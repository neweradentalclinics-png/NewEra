<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEW ERA DENTAL CENTER - الإدارة</title>
    
    <!-- مكتبات React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706' }
                    }
                }
            }
        }
    </script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #FDFCFB; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #F59E0B; border-radius: 10px; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        .animate-scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background-color: #e5e7eb; border: 1px solid #e5e7eb; border-radius: 16px; overflow: hidden; }
        .calendar-cell { background-color: white; aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .calendar-cell:hover { background-color: #fffbeb; }
        .calendar-cell.other-month { background-color: #f9fafb; color: #9ca3af; }
        .calendar-cell.today { background-color: #fef3c7; color: #b45309; font-weight: 900; border: 2px solid #f59e0b; }
        .dot { height: 6px; width: 6px; background-color: #F59E0B; border-radius: 50%; margin-top: 4px; }
        .modal-layer { z-index: 99999 !important; }
        
        /* تأثيرات Checkbox */
        input[type="checkbox"] { accent-color: #F59E0B; width: 16px; height: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // 1. Firebase Config (New Era)
        const firebaseConfig = {
            apiKey: "AIzaSyDQ17UevaMBy2aVYxsrLNpdQCvn92uSKi0",
            authDomain: "new-era-dental-center.firebaseapp.com",
            projectId: "new-era-dental-center",
            storageBucket: "new-era-dental-center.firebasestorage.app",
            messagingSenderId: "11521109321",
            appId: "1:11521109321:web:49e24509d937ff3e20be98"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        // كود السوبر أدمن الأولي (1279): بيتسجل أول مرة بس، وبعدها يتغير من الإعدادات → كود السوبر أدمن
        const BOOTSTRAP_CODE = "1279";

        // ===== تأمين الدخول: كل كود موظف ليه حساب دخول في Firebase Auth (من غير ما شكل الدخول يتغير) =====
        const sha256Hex = async (str) => {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        };
        const authCreds = async (code) => {
            const h = await sha256Hex('newera-clinic|' + String(code).trim());
            return { email: 'u' + h.slice(0, 32) + '@neweraclinic.app', password: h.slice(32, 64) + 'Ne!' };
        };
        let secApp = null;
        const getSecAuth = () => { if (!secApp) secApp = firebase.initializeApp(firebaseConfig, 'sec'); return secApp.auth(); };
        const ensureAuthUser = async (code) => {
            const { email, password } = await authCreds(code);
            const sa = getSecAuth();
            let cred;
            try { cred = await sa.createUserWithEmailAndPassword(email, password); }
            catch (e) { if (e.code === 'auth/email-already-in-use') cred = await sa.signInWithEmailAndPassword(email, password); else throw e; }
            const uid = cred.user.uid;
            await sa.signOut();
            return uid;
        };
        const syncStaffAuth = async (staffId, d, prev) => {
            const code = String(d.code || '').trim();
            if (!code) throw new Error('الكود فاضي');
            if (prev && prev.authUid && String(prev.code).trim() === code && prev.role === d.role && prev.name === d.name) return;
            const uid = await ensureAuthUser(code);
            const ex = await db.collection('staff_auth').doc(uid).get();
            if (ex.exists && ex.data().staffId && ex.data().staffId !== staffId) throw new Error('الكود ده مستخدم لموظف تاني — غيّريه');
            const b = db.batch();
            if (prev && prev.authUid && prev.authUid !== uid) b.delete(db.collection('staff_auth').doc(prev.authUid));
            b.set(db.collection('staff_auth').doc(uid), { staffId, role: d.role, name: d.name });
            b.update(db.collection('staff_members').doc(staffId), { authUid: uid });
            await b.commit();
        };
        const removeStaff = (st) => {
            const b = db.batch();
            if (st.authUid) b.delete(db.collection('staff_auth').doc(st.authUid));
            b.delete(db.collection('public_doctors').doc(st.id));
            b.delete(db.collection('staff_members').doc(st.id));
            return b.commit();
        };
        const migrateAllStaff = async () => {
            const sn = await db.collection('staff_members').get(); let n = 0;
            for (const d of sn.docs) {
                const st = d.data();
                if (st.authUid || !st.code) continue;
                try { await syncStaffAuth(d.id, st, st); n++; } catch (e) { console.error('migrate', e); }
            }
            return n;
        };
        // لموظف لسه معندوش حساب (قبل تفعيل القواعد الجديدة بس): بنجهزله حسابه أوتوماتيك أول ما يدخل
        const legacyHeal = async (code) => {
            try {
                await auth.signInAnonymously();
                const sn = await db.collection('staff_members').where('code', '==', code).limit(1).get();
                if (sn.empty) { await auth.signOut(); return false; }
                const d = sn.docs[0];
                await syncStaffAuth(d.id, d.data(), d.data());
                const { email, password } = await authCreds(code);
                await auth.signInWithEmailAndPassword(email, password);
                return true;
            } catch (e) { try { await auth.signOut(); } catch (x) {} return false; }
        };
        const bootstrapMaster = async () => {
            const n = BOOTSTRAP_CODE;
            const dup = await db.collection('staff_members').where('code', '==', n).limit(1).get();
            const sd = { name: 'Admin', code: n, role: 'superadmin', branchId: 'all', branchIds: [], jobTitle: 'سوبر أدمن' };
            let sid;
            if (!dup.empty && dup.docs[0].data().role === 'superadmin') sid = dup.docs[0].id;
            else if (!dup.empty) { alert('الكود 1279 مستخدم لموظف عادي. غيّري كوده الأول من النسخة القديمة وجرّبي تاني.'); return false; }
            else sid = (await db.collection('staff_members').add(sd)).id;
            await syncStaffAuth(sid, sd, null);
            await db.collection('settings').doc('security').set({ masterReady: true, at: new Date().toISOString() });
            return n;
        };
        // فروع الطبيب: القائمة الجديدة (branchIds) أو الفرع القديم (branchId)
        // ===== التنبيهات المجانية =====
        // تيليجرام: ضعي توكن البوت (من @BotFather) وأرقام الشات (chat_id) هنا. المفتاح = اسم الفرع كما هو مكتوب في التطبيق.
        const TG = { token: '8563202107:AAFaCbaavRp-CK6dihDPWSY9tpYX56QakIA', main: '8017153450', branches: { /* 'فيصل': 'CHAT_ID', 'حلوان': 'CHAT_ID' */ } };
        const tgSend = (text, branchName) => {
            if (!TG.token) return;
            [...new Set([TG.main, TG.branches[branchName]].filter(Boolean))].forEach(chat =>
                fetch(`https://api.telegram.org/bot${TG.token}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: chat, text }) }).catch(() => {}));
        };
        let _ac;
        const pushLocal = (text) => {
            try { _ac = _ac || new (window.AudioContext || window.webkitAudioContext)(); const o = _ac.createOscillator(), g = _ac.createGain(); o.connect(g); g.connect(_ac.destination); o.frequency.value = 880; g.gain.value = 0.15; o.start(); o.stop(_ac.currentTime + 0.25); } catch (e) {}
            try { if ('Notification' in window && Notification.permission === 'granted') new Notification(text); } catch (e) {}
        };
        // مدة تذكير المعمل بالأيام (لو الحالة قديمة ومفيهاش مدة = يومين، 0 = بدون تذكير)
        const localDay = () => new Date().toLocaleDateString('en-CA');
        const labRemindDays = c => (c.remindDays === undefined || c.remindDays === null || c.remindDays === '') ? 2 : Number(c.remindDays);
        const labDue = c => c.status !== 'returned' && !c.chasedAt && c.sentDate && labRemindDays(c) > 0 && (new Date(new Date().toISOString().split('T')[0]) - new Date(c.sentDate)) / 864e5 >= labRemindDays(c);
        const daysLabel = n => ({ 1: 'يوم', 2: 'يومين', 3: '3 أيام', 5: '5 أيام', 7: 'أسبوع', 10: '10 أيام', 14: 'أسبوعين', 30: 'شهر' }[n] || n + ' يوم');
        const TPL_DEFAULT = {
            reminder: 'أهلاً {name} 👋\nتذكير بموعدك في {branch} يوم {date} الساعة {time}.\nبرجاء تأكيد الحضور، شكراً لثقتكم.',
            review: 'شكراً لزيارتك {branch} يا {name} 🌟\nرأيك يهمنا جداً، ممكن تقيّم تجربتك من هنا:\n{link}',
            followup: 'أهلاً {name}، معاك {branch} 👋\nحبينا نطمّن ونتابع معاك بخصوص {service}. تحب نحجزلك موعد؟',
            lab: 'السلام عليكم، بخصوص حالة المريض {patient} ({case}) المُسلّمة لكم بتاريخ {date}. برجاء الإفادة بموعد التسليم.',
            tgApp: '📅 حجز جديد — فرع {branch}\nالمريض: {patient}\nالموعد: {date} {time}\nالخدمة: {service}\nالدكتور: {doctor}\nبواسطة: {by}\n\n📊 إجمالي حجوزات {date} في {branch}: {count}',
            tgShortage: '⚠️ نقص جديد — {branch}\nالصنف: {item} ({qty})\nبواسطة: {by}\n\n📊 إجمالي النواقص في {branch}: {count}',
            tgDue: '🧾 فاتورة جديدة — {branch}\nالجهة: {party}\nالمبلغ: {amount} ج\nموعد السداد: {due}\nبواسطة: {by}\n\n📊 إجمالي المستحق في {branch}: {sum} ج ({count} فاتورة)',
            tgLab: '⏰ حالة معمل مر عليها {days} — اطلبيها من المعمل\nالمعمل: {lab}\nالمريض: {patient}\nالنوع: {case}\nالفرع: {branch}',
            tgFollow: '📞 موعد متابعة مريض: {patient}\nالخدمة: {service}\nالفرع: {branch}'
        };
        const OLD_TG = {
            tgApp: '📅 حجز جديد\nالمريض: {patient}\nالموعد: {date} {time}\nالخدمة: {service}\nالدكتور: {doctor}\nالفرع: {branch}\nبواسطة: {by}',
            tgShortage: '⚠️ نقص جديد\nالصنف: {item} ({qty})\nالفرع: {branch}\nبواسطة: {by}',
            tgDue: '🧾 فاتورة/مستحق جديد\nالجهة: {party}\nالمبلغ: {amount} ج\nموعد السداد: {due}\nالفرع: {branch}\nبواسطة: {by}'
        };
        const TPL = { ...TPL_DEFAULT };
        const fillT = (k, v) => String(TPL[k] || '').replace(/\{(\w+)\}/g, (m, x) => v[x] ?? '');
        // بيانات حية لحساب الإجماليات في رسائل تيليجرام (بتتحدث من App)
        const LIVE = { appointments: [], dues: [], shortages: [] };
        const tgStats = (col, d, newId) => {
            const arr = (LIVE[col] || []).filter(x => x.id !== newId);
            const base = col === 'appointments' ? (x => x.date === d.date) : col === 'dues' ? (x => !x.paid) : (() => true);
            const all = arr.filter(base), br = all.filter(x => x.branchId === d.branchId);
            const r = { count: br.length + 1, countAll: all.length + 1 };
            if (col === 'dues') {
                const sm = a => Math.round(a.reduce((t, x) => t + (Number(x.amount) || 0), 0) * 100) / 100;
                r.sum = sm(br) + (Number(d.amount) || 0); r.sumAll = sm(all) + (Number(d.amount) || 0);
            }
            return r;
        };
        const tgText = (col, d, bn, dn, by, newId) => {
            const st = tgStats(col, d, newId), brn = d.branchId === 'store' ? 'المخزن' : bn;
            return col === 'appointments'
                ? fillT('tgApp', { patient: d.patientName, date: d.date, time: d.time || '', service: d.service || '', doctor: dn || '', branch: bn, by, ...st })
                : col === 'dues'
                    ? fillT('tgDue', { party: d.party, amount: d.amount, due: d.dueDate || 'بدون موعد', branch: brn, by, ...st })
                    : fillT('tgShortage', { item: d.itemName, qty: d.quantity, branch: brn, by, ...st });
        };
        const IS_ANDROID = /Android/i.test(navigator.userAgent);
        const WA_TARGET = IS_ANDROID ? '_self' : '_blank';
        // على أندرويد بيفتح واتساب بيزنيس مباشرة، وإلا بيرجع للرابط العادي (wa.me)
        const waOpen = (n, text) => {
            const t = encodeURIComponent(text), web = `https://wa.me/${n || ''}?text=${t}`;
            return IS_ANDROID ? `intent://send?${n ? 'phone=' + n + '&' : ''}text=${t}#Intent;scheme=whatsapp;package=com.whatsapp.w4b;S.browser_fallback_url=${encodeURIComponent(web)};end` : web;
        };
        const waUrl = (phone, text) => { let n = String(phone || '').replace(/\D/g, ''); if (!n) return null; if (n.startsWith('0')) n = '2' + n; return waOpen(n, text); };
        const SERVICES = ['جراحة', 'زراعة', 'تقويم', 'تركيبات', 'أطفال', 'حشو عصب', 'حشو عادي', 'تبييض', 'فينير', 'سناب اون'];
        const svcText = p => (p.services && p.services.length) ? p.services.join('، ') : (p.service || '');
        function NotifBell({ items, unread, reviews = [], onReview, onOpen, onPick }) {
            const [open, setOpen] = useState(false);
            const [deletedIds, setDeletedIds] = useState(new Set());

            // Group and aggregate notifications with branch/category awareness
            const aggregated = useMemo(() => {
                const agg = {};
                items.filter(n => !deletedIds.has(n.id)).forEach(n => {
                    let groupKey, groupData;

                    if (n.kind === 'patient') {
                        groupKey = 'patient';
                        groupData = { type: 'patient', icon: '📞', category: 'متابعات' };
                    } else if (n.kind === 'lab') {
                        const labMatch = n.text.match(/اطلبي من (.+?):/);
                        const labName = labMatch ? labMatch[1] : 'معمل';
                        groupKey = `lab_${labName}`;
                        groupData = { type: 'lab', icon: '⏰', category: `طلب من ${labName}`, labName };
                    } else if (n.category === 'bookings') {
                        groupKey = `bookings_${n.branchId || 'unknown'}`;
                        groupData = { type: 'appointments', icon: '📅', category: 'حجوزات جديدة', branchId: n.branchId };
                    } else if (n.category === 'invoices') {
                        groupKey = `invoices_${n.branchId || 'unknown'}`;
                        groupData = { type: 'dues', icon: '🧾', category: 'فواتير', branchId: n.branchId };
                    } else if (n.category === 'shortages') {
                        groupKey = `shortages_${n.branchId || 'unknown'}`;
                        groupData = { type: 'shortages', icon: '⚠️', category: 'نواقص جديدة', branchId: n.branchId };
                    } else {
                        groupKey = n.kind || 'other';
                        groupData = { type: n.kind || 'other', icon: '📋', category: n.kind || 'أخرى' };
                    }

                    if (!agg[groupKey]) {
                        agg[groupKey] = { ...groupData, items: [], itemNames: [] };
                    }
                    agg[groupKey].items.push(n);
                    if (n.itemName) agg[groupKey].itemNames.push(n.itemName);
                });

                return Object.values(agg).map(group => {
                    const count = group.items.length;
                    let text = '';

                    if (group.type === 'appointments') {
                        const names = group.itemNames.slice(0, 2).join(' و ');
                        const moreText = count > 2 ? ` و${count - 2} آخرين` : '';
                        text = `${count} حجز جديد: ${names}${moreText}`;
                    } else if (group.type === 'dues') {
                        text = `${count} فاتورة جديدة`;
                    } else if (group.type === 'shortages') {
                        const names = group.itemNames.slice(0, 2).join(' و ');
                        const moreText = count > 2 ? ` و${count - 2} آخرين` : '';
                        text = `${count} نقص جديد: ${names}${moreText}`;
                    } else if (group.type === 'lab') {
                        const names = group.itemNames.slice(0, 2).join(' و ');
                        const moreText = count > 2 ? ` و${count - 2} حالات أخرى` : '';
                        text = `${count} حالة معمل من ${group.labName}: ${names}${moreText}`;
                    } else if (group.type === 'patient') {
                        const names = group.itemNames.slice(0, 2).join(' و ');
                        const moreText = count > 2 ? ` و${count - 2} آخرين` : '';
                        text = `${count} متابعة: ${names}${moreText}`;
                    } else {
                        text = group.items[0]?.text || group.category;
                    }

                    return { ...group, text, count };
                }).sort((a, b) => b.items[0]?.ts - a.items[0]?.ts);
            }, [items, deletedIds]);

            const handleDelete = (groupKey) => {
                const group = aggregated.find(g => g.items);
                if (group) {
                    const newDeleted = new Set(deletedIds);
                    group.items.forEach(item => newDeleted.add(item.id));
                    setDeletedIds(newDeleted);
                }
            };

            const handleNotifClick = (n) => {
                setOpen(false);
                onPick(n);
            };

            const visibleCount = unread - deletedIds.size;

            return (
                <div className="relative mr-1">
                    <button type="button" onClick={() => { setOpen(!open); if (!open) onOpen(); }} className="relative p-1.5 sm:p-2 rounded-full text-gray-600 hover:text-gold-600 bg-gray-50 border border-gray-100" title="الإشعارات">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
                        {visibleCount > 0 && <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-black rounded-full min-w-[16px] h-4 px-1 flex items-center justify-center">{visibleCount}</span>}
                    </button>
                    {open && (<>
                        <div className="fixed inset-0 z-40" onClick={() => setOpen(false)}></div>
                        <div className="fixed top-16 right-4 left-4 md:absolute md:top-12 md:right-0 md:left-auto w-full md:w-96 max-h-[80vh] overflow-y-auto bg-white rounded-2xl shadow-2xl border border-gray-100 z-50 animate-fade-in">
                            <div className="sticky top-0 bg-white border-b border-gray-100 z-10">
                                <p className="p-4 text-sm font-black text-gray-800">الإشعارات ({aggregated.length + reviews.length})</p>
                            </div>

                            {/* Reviews Section */}
                            {reviews.length > 0 && (
                                <div className="p-4 bg-amber-50 border-b border-amber-100">
                                    <p className="text-[11px] font-black text-amber-700 mb-3">⭐ متنسيش تبعتي رسايل التقييم ({reviews.length})</p>
                                    {reviews.map(r => (
                                        <div key={r.id} className="flex items-center justify-between gap-2 bg-white rounded-xl p-3 mb-2 last:mb-0">
                                            <span className="text-[11px] font-bold text-gray-800 min-w-0 flex-1 truncate">{r.name}</span>
                                            <span className="flex gap-1 shrink-0 flex-wrap justify-end">
                                                {r.url && <a href={r.url} target={WA_TARGET} rel="noreferrer" className="px-2 py-1 bg-green-500 text-white rounded text-[9px] font-bold whitespace-nowrap">واتساب</a>}
                                                <button type="button" onClick={() => onReview(r.id, 'reviewSent')} className="px-2 py-1 bg-emerald-500 text-white rounded text-[9px] font-bold">✓</button>
                                            </span>
                                        </div>))}
                                </div>)}

                            {/* Notifications Groups */}
                            {aggregated.length === 0 && reviews.length === 0 ? (
                                <p className="p-8 text-center text-[11px] text-gray-400 font-bold">لا توجد إشعارات</p>
                            ) : (
                                <div className="divide-y divide-gray-100">
                                    {aggregated.map((group, idx) => (
                                        <div key={idx} className="hover:bg-gold-50/50 transition-colors group/notif">
                                            <div className="flex items-start gap-3 p-4 cursor-pointer hover:bg-gold-50" onClick={() => handleNotifClick({ ...group.items[0], refIds: group.items.map(i => i.refId || i.id) })}>
                                                <div className="text-xl pt-0.5 shrink-0">{group.icon}</div>
                                                <div className="flex-1 min-w-0">
                                                    <p className="text-[11px] font-black text-gray-800 line-clamp-2">{group.text}</p>

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);

            const [currentIndex, setCurrentIndex] = useState(0);
            const activeTab = history[currentIndex];

            const [selectedBranch, setSelectedBranch] = useState('all');

            const [data, setData] = useState({ branches: [], staff: [], patients: [], appointments: [], payments: [], shortages: [], labCases: [], consumables: [], dues: [] });
            const [costs, setCosts] = useState({});
            
            const [modal, setModal] = useState(null);
            const [confirmAction, setConfirmAction] = useState(null);
            const [toastMsg, setToastMsg] = useState(null);
            const [alerts, setAlerts] = useState([]);

            const userRef = useRef(null); userRef.current = currentUser;
            LIVE.appointments = data.appointments; LIVE.dues = data.dues; LIVE.shortages = data.shortages;
            const firstSnap = useRef({});
            const evVisible = (kind, x, u) => {
                if (kind === 'dues' && u.role !== 'admin' && u.role !== 'superadmin') return false;
                if (u.role === 'employee' && x.branchId !== u.branchId) return false;
                if (u.role === 'doctor' && !(kind === 'appointments' && x.doctorId === u.id)) return false;
                return true;
            };
            const mkEv = (kind, id, x) => {
                let text, category;
                if (kind === 'appointments') {
                    text = `📅 حجز جديد: ${x.patientName} — ${x.date} ${x.time || ''}`;
                    category = 'bookings';
                } else if (kind === 'dues') {
                    text = `🧾 فاتورة/مستحق جديد: ${x.party} — ${Number(x.amount) || 0} ج`;
                    category = 'invoices';
                } else {
                    text = `⚠️ نقص جديد: ${x.itemName} (${x.quantity})`;
                    category = 'shortages';
                }
                return { id, refId: id, text, tab: kind, kind, category, branchId: x.branchId, ts: x.timestamp ? new Date(x.timestamp).getTime() : Date.now(), read: false, itemName: x.itemName || x.patientName || x.party };
            };
            const notify = (kind, s) => {
                if (!firstSnap.current[kind]) { firstSnap.current[kind] = true; return; }

                s.docChanges().forEach(ch => {
                    if (ch.type !== 'added' || ch.doc.metadata.hasPendingWrites) return;
                    const x = ch.doc.data();
                    if (!evVisible(kind, x, u)) return;
                    const ev = mkEv(kind, ch.doc.id, x);
                    setAlerts(a => [...a, ev]); setEvents(e => [ev, ...e].slice(0, 100)); pushLocal(ev.text);
                });
            };
            // إشعارات اللي وصلت والتطبيق مقفول: بنحفظ الـ IDs اللي الجهاز شافها، وأول ما يتفتح ويسجل دخول بنقارن
            const missedDone = useRef({});
            useEffect(() => {
                const u = currentUser; if (!u) return;
                const fs = firstSnap.current;

                const key = 'clinic_seen_' + (u.id || u.name);
                const cols = { appointments: data.appointments, dues: data.dues, shortages: data.shortages };
                if (!missedDone.current[key]) {
                    missedDone.current[key] = true;
                    let seen = null;
                    try { seen = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) {}
                    if (seen) {
                        const found = [];
                        Object.entries(cols).forEach(([k, arr]) => {
                            if (!Array.isArray(seen[k])) return;
                            const ids = new Set(seen[k]);
                            arr.forEach(x => {
                                if (ids.has(x.id) || !evVisible(k, x, u)) return;
                                found.push(mkEv(k, x.id, x));
                            });

                        if (found.length) {
                            found.sort((a, b) => b.ts - a.ts);
