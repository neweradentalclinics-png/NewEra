                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-3">
                        <div className="lg:col-span-2"><Panel title="جدول النهاردة" sub={todayApps.length + ' حجز'} action={<button type="button" onClick={() => onNav('appointments')} className="text-[11px] font-black text-gold-600">كل المواعيد ←</button>}>
                            {todayApps.length === 0 ? <p className="text-xs text-gray-400 font-bold py-6 text-center">مفيش حجوزات النهاردة</p> : (
                                <div className="divide-y divide-gray-50 max-h-80 overflow-y-auto custom-scrollbar -mx-1">{todayApps.map(a => { const st = (!a.status || a.status === 'booked') ? 'unconfirmed' : a.status; const S = APP_STATUS[st] || APP_STATUS.unconfirmed; return (
                                    <div key={a.id} className="flex items-center gap-3 py-2.5 px-1">
                                        <span className="text-[11px] font-black text-gold-700 bg-gold-50 rounded-lg px-2 py-1 w-14 text-center shrink-0" dir="ltr">{a.time || '--'}</span>
                                        <div className="min-w-0 flex-1"><p className="text-xs font-black text-gray-800 truncate">{a.patientName}</p><p className="text-[10px] text-gray-400 font-bold truncate">{[a.service, a.doctorName && 'د. ' + a.doctorName, selectedBranch === 'all' && (data.branches.find(b => b.id === a.branchId) || {}).name].filter(Boolean).join(' • ')}</p></div>
                                        {a.source === 'online' && <span className="text-[9px] font-black text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded shrink-0">أونلاين</span>}
                                        <span className={`text-[9px] font-black px-2 py-1 rounded-lg shrink-0 ${S.c}`}>{S.l}</span>
                                    </div>); })}</div>)}
                        </Panel></div>
                        <Panel title="أكتر الخدمات طلباً" sub={PER.l}><RankBars rows={topServices} empty="مفيش خدمات مسجلة في الفترة دي" /></Panel>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-3">
                        {isSuper && <div className="lg:col-span-2"><Panel title="الإيراد — آخر 6 شهور" sub="من التوريدات المسجلة"><MiniBars points={revPts} unit=" ج" /></Panel></div>}
                        <div className={isSuper ? '' : 'lg:col-span-3'}><Panel title="الحجوزات حسب الدكتور" sub={PER.l}><RankBars rows={byDoctor} unit=" حجز" empty="مفيش حجوزات مرتبطة بدكاترة" /></Panel></div>
                    </div>

                    {branchRows.length > 0 && <Panel title="مقارنة الفروع" sub={PER.l}>
                        <div className="overflow-x-auto -mx-1"><table className="w-full text-right text-xs min-w-[520px]">
                            <thead className="text-[10px] text-gray-400"><tr className="border-b border-gray-100"><th className="p-2 font-black">الفرع</th><th className="p-2 font-black text-center">حجوزات</th><th className="p-2 font-black text-center">حضور</th><th className="p-2 font-black text-center">عند المعمل</th><th className="p-2 font-black text-center">نواقص</th>{isSuper && <th className="p-2 font-black text-center">إيراد</th>}<th className="p-2 font-black text-center">مستحقات</th></tr></thead>
                            <tbody className="divide-y divide-gray-50">{branchRows.map(r => <tr key={r.b.id} className="hover:bg-gray-50">
                                <td className="p-2 font-black text-gray-800">{r.b.name}</td><td className="p-2 text-center font-bold">{fmtN(r.apps)}</td>
                                <td className={`p-2 text-center font-bold ${r.att !== null && r.att < 70 ? 'text-red-600' : ''}`}>{r.att === null ? '—' : r.att + '%'}</td>
                                <td className="p-2 text-center font-bold">{r.lab}</td><td className="p-2 text-center font-bold">{r.short}</td>
                                {isSuper && <td className="p-2 text-center font-black text-gray-900">{fmtN(r.rev)} ج</td>}<td className="p-2 text-center font-bold">{fmtN(r.dues)} ج</td></tr>)}</tbody>
                        </table></div>
                    </Panel>}
                </div>
            );
        }

        function ShortagesView({ focusIds, onBuy, shortages, branches, currentUser, selectedBranch, onConfirm, onEdit, showToast }) {
            const [itemName, setItemName] = useState('');
            const [quantity, setQuantity] = useState('');
            const [branchId, setBranchId] = useState(currentUser.role === 'employee' ? currentUser.branchId : (selectedBranch === 'all' ? 'store' : selectedBranch));

            const sortedShortages = useMemo(() => [...shortages].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)), [shortages]);

            const groupedShortages = useMemo(() => {
                if (selectedBranch !== 'all') return { [selectedBranch]: sortedShortages };
                const groups = {};
                sortedShortages.forEach(s => {
                    const bId = s.branchId || 'unknown';
                    if (!groups[bId]) groups[bId] = [];
                    groups[bId].push(s);
                });
                return groups;
            }, [sortedShortages, selectedBranch]);

            useEffect(() => { if (focusIds && focusIds.length) setTimeout(() => document.getElementById('short-' + focusIds[0])?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300); }, [focusIds]);
            const handleAdd = (e) => {
                e.preventDefault();
                if (!itemName || !quantity) return;
                db.collection('shortages').add({ itemName, quantity, branchId, requestedBy: currentUser.name, timestamp: new Date().toISOString() })
                .then(ref => { const bn = branches.find(b => b.id === branchId)?.name || ''; tgSend(tgText('shortages', { itemName, quantity, branchId }, bn, '', currentUser.name, ref.id), branchId, 'shortage'); setItemName(''); setQuantity(''); showToast("تم إضافة الصنف للمخزن"); })
                .catch(err => showToast("مشكلة في إضافة صنف: " + err.message));
            };

            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <h3 className="text-lg font-black text-gray-800">النواقص</h3>
                    <div className="bg-white p-4 rounded-[20px] border border-gray-100 shadow-sm">
                        <form onSubmit={handleAdd} className="flex flex-col md:flex-row gap-3 items-end">
                            <div className="flex-1 w-full">
                                <label className="text-[9px] font-black text-gray-400 uppercase tracking-widest block mb-1">اسم الصنف</label>
                                <input type="text" required value={itemName} onChange={e=>setItemName(e.target.value)} placeholder="مثال: كمامات..." className="w-full bg-gray-50 border border-gray-100 focus:border-gold-500 p-2.5 rounded-lg outline-none font-bold text-gray-800 text-xs" />
                            </div>
                            <div className="w-full md:w-28">
                                <label className="text-[9px] font-black text-gray-400 uppercase tracking-widest block mb-1">الكمية</label>
                                <input type="text" required value={quantity} onChange={e=>setQuantity(e.target.value)} placeholder="مثال: 5" className="w-full bg-gray-50 border border-gray-100 focus:border-gold-500 p-2.5 rounded-lg outline-none font-bold text-gray-800 text-xs text-center" />
                            </div>
                            
                            {(currentUser.role === 'admin' || currentUser.role === 'superadmin') && (
                                <div className="w-full md:w-40">
                                    <label className="text-[9px] font-black text-gray-400 uppercase tracking-widest block mb-1">الفرع / المخزن</label>
                                    <select value={branchId} onChange={e=>setBranchId(e.target.value)} className="w-full bg-gray-50 border border-gray-100 focus:border-gold-500 p-2.5 rounded-lg outline-none font-bold text-gray-800 text-xs cursor-pointer">
                                        <option value="store">المخزن (الرئيسي)</option>
                                        {branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
                                    </select>
                                </div>
                            )}
                            <button type="submit" className="w-full md:w-auto bg-gold-500 text-white px-6 py-2.5 rounded-lg font-black text-xs shadow-md hover:bg-gold-600 transition-colors">أضف +</button>
                        </form>
                    </div>

                    <div className="bg-white rounded-[20px] border border-gray-100 shadow-sm p-3 sm:p-4 space-y-4">
                        {Object.keys(groupedShortages).length === 0 ? (
                            <div className="p-4 text-center text-gray-400 font-bold text-xs">لا توجد نواقص مسجلة.</div>
                        ) : (
                            Object.entries(groupedShortages).map(([bId, bShortages]) => {
                                if(bShortages.length === 0) return null;
                                const bName = bId === 'store' ? 'المخزن الرئيسي' : (branches.find(b=>b.id===bId)?.name || 'غير معروف');
                                return (
                                    <div key={bId} className="mb-2">
                                        <div className="flex items-center gap-3 mb-2 mt-1">
                                            <span className="text-[10px] font-black bg-gradient-to-r from-gold-500 to-gold-600 text-white px-3 py-1 rounded-lg shadow-sm border border-gold-400">{bName}</span>
                                            <div className="h-px bg-gradient-to-l from-gold-200 to-transparent flex-1 rounded-full"></div>
                                        </div>
                                        <div className="space-y-2">
                                            {bShortages.map(item => {
                                                const d = new Date(item.timestamp).toLocaleDateString('en-GB');
                                                return (
                                                    <div key={item.id} id={'short-' + item.id} className={`flex flex-col sm:flex-row justify-between items-start sm:items-center p-3 rounded-xl border gap-3 ${focusIds?.includes(item.id) ? 'bg-gold-50 border-gold-500 ring-2 ring-gold-400' : 'bg-gray-50 border-gray-100'}`}>
                                                        <div>
                                                            <div className="flex items-center gap-2">
                                                                <span className="font-black text-gray-800 text-xs sm:text-sm">{item.itemName}</span>
                                                                <span className="bg-gold-100 text-gold-700 px-1.5 py-0.5 rounded-md text-[10px] font-bold">{item.quantity}</span>
                                                            </div>
                                                            <div className="text-[9px] text-gray-500 flex flex-wrap gap-2 mt-1 items-center">
                                                                <span className="flex items-center gap-0.5"><IconUserCircle/> {item.requestedBy}</span>
                                                                <span dir="ltr" className="text-gray-400 font-mono">{d}</span>
                                                            </div>
                                                        </div>
                                                        
                                                        <div className="flex items-center gap-1.5 shrink-0">
                                                            <button type="button" onClick={() => onEdit(item)} className="bg-white text-gold-500 hover:bg-gold-500 hover:text-white p-1.5 rounded-lg border border-gray-200 transition-colors">
                                                                <IconEdit />
                                                            </button>
                                                            <button type="button" onClick={() => onBuy(item)} className="bg-emerald-50 text-emerald-600 hover:bg-emerald-500 hover:text-white px-2 py-1 rounded-md font-bold text-[9px] border border-emerald-100 transition-colors whitespace-nowrap">
                                                                ✅ تم الشراء
                                                            </button>
                                                            <button type="button" onClick={() => onConfirm({ msg: 'حذف "' + item.itemName + '" من النواقص؟', onConfirm: () => db.collection('shortages').doc(item.id).delete().then(() => showToast('تم الحذف')).catch(err => showToast('مشكلة في الحذف: ' + err.message)) })} className="p-1.5 text-red-500 bg-red-50 hover:bg-red-500 hover:text-white rounded-lg border border-red-100 transition-colors" title="حذف">
                                                                <IconTrash />
                                                            </button>
                                                        </div>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>
                                )
                            })
                        )}
                    </div>
                </div>
            );
        }

        // --- المواعيد ---
        function AppointmentsView({ focusIds, apps, branches, currentUser, selectedBranch, onConfirm, onAdd, onEdit, onNav, showToast }) {
            const [viewMode, setViewMode] = useState('daily'); 
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            useEffect(() => { if (!focusIds || !focusIds.length) return; const a = apps.find(x => focusIds.includes(x.id)); if (a && a.date) { setSelectedDate(a.date); setViewMode('daily'); } setTimeout(() => document.getElementById('app-' + (a ? a.id : ''))?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 350); }, [focusIds]);

            const filteredApps = useMemo(() => {
                let list = apps.filter(a => selectedBranch === 'all' || a.branchId === selectedBranch);
                list.sort((a, b) => {
                    const dA = a.date || ""; const dB = b.date || "";
                    if (dA !== dB) return dA.localeCompare(dB);
                    const tA = a.time || ""; const tB = b.time || "";
                    return tA.localeCompare(tB);
                });
                return list;
            }, [apps, selectedBranch]);

            const dailyApps = useMemo(() => filteredApps.filter(a => a.date === selectedDate), [filteredApps, selectedDate]);

            const groupedByBranchDaily = useMemo(() => {
                if (selectedBranch !== 'all') return { [selectedBranch]: dailyApps };
                const groups = {};
                dailyApps.forEach(a => {
                    const bId = a.branchId || 'unknown';
                    if (!groups[bId]) groups[bId] = [];
                    groups[bId].push(a);
                });
                return groups;
            }, [dailyApps, selectedBranch]);

            const weeklyDays = useMemo(() => {
                const days = [];
                for(let i=0; i<7; i++) {
                    const d = new Date(selectedDate);
                    d.setDate(d.getDate() + i);
                    const dStr = d.toISOString().split('T')[0];
                    const dayName = new Intl.DateTimeFormat('ar-EG', { weekday: 'long' }).format(d);
                    const dayApps = filteredApps.filter(a => a.date === dStr);
                    days.push({ date: dStr, dayName, apps: dayApps });
                }
                return days;
            }, [filteredApps, selectedDate]);

            const handleManualCleanup = () => {
                onConfirm({
                    msg: 'هل أنت متأكد من مسح جميع المواعيد التي مر عليها أكثر من شهر؟ (إجراء آمن)',
                    onConfirm: () => {
                        const oneMonthAgo = new Date();
                        oneMonthAgo.setMonth(oneMonthAgo.getMonth() - 1);
                        const cutoffDate = oneMonthAgo.toISOString().split('T')[0];
                        
                        const old = apps.filter(app => app.date && app.date < cutoffDate);
                        if (old.length === 0) { showToast("مفيش مواعيد أقدم من شهر."); return; }
                        old.forEach(app => {
                            db.collection('appointments').doc(app.id).delete()
                            .catch(err => showToast("خطأ في مسح موعد: " + err.message));
                        });
                        showToast("تم مسح " + old.length + " موعد قديم.");
                    }
                });
            };

            const renderCalendar = () => {
                const date = new Date(selectedDate);
                const year = date.getFullYear(); const month = date.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const calendarDays = [];
                for (let i = 0; i < firstDay; i++) calendarDays.push({ empty: true });
                for (let i = 1; i <= daysInMonth; i++) {
                    const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                    const count = apps.filter(a => a.date === dStr && (selectedBranch === 'all' || a.branchId === selectedBranch)).length;
                    calendarDays.push({ d: i, date: dStr, count });
                }
                return (
                    <div className="bg-white rounded-[20px] border border-gray-100 shadow-sm overflow-hidden animate-slide-up mt-4">
                        <div className="grid grid-cols-7 bg-gray-50 border-b border-gray-100 text-center py-2 text-[9px] font-black text-gray-500">
                            <div>أحد</div><div>إثنين</div><div>ثلاثاء</div><div>أربعاء</div><div>خميس</div><div>جمعة</div><div>سبت</div>
                        </div>
                        <div className="calendar-grid">
                            {calendarDays.map((item, idx) => item.empty ? <div key={idx} className="calendar-cell bg-gray-50 opacity-30"></div> : (
                                <div key={idx} 
                                    onClick={() => { setSelectedDate(item.date); setViewMode('daily'); }}
                                    className={`calendar-cell ${item.date === selectedDate ? 'today' : ''}`}
                                >
                                    <span className="text-xs font-bold">{item.d}</span>
                                    {item.count > 0 && <span className="text-[8px] font-black text-gold-600 mt-1 bg-gold-50 px-1.5 rounded">{item.count} حجز</span>}
                                    {item.count > 0 && <span className="dot"></span>}
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-3">
                        <h3 className="text-lg font-black text-gray-800">إدارة المواعيد</h3>
                        <div className="flex bg-gray-100 p-1 rounded-xl w-full lg:w-auto">
                            <button type="button" onClick={() => setViewMode('daily')} className={`flex-1 px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode==='daily' ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>يومي</button>
                            <button type="button" onClick={() => setViewMode('weekly')} className={`flex-1 px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode==='weekly' ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>أسبوعي</button>
                            <button type="button" onClick={() => setViewMode('monthly')} className={`flex-1 px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode==='monthly' ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>شهري</button>
                        </div>
                        <input type="date" value={selectedDate} onChange={(e)=>setSelectedDate(e.target.value)} className="w-full lg:w-auto bg-white border border-gray-200 text-xs font-bold p-2 rounded-xl outline-none focus:border-gold-500"/>
                        
                        <div className="flex gap-2 w-full lg:w-auto">
                            {currentUser.role === 'superadmin' && (
                                <button type="button" onClick={handleManualCleanup} className="w-full lg:w-auto bg-red-50 text-red-600 border border-red-200 px-3 py-2 rounded-xl text-[10px] font-black hover:bg-red-500 hover:text-white transition-colors">تنظيف المواعيد القديمة</button>
                            )}
                            {currentUser.role !== 'doctor' && <button type="button" onClick={onAdd} className="w-full lg:w-auto bg-gold-500 text-white px-5 py-2 rounded-xl text-xs font-black shadow-md hover:bg-gold-600 transition-colors">+ حجز</button>}
                        </div>
                    </div>

                    {viewMode === 'daily' && (
                        <div className="animate-slide-up">
                            {Object.keys(groupedByBranchDaily).length === 0 ? (
                                <div className="p-8 text-center text-gray-400 font-bold border border-dashed rounded-3xl bg-white text-sm">لا توجد مواعيد في هذا اليوم.</div>
                            ) : (
                                Object.entries(groupedByBranchDaily).map(([bId, bApps]) => {
                                    if(bApps.length === 0) return null;

        function MasterCodeView({ currentUser, showToast }) {

        // ===== النسخ الاحتياطي (السوبر أدمن بس) =====
        const BACKUP_COLS = ['faqs', 'services', 'specialties', 'consults', 'branches', 'staff_members', 'staff_codes', 'staff_auth', 'public_doctors', 'patients', 'appointments', 'online_bookings', 'booked_slots', 'lab_cases', 'lab_costs', 'payments', 'shortages', 'consumables', 'dues', 'settings', 'private_config'];
        const packVal = v => v instanceof firebase.firestore.Timestamp ? { __ts: v.toMillis() } : Array.isArray(v) ? v.map(packVal) : (v && typeof v === 'object') ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, packVal(x)])) : v;
        const unpackVal = v => (v && typeof v === 'object' && !Array.isArray(v) && Object.keys(v).length === 1 && typeof v.__ts === 'number') ? firebase.firestore.Timestamp.fromMillis(v.__ts) : Array.isArray(v) ? v.map(unpackVal) : (v && typeof v === 'object') ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, unpackVal(x)])) : v;
        function BackupView({ showToast }) {
            const [busy, setBusy] = useState('');
            const [last, setLast] = useState(() => { try { return localStorage.getItem('neLastBackup') || ''; } catch (e) { return ''; } });
            const download = async () => {
                setBusy('جاري تجميع البيانات...');
                try {
                    const out = { app: 'new-era-clinic', version: 1, at: new Date().toISOString(), collections: {} };
                    for (const c of BACKUP_COLS) {
                        setBusy('جاري تحميل ' + c + '...');
                        const sn = await db.collection(c).get();
                        out.collections[c] = Object.fromEntries(sn.docs.map(d => [d.id, packVal(d.data())]));
                    }
                    const n = Object.values(out.collections).reduce((t, x) => t + Object.keys(x).length, 0);
                    const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'new-era-backup-' + localDay() + '.json'; a.click();
                    const stamp = new Date().toLocaleString('ar-EG'); setLast(stamp); try { localStorage.setItem('neLastBackup', stamp); } catch (e) {}
                    showToast('اتنزلت نسخة فيها ' + n + ' سجل ✓');
                } catch (e) { showToast('مشكلة في النسخة: ' + e.message); }
                setBusy('');
            };
            const restore = async (file) => {
                let j; try { j = JSON.parse(await file.text()); } catch (e) { showToast('الملف ده مش نسخة احتياطية'); return; }
                if (!j || j.app !== 'new-era-clinic' || !j.collections) { showToast('الملف ده مش نسخة احتياطية من السيستم'); return; }
                const n = Object.values(j.collections).reduce((t, x) => t + Object.keys(x || {}).length, 0);
                const ans = prompt('هتسترجعي ' + n + ' سجل من نسخة ' + new Date(j.at).toLocaleString('ar-EG') + '.\n\nالسجلات اللي في النسخة هترجع زي ما كانت (ولو اتعدلت بعدها هيرجع القديم). السجلات الجديدة اللي اتعملت بعد النسخة مش هتتمسح.\n\nللتأكيد اكتبي كلمة: استرجاع');
                if (ans !== 'استرجاع') return;
                setBusy('جاري الاسترجاع...');
                try {
                    const writes = [];
                    Object.entries(j.collections).forEach(([c, docs]) => { if (BACKUP_COLS.includes(c)) Object.entries(docs || {}).forEach(([id, data]) => writes.push([c, id, unpackVal(data)])); });
                    for (let i = 0; i < writes.length; i += 400) {
                        const b = db.batch();
                        writes.slice(i, i + 400).forEach(([c, id, data]) => b.set(db.collection(c).doc(id), data));
                        await b.commit();
                        setBusy('جاري الاسترجاع... ' + Math.min(i + 400, writes.length) + ' / ' + writes.length);
                    }
                    showToast('اتسترجع ' + writes.length + ' سجل ✓');
                } catch (e) { showToast('مشكلة في الاسترجاع: ' + e.message); }
                setBusy('');
            };
            const card = "bg-white rounded-[20px] border border-gray-100 shadow-sm p-5 space-y-3";
            return (
                <div className="space-y-3 max-w-2xl">
                    <div className={card}>

                        <button type="button" disabled={!!busy} onClick={download} className="w-full bg-gray-900 text-white py-3 rounded-xl font-black text-sm disabled:opacity-50">⬇ تنزيل نسخة احتياطية دلوقتي</button>
                        {last && <p className="text-[10px] text-gray-400 font-bold">آخر نسخة من الجهاز ده: {last}</p>}
                    </div>
                    <div className={card}>
                        <h4 className="font-black text-gray-800 text-sm">☁️ نسخة تلقائية كل يوم</h4>
                        <p className="text-[11px] text-gray-500 font-bold leading-relaxed">سكريبت جوجل (اللي بيبعت إشعارات تيليجرام) بيعمل نسخة كاملة كل يوم الساعة 3 الفجر ويحفظها في جوجل درايف في فولدر <b>"نسخ نيو إيرا الاحتياطية"</b>، ويحتفظ بآخر 30 نسخة. الملفات دي بتترجع من هنا برضه.</p>
                    </div>
                    <div className={card}>
                        <h4 className="font-black text-gray-800 text-sm">♻️ استرجاع من نسخة</h4>
                        <p className="text-[11px] text-gray-500 font-bold leading-relaxed">لو بيانات اتمسحت أو اتغيّرت بالغلط. اختاري ملف النسخة، وهيطلب منك تكتبي كلمة "استرجاع" للتأكيد.</p>
                        <label className={`block w-full text-center bg-red-50 text-red-600 border border-red-100 py-3 rounded-xl font-black text-sm cursor-pointer ${busy ? 'opacity-50 pointer-events-none' : ''}`}>⬆ اختاري ملف النسخة<input type="file" accept="application/json" hidden onChange={e => { const f = e.target.files[0]; e.target.value = ''; if (f) restore(f); }} /></label>
                    </div>
                    {busy && <p className="text-xs font-black text-gold-600 animate-pulse">{busy}</p>}
                </div>
            );
        }

        // ===== شاشة الرسايل المخصصة =====
        const CM_EXAMPLES = [
            { name: 'تذكير الدكاترة بحجوزات بكرة', when: 'daily', time: '20:00', to: { doctors: true }, skipZero: 'حجوزات_بكرة', text: 'مساء الخير يا د. {الدكتور} 🌙\nعندك بكرة {حجوزات_بكرة} حجز.' },
            { name: 'تأكيد حجوزات بكرة (السكرتارية)', when: 'daily', time: '17:00', to: { branches: true }, skipZero: 'غير_مؤكد_بكرة', text: '📞 فرع {الفرع}: فيه {غير_مؤكد_بكرة} حجز بكرة لسه مش مؤكد — كلّموهم.' },
            { name: 'ملخص آخر الأسبوع', when: 'weekly', days: [4], time: '22:00', to: { main: true }, text: '📊 ملخص {التاريخ}\nحجوزات النهاردة: {حجوزات_النهاردة}\nكنسل: {كنسل_النهاردة}\nمتابعات مستحقة: {متابعات_مستحقة}' }
        ];
        function CustomMsgsView({ showToast, data }) {
            const [list, setList] = useState(null);

            if (!list) return <p className="text-xs font-bold text-gray-400">...</p>;
            const ctx = () => { const today = localDay(); return { branches: data.branches, staff: data.staff, apps: data.appointments, patients: data.patients, labs: data.labCases, shortages: data.shortages, today, tomorrow: dayShift(today, 1), tg: TG }; };
            const upd = (id, patch) => { setList(l => l.map(m => m.id === id ? { ...m, ...patch } : m)); setDirty(true); };
            const add = (ex) => { const id = 'c' + Date.now(); setList(l => [...l, { id, on: true, when: 'daily', time: '09:00', days: [], date: localDay(), to: {}, branchIds: [], text: '', skipZero: '', name: 'رسالة جديدة', ...(ex ? JSON.parse(JSON.stringify(ex)) : {}) }]); setOpen(id); setDirty(true); };
            const save = () => db.collection('private_config').doc('custom_msgs').set({ list, updatedAt: new Date().toISOString() }).then(() => { setDirty(false); showToast('تم حفظ الرسايل ✓'); }).catch(e => showToast(e.message));
            const insertVar = (m, v) => {

            const inp = "w-full p-2.5 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500";
            const chk = (on, label, onChange) => <label className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border text-[11px] font-bold cursor-pointer ${on ? 'bg-gold-50 border-gold-300 text-gold-800' : 'bg-white border-gray-200 text-gray-600'}`}><input type="checkbox" checked={on} onChange={onChange} className="hidden" />{on ? '☑' : '☐'} {label}</label>;
            return (
                <div className="space-y-3 max-w-2xl">
                    <div className="bg-white rounded-[20px] border border-gray-100 shadow-sm p-5 space-y-2">

                    {list.length === 0 && <p className="text-xs text-gray-400 font-bold text-center py-6">مفيش رسايل مخصصة لسه.</p>}

                        return (

                                </div>

                                        <div className="flex flex-wrap gap-2 items-center">
                                            {[['daily', 'كل يوم'], ['weekly', 'أيام معينة'], ['once', 'مرة واحدة']].map(([k, n]) => <button key={k} type="button" onClick={() => upd(m.id, { when: k })} className={`px-3 py-1.5 rounded-lg text-[11px] font-black ${m.when === k ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-600'}`}>{n}</button>)}
                                            <span className="text-[11px] font-bold text-gray-500">الساعة</span><input type="time" value={m.time || ''} onChange={e => upd(m.id, { time: e.target.value })} className="p-1.5 bg-gray-50 border border-gray-100 rounded-lg text-xs font-bold" />
                                            {m.when === 'once' && <input type="date" value={m.date || ''} onChange={e => upd(m.id, { date: e.target.value })} className="p-1.5 bg-gray-50 border border-gray-100 rounded-lg text-xs font-bold" />}
                                        </div>
                                        {m.when === 'weekly' && <div className="flex flex-wrap gap-1.5">{CM_DAYS.map(([d, n]) => chk((m.days || []).includes(d), n, () => upd(m.id, { days: (m.days || []).includes(d) ? m.days.filter(x => x !== d) : [...(m.days || []), d] })))}</div>}
                                    </div>
                                    <div className="space-y-1.5"><p className="text-[10px] font-black text-gray-500">لمين؟</p>
                                        <div className="flex flex-wrap gap-1.5">{CM_TO.map(([k, n]) => <React.Fragment key={k}>{chk(!!(m.to || {})[k], n, () => upd(m.id, { to: { ...(m.to || {}), [k]: !(m.to || {})[k] } }))}</React.Fragment>)}</div>
                                        <div className="flex flex-wrap gap-1.5 items-center"><span className="text-[10px] font-bold text-gray-400">الفروع:</span>
                                            {chk(!(m.branchIds || []).length, 'كل الفروع', () => upd(m.id, { branchIds: [] }))}
                                            {data.branches.map(b => <React.Fragment key={b.id}>{chk((m.branchIds || []).includes(b.id), b.name, () => upd(m.id, { branchIds: (m.branchIds || []).includes(b.id) ? m.branchIds.filter(x => x !== b.id) : [...(m.branchIds || []), b.id] }))}</React.Fragment>)}</div>
                                    </div>
                                    <div className="space-y-1.5"><p className="text-[10px] font-black text-gray-500">الرسالة</p>
                                        <textarea ref={el => { refs.current[m.id] = el; }} rows="4" value={m.text || ''} onChange={e => upd(m.id, { text: e.target.value })} className={inp + ' text-sm leading-relaxed'} placeholder="اكتبي الرسالة هنا..." />
                                        <div className="flex flex-wrap gap-1">{CM_VARS.map(([k, n]) => <button key={k} type="button" onClick={() => insertVar(m, k)} className="px-2 py-1 rounded-md bg-blue-50 text-blue-700 text-[10px] font-black hover:bg-blue-100">+ {n}</button>)}</div>
                                        <label className="flex items-center gap-2 text-[11px] font-bold text-gray-600 flex-wrap">متتبعتش لو
                                            <select value={m.skipZero || ''} onChange={e => upd(m.id, { skipZero: e.target.value })} className="p-1.5 bg-gray-50 border border-gray-100 rounded-lg text-[11px] font-bold"><option value="">— ابعت دايماً —</option>{CM_VARS.slice(3).map(([k, n]) => <option key={k} value={k}>{n}</option>)}</select>
                                            {m.skipZero && '= صفر'}</label>
                                    </div>
                                    <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-3 space-y-2">
                                        <p className="text-[11px] font-black text-indigo-800">🔎 الترجمة</p>
                                        <p className="text-xs font-bold text-indigo-900 leading-relaxed">{cmExplain(m, data.branches)}</p>
                                        {(!TG.token) && <p className="text-[11px] font-bold text-red-600">⚠️ مفيش توكن تيليجرام محفوظ.</p>}
                                        {allR === 0 ? <p className="text-[11px] font-bold text-red-600">⚠️ مفيش حد هيستلمها: اتأكدي إن اللي اخترتيهم ليهم رقم شات في تبويب "تيليجرام".</p>
                                            : <p className="text-[11px] font-bold text-indigo-700">لو اتبعتت دلوقتي: هتوصل لـ {built.length} من {allR}{built.length < allR ? ' (الباقي متخطّى عشان الرقم = صفر)' : ''}</p>}
                                        {/\{[^{}]+\}/.test(built[0] ? built[0].text : '') && <p className="text-[11px] font-bold text-amber-700">⚠️ فيه كلمة بين أقواس السيستم مش فاهمها — استخدمي الزراير الزرقا.</p>}
                                        {built.slice(0, 3).map((x, i) => <div key={i} className="bg-white rounded-lg p-2.5 border border-indigo-100"><p className="text-[9px] font-black text-gray-400 mb-1">← {x.r.label}</p><p className="text-xs font-bold text-gray-800 whitespace-pre-line">{x.text}</p></div>)}
                                        {built.length > 3 && <p className="text-[10px] font-bold text-indigo-600">+ {built.length - 3} كمان</p>}
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        <button type="button" onClick={() => { if (!TG.token || !TG.main) { showToast('محتاجة توكن وشات إدارة'); return; } const x = built[0]; tgPost(TG.main, '🧪 تجربة: ' + (m.name || '') + '\n\n' + (x ? x.text : cmRender(m.text, {}))).then(() => showToast('اتبعتت تجربة على شات الإدارة')).catch(e => showToast(e.message)); }} className="bg-gray-100 px-3 py-2 rounded-xl text-[11px] font-black">🧪 ابعت تجربة لشات الإدارة</button>
                                        <button type="button" onClick={() => { if (!built.length) { showToast('مفيش حد هيستلم'); return; } if (!confirm('تبعتي الرسالة دلوقتي لـ ' + built.length + '؟')) return; cmSendAll(built); showToast('بتتبعت لـ ' + built.length); }} className="bg-gray-900 text-white px-3 py-2 rounded-xl text-[11px] font-black">📤 ابعت دلوقتي للكل</button>
                                    </div>
                                </div>}
                            </div>
                        );
                    })}
                    <button type="button" onClick={save} disabled={!dirty} className="w-full bg-gold-500 text-white py-3 rounded-xl font-black text-sm disabled:opacity-40">{dirty ? 'حفظ الرسايل' : 'محفوظ ✓'}</button>

        // إعدادات تيليجرام (السوبر أدمن بس) — بتتحفظ في مكان مقفول على الموظفين
        function TelegramView({ showToast, branches = [], staff = [] }) {
            const doctors = staff.filter(x => x.role === 'doctor');
            const admins = staff.filter(x => x.role === 'admin' || x.role === 'superadmin');
            const [openP, setOpenP] = useState(null);
            const [v, setV] = useState(null);
            const [found, setFound] = useState(null);
            const [bot, setBot] = useState(null);
            const [showTk, setShowTk] = useState(false);
            const [testRes, setTestRes] = useState({});
            const why = (d) => /chat not found/i.test(d) ? 'الرقم ده لسه مكلّمش البوت: صاحب الرقم لازم يفتح البوت ويدوس Start (أو الرقم غلط)'
                : /unauthorized/i.test(d) ? 'التوكن غلط أو اتلغى — راجعيه من @BotFather'
                : /blocked/i.test(d) ? 'صاحب الرقم عامل Block للبوت — يفتحه ويدوس Restart'
                : /kicked|not a member/i.test(d) ? 'البوت اتشال من الجروب ده — ضيفيه تاني'
                : /failed to fetch|network/i.test(d) ? 'الجهاز مش قادر يوصل لتيليجرام (النت أو الشبكة حاجباه)' : d;
            // اسم البوت ولينكه (عشان السكرتارية تعرف تبعت لمين)
            useEffect(() => {
                const tk = v && v.token.trim(); if (!tk) { setBot(null); return; }
                const t = setTimeout(() => fetch(`https://api.telegram.org/bot${tk}/getMe`).then(r => r.json()).then(j => setBot(j.ok ? j.result : { err: j.description || 'التوكن غلط' })).catch(() => setBot({ err: 'مش قادرين نوصل لتيليجرام' })), 500);
                return () => clearTimeout(t);
            }, [v && v.token]);
            useEffect(() => { db.collection('private_config').doc('telegram').get().then(d => {
                const x = d.exists ? d.data() : {}, bx = x.branches || {};
                setV({ token: x.token || '', main: x.main || '', branches: Object.fromEntries(branches.map(b => [b.id, bx[b.id] || bx[b.name] || ''])), people: mergePeople(x), routes: mergeRoutes(x), off: x.off || [], quiet: x.quiet || {} });
            }).catch(e => showToast(e.message)); }, []);
            if (!v) return <p className="text-xs font-bold text-gray-400">...</p>;
            const inp = "w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500";
            const card = "bg-white rounded-[20px] border border-gray-100 shadow-sm p-5 space-y-3";
            const save = () => {
                const br = {}; Object.entries(v.branches).forEach(([k, c]) => { if (String(c).trim()) br[k] = String(c).trim(); });
                const ids = new Set(staff.map(x => x.id)), pp = {};
                // بنحفظ اللي ليه رقم شات بس، ومن اللي اتشالوا من السيستم بنشيلهم
                Object.entries(v.people || {}).forEach(([k, per]) => { const chat = String(per.chat || '').trim(); if (!chat || (!per.manual && !ids.has(k))) return; pp[k] = { chat, kinds: per.kinds || [], ...(per.manual ? { manual: true, name: (per.name || '').trim() } : {}) }; });
                db.collection('private_config').doc('telegram').set({ token: v.token.trim(), main: v.main.trim(), branches: br, people: pp, routes: v.routes, off: v.off || [], quiet: v.quiet || {}, routesKnown: TG_KINDS.map(k => k[0]) })
                    .then(() => showToast('تم حفظ إعدادات تيليجرام')).catch(e => showToast(e.message));
            };
            const test = (chat, label, key) => {
                const tk = v.token.trim(), id = String(chat || '').trim();
                if (!tk) { setTestRes(r => ({ ...r, [key]: { ok: false, t: 'خانة التوكن فاضية — حطيه واحفظي' } })); return; }
                if (!id) { setTestRes(r => ({ ...r, [key]: { ok: false, t: 'رقم الشات فاضي' } })); return; }
                setTestRes(r => ({ ...r, [key]: { t: 'جاري الإرسال...' } }));
                fetch(`https://api.telegram.org/bot${tk}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: id, text: '✅ رسالة تجربة من سيستم نيو إيرا — ' + label }) })
                    .then(r => r.json()).then(j => setTestRes(r => ({ ...r, [key]: j.ok ? { ok: true, t: 'الرسالة وصلت ✓' } : { ok: false, t: why(j.description || '') } })))
                    .catch(e => setTestRes(r => ({ ...r, [key]: { ok: false, t: why(e.message) } })));
            };
            const Res = ({ k }) => testRes[k] ? <p className={`text-[11px] font-bold ${testRes[k].ok ? 'text-emerald-600' : testRes[k].ok === false ? 'text-red-600' : 'text-gray-400'}`}>{testRes[k].t}</p> : null;
            const findChats = () => {
                if (!v.token.trim()) { showToast('حطي التوكن الأول'); return; }
                fetch(`https://api.telegram.org/bot${v.token.trim()}/getUpdates`).then(r => r.json()).then(j => {
                    if (!j.ok) {
                        const err = j.description || 'خطأ من تيليجرام';
                        if (/webhook/i.test(err)) fetch(`https://api.telegram.org/bot${v.token.trim()}/getWebhookInfo`).then(r => r.json()).then(w => setFound({ err, hook: (w.result && w.result.url) || '' })).catch(() => setFound({ err }));
                        else setFound({ err });
                        return;
                    }
                    const m = {}; (j.result || []).forEach(u => { const c = (u.message || u.edited_message || u.my_chat_member || u.chat_member || u.channel_post || {}).chat; if (c) m[c.id] = (c.type === 'private' ? '👤 ' : '👥 ') + (c.title || [c.first_name, c.last_name].filter(Boolean).join(' ') || c.username || c.id); });
                    setFound(Object.entries(m));
                }).catch(e => setFound({ err: e.message }));
            };
            const setPer = (k, patch) => setV(p => { const cur = (p.people || {})[k] || { chat: '', kinds: [...PERSON_DEFAULT[(staff.find(x => x.id === k) || {}).role === 'doctor' ? 'doctor' : 'admin']] }; return { ...p, people: { ...p.people, [k]: { ...cur, ...patch } } }; });
            const PersonRow = ({ id, name, tag, type, manual }) => {
                const per = (v.people || {})[id] || { chat: '', kinds: [...PERSON_DEFAULT[type]] };
                const open = openP === id, kinds = per.kinds || [];
                return (

                            {manual && <button type="button" onClick={() => setV(p => { const pp = { ...p.people }; delete pp[id]; return { ...p, people: pp }; })} className="px-2 text-red-500 font-black shrink-0">✕</button>}</div>
                        <Res k={'p_' + id} />
                        {open && <div className="grid grid-cols-1 sm:grid-cols-2 gap-1 pt-1">{TG_KINDS.map(([k, n]) => <label key={k} className="flex items-center gap-2 text-[11px] font-bold text-gray-700 cursor-pointer">
                            <input type="checkbox" checked={kinds.includes(k)} onChange={() => setPer(id, { kinds: kinds.includes(k) ? kinds.filter(x => x !== k) : [...kinds, k] })} />{n}{type === 'doctor' && DOCTOR_OWN_KINDS.includes(k) ? <span className="text-[9px] text-gray-400">(بتاعته بس)</span> : ''}</label>)}</div>}

            return (
                <div className="space-y-3 max-w-2xl">
                    <div className={card}>
