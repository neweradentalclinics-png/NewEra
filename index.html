                        const want = {};
                        data.staff.filter(x => x.role === 'doctor').forEach(x => { want[x.id] = { name: x.name || '', branchIds: doctorBranchIds(x, data.branches) }; });
                        const have = await db.collection('public_doctors').get();
                        const b = db.batch(); let n = 0;
                        Object.entries(want).forEach(([id, v]) => { const h = have.docs.find(x => x.id === id); if (!h || h.data().name !== v.name || JSON.stringify(h.data().branchIds) !== JSON.stringify(v.branchIds)) { b.set(db.collection('public_doctors').doc(id), v); n++; } });
                        have.docs.forEach(x => { if (!want[x.id]) { b.delete(x.ref); n++; } });
                        if (n) await b.commit();
                    } catch (e) { console.error('public_doctors sync', e); }
                }, 1500);
                return () => clearTimeout(t);
            }, [isLoggedIn, currentUser, data.staff, data.branches]);
            useEffect(() => {
                if (!isLoggedIn || !currentUser || currentUser.role === 'doctor') return;
                if (!firstSnap.current.appointments) return;
                const t = setTimeout(async () => {
                    try {
                        const today = localDay();
                        const want = {};
                        data.appointments.forEach(a => { if (!a.date || !a.time || a.date < today || a.status === 'canceled') return; want[[a.branchId, a.doctorId || 'none', a.date, a.time].join('_')] = { branchId: a.branchId || '', doctorId: a.doctorId || '', date: a.date, time: a.time }; });
                        const have = await db.collection('booked_slots').where('date', '>=', today).get();
                        const b = db.batch(); let n = 0;
                        Object.entries(want).forEach(([id, v]) => { if (!have.docs.some(x => x.id === id)) { b.set(db.collection('booked_slots').doc(id), v); n++; } });
                        have.docs.forEach(x => { const at = x.data().at; if (!want[x.id] && !(at && Date.now() - at < 120000)) { b.delete(x.ref); n++; } });
                        if (n) await b.commit();
                        // حجوزات أونلاين قديمة (قبل التأمين): نربطها بكود الحجز عشان المريض يقدر يعدلها
                        const legacy = data.appointments.filter(a => a.bookingCode && !a.source && a.date >= today).slice(0, 200);
                        if (legacy.length) {
                            const lb = db.batch();
                            legacy.forEach(a => { lb.update(db.collection('appointments').doc(a.id), { source: 'online' }); lb.set(db.collection('online_bookings').doc(a.bookingCode), { appointmentId: a.id }); });
                            await lb.commit();
                        }
                    } catch (e) { console.error('booked_slots sync', e); }
                }, 2000);
                return () => clearTimeout(t);
            }, [isLoggedIn, currentUser, data.appointments]);

            // دالة تسجيل الدخول (الشكل زي ما هو، بس التحقق بقى من Firebase Auth)
            const finishLogin = (found) => {
                setCurrentUser(found);
                setIsLoggedIn(true);
                if (found.role === 'employee') setSelectedBranch(found.branchId);
                else if (found.role === 'doctor') {
                    const ids = (Array.isArray(found.branchIds) && found.branchIds.length) ? found.branchIds : (found.branchId && found.branchId !== 'all' ? [found.branchId] : []);
                    setSelectedBranch(ids.length === 1 ? ids[0] : 'all');
                }
            };
            const loginByCode = async (code) => {
                const { email, password } = await authCreds(code);
                let ok = false;
                try { await auth.signInWithEmailAndPassword(email, password); ok = true; }
                catch (e) {
                    if (e.code === 'auth/too-many-requests' || e.code === 'auth/network-request-failed' || e.code === 'auth/operation-not-allowed') throw e;
                    ok = await legacyHeal(code);
                }
                if (!ok) return false;
                const sn = await db.collection('staff_members').where('code', '==', code).limit(1).get();
                if (sn.empty) { await auth.signOut().catch(() => {}); return false; }
                const found = { id: sn.docs[0].id, ...sn.docs[0].data() };
                finishLogin(found);
                if (found.role === 'superadmin') migrateAllStaff().then(n => { if (n) setToastMsg('تم تجهيز ' + n + ' موظف للدخول الآمن'); }).catch(() => {});
                return true;
            };
            const doLogin = async (rawCode) => {
                const code = String(rawCode || '').trim();
                if (!code) return false;
                try {
                    if (code === BOOTSTRAP_CODE) {
                        let fresh = false;
                        try { await auth.signInAnonymously(); const sc = await db.collection('settings').doc('security').get(); fresh = !(sc.exists && sc.data().masterReady); } catch (e) { fresh = false; }
                        if (fresh) {
                            const nc = await bootstrapMaster();
                            if (!nc) { await auth.signOut().catch(() => {}); return false; }
                            return (await loginByCode(nc)) ? nc : false;
                        }
                        await auth.signOut().catch(() => {});
                    }
                    return (await loginByCode(code)) ? code : false;
                } catch (e) {
                    console.error(e);
                    alert('مشكلة في الدخول: ' + (e.message || e) + (e.code === 'auth/operation-not-allowed' ? '\n(فعّلي Email/Password من Firebase → Authentication → Sign-in method)' : ''));
                    return false;
                }
            };

            const filteredData = useMemo(() => {
                const isDocUser = currentUser?.role === 'doctor';
                const docBr = isDocUser ? doctorBranchIds(currentUser, data.branches) : [];
                const branchId = currentUser?.role === 'employee' ? currentUser.branchId : selectedBranch;
                const filter = isDocUser
                    ? (i) => docBr.includes(i.branchId) && (branchId === 'all' || i.branchId === branchId)
                    : (i) => branchId === 'all' || i.branchId === branchId;
                return {
                    patients: data.patients.filter(filter).filter(p => currentUser?.role !== 'doctor' || p.doctorId === currentUser.id),
                    appointments: data.appointments.filter(filter).filter(a => currentUser?.role !== 'doctor' || a.doctorId === currentUser.id),
                    payments: data.payments.filter(filter),
                    shortages: data.shortages.filter(filter),
                    labCases: data.labCases.filter(filter),
                    consumables: data.consumables.filter(filter),
                    dues: data.dues.filter(d => currentUser?.role === 'employee' ? d.recordedById === currentUser.id : filter(d)),
                    branches: data.branches
                };
            }, [data, currentUser, selectedBranch]);

            if (!isLoggedIn) return <LoginView onLogin={doLogin} />;

            const isSuperAdmin = currentUser.role === 'superadmin';
            const isAdminOrSuper = currentUser.role === 'admin' || currentUser.role === 'superadmin';
            const isDoctor = currentUser.role === 'doctor';
            const todayS = new Date().toISOString().split('T')[0];
            const inScope = x => currentUser.role === 'admin' || currentUser.role === 'superadmin' || x.branchId === currentUser.branchId;
            const dueNotifs = currentUser.role !== 'employee' ? [] : [
                ...data.patients.filter(p => p.followUpDate && !p.followedAt && p.followUpDate <= todayS && inScope(p)).map(p => ({ id: 'p' + p.id, kind: 'patient', refId: p.id, tab: 'patients', text: '📞 متابعة: ' + p.name + (svcText(p) ? ' — ' + svcText(p) : ''), ts: new Date(p.followUpDate).getTime(), wa: waUrl(p.phone, fillT('followup', { name: p.name, branch: bLabel(data.branches, p.branchId), service: svcText(p) })), itemName: p.name, branchId: p.branchId })),
                ...data.labCases.filter(c => labDue(c) && inScope(c)).map(c => ({ id: 'l' + c.id, kind: 'lab', refId: c.id, tab: 'labs', text: '⏰ اطلبي من ' + c.labName + ': ' + c.patientName, ts: new Date(c.sentDate).getTime() + labRemindDays(c) * 864e5, wa: waLink(c, labPhoneAll[c.labName]), itemName: c.patientName, branchId: c.branchId }))
            ];
            const labPhoneAll = Object.fromEntries(data.labCases.filter(x => x.labPhone).sort((a, b) => (a.sentDate || '').localeCompare(b.sentDate || '')).map(x => [x.labName, x.labPhone]));
            const reviewRows = currentUser.role !== 'employee' ? [] : data.appointments
                .filter(a => a.branchId === currentUser.branchId && (a.status === 'arrived' || a.status === 'done') && !a.reviewSent && !a.reviewSkipped && a.date <= todayS && a.date >= addDays(-3))
                .sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')))
                .map(a => { const br = data.branches.find(b => b.id === a.branchId) || {}; return { id: a.id, name: a.patientName, url: waUrl(a.phone, fillT('review', { name: a.patientName, branch: br.name || '', link: br.reviewLink || br.mapsLink || '' })) }; });
            const markReview = (id, field) => db.collection('appointments').doc(id).update(field === 'reviewSent' ? { reviewSent: true, reviewSentAt: new Date().toISOString(), reviewSentBy: currentUser.name } : { reviewSkipped: true }).catch(e => setToastMsg('مشكلة: ' + e.message));
            const notifItems = [...events, ...dueNotifs].sort((a, b) => b.ts - a.ts);
            const unreadCount = dueNotifs.length + reviewRows.length + events.filter(e => !e.read).length;
            const quickBuy = (it) => setConfirmAction({
                msg: 'تسجيل شراء "' + it.itemName + '" (' + it.quantity + ') وإزالته من النواقص؟',
                onConfirm: () => {
                    const key = (it.itemName || '').trim().toLowerCase();
                    const last = data.consumables.filter(c => c.unitCost && (c.itemName || '').trim().toLowerCase() === key).sort((a, b) => (a.date || '').localeCompare(b.date || '')).pop();
                    const unit = last ? Number(last.unitCost) : 0;
                    const q = parseFloat(it.quantity) || 0;
                    const day = new Date().toISOString().split('T')[0];
                    const b = db.batch();
                    b.set(db.collection('consumables').doc(), { kind: 'purchase', itemName: (it.itemName || '').trim(), qty: it.quantity, unitCost: unit, amount: Math.round(unit * q * 100) / 100, date: day, month: day.slice(0, 7), note: '', branchId: it.branchId || 'store', source: 'auto', recordedBy: currentUser.name });
                    b.delete(db.collection('shortages').doc(it.id));
                    b.commit().then(() => setToastMsg(unit ? 'تم تسجيل الشراء في المستهلكات' : 'تم تسجيل الشراء — السعر 0، عدّليه من المستهلكات')).catch(err => setToastMsg('مشكلة: ' + err.message));
                }
            });
            const pickNotif = (n) => { navigateTo(n.tab); const ids = n.refIds || (n.refId ? [n.refId] : []); if (ids.length) { if (isAdminOrSuper && selectedBranch !== 'all' && n.branchId !== selectedBranch) setSelectedBranch('all'); setFocus({ tab: n.tab, id: ids[0], ids }); setTimeout(() => setFocus(null), 8000); } };
            const doctorBranches = isDoctor ? doctorBranchIds(currentUser, data.branches) : [];

            return (
                <div className="flex h-screen overflow-hidden text-gray-800 bg-[#FDFCFB] relative">
                    {/* التوست ورسائل التأكيد */}
                    {alerts.length > 0 && <div className="fixed top-3 left-3 right-3 z-[999999] flex flex-col gap-2 max-w-md mx-auto">{alerts.slice(-1).map(a => <button key={a.id} type="button" onClick={() => { pickNotif(a); setAlerts([]); }} className="bg-gray-900 text-white text-xs font-bold p-3 rounded-2xl shadow-2xl text-right animate-slide-up">{a.text}</button>)}</div>}
                    {toastMsg && <Toast msg={toastMsg} onClose={() => setToastMsg(null)} />}
                    {confirmAction && <ConfirmModal action={confirmAction} onClose={()=>setConfirmAction(null)} />}
                    {modal && <DataModal modal={modal} staff={data.staff} costs={costs} labNames={[...new Set(filteredData.labCases.map(c => c.labName).filter(Boolean))]} lastCosts={Object.fromEntries(data.consumables.filter(c => c.unitCost).sort((a, b) => (a.date || '').localeCompare(b.date || '')).map(c => [(c.itemName || '').trim().toLowerCase(), c.unitCost]))} labPhones={Object.fromEntries(filteredData.labCases.filter(c => c.labPhone).map(c => [c.labName, c.labPhone]))} branches={data.branches} user={currentUser} selectedBranch={selectedBranch} onClose={()=>setModal(null)} showToast={setToastMsg} />}

                    {/* Overlay للطبقة الشفافة عشان تقفل القايمة الجانبية لما تدوس بره */}
                    {isSidebarOpen && (
                        <div 
                            className="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 lg:hidden animate-fade-in" 
                            onClick={() => setIsSidebarOpen(false)}
                        ></div>
                    )}

                    {/* القائمة الجانبية */}
                    <div className={`fixed inset-y-0 right-0 z-50 bg-white border-l border-gold-400 shadow-2xl transition-transform duration-300 transform ${isSidebarOpen ? 'translate-x-0' : 'translate-x-full'} lg:relative lg:translate-x-0 w-72 h-full flex flex-col`}>
                        <div className="p-8 border-b border-gray-100 flex flex-col items-center relative shrink-0">
                            <img src="https://i.ibb.co/qLw7Tcqv/logo-Dr-shahenda-original.png" className="w-28 h-auto object-contain drop-shadow-sm mb-2" alt="Logo" />
                            <span className="text-[9px] font-bold text-gray-300">نسخة 4.3</span>
                            <button type="button" onClick={() => setIsSidebarOpen(false)} className="absolute left-4 top-8 p-2 text-gray-400 bg-gray-50 rounded-full lg:hidden"><IconX /></button>
                        </div>
                        <nav className="flex-1 p-6 space-y-2 overflow-y-auto custom-scrollbar">
                            {isAdminOrSuper && <SidebarItem icon={<IconDashboard/>} label="لوحة التحكم" active={activeTab === 'dashboard'} onClick={() => navigateTo('dashboard')} />}
                            {<SidebarItem icon={<IconUsers/>} label="سجل المرضى" active={activeTab === 'patients'} onClick={() => navigateTo('patients')} />}
                            <SidebarItem icon={<IconCalendar/>} label="المواعيد والتقويم" active={activeTab === 'appointments'} onClick={() => navigateTo('appointments')} />
                            {!isDoctor && <SidebarItem icon={<IconClipboard/>} label="النواقص" active={activeTab === 'shortages'} onClick={() => navigateTo('shortages')} />}
                            <SidebarItem icon={<IconFlask/>} label="المعامل" active={activeTab === 'labs'} onClick={() => navigateTo('labs')} />
                            {currentUser.role === 'employee' && <SidebarItem icon={<IconWallet/>} label="الفواتير" active={activeTab === 'dues'} onClick={() => navigateTo('dues')} />}
                            {currentUser.role === 'employee' && <SidebarItem icon={<IconWallet/>} label="توريد اليوم" active={activeTab === 'daily'} onClick={() => navigateTo('daily')} />}
                            {isAdminOrSuper && <div className="px-3 pt-4 pb-1 text-[9px] font-black text-gray-400 tracking-widest">الإدارة</div>}
                            {isAdminOrSuper && <SidebarItem icon={<IconWallet/>} label="المستهلكات الشهرية" active={activeTab === 'consumables'} onClick={() => navigateTo('consumables')} />}
                            {isAdminOrSuper && <SidebarItem icon={<IconWallet/>} label="الفواتير والمستحقات" active={activeTab === 'dues'} onClick={() => navigateTo('dues')} />}
                            {isSuperAdmin && <SidebarItem icon={<IconWallet/>} label="الماليات" active={activeTab === 'finance'} onClick={() => navigateTo('finance')} />}
                            {isAdminOrSuper && <SidebarItem icon={<IconCog/>} label="الإعدادات" active={activeTab === 'settings'} onClick={() => navigateTo('settings')} />}
                        </nav>
                    </div>

                    {/* المحتوى الرئيسي */}
                    <div className="flex-1 flex flex-col h-full w-full overflow-hidden">
                        <header className="h-16 md:h-20 bg-white/90 border-b border-gray-200 px-3 sm:px-6 flex items-center justify-between z-30 shrink-0 shadow-sm relative">
                            <div className="flex items-center gap-1 sm:gap-3">
                                <button type="button" onClick={() => setIsSidebarOpen(true)} className="p-2 text-gray-700 hover:text-gold-500 rounded-lg lg:hidden"><IconMenu/></button>
                                
                                <div className="flex items-center bg-gray-50 rounded-full border border-gray-100 p-1">
                                    <button type="button" onClick={goBack} disabled={currentIndex === 0} className={`p-1.5 sm:p-2 rounded-full transition-colors flex items-center justify-center ${currentIndex > 0 ? 'text-gray-600 hover:text-gold-600 hover:bg-white shadow-sm' : 'text-gray-300 cursor-not-allowed'}`} title="رجوع">
                                        <IconBack />
                                    </button>
                                    <button type="button" onClick={() => navigateTo(isDoctor ? 'appointments' : 'dashboard')} className="p-1.5 sm:p-2 rounded-full transition-colors flex items-center justify-center text-gray-600 hover:text-gold-600 hover:bg-white shadow-sm mx-1" title="الرئيسية">
                                        <IconHome />
                                    </button>
                                    <button type="button" onClick={goForward} disabled={currentIndex === history.length - 1} className={`p-1.5 sm:p-2 rounded-full transition-colors flex items-center justify-center ${currentIndex < history.length - 1 ? 'text-gray-600 hover:text-gold-600 hover:bg-white shadow-sm' : 'text-gray-300 cursor-not-allowed'}`} title="للأمام">
                                        <IconForward />
                                    </button>
                                </div>
                                <NotifBell items={notifItems} unread={unreadCount} reviews={reviewRows} onReview={markReview} onOpen={() => setEvents(es => es.map(e => ({ ...e, read: true })))} onPick={pickNotif} />
                            </div>
                            
                            <div className="flex items-center gap-3 sm:gap-4">
                                {isAdminOrSuper && (
                                    <select value={selectedBranch} onChange={(e) => setSelectedBranch(e.target.value)} className="bg-gray-50 border border-gray-200 text-[10px] sm:text-xs font-bold p-1.5 sm:p-2.5 rounded-xl outline-none cursor-pointer focus:border-gold-500 max-w-[100px] sm:max-w-none">
                                        <option value="all">كل الفروع</option>
                                        {data.branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                                    </select>
                                )}
                                {isDoctor && doctorBranches.length > 1 && (
                                    <select value={selectedBranch} onChange={(e) => setSelectedBranch(e.target.value)} className="bg-gray-50 border border-gray-200 text-[10px] sm:text-xs font-bold p-1.5 sm:p-2.5 rounded-xl outline-none cursor-pointer focus:border-gold-500 max-w-[100px] sm:max-w-none">
                                        <option value="all">كل فروعي</option>
                                        {doctorBranches.map(id => <option key={id} value={id}>{data.branches.find(b => b.id === id)?.name || id}</option>)}
                                    </select>
                                )}
                                <div className="text-left hidden sm:block pr-4 border-r border-gray-200">
                                    <p className="text-xs font-black text-gray-800">{currentUser.name}</p>
                                    <p className="text-[10px] text-gold-500 font-bold uppercase">{isSuperAdmin ? 'Super Admin' : currentUser.role === 'admin' ? 'مدير عام' : currentUser.role === 'doctor' ? 'طبيب' : 'موظف فرع'}</p>
                                </div>
                                <button type="button" onClick={() => {localStorage.removeItem('newEraSavedCode'); auth.signOut().catch(() => {}).finally(() => window.location.reload());}} className="text-red-500 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-xl font-bold text-xs transition-colors">خروج</button>
                            </div>
                        </header>

                        <div className="flex-1 p-3 md:p-8 overflow-y-auto w-full custom-scrollbar pb-20">
                            {activeTab === 'dashboard' && !isDoctor && <DashboardStats data={filteredData} userRole={currentUser.role} onNav={navigateTo} />}
                                                        {activeTab === 'patients' && <PatientsView staff={data.staff} focusId={focus?.tab === 'patients' ? focus.id : null} patients={filteredData.patients} branches={data.branches} currentUser={currentUser} onConfirm={setConfirmAction} onAdd={()=>setModal({type:'patient', mode:'add'})} onEdit={(d)=>setModal({type:'patient', mode:'edit', data:d})} showToast={setToastMsg} />}
                            {activeTab === 'appointments' && <AppointmentsView focusIds={focus?.tab === 'appointments' ? focus.ids : null} apps={filteredData.appointments} branches={data.branches} currentUser={currentUser} selectedBranch={selectedBranch} onConfirm={setConfirmAction} onAdd={()=>setModal({type:'app', mode:'add'})} onEdit={(d)=>setModal({type:'app', mode:'edit', data:d})} onNav={navigateTo} showToast={setToastMsg} />}
                            {activeTab === 'daily' && currentUser.role === 'employee' && <DailyView payments={data.payments} branches={data.branches} currentUser={currentUser} onConfirm={setConfirmAction} onAdd={()=>setModal({type:'payment', mode:'add', data:{branchId:currentUser.branchId}})} onEdit={(d)=>setModal({type:'payment', mode:'edit', data:d})} showToast={setToastMsg} />}
                            {activeTab === 'finance' && isSuperAdmin && <FinanceView payments={filteredData.payments} branches={data.branches} selectedBranch={selectedBranch} currentUser={currentUser} onConfirm={setConfirmAction} onAdd={(bId)=>setModal({type:'payment', mode:'add', data:{branchId:bId}})} onEdit={(d)=>setModal({type:'payment', mode:'edit', data:d})} showToast={setToastMsg} />}
                                                        {activeTab === 'labs' && <LabsView focusId={focus?.tab === 'labs' ? focus.id : null} cases={filteredData.labCases} costs={costs} branches={data.branches} currentUser={currentUser} selectedBranch={selectedBranch} onConfirm={setConfirmAction} onAdd={()=>setModal({type:'lab', mode:'add'})} onEdit={(d)=>setModal({type:'lab', mode:'edit', data:d})} showToast={setToastMsg} />}
                            {activeTab === 'settings' && isAdminOrSuper && <SettingsView sections={[{ k: 'branches', label: 'الفروع', node: <BranchesView branches={data.branches} onConfirm={setConfirmAction} onAdd={()=>setModal({type:'branch', mode:'add'})} onEdit={(d)=>setModal({type:'branch', mode:'edit', data:d})} showToast={setToastMsg} /> }, { k: 'templates', label: 'قوالب الرسائل', node: <TemplatesView showToast={setToastMsg} /> }, ...(isSuperAdmin ? [{ k: 'staff', label: 'الموظفين', node: <StaffView staff={data.staff} branches={data.branches} onConfirm={setConfirmAction} onAdd={(k)=>setModal({type:'staff', mode:'add', data:{kind:k}})} onEdit={(d)=>setModal({type:'staff', mode:'edit', data:d})} showToast={setToastMsg} /> }, { k: 'mycode', label: 'كود السوبر أدمن', node: <MasterCodeView currentUser={currentUser} showToast={setToastMsg} /> }] : [])]} />}
                            {activeTab === 'dues' && !isDoctor && <DuesView focusIds={focus?.tab === 'dues' ? focus.ids : null} items={filteredData.dues} branches={data.branches} currentUser={currentUser} onConfirm={setConfirmAction} onAdd={()=>setModal({type:'due', mode:'add'})} onEdit={(d)=>setModal({type:'due', mode:'edit', data:d})} showToast={setToastMsg} />}
                                                        {activeTab === 'consumables' && isAdminOrSuper && <ConsumablesView allItems={data.consumables} items={filteredData.consumables} branches={data.branches} currentUser={currentUser} selectedBranch={selectedBranch} onConfirm={setConfirmAction} onAdd={()=>setModal({type:'consumable', mode:'add', data:{kind:'purchase'}})} onEdit={(d)=>setModal({type:'consumable', mode:'edit', data:d})} showToast={setToastMsg} />}
                            {activeTab === 'shortages' && !isDoctor && <ShortagesView focusIds={focus?.tab === 'shortages' ? focus.ids : null} onBuy={(it)=> !isAdminOrSuper ? setConfirmAction({msg:'هل تم توفير وشراء هذا الصنف؟', onConfirm:()=>db.collection('shortages').doc(it.id).delete().then(()=>setToastMsg('تم')).catch(err=>setToastMsg('مشكلة: '+err.message))}) : quickBuy(it)} shortages={filteredData.shortages} branches={data.branches} currentUser={currentUser} selectedBranch={selectedBranch} onConfirm={setConfirmAction} onEdit={(d)=>setModal({type:'shortage', mode:'edit', data:d})} showToast={setToastMsg} />}
                        </div>
                    </div>
                </div>
            );
        }

        function LoginView({ onLogin }) {
            const [code, setCode] = useState(['', '', '', '']);
            const [rememberMe, setRememberMe] = useState(true);
            const inputRefs = useRef([]);

            const [busy, setBusy] = useState(false);
            useEffect(() => {
                const savedCode = localStorage.getItem('newEraSavedCode');
                if (savedCode) Promise.resolve(onLogin(savedCode)).then(r => { if (typeof r === 'string' && r !== savedCode) localStorage.setItem('newEraSavedCode', r); }).catch(() => {});
            }, []);

            const handleChange = (index, value) => {
                if (!/^[0-9]*$/.test(value)) return;
                const newCode = [...code]; newCode[index] = value.slice(-1); setCode(newCode);
                if (value && index < 3) inputRefs.current[index + 1].focus();
            };

            const handleKeyDown = (index, e) => {
                if (e.key === 'Backspace' && !code[index] && index > 0) inputRefs.current[index - 1].focus();
                else if (e.key === 'Enter') attemptLogin();
            };

            const attemptLogin = async () => {
                if (busy) return;
                const fullCode = code.join('');
                setBusy(true);
                const success = await onLogin(fullCode);
                setBusy(false);
                if (success && rememberMe) {
                    localStorage.setItem('newEraSavedCode', typeof success === 'string' ? success : fullCode);
                } else if (!success) {
                    alert("كود الدخول غير صحيح!");
                    setCode(['', '', '', '']);
                    inputRefs.current[0].focus();
                }
            };

            return (
                <div className="h-screen bg-[#050505] flex items-center justify-center p-6 text-center w-full relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-96 h-96 bg-gold-600/10 rounded-full blur-[120px] -translate-y-1/2 translate-x-1/2"></div>
                    <div className="w-full max-w-md bg-[#111111] p-10 rounded-[40px] border border-white/5 shadow-2xl relative z-10 flex flex-col items-center animate-scale-in">
                        <img src="https://i.ibb.co/qLw7Tcqv/logo-Dr-shahenda-original.png" className="w-64 mb-8 drop-shadow-[0_0_15px_rgba(245,158,11,0.2)]" />
                        <p className="text-gray-400 text-sm mb-6 font-bold tracking-widest uppercase">أدخل الكود الخاص بك</p>
                        <div className="flex gap-4 mb-6" dir="ltr">
                            {[0, 1, 2, 3].map((index) => (
                                <input key={index} ref={el => inputRefs.current[index] = el} type="password" inputMode="numeric" value={code[index]} onChange={(e) => handleChange(index, e.target.value)} onKeyDown={(e) => handleKeyDown(index, e)} className="w-14 h-16 bg-black/80 border border-white/10 rounded-2xl text-center text-3xl font-black text-gold-500 focus:border-gold-500 outline-none transition-all shadow-inner" />
                            ))}
                        </div>
                        <label className="flex items-center gap-2 text-gray-400 text-sm font-bold mb-8 cursor-pointer hover:text-gold-500 transition-colors">
                            <input type="checkbox" checked={rememberMe} onChange={(e) => setRememberMe(e.target.checked)} className="rounded" />
                            تذكرني (للدخول التلقائي)
                        </label>
                        <button type="button" onClick={attemptLogin} className="w-full bg-gradient-to-r from-gold-600 to-gold-400 text-black font-black py-4 rounded-2xl shadow-lg hover:scale-105 transition-transform text-lg">تـسـجـيـل الـدخـول</button>
                    </div>
                </div>
            );
        }

        function SidebarItem({ icon, label, active, onClick }) {
            return (
                <button type="button" onClick={onClick} className={`w-full flex items-center gap-4 p-4 rounded-2xl transition-all duration-200 ${active ? 'bg-gold-500 text-white shadow-md shadow-gold-500/30' : 'text-gray-500 hover:bg-gray-50 hover:text-gold-600'}`}>
                    <span className={active ? 'text-white' : 'text-gray-400'}>{icon}</span>
                    <span className="font-bold text-sm tracking-tight">{label}</span>
                </button>
            );
        }

        function DashboardStats({ data, userRole, onNav }) {
            const stats = [
                { label: 'سجل المرضى', val: data.patients.length, icon: <IconUsers/>, tab: 'patients' },
                { label: 'المواعيد القادمة', val: data.appointments.length, icon: <IconCalendar/>, tab: 'appointments' },
                { label: 'النواقص', val: data.shortages.length, icon: <IconClipboard/>, tab: 'shortages' }
            ];
            if (userRole === 'superadmin') {
                stats.push({ label: 'الإيرادات', val: data.payments.reduce((a,b) => a+Number(b.amount||0),0) + ' ج', icon: <IconWallet/>, tab: 'finance' });
            }
            return (
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-6 animate-fade-in">
                    {stats.map((s, i) => (
                        <div key={i} onClick={() => onNav(s.tab)} className="bg-white p-4 sm:p-6 rounded-[20px] sm:rounded-[30px] border border-gray-100 shadow-sm cursor-pointer hover:-translate-y-1 transition-transform flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-5">
                            <div className="w-10 h-10 sm:w-14 sm:h-14 rounded-xl sm:rounded-2xl bg-gray-50 text-gold-500 flex items-center justify-center shrink-0">{s.icon}</div>
                            <div><p className="text-[9px] sm:text-[10px] font-black text-gray-400 uppercase tracking-widest">{s.label}</p><p className="text-lg sm:text-2xl font-black text-gray-800 tracking-tighter">{s.val}</p></div>
                        </div>
                    ))}
                </div>
            );
        }

        function ShortagesView({ focusIds, onBuy, shortages, branches, currentUser, selectedBranch, onConfirm, onEdit, showToast }) {
            const [itemName, setItemName] = useState('');
            const [quantity, setQuantity] = useState('');
            const [branchId, setBranchId] = useState(currentUser.role === 'employee' ? currentUser.branchId : (selectedBranch === 'all' ? 'store' : selectedBranch));

            const sortedShortages = useMemo(() => [...shortages].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)), [shortages]);

            const groupedShortages = useMemo(() => {
                if (selectedBranch !== 'all') return { [selectedBranch]: sortedShortages };
                const groups = {};
                sortedShortages.forEach(s => {
                    const bId = s.branchId || 'unknown';
                    if (!groups[bId]) groups[bId] = [];
                    groups[bId].push(s);
                });
                return groups;
            }, [sortedShortages, selectedBranch]);

            useEffect(() => { if (focusIds && focusIds.length) setTimeout(() => document.getElementById('short-' + focusIds[0])?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300); }, [focusIds]);
            const handleAdd = (e) => {
                e.preventDefault();
                if (!itemName || !quantity) return;
                db.collection('shortages').add({ itemName, quantity, branchId, requestedBy: currentUser.name, timestamp: new Date().toISOString() })
                .then(ref => { const bn = branches.find(b => b.id === branchId)?.name || ''; tgSend(tgText('shortages', { itemName, quantity, branchId }, bn, '', currentUser.name, ref.id), bn); setItemName(''); setQuantity(''); showToast("تم إضافة الصنف للمخزن"); })
                .catch(err => showToast("مشكلة في إضافة صنف: " + err.message));
            };

            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <h3 className="text-lg font-black text-gray-800">النواقص</h3>
                    <div className="bg-white p-4 rounded-[20px] border border-gray-100 shadow-sm">
                        <form onSubmit={handleAdd} className="flex flex-col md:flex-row gap-3 items-end">
                            <div className="flex-1 w-full">
                                <label className="text-[9px] font-black text-gray-400 uppercase tracking-widest block mb-1">اسم الصنف</label>
                                <input type="text" required value={itemName} onChange={e=>setItemName(e.target.value)} placeholder="مثال: كمامات..." className="w-full bg-gray-50 border border-gray-100 focus:border-gold-500 p-2.5 rounded-lg outline-none font-bold text-gray-800 text-xs" />
                            </div>
                            <div className="w-full md:w-28">
                                <label className="text-[9px] font-black text-gray-400 uppercase tracking-widest block mb-1">الكمية</label>
                                <input type="text" required value={quantity} onChange={e=>setQuantity(e.target.value)} placeholder="مثال: 5" className="w-full bg-gray-50 border border-gray-100 focus:border-gold-500 p-2.5 rounded-lg outline-none font-bold text-gray-800 text-xs text-center" />
                            </div>
                            
                            {(currentUser.role === 'admin' || currentUser.role === 'superadmin') && (
                                <div className="w-full md:w-40">
                                    <label className="text-[9px] font-black text-gray-400 uppercase tracking-widest block mb-1">الفرع / المخزن</label>
                                    <select value={branchId} onChange={e=>setBranchId(e.target.value)} className="w-full bg-gray-50 border border-gray-100 focus:border-gold-500 p-2.5 rounded-lg outline-none font-bold text-gray-800 text-xs cursor-pointer">
                                        <option value="store">المخزن (الرئيسي)</option>
                                        {branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
                                    </select>
                                </div>
                            )}
                            <button type="submit" className="w-full md:w-auto bg-gold-500 text-white px-6 py-2.5 rounded-lg font-black text-xs shadow-md hover:bg-gold-600 transition-colors">أضف +</button>
                        </form>
                    </div>

                    <div className="bg-white rounded-[20px] border border-gray-100 shadow-sm p-3 sm:p-4 space-y-4">
                        {Object.keys(groupedShortages).length === 0 ? (
                            <div className="p-4 text-center text-gray-400 font-bold text-xs">لا توجد نواقص مسجلة.</div>
                        ) : (
                            Object.entries(groupedShortages).map(([bId, bShortages]) => {
                                if(bShortages.length === 0) return null;
                                const bName = bId === 'store' ? 'المخزن الرئيسي' : (branches.find(b=>b.id===bId)?.name || 'غير معروف');
                                return (
                                    <div key={bId} className="mb-2">
                                        <div className="flex items-center gap-3 mb-2 mt-1">
                                            <span className="text-[10px] font-black bg-gradient-to-r from-gold-500 to-gold-600 text-white px-3 py-1 rounded-lg shadow-sm border border-gold-400">{bName}</span>
                                            <div className="h-px bg-gradient-to-l from-gold-200 to-transparent flex-1 rounded-full"></div>
                                        </div>
                                        <div className="space-y-2">
                                            {bShortages.map(item => {
                                                const d = new Date(item.timestamp).toLocaleDateString('en-GB');
                                                return (
                                                    <div key={item.id} id={'short-' + item.id} className={`flex flex-col sm:flex-row justify-between items-start sm:items-center p-3 rounded-xl border gap-3 ${focusIds?.includes(item.id) ? 'bg-gold-50 border-gold-500 ring-2 ring-gold-400' : 'bg-gray-50 border-gray-100'}`}>
                                                        <div>
                                                            <div className="flex items-center gap-2">
                                                                <span className="font-black text-gray-800 text-xs sm:text-sm">{item.itemName}</span>
                                                                <span className="bg-gold-100 text-gold-700 px-1.5 py-0.5 rounded-md text-[10px] font-bold">{item.quantity}</span>
                                                            </div>
                                                            <div className="text-[9px] text-gray-500 flex flex-wrap gap-2 mt-1 items-center">
                                                                <span className="flex items-center gap-0.5"><IconUserCircle/> {item.requestedBy}</span>
                                                                <span dir="ltr" className="text-gray-400 font-mono">{d}</span>
                                                            </div>
                                                        </div>
                                                        
                                                        <div className="flex items-center gap-1.5 shrink-0">
                                                            <button type="button" onClick={() => onEdit(item)} className="bg-white text-gold-500 hover:bg-gold-500 hover:text-white p-1.5 rounded-lg border border-gray-200 transition-colors">
                                                                <IconEdit />
                                                            </button>
                                                            <button type="button" onClick={() => onBuy(item)} className="bg-emerald-50 text-emerald-600 hover:bg-emerald-500 hover:text-white px-2 py-1 rounded-md font-bold text-[9px] border border-emerald-100 transition-colors whitespace-nowrap">
                                                                ✅ تم الشراء
                                                            </button>
                                                            <button type="button" onClick={() => onConfirm({ msg: 'حذف "' + item.itemName + '" من النواقص؟', onConfirm: () => db.collection('shortages').doc(item.id).delete().then(() => showToast('تم الحذف')).catch(err => showToast('مشكلة في الحذف: ' + err.message)) })} className="p-1.5 text-red-500 bg-red-50 hover:bg-red-500 hover:text-white rounded-lg border border-red-100 transition-colors" title="حذف">
                                                                <IconTrash />
                                                            </button>
                                                        </div>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>
                                )
                            })
                        )}
                    </div>
                </div>
            );
        }

        // --- المواعيد ---
        function AppointmentsView({ focusIds, apps, branches, currentUser, selectedBranch, onConfirm, onAdd, onEdit, onNav, showToast }) {
            const [viewMode, setViewMode] = useState('daily'); 
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            useEffect(() => { if (!focusIds || !focusIds.length) return; const a = apps.find(x => focusIds.includes(x.id)); if (a && a.date) { setSelectedDate(a.date); setViewMode('daily'); } setTimeout(() => document.getElementById('app-' + (a ? a.id : ''))?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 350); }, [focusIds]);

            const filteredApps = useMemo(() => {
                let list = apps.filter(a => selectedBranch === 'all' || a.branchId === selectedBranch);
                list.sort((a, b) => {
                    const dA = a.date || ""; const dB = b.date || "";
                    if (dA !== dB) return dA.localeCompare(dB);
                    const tA = a.time || ""; const tB = b.time || "";
                    return tA.localeCompare(tB);
                });
                return list;
            }, [apps, selectedBranch]);

            const dailyApps = useMemo(() => filteredApps.filter(a => a.date === selectedDate), [filteredApps, selectedDate]);

            const groupedByBranchDaily = useMemo(() => {
                if (selectedBranch !== 'all') return { [selectedBranch]: dailyApps };
                const groups = {};
                dailyApps.forEach(a => {
                    const bId = a.branchId || 'unknown';
                    if (!groups[bId]) groups[bId] = [];
                    groups[bId].push(a);
                });
                return groups;
            }, [dailyApps, selectedBranch]);

            const weeklyDays = useMemo(() => {
                const days = [];
                for(let i=0; i<7; i++) {
                    const d = new Date(selectedDate);
                    d.setDate(d.getDate() + i);
                    const dStr = d.toISOString().split('T')[0];
                    const dayName = new Intl.DateTimeFormat('ar-EG', { weekday: 'long' }).format(d);
                    const dayApps = filteredApps.filter(a => a.date === dStr);
                    days.push({ date: dStr, dayName, apps: dayApps });
                }
                return days;
            }, [filteredApps, selectedDate]);

            const handleManualCleanup = () => {
                onConfirm({
                    msg: 'هل أنت متأكد من مسح جميع المواعيد التي مر عليها أكثر من شهر؟ (إجراء آمن)',
                    onConfirm: () => {
                        const oneMonthAgo = new Date();
                        oneMonthAgo.setMonth(oneMonthAgo.getMonth() - 1);
                        const cutoffDate = oneMonthAgo.toISOString().split('T')[0];
                        
                        const old = apps.filter(app => app.date && app.date < cutoffDate);
                        if (old.length === 0) { showToast("مفيش مواعيد أقدم من شهر."); return; }
                        old.forEach(app => {
                            db.collection('appointments').doc(app.id).delete()
                            .catch(err => showToast("خطأ في مسح موعد: " + err.message));
                        });
                        showToast("تم مسح " + old.length + " موعد قديم.");
                    }
                });
            };

            const renderCalendar = () => {
                const date = new Date(selectedDate);
                const year = date.getFullYear(); const month = date.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const calendarDays = [];
                for (let i = 0; i < firstDay; i++) calendarDays.push({ empty: true });
                for (let i = 1; i <= daysInMonth; i++) {
                    const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                    const count = apps.filter(a => a.date === dStr && (selectedBranch === 'all' || a.branchId === selectedBranch)).length;
                    calendarDays.push({ d: i, date: dStr, count });
                }
                return (
                    <div className="bg-white rounded-[20px] border border-gray-100 shadow-sm overflow-hidden animate-slide-up mt-4">
                        <div className="grid grid-cols-7 bg-gray-50 border-b border-gray-100 text-center py-2 text-[9px] font-black text-gray-500">
                            <div>أحد</div><div>إثنين</div><div>ثلاثاء</div><div>أربعاء</div><div>خميس</div><div>جمعة</div><div>سبت</div>
                        </div>
                        <div className="calendar-grid">
                            {calendarDays.map((item, idx) => item.empty ? <div key={idx} className="calendar-cell bg-gray-50 opacity-30"></div> : (
                                <div key={idx} 
                                    onClick={() => { setSelectedDate(item.date); setViewMode('daily'); }}
                                    className={`calendar-cell ${item.date === selectedDate ? 'today' : ''}`}
                                >
                                    <span className="text-xs font-bold">{item.d}</span>
                                    {item.count > 0 && <span className="text-[8px] font-black text-gold-600 mt-1 bg-gold-50 px-1.5 rounded">{item.count} حجز</span>}
                                    {item.count > 0 && <span className="dot"></span>}
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-3">
                        <h3 className="text-lg font-black text-gray-800">إدارة المواعيد</h3>
                        <div className="flex bg-gray-100 p-1 rounded-xl w-full lg:w-auto">
                            <button type="button" onClick={() => setViewMode('daily')} className={`flex-1 px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode==='daily' ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>يومي</button>
                            <button type="button" onClick={() => setViewMode('weekly')} className={`flex-1 px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode==='weekly' ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>أسبوعي</button>
                            <button type="button" onClick={() => setViewMode('monthly')} className={`flex-1 px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode==='monthly' ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>شهري</button>
                        </div>
                        <input type="date" value={selectedDate} onChange={(e)=>setSelectedDate(e.target.value)} className="w-full lg:w-auto bg-white border border-gray-200 text-xs font-bold p-2 rounded-xl outline-none focus:border-gold-500"/>
                        
                        <div className="flex gap-2 w-full lg:w-auto">
                            {currentUser.role === 'superadmin' && (
                                <button type="button" onClick={handleManualCleanup} className="w-full lg:w-auto bg-red-50 text-red-600 border border-red-200 px-3 py-2 rounded-xl text-[10px] font-black hover:bg-red-500 hover:text-white transition-colors">تنظيف المواعيد القديمة</button>
                            )}
                            {currentUser.role !== 'doctor' && <button type="button" onClick={onAdd} className="w-full lg:w-auto bg-gold-500 text-white px-5 py-2 rounded-xl text-xs font-black shadow-md hover:bg-gold-600 transition-colors">+ حجز</button>}
                        </div>
                    </div>

                    {viewMode === 'daily' && (
                        <div className="animate-slide-up">
                            {Object.keys(groupedByBranchDaily).length === 0 ? (
                                <div className="p-8 text-center text-gray-400 font-bold border border-dashed rounded-3xl bg-white text-sm">لا توجد مواعيد في هذا اليوم.</div>
                            ) : (
                                Object.entries(groupedByBranchDaily).map(([bId, bApps]) => {
                                    if(bApps.length === 0) return null;
                                    const bName = branches.find(b=>b.id===bId)?.name || 'العيادة';
                                    return (
                                        <div key={bId} className="mb-4">
                                            {selectedBranch === 'all' && (
                                                <div className="flex items-center gap-3 mb-4 mt-2">
                                                    <span className="text-xs font-black bg-gradient-to-r from-gold-500 to-gold-600 text-white px-4 py-1.5 rounded-lg shadow-md border border-gold-400">فرع {bName}</span>
                                                    <div className="h-0.5 bg-gradient-to-l from-gold-200 to-transparent flex-1 rounded-full"></div>
                                                </div>
                                            )}
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
                                                {bApps.map(a => (
                                                    <div key={a.id} id={'app-' + a.id} className={`bg-white p-2.5 rounded-xl border ${focusIds?.includes(a.id) ? 'border-gold-500 ring-2 ring-gold-400' : 'border-gray-100'} flex flex-col sm:flex-row sm:items-center justify-between gap-2 hover:bg-gray-50 transition-colors shadow-sm`}>
                                                        <div className="flex items-center gap-2 min-w-0">
                                                            <div className="bg-gold-50 text-gold-700 px-2 py-1 rounded-lg text-[10px] font-black shrink-0 tracking-widest">{a.time || '00:00'}</div>
                                                            <div className="min-w-0">
                                                                <h5 className="font-black text-gray-800 text-xs truncate leading-tight mb-0.5">{a.patientName}</h5>
                                                                <div className="flex flex-wrap items-center gap-1.5">
                                                                    <span className="text-[9px] font-mono font-bold text-gray-500 tracking-wider" dir="ltr">{a.phone || 'بدون رقم'}</span>
                                                                    {a.service && <span className="text-[8px] bg-blue-50 text-blue-600 px-1.5 rounded font-bold">{a.service}</span>}
                                                                    {a.doctorName && <span className="text-[8px] bg-purple-50 text-purple-600 px-1.5 rounded font-bold">د. {a.doctorName}</span>}
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div className="flex gap-1 shrink-0 self-end sm:self-auto items-center"><StatusSelect a={a} showToast={showToast} />{(() => { const br = branches.find(b => b.id === a.branchId) || {}; return (<><WaMsg phone={a.phone} label="تذكير" text={fillT('reminder', { name: a.patientName, branch: br.name || '', date: a.date, time: a.time || '' })} />{(a.status === 'done' || a.status === 'arrived') && <WaMsg phone={a.phone} label={a.reviewSent ? 'تقييم ✓' : 'تقييم'} text={fillT('review', { name: a.patientName, branch: br.name || '', link: br.reviewLink || br.mapsLink || '' })} />}</>); })()}{currentUser.role !== 'doctor' && (<>
                                                            <button type="button" onClick={()=>onEdit(a)} className="p-1.5 bg-white border border-gray-200 text-gold-500 rounded-lg hover:bg-gold-500 hover:text-white transition-colors"><IconEdit/></button>
                                                            <button type="button" onClick={()=>onConfirm({msg:'إلغاء الموعد نهائياً؟', onConfirm:()=>{
                                                                db.collection('appointments').doc(a.id).delete()
                                                                .then(() => showToast("تم إلغاء الموعد"))
                                                                .catch(err => showToast("مشكلة في حذف الموعد: " + err.message)); 
                                                            }})} className="p-1.5 bg-white border border-gray-200 text-red-500 rounded-lg hover:bg-red-500 hover:text-white transition-colors"><IconTrash/></button>
                                                        </>)}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )
                                })
                            )}
                        </div>
                    )}

                    {viewMode === 'weekly' && (
                        <div className="bg-white rounded-[20px] border border-gray-100 shadow-sm overflow-hidden animate-slide-up">
                            <div className="divide-y divide-gray-50">
                                {weeklyDays.map((day, idx) => (
                                    <div key={idx} onClick={() => { setSelectedDate(day.date); setViewMode('daily'); }} className="flex flex-col sm:flex-row sm:items-center justify-between p-4 hover:bg-gray-50 cursor-pointer transition-colors group">
                                        <div className="flex items-center gap-4 mb-2 sm:mb-0">
                                            <div className={`w-12 h-12 rounded-xl flex flex-col items-center justify-center border-2 ${day.date === new Date().toISOString().split('T')[0] ? 'bg-gold-50 border-gold-400 text-gold-700' : 'bg-white border-gray-100 text-gray-500 group-hover:border-gold-200'}`}>
                                                <span className="text-xs font-black">{day.date.split('-')[2]}</span>
                                            </div>

        function MasterCodeView({ currentUser, showToast }) {
            const [oldC, setOldC] = useState('');
            const [newC, setNewC] = useState('');
            const [conf, setConf] = useState('');
            const [busy, setBusy] = useState(false);
            const inp = "w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500 text-center tracking-[0.5em]";
            const save = async (e) => {
                e.preventDefault();
                if (busy) return;
                const o = oldC.trim(), n = newC.trim();
                if (o !== String(currentUser.code)) { showToast('الكود الحالي غلط'); return; }
                if (!/^\d{4}$/.test(n)) { showToast('الكود الجديد لازم يكون 4 أرقام'); return; }
                if (n !== conf.trim()) { showToast('تأكيد الكود مش مطابق'); return; }
                if (n === o) { showToast('الكود الجديد هو نفسه القديم'); return; }
                setBusy(true);
                try {
                    const dup = await db.collection('staff_members').where('code', '==', n).limit(1).get();
                    if (!dup.empty) { showToast('الكود ده مستخدم لموظف تاني'); setBusy(false); return; }
                    const uid = await ensureAuthUser(n);
                    const b = db.batch();
                    if (currentUser.authUid && currentUser.authUid !== uid) b.delete(db.collection('staff_auth').doc(currentUser.authUid));
                    b.set(db.collection('staff_auth').doc(uid), { staffId: currentUser.id, role: 'superadmin', name: currentUser.name });
                    b.update(db.collection('staff_members').doc(currentUser.id), { code: n, authUid: uid });
                    await b.commit();
                    try { if (localStorage.getItem('newEraSavedCode')) localStorage.setItem('newEraSavedCode', n); } catch (x) {}
                    alert('تم تغيير الكود. هتدخلي بالكود الجديد من الشاشة الجاية.');
                    auth.signOut().catch(() => {}).finally(() => window.location.reload());
                } catch (err) {
                    showToast('مشكلة في تغيير الكود: ' + err.message);
                    setBusy(false);
                }
            };
            return (
                <form onSubmit={save} className="bg-white rounded-[20px] border border-gray-100 shadow-sm p-5 space-y-3 max-w-sm">
                    <h4 className="font-black text-gray-800 text-sm">تغيير كود السوبر أدمن</h4>
                    <p className="text-[10px] text-gray-400 font-bold">الصفحة دي بتظهر للسوبر أدمن بس. بعد التغيير هتدخلي بالكود الجديد.</p>
                    <div className="space-y-1"><label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الكود الحالي</label>
                        <input type="password" inputMode="numeric" maxLength={4} value={oldC} onChange={e => setOldC(e.target.value.replace(/\D/g, ''))} className={inp} required /></div>
                    <div className="space-y-1"><label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الكود الجديد (4 أرقام)</label>
                        <input type="password" inputMode="numeric" maxLength={4} value={newC} onChange={e => setNewC(e.target.value.replace(/\D/g, ''))} className={inp} required /></div>
                    <div className="space-y-1"><label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">تأكيد الكود الجديد</label>
                        <input type="password" inputMode="numeric" maxLength={4} value={conf} onChange={e => setConf(e.target.value.replace(/\D/g, ''))} className={inp} required /></div>
                    <button disabled={busy} type="submit" className="w-full bg-gold-500 text-white py-3 rounded-xl font-black text-sm shadow-md hover:bg-gold-600 disabled:opacity-50">{busy ? 'جاري الحفظ...' : 'حفظ الكود الجديد'}</button>
                </form>
            );
        }

            useEffect(() => { const t = setInterval(() => tick(v => v + 1), 30000); return () => clearInterval(t); }, []);
            const today = localDay();
            const mine = payments.filter(p => p.createdDay === today && (p.recordedById ? p.recordedById === currentUser.id : p.recordedBy === currentUser.name)).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
            const total = mine.reduce((s, p) => s + Number(p.amount || 0), 0);
            const guard = (fn) => { if (localDay() !== today) { showToast('انتهى اليوم — مينفعش التعديل'); return; } fn(); };
            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="bg-gradient-to-r from-gold-600 to-gold-400 p-6 rounded-[20px] text-white shadow-xl flex flex-wrap justify-between items-center gap-4">
                        <div><p className="text-gold-100 text-[10px] font-bold mb-1">توريد اليوم ({mine.length} تسجيل)</p><h2 className="text-3xl font-black">{total} EGP</h2></div>
                        <button type="button" onClick={onAdd} className="bg-white text-gold-600 px-5 py-2.5 rounded-xl text-xs font-black shadow-lg">+ إضافة توريد</button>

                        {mine.length === 0 && <p className="text-gray-400 text-xs font-bold text-center p-4">لا يوجد توريد مسجل اليوم.</p>}
                        {mine.map(p => (
                            <div key={p.id} className="flex justify-between items-center p-4 bg-gray-50 rounded-xl relative">
                                <div className="absolute left-2 top-2 flex gap-1">
                                    <button type="button" onClick={() => guard(() => onEdit(p))} className="p-1 text-gold-500 bg-white border border-gray-200 rounded-lg"><IconEdit/></button>
                                    <button type="button" onClick={() => guard(() => onConfirm({ msg: 'حذف هذا التوريد؟', onConfirm: () => { if (localDay() !== today) { showToast('انتهى اليوم — مينفعش الحذف'); return; } db.collection('payments').doc(p.id).delete().then(() => showToast('تم الحذف')).catch(err => showToast('مشكلة في الحذف: ' + err.message)); } }))} className="p-1 text-red-500 bg-white border border-gray-200 rounded-lg"><IconTrash/></button>
                                </div>
                                <div className="mt-2">
                                    <p className="font-black text-xs text-gray-800">فرع {branches.find(b => b.id === p.branchId)?.name || 'غير معروف'}</p>

                                </div>
                                <div className="text-emerald-500 font-black text-base mr-12">{p.amount} ج</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

            const groupedCases = Object.entries(list.reduce((g, c) => { (g[c.branchId] = g[c.branchId] || []).push(c); return g; }, {}))

            const upd = (c, d, msg) => db.collection('lab_cases').doc(c.id).update(d).then(() => showToast(msg)).catch(err => showToast("مشكلة: " + err.message));
