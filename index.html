    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #FDFCFB; -webkit-tap-highlight-color: transparent; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .calendar-cell { background-color: white; aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .calendar-cell:hover { background-color: #fffbeb; }

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // 1. Firebase Config (New Era)
        const firebaseConfig = {
            apiKey: "AIzaSyDQ17UevaMBy2aVYxsrLNpdQCvn92uSKi0",
            authDomain: "new-era-dental-center.firebaseapp.com",
            projectId: "new-era-dental-center",
            storageBucket: "new-era-dental-center.firebasestorage.app",
            messagingSenderId: "11521109321",
            appId: "1:11521109321:web:49e24509d937ff3e20be98"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        // كود السوبر أدمن الأولي (1279): بيتسجل أول مرة بس، وبعدها يتغير من الإعدادات → كود السوبر أدمن
        // أول تشغيل على قاعدة بيانات فاضية بس: يوزر 1279 وباسورد 1279 (يتغيروا من الإعدادات بعدها)
        const BOOTSTRAP_CODE = "1279";

        // ===== الدخول: اسم مستخدم + كلمة سر (أي طول) =====
        // كل يوزر+باسورد ليهم حساب دخول في Firebase Auth، والإيميل/الباسورد الحقيقيين مشتقين منهم ومحدش يشوفهم.
        const sha256Hex = async (str) => {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        };
        const normUser = u => String(u || '').trim().toLowerCase().replace(/\s+/g, '');
        const authCreds = async (username, password) => {
            const h = await sha256Hex('newera-clinic|v2|' + normUser(username) + '|' + String(password || ''));
            return { email: 'u' + h.slice(0, 32) + '@neweraclinic.app', password: h.slice(32, 64) + 'Ne!' };
        };
        // الأكواد القديمة (4 أرقام) — للانتقال بس
        const legacyCreds = async (code) => {
            const h = await sha256Hex('newera-clinic|' + String(code).trim());
            return { email: 'u' + h.slice(0, 32) + '@neweraclinic.app', password: h.slice(32, 64) + 'Ne!' };
        };
        let secApp = null;
        const getSecAuth = () => { if (!secApp) secApp = firebase.initializeApp(firebaseConfig, 'sec'); return secApp.auth(); };
        const ensureAuthUser = async (username, password) => {
            const { email, password: pw } = await authCreds(username, password);
            const sa = getSecAuth();
            let cred;
            try { cred = await sa.createUserWithEmailAndPassword(email, pw); }
            catch (e) { if (e.code === 'auth/email-already-in-use') cred = await sa.signInWithEmailAndPassword(email, pw); else throw e; }
            const uid = cred.user.uid;
            await sa.signOut();
            return uid;
        };
        const validUser = u => /^[^\s]{3,40}$/.test(u);
        const validPass = p => typeof p === 'string' && p.length >= 4 && p.length <= 100;
        // حفظ موظف + اليوزر والباسورد + حساب الدخول في عملية واحدة.
        // اليوزر والباسورد في staff_codes (السوبر أدمن بس يقدر يقراها) ومش في staff_members.
        const saveStaff = async (staffId, d, prev) => {
            const username = normUser(d.username);
            const password = String(d.password || '');
            if (!validUser(username)) throw new Error('اسم المستخدم من 3 لـ 40 حرف ومن غير مسافات');
            if (!validPass(password)) throw new Error('كلمة السر لازم تكون 4 حروف/أرقام على الأقل');
            const dup = await db.collection('staff_codes').where('username', '==', username).get();
            if (dup.docs.some(x => x.id !== staffId)) throw new Error('اسم المستخدم ده مستخدم لموظف تاني');
            const same = prev && prev.authUid && normUser(prev.username) === username && prev.password === password;
            const uid = same ? prev.authUid : await ensureAuthUser(username, password);
            const ex = await db.collection('staff_auth').doc(uid).get();
            if (ex.exists && ex.data().staffId && ex.data().staffId !== staffId) throw new Error('اليوزر ده مستخدم لموظف تاني — غيّريه');
            const { username: _u, password: _p, code: _c, ...rest } = d;
            const b = db.batch();
            if (prev && prev.authUid && prev.authUid !== uid) b.delete(db.collection('staff_auth').doc(prev.authUid));
            b.set(db.collection('staff_members').doc(staffId), { ...rest, authUid: uid, code: firebase.firestore.FieldValue.delete() }, { merge: true });
            b.set(db.collection('staff_codes').doc(staffId), { username, password });
            b.set(db.collection('staff_auth').doc(uid), { staffId, role: d.role, name: d.name, username });
            await b.commit();
            return uid;
        };
        const removeStaff = (st) => {
            const b = db.batch();
            if (st.authUid) b.delete(db.collection('staff_auth').doc(st.authUid));
            b.delete(db.collection('public_doctors').doc(st.id));
            b.delete(db.collection('staff_codes').doc(st.id));
            b.delete(db.collection('staff_members').doc(st.id));
            return b.commit();
        };
        // تحويل الأكواد القديمة ليوزر وباسورد (بيشتغل لوحده أول ما السوبر أدمن يدخل):
        // كل موظف كان ليه كود 1234 بقى: اليوزر = 1234 والباسورد = 1234 لحد ما تغيّريهم.
        // بيرجّع { n, self } — self = true لو حساب السوبر أدمن نفسه اتحوّل (لازم إعادة تحميل)
        const migrateAllStaff = async () => {
            const [sm, sc] = await Promise.all([db.collection('staff_members').get(), db.collection('staff_codes').get()]);
            const codes = {}; sc.docs.forEach(x => codes[x.id] = x.data());
            const me = auth.currentUser && auth.currentUser.uid;
            let n = 0, selfJob = null;
            for (const d of sm.docs) {
                const st = d.data(), c = codes[d.id] || {};
                try {
                    if (c.username) { if (st.code !== undefined) await d.ref.update({ code: firebase.firestore.FieldValue.delete() }); continue; }
                    const code = String(c.code ?? st.code ?? '').trim();
                    if (!code) continue;
                    const run = () => saveStaff(d.id, { ...st, username: code, password: code }, st.authUid ? { ...st, username: '', password: '' } : null);
                    if (st.authUid && st.authUid === me) { selfJob = { run, code }; continue; }
                    await run(); n++;
                } catch (e) { console.error('migrate', d.id, e); }
            }
            if (selfJob) {
                await selfJob.run(); n++;
                const cr = await authCreds(selfJob.code, selfJob.code);
                await auth.signInWithEmailAndPassword(cr.email, cr.password);
                return { n, self: true };
            }
            return { n, self: false };
        };
        // بعد ما الحساب يدخل: نجيب بيانات الموظف من staff_auth
        const loadStaffForUid = async (uid) => {
            const sa = await db.collection('staff_auth').doc(uid).get();
            if (!sa.exists || !sa.data().staffId) return null;
            const m = await db.collection('staff_members').doc(sa.data().staffId).get();
            if (!m.exists) return null;
            const { code: _c, ...rest } = m.data();
            return { id: m.id, ...rest, authUid: uid, username: sa.data().username || '' };
        };
        // أول تشغيل على قاعدة بيانات جديدة فاضية بس (تحت القواعد الجديدة مش بيقدر يعمل حاجة — وده المطلوب)
        const bootstrapMaster = async () => {
            try {
                await auth.signInAnonymously();
                const sup = await db.collection('staff_members').where('role', '==', 'superadmin').limit(1).get();
                if (!sup.empty) { await auth.signOut(); return false; }
                const sd = { name: 'Admin', username: BOOTSTRAP_CODE, password: BOOTSTRAP_CODE, role: 'superadmin', branchId: 'all', branchIds: [], jobTitle: 'سوبر أدمن' };
                await saveStaff(db.collection('staff_members').doc().id, sd, null);
                await auth.signOut();
                return true;
            } catch (e) { try { await auth.signOut(); } catch (x) {} return false; }
        };
        // فروع الطبيب: القائمة الجديدة (branchIds) أو الفرع القديم (branchId)
        // ===== التنبيهات المجانية =====
        // تيليجرام: التوكن وأرقام الشات بتتحط من الإعدادات (المفتاح في branches = اسم الفرع كما هو مكتوب في التطبيق).
        // التوكن مش مكتوب في الكود خلاص: بيتحفظ في Firestore (private_config/telegram) ويتقري بعد دخول الموظف بس.
        // السوبر أدمن يحطه من: الإعدادات → تيليجرام.
        // أنواع الإشعارات، وكل نوع بيروح للإدارة (الشات الرئيسي) و/أو لسكرتارية الفرع حسب الإعدادات
        const TG_KINDS = [
            ['booking', 'حجز جديد من السيستم'], ['online', 'حجز أونلاين جديد (الموقع / صفحة الحجز)'], ['cancel', 'كنسل أو تأجيل'],
            ['follow', 'موعد متابعة مريض'], ['lab', 'تذكير حالة معمل'], ['shortage', 'نقص جديد'], ['due', 'فاتورة / مستحق جديد'], ['digest', 'ملخص الصبح اليومي'], ['schedule', 'مواعيد النهاردة بالتفصيل لكل دكتور']
        ];
        const TG_DEFAULT_ROUTES = { main: ['booking', 'online', 'cancel', 'follow', 'lab', 'shortage', 'due', 'schedule'], branch: ['booking', 'online', 'cancel', 'follow', 'lab', 'shortage', 'digest'] };
        // إشعارات جديدة بتتضاف للإعدادات المحفوظة قبلها بقيمتها الافتراضية
        const mergeRoutes = (x) => { if (!x.routes) return TG_DEFAULT_ROUTES; const known = x.routesKnown || ['booking', 'online', 'cancel', 'follow', 'lab', 'shortage', 'due', 'digest']; const r = {}; ['main', 'branch'].forEach(sd => { r[sd] = [...(x.routes[sd] || []), ...TG_DEFAULT_ROUTES[sd].filter(k => !known.includes(k))]; }); return r; };
        const TG = { token: '', main: '', branches: {}, routes: TG_DEFAULT_ROUTES };
        const tgPost = (chat, text) => fetch(`https://api.telegram.org/bot${TG.token}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: chat, text }) });
        // branchId = الفرع اللي الإشعار يخصه، kind = نوع الإشعار
        const tgSend = (text, branchId, kind) => {
            if (!TG.token) return;
            const r = TG.routes || TG_DEFAULT_ROUTES, chats = [];
            if (TG.main && (r.main || []).includes(kind)) chats.push(TG.main);
            const bName = (LIVE.branches.find(b => b.id === branchId) || {}).name;
            const bc = TG.branches[branchId] || (bName && TG.branches[bName]);
            if (bc && (r.branch || []).includes(kind)) chats.push(bc);
            [...new Set(chats)].forEach(chat => tgPost(chat, text).catch(() => {}));
        };
        // جدول مواعيد النهاردة لفرع: متقسم على الدكاترة، وبيتقسم لكذا رسالة لو طويل (حد تيليجرام 4096 حرف)
        const fmt12 = t => { if (!t) return '--'; const [h, m] = t.split(':').map(Number); return (h % 12 || 12) + ':' + String(m || 0).padStart(2, '0') + (h >= 12 ? ' م' : ' ص'); };
        const scheduleMessages = (branch, apps, date) => {
            const list = apps.filter(a => a.branchId === branch.id && a.date === date && a.status !== 'canceled').sort((a, b) => (a.time || '').localeCompare(b.time || ''));
            const canceled = apps.filter(a => a.branchId === branch.id && a.date === date && a.status === 'canceled').length;
            const dayTxt = new Intl.DateTimeFormat('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(date + 'T12:00:00'));
            if (!list.length) return ['🗓️ فرع ' + branch.name + ' — ' + dayTxt + '\nمفيش حجوزات النهاردة.' + (canceled ? ' (' + canceled + ' اتكنسلوا)' : '')];
            const groups = {};
            list.forEach(a => { const k = a.doctorName ? 'د. ' + a.doctorName : 'بدون دكتور'; (groups[k] = groups[k] || []).push(a); });
            const st = a => { const k = (!a.status || a.status === 'booked') ? 'unconfirmed' : a.status; return ({ unconfirmed: '❓ مش مؤكد', confirmed: '✅ مؤكد', on_way: '🚗 في الطريق', arrived: '🟢 حضر', done: '✔️ خلص', postponed: '⏸ مؤجل' })[k] || ''; };
            const head = '🗓️ مواعيد النهاردة — فرع ' + branch.name + '\n' + dayTxt + ' • ' + list.length + ' حجز' + (canceled ? ' • ' + canceled + ' كنسل' : '');
            const blocks = Object.entries(groups).map(([doc, arr]) => '👨‍⚕️ ' + doc + ' (' + arr.length + ')\n' + arr.map(a => '• ' + fmt12(a.time) + ' — ' + a.patientName + (a.service ? ' — ' + a.service : '') + (a.phone ? ' — ' + a.phone : '') + ' ' + st(a) + (a.source === 'online' ? ' 🌐' : '')).join('\n'));
            const out = []; let cur = head;
            blocks.forEach(bk => { if ((cur + '\n\n' + bk).length > 3800) { out.push(cur); cur = bk; } else cur += '\n\n' + bk; });
            out.push(cur);
            return out;
        };
        const sendSchedules = (branches, apps, date) => branches.forEach(b => scheduleMessages(b, apps, date).reduce((p, m) => p.then(() => tgSend(m, b.id, 'schedule')).then(() => new Promise(r => setTimeout(r, 400))), Promise.resolve()));
        let _ac;
        const pushLocal = (text) => {
            try { _ac = _ac || new (window.AudioContext || window.webkitAudioContext)(); const o = _ac.createOscillator(), g = _ac.createGain(); o.connect(g); g.connect(_ac.destination); o.frequency.value = 880; g.gain.value = 0.15; o.start(); o.stop(_ac.currentTime + 0.25); } catch (e) {}
            try { if ('Notification' in window && Notification.permission === 'granted') new Notification(text); } catch (e) {}
        };
        // مدة تذكير المعمل بالأيام (لو الحالة قديمة ومفيهاش مدة = يومين، 0 = بدون تذكير)
        const localDay = () => new Date().toLocaleDateString('en-CA');
        const labRemindDays = c => (c.remindDays === undefined || c.remindDays === null || c.remindDays === '') ? 2 : Number(c.remindDays);
        const labDue = c => c.status !== 'returned' && !c.chasedAt && c.sentDate && labRemindDays(c) > 0 && (new Date(new Date().toISOString().split('T')[0]) - new Date(c.sentDate)) / 864e5 >= labRemindDays(c);
        const daysLabel = n => ({ 1: 'يوم', 2: 'يومين', 3: '3 أيام', 5: '5 أيام', 7: 'أسبوع', 10: '10 أيام', 14: 'أسبوعين', 30: 'شهر' }[n] || n + ' يوم');
        const TPL_DEFAULT = {
            reminder: 'أهلاً {name} 👋\nتذكير بموعدك في {branch} يوم {date} الساعة {time}.\nبرجاء تأكيد الحضور، شكراً لثقتكم.',
            review: 'شكراً لزيارتك {branch} يا {name} 🌟\nرأيك يهمنا جداً، ممكن تقيّم تجربتك من هنا:\n{link}',
            followup: 'أهلاً {name}، معاك {branch} 👋\nحبينا نطمّن ونتابع معاك بخصوص {service}. تحب نحجزلك موعد؟',
            lab: 'السلام عليكم، بخصوص حالة المريض {patient} ({case}) المُسلّمة لكم بتاريخ {date}. برجاء الإفادة بموعد التسليم.',
            tgApp: '📅 حجز جديد — فرع {branch}\nالمريض: {patient}\nالموعد: {date} {time}\nالخدمة: {service}\nالدكتور: {doctor}\nبواسطة: {by}\n\n📊 إجمالي حجوزات {date} في {branch}: {count}',
            tgShortage: '⚠️ نقص جديد — {branch}\nالصنف: {item} ({qty})\nبواسطة: {by}\n\n📊 إجمالي النواقص في {branch}: {count}',
            tgDue: '🧾 فاتورة جديدة — {branch}\nالجهة: {party}\nالمبلغ: {amount} ج\nموعد السداد: {due}\nبواسطة: {by}\n\n📊 إجمالي المستحق في {branch}: {sum} ج ({count} فاتورة)',
            tgLab: '⏰ حالة معمل مر عليها {days} — اطلبيها من المعمل\nالمعمل: {lab}\nالمريض: {patient}\nالنوع: {case}\nالفرع: {branch}',
            tgFollow: '📞 موعد متابعة مريض: {patient}\nالخدمة: {service}\nالفرع: {branch}',
            tgOnline: '🌐 حجز أونلاين جديد — فرع {branch}\nالمريض: {patient}\nالموبايل: {phone}\nالموعد: {date} {time}\nالخدمة: {service}\nالدكتور: {doctor}\nكود الحجز: {code}\n\n📊 إجمالي حجوزات {date} في {branch}: {count}',
            tgCancel: '❌ {kind} — فرع {branch}\nالمريض: {patient}\nالموبايل: {phone}\nالموعد كان: {date} {time}\nالخدمة: {service}\nالدكتور: {doctor}\n📞 اتسجل في سجل المرضى للمتابعة',
            tgDigest: '☀️ صباح الخير — ملخص فرع {branch}\n{date}\n\n📅 حجوزات النهاردة: {today} (أونلاين: {online})\n❓ حجوزات بكرة لسه مش مؤكدة: {tomorrow}\n📞 متابعات مستحقة: {follow}\n⏰ حالات معمل محتاجة تتطلب: {lab}\n⚠️ نواقص مفتوحة: {short}'
        };
        const OLD_TG = {
            tgApp: '📅 حجز جديد\nالمريض: {patient}\nالموعد: {date} {time}\nالخدمة: {service}\nالدكتور: {doctor}\nالفرع: {branch}\nبواسطة: {by}',
            tgShortage: '⚠️ نقص جديد\nالصنف: {item} ({qty})\nالفرع: {branch}\nبواسطة: {by}',
            tgDue: '🧾 فاتورة/مستحق جديد\nالجهة: {party}\nالمبلغ: {amount} ج\nموعد السداد: {due}\nالفرع: {branch}\nبواسطة: {by}'
        };
        const TPL = { ...TPL_DEFAULT };
        const fillT = (k, v) => String(TPL[k] || '').replace(/\{(\w+)\}/g, (m, x) => v[x] ?? '');
        // بيانات حية لحساب الإجماليات في رسائل تيليجرام (بتتحدث من App)
        const LIVE = { appointments: [], dues: [], shortages: [], branches: [] };
        const tgStats = (col, d, newId) => {
            const arr = (LIVE[col] || []).filter(x => x.id !== newId);
            const base = col === 'appointments' ? (x => x.date === d.date) : col === 'dues' ? (x => !x.paid) : (() => true);
            const all = arr.filter(base), br = all.filter(x => x.branchId === d.branchId);
            const r = { count: br.length + 1, countAll: all.length + 1 };
            if (col === 'dues') {
                const sm = a => Math.round(a.reduce((t, x) => t + (Number(x.amount) || 0), 0) * 100) / 100;
                r.sum = sm(br) + (Number(d.amount) || 0); r.sumAll = sm(all) + (Number(d.amount) || 0);
            }
            return r;
        };

                const docBr = isDocUser ? doctorBranchIds(currentUser, data.branches) : [];
                const branchId = currentUser?.role === 'employee' ? currentUser.branchId : selectedBranch;
                const filter = isDocUser
                    ? (i) => docBr.includes(i.branchId) && (branchId === 'all' || i.branchId === branchId)
                    : (i) => branchId === 'all' || i.branchId === branchId;
                return {
                    patients: data.patients.filter(filter).filter(p => currentUser?.role !== 'doctor' || p.doctorId === currentUser.id),
                    appointments: data.appointments.filter(filter).filter(a => currentUser?.role !== 'doctor' || a.doctorId === currentUser.id),
                    payments: data.payments.filter(filter),
                    shortages: data.shortages.filter(filter),
                    labCases: data.labCases.filter(filter),
                    consumables: data.consumables.filter(filter),
                    dues: data.dues.filter(d => currentUser?.role === 'employee' ? d.recordedById === currentUser.id : filter(d)),
                    branches: data.branches
                };
            }, [data, currentUser, selectedBranch]);

            if (!isLoggedIn) return authChecked ? <LoginView onLogin={doLogin} /> : <div className="h-screen bg-[#050505] flex items-center justify-center text-gold-500 font-black">...</div>;
            const staffFull = data.staff.map(s => staffCodes[s.id] ? { ...s, username: staffCodes[s.id].username || '', password: staffCodes[s.id].password || '' } : s);

            const isSuperAdmin = currentUser.role === 'superadmin';
            const isAdminOrSuper = currentUser.role === 'admin' || currentUser.role === 'superadmin';
            const isDoctor = currentUser.role === 'doctor';
            const todayS = new Date().toISOString().split('T')[0];
            const inScope = x => currentUser.role === 'admin' || currentUser.role === 'superadmin' || x.branchId === currentUser.branchId;
            const dueNotifs = currentUser.role !== 'employee' ? [] : [
                ...data.patients.filter(p => p.followUpDate && !p.followedAt && p.followUpDate <= todayS && inScope(p)).map(p => ({ id: 'p' + p.id, kind: 'patient', refId: p.id, tab: 'patients', text: '📞 متابعة: ' + p.name + (svcText(p) ? ' — ' + svcText(p) : ''), ts: new Date(p.followUpDate).getTime(), wa: waUrl(p.phone, fillT('followup', { name: p.name, branch: bLabel(data.branches, p.branchId), service: svcText(p) })), itemName: p.name, branchId: p.branchId })),
                ...data.labCases.filter(c => labDue(c) && inScope(c)).map(c => ({ id: 'l' + c.id, kind: 'lab', refId: c.id, tab: 'labs', text: '⏰ اطلبي من ' + c.labName + ': ' + c.patientName, ts: new Date(c.sentDate).getTime() + labRemindDays(c) * 864e5, wa: waLink(c, labPhoneAll[c.labName]), itemName: c.patientName, branchId: c.branchId }))
            ];
            const labPhoneAll = Object.fromEntries(data.labCases.filter(x => x.labPhone).sort((a, b) => (a.sentDate || '').localeCompare(b.sentDate || '')).map(x => [x.labName, x.labPhone]));
            const reviewRows = currentUser.role !== 'employee' ? [] : data.appointments
                .filter(a => a.branchId === currentUser.branchId && (a.status === 'arrived' || a.status === 'done') && !a.reviewSent && !a.reviewSkipped && a.date <= todayS && a.date >= addDays(-3))
                .sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')))
                .map(a => { const br = data.branches.find(b => b.id === a.branchId) || {}; return { id: a.id, name: a.patientName, url: waUrl(a.phone, fillT('review', { name: a.patientName, branch: br.name || '', link: br.reviewLink || br.mapsLink || '' })) }; });
            const markReview = (id, field) => db.collection('appointments').doc(id).update(field === 'reviewSent' ? { reviewSent: true, reviewSentAt: new Date().toISOString(), reviewSentBy: currentUser.name } : { reviewSkipped: true }).catch(e => setToastMsg('مشكلة: ' + e.message));
            const notifItems = [...events, ...dueNotifs].sort((a, b) => b.ts - a.ts);
            const unreadCount = dueNotifs.length + reviewRows.length + events.filter(e => !e.read).length;
            const quickBuy = (it) => setConfirmAction({
                msg: 'تسجيل شراء "' + it.itemName + '" (' + it.quantity + ') وإزالته من النواقص؟',
                onConfirm: () => {
                    const key = (it.itemName || '').trim().toLowerCase();
                    const last = data.consumables.filter(c => c.unitCost && (c.itemName || '').trim().toLowerCase() === key).sort((a, b) => (a.date || '').localeCompare(b.date || '')).pop();
                    const unit = last ? Number(last.unitCost) : 0;
                    const q = parseFloat(it.quantity) || 0;
                    const day = new Date().toISOString().split('T')[0];
                    const b = db.batch();
                    b.set(db.collection('consumables').doc(), { kind: 'purchase', itemName: (it.itemName || '').trim(), qty: it.quantity, unitCost: unit, amount: Math.round(unit * q * 100) / 100, date: day, month: day.slice(0, 7), note: '', branchId: it.branchId || 'store', source: 'auto', recordedBy: currentUser.name });
                    b.delete(db.collection('shortages').doc(it.id));
                    b.commit().then(() => setToastMsg(unit ? 'تم تسجيل الشراء في المستهلكات' : 'تم تسجيل الشراء — السعر 0، عدّليه من المستهلكات')).catch(err => setToastMsg('مشكلة: ' + err.message));
                }
            });
            const pickNotif = (n) => { navigateTo(n.tab); const ids = n.refIds || (n.refId ? [n.refId] : []); if (ids.length) { if (isAdminOrSuper && selectedBranch !== 'all' && n.branchId !== selectedBranch) setSelectedBranch('all'); setFocus({ tab: n.tab, id: ids[0], ids }); setTimeout(() => setFocus(null), 8000); } };
            const doctorBranches = isDoctor ? doctorBranchIds(currentUser, data.branches) : [];

            return (
                <div className="flex h-screen overflow-hidden text-gray-800 bg-[#FDFCFB] relative">
                    {/* التوست ورسائل التأكيد */}
                    {alerts.length > 0 && <div className="fixed top-3 left-3 right-3 z-[999999] flex flex-col gap-2 max-w-md mx-auto">{alerts.slice(-1).map(a => <button key={a.id} type="button" onClick={() => { pickNotif(a); setAlerts([]); }} className="bg-gray-900 text-white text-xs font-bold p-3 rounded-2xl shadow-2xl text-right animate-slide-up">{a.text}</button>)}</div>}
                    {toastMsg && <Toast msg={toastMsg} onClose={() => setToastMsg(null)} />}
                    {confirmAction && <ConfirmModal action={confirmAction} onClose={()=>setConfirmAction(null)} />}
                    {modal && <DataModal modal={modal} staff={staffFull} costs={costs} labNames={[...new Set(filteredData.labCases.map(c => c.labName).filter(Boolean))]} lastCosts={Object.fromEntries(data.consumables.filter(c => c.unitCost).sort((a, b) => (a.date || '').localeCompare(b.date || '')).map(c => [(c.itemName || '').trim().toLowerCase(), c.unitCost]))} labPhones={Object.fromEntries(filteredData.labCases.filter(c => c.labPhone).map(c => [c.labName, c.labPhone]))} branches={data.branches} user={currentUser} selectedBranch={selectedBranch} onClose={()=>setModal(null)} showToast={setToastMsg} />}

                    {/* Overlay للطبقة الشفافة عشان تقفل القايمة الجانبية لما تدوس بره */}
                    {isSidebarOpen && (
                        <div 
                            className="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 lg:hidden animate-fade-in" 
                            onClick={() => setIsSidebarOpen(false)}
                        ></div>
                    )}

                    {/* القائمة الجانبية */}
                    <div className={`fixed inset-y-0 right-0 z-50 bg-white border-l border-gold-400 shadow-2xl transition-transform duration-300 transform ${isSidebarOpen ? 'translate-x-0' : 'translate-x-full'} lg:relative lg:translate-x-0 w-72 h-full flex flex-col`}>
                        <div className="p-8 border-b border-gray-100 flex flex-col items-center relative shrink-0">
                            <img src="https://i.ibb.co/qLw7Tcqv/logo-Dr-shahenda-original.png" className="w-28 h-auto object-contain drop-shadow-sm mb-2" alt="Logo" />
                            <span className="text-[9px] font-bold text-gray-300">نسخة 4.3</span>
                            <button type="button" onClick={() => setIsSidebarOpen(false)} className="absolute left-4 top-8 p-2 text-gray-400 bg-gray-50 rounded-full lg:hidden"><IconX /></button>
                        </div>
                        <nav className="flex-1 p-6 space-y-2 overflow-y-auto custom-scrollbar">
                            {isAdminOrSuper && <SidebarItem icon={<IconDashboard/>} label="لوحة التحكم" active={activeTab === 'dashboard'} onClick={() => navigateTo('dashboard')} />}
                            {<SidebarItem icon={<IconUsers/>} label="سجل المرضى" active={activeTab === 'patients'} onClick={() => navigateTo('patients')} />}
                            <SidebarItem icon={<IconCalendar/>} label="المواعيد والتقويم" active={activeTab === 'appointments'} onClick={() => navigateTo('appointments')} />
                            {!isDoctor && <SidebarItem icon={<IconClipboard/>} label="النواقص" active={activeTab === 'shortages'} onClick={() => navigateTo('shortages')} />}
                            <SidebarItem icon={<IconFlask/>} label="المعامل" active={activeTab === 'labs'} onClick={() => navigateTo('labs')} />
                            {currentUser.role === 'employee' && <SidebarItem icon={<IconWallet/>} label="الفواتير" active={activeTab === 'dues'} onClick={() => navigateTo('dues')} />}
                            {currentUser.role === 'employee' && <SidebarItem icon={<IconWallet/>} label="توريد اليوم" active={activeTab === 'daily'} onClick={() => navigateTo('daily')} />}
                            {isAdminOrSuper && <div className="px-3 pt-4 pb-1 text-[9px] font-black text-gray-400 tracking-widest">الإدارة</div>}
                            {isAdminOrSuper && <SidebarItem icon={<IconWallet/>} label="المستهلكات الشهرية" active={activeTab === 'consumables'} onClick={() => navigateTo('consumables')} />}
                            {isAdminOrSuper && <SidebarItem icon={<IconWallet/>} label="الفواتير والمستحقات" active={activeTab === 'dues'} onClick={() => navigateTo('dues')} />}
                            {isSuperAdmin && <SidebarItem icon={<IconWallet/>} label="الماليات" active={activeTab === 'finance'} onClick={() => navigateTo('finance')} />}
                            {isAdminOrSuper && <SidebarItem icon={<IconCog/>} label="الإعدادات" active={activeTab === 'settings'} onClick={() => navigateTo('settings')} />}
                        </nav>
                    </div>

                    {/* المحتوى الرئيسي */}
                    <div className="flex-1 flex flex-col h-full w-full overflow-hidden">
                        <header className="h-16 md:h-20 bg-white/90 border-b border-gray-200 px-3 sm:px-6 flex items-center justify-between z-30 shrink-0 shadow-sm relative">
                            <div className="flex items-center gap-1 sm:gap-3">
                                <button type="button" onClick={() => setIsSidebarOpen(true)} className="p-2 text-gray-700 hover:text-gold-500 rounded-lg lg:hidden"><IconMenu/></button>
                                
                                <div className="flex items-center bg-gray-50 rounded-full border border-gray-100 p-1">
                                    <button type="button" onClick={goBack} disabled={currentIndex === 0} className={`p-1.5 sm:p-2 rounded-full transition-colors flex items-center justify-center ${currentIndex > 0 ? 'text-gray-600 hover:text-gold-600 hover:bg-white shadow-sm' : 'text-gray-300 cursor-not-allowed'}`} title="رجوع">
                                        <IconBack />
                                    </button>
                                    <button type="button" onClick={() => navigateTo(isDoctor ? 'appointments' : 'dashboard')} className="p-1.5 sm:p-2 rounded-full transition-colors flex items-center justify-center text-gray-600 hover:text-gold-600 hover:bg-white shadow-sm mx-1" title="الرئيسية">
                                        <IconHome />
                                    </button>
                                    <button type="button" onClick={goForward} disabled={currentIndex === history.length - 1} className={`p-1.5 sm:p-2 rounded-full transition-colors flex items-center justify-center ${currentIndex < history.length - 1 ? 'text-gray-600 hover:text-gold-600 hover:bg-white shadow-sm' : 'text-gray-300 cursor-not-allowed'}`} title="للأمام">
                                        <IconForward />
                                    </button>
                                </div>
                                <NotifBell items={notifItems} unread={unreadCount} reviews={reviewRows} onReview={markReview} onOpen={() => setEvents(es => es.map(e => ({ ...e, read: true })))} onPick={pickNotif} />
                            </div>
                            
                            <div className="flex items-center gap-3 sm:gap-4">
                                {isAdminOrSuper && (
                                    <select value={selectedBranch} onChange={(e) => setSelectedBranch(e.target.value)} className="bg-gray-50 border border-gray-200 text-[10px] sm:text-xs font-bold p-1.5 sm:p-2.5 rounded-xl outline-none cursor-pointer focus:border-gold-500 max-w-[100px] sm:max-w-none">
                                        <option value="all">كل الفروع</option>
                                        {data.branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                                    </select>
                                )}
                                {isDoctor && doctorBranches.length > 1 && (
                                    <select value={selectedBranch} onChange={(e) => setSelectedBranch(e.target.value)} className="bg-gray-50 border border-gray-200 text-[10px] sm:text-xs font-bold p-1.5 sm:p-2.5 rounded-xl outline-none cursor-pointer focus:border-gold-500 max-w-[100px] sm:max-w-none">
                                        <option value="all">كل فروعي</option>
                                        {doctorBranches.map(id => <option key={id} value={id}>{data.branches.find(b => b.id === id)?.name || id}</option>)}
                                    </select>
                                )}
                                <div className="text-left hidden sm:block pr-4 border-r border-gray-200">
                                    <p className="text-xs font-black text-gray-800">{currentUser.name}</p>
                                    <p className="text-[10px] text-gold-500 font-bold uppercase">{isSuperAdmin ? 'Super Admin' : currentUser.role === 'admin' ? 'مدير عام' : currentUser.role === 'doctor' ? 'طبيب' : 'موظف فرع'}</p>
                                </div>
                                <button type="button" onClick={() => {try { localStorage.removeItem('newEraSavedCode'); } catch (e) {} auth.signOut().catch(() => {}).finally(() => window.location.reload());}} className="text-red-500 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-xl font-bold text-xs transition-colors">خروج</button>
                            </div>
                        </header>

                        <div className="flex-1 p-3 md:p-8 overflow-y-auto w-full custom-scrollbar pb-20">
                            {activeTab === 'dashboard' && !isDoctor && <DashboardStats data={filteredData} userRole={currentUser.role} onNav={navigateTo} selectedBranch={currentUser.role === 'employee' ? currentUser.branchId : selectedBranch} staff={data.staff} />}
                                                        {activeTab === 'patients' && <PatientsView staff={data.staff} focusId={focus?.tab === 'patients' ? focus.id : null} patients={filteredData.patients} branches={data.branches} currentUser={currentUser} onConfirm={setConfirmAction} onAdd={()=>setModal({type:'patient', mode:'add'})} onEdit={(d)=>setModal({type:'patient', mode:'edit', data:d})} showToast={setToastMsg} />}
                            {activeTab === 'appointments' && <AppointmentsView focusIds={focus?.tab === 'appointments' ? focus.ids : null} apps={filteredData.appointments} branches={data.branches} currentUser={currentUser} selectedBranch={selectedBranch} onConfirm={setConfirmAction} onAdd={()=>setModal({type:'app', mode:'add'})} onEdit={(d)=>setModal({type:'app', mode:'edit', data:d})} onNav={navigateTo} showToast={setToastMsg} />}
                            {activeTab === 'daily' && currentUser.role === 'employee' && <DailyView payments={data.payments} branches={data.branches} currentUser={currentUser} onConfirm={setConfirmAction} onAdd={()=>setModal({type:'payment', mode:'add', data:{branchId:currentUser.branchId}})} onEdit={(d)=>setModal({type:'payment', mode:'edit', data:d})} showToast={setToastMsg} />}
                            {activeTab === 'finance' && isSuperAdmin && <FinanceView payments={filteredData.payments} branches={data.branches} selectedBranch={selectedBranch} currentUser={currentUser} onConfirm={setConfirmAction} onAdd={(bId)=>setModal({type:'payment', mode:'add', data:{branchId:bId}})} onEdit={(d)=>setModal({type:'payment', mode:'edit', data:d})} showToast={setToastMsg} />}
                                                        {activeTab === 'labs' && <LabsView focusId={focus?.tab === 'labs' ? focus.id : null} cases={filteredData.labCases} costs={costs} branches={data.branches} currentUser={currentUser} selectedBranch={selectedBranch} onConfirm={setConfirmAction} onAdd={()=>setModal({type:'lab', mode:'add'})} onEdit={(d)=>setModal({type:'lab', mode:'edit', data:d})} showToast={setToastMsg} />}
                            {activeTab === 'settings' && isAdminOrSuper && <SettingsView sections={[{ k: 'branches', label: 'الفروع', node: <BranchesView branches={data.branches} onConfirm={setConfirmAction} onAdd={()=>setModal({type:'branch', mode:'add'})} onEdit={(d)=>setModal({type:'branch', mode:'edit', data:d})} showToast={setToastMsg} /> }, { k: 'templates', label: 'قوالب الرسائل', node: <TemplatesView showToast={setToastMsg} /> }, ...(isSuperAdmin ? [{ k: 'staff', label: 'الموظفين', node: <StaffView staff={staffFull} branches={data.branches} onConfirm={setConfirmAction} onAdd={(k)=>setModal({type:'staff', mode:'add', data:{kind:k}})} onEdit={(d)=>setModal({type:'staff', mode:'edit', data:d})} showToast={setToastMsg} /> }, { k: 'mycode', label: 'حسابي', node: <MasterCodeView currentUser={currentUser} showToast={setToastMsg} /> }, { k: 'telegram', label: 'تيليجرام', node: <TelegramView showToast={setToastMsg} branches={data.branches} /> }] : [])]} />}
                            {activeTab === 'dues' && !isDoctor && <DuesView focusIds={focus?.tab === 'dues' ? focus.ids : null} items={filteredData.dues} branches={data.branches} currentUser={currentUser} onConfirm={setConfirmAction} onAdd={()=>setModal({type:'due', mode:'add'})} onEdit={(d)=>setModal({type:'due', mode:'edit', data:d})} showToast={setToastMsg} />}
                                                        {activeTab === 'consumables' && isAdminOrSuper && <ConsumablesView allItems={data.consumables} items={filteredData.consumables} branches={data.branches} currentUser={currentUser} selectedBranch={selectedBranch} onConfirm={setConfirmAction} onAdd={()=>setModal({type:'consumable', mode:'add', data:{kind:'purchase'}})} onEdit={(d)=>setModal({type:'consumable', mode:'edit', data:d})} showToast={setToastMsg} />}
                            {activeTab === 'shortages' && !isDoctor && <ShortagesView focusIds={focus?.tab === 'shortages' ? focus.ids : null} onBuy={(it)=> !isAdminOrSuper ? setConfirmAction({msg:'هل تم توفير وشراء هذا الصنف؟', onConfirm:()=>db.collection('shortages').doc(it.id).delete().then(()=>setToastMsg('تم')).catch(err=>setToastMsg('مشكلة: '+err.message))}) : quickBuy(it)} shortages={filteredData.shortages} branches={data.branches} currentUser={currentUser} selectedBranch={selectedBranch} onConfirm={setConfirmAction} onEdit={(d)=>setModal({type:'shortage', mode:'edit', data:d})} showToast={setToastMsg} />}
                        </div>
                    </div>
                </div>
            );
        }

        function LoginView({ onLogin }) {
            const [user, setUser] = useState('');
            const [pass, setPass] = useState('');
            const [show, setShow] = useState(false);
            const [rememberMe, setRememberMe] = useState(true);
            const [busy, setBusy] = useState(false);
            const [err, setErr] = useState('');
            const passRef = useRef(null);

            const attemptLogin = async (e) => {
                e && e.preventDefault();
                if (busy) return;
                setErr(''); setBusy(true);
                const ok = await onLogin(user, pass, rememberMe);
                setBusy(false);
                if (!ok) { setErr('اسم المستخدم أو كلمة السر غلط'); setPass(''); passRef.current && passRef.current.focus(); }
            };
            const field = "w-full bg-black/80 border border-white/10 rounded-2xl px-4 py-3.5 text-base font-bold text-white placeholder-gray-600 focus:border-gold-500 outline-none transition-all shadow-inner";

            return (
                <div className="h-screen bg-[#050505] flex items-center justify-center p-6 text-center w-full relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-96 h-96 bg-gold-600/10 rounded-full blur-[120px] -translate-y-1/2 translate-x-1/2"></div>
                    <form onSubmit={attemptLogin} className="w-full max-w-md bg-[#111111] p-8 sm:p-10 rounded-[40px] border border-white/5 shadow-2xl relative z-10 flex flex-col items-center animate-scale-in">
                        <img src="https://i.ibb.co/qLw7Tcqv/logo-Dr-shahenda-original.png" className="w-56 mb-8 drop-shadow-[0_0_15px_rgba(245,158,11,0.2)]" />
                        <div className="w-full space-y-3 mb-4 text-right">
                            <label className="block text-gray-400 text-xs font-bold">اسم المستخدم</label>
                            <input autoFocus autoComplete="username" autoCapitalize="none" spellCheck="false" dir="ltr" value={user} onChange={e => setUser(e.target.value)} className={field} />
                            <label className="block text-gray-400 text-xs font-bold pt-1">كلمة السر</label>
                            <div className="relative">
                                <input ref={passRef} type={show ? 'text' : 'password'} autoComplete="current-password" dir="ltr" value={pass} onChange={e => setPass(e.target.value)} className={field + ' pl-16'} />
                                <button type="button" onClick={() => setShow(!show)} className="absolute left-3 top-1/2 -translate-y-1/2 text-[11px] font-black text-gray-400 hover:text-gold-500">{show ? 'إخفاء' : 'إظهار'}</button>
                            </div>
                        </div>
                        {err && <p className="w-full text-red-400 text-sm font-bold mb-3 bg-red-500/10 rounded-xl py-2">{err}</p>}
                        <label className="flex items-center gap-2 text-gray-400 text-sm font-bold mb-6 cursor-pointer hover:text-gold-500 transition-colors self-start">
                            <input type="checkbox" checked={rememberMe} onChange={(e) => setRememberMe(e.target.checked)} className="rounded" />
                            تذكرني على الجهاز ده
                        </label>
                        <button type="submit" disabled={busy || !user.trim() || !pass} className="w-full bg-gradient-to-r from-gold-600 to-gold-400 text-black font-black py-4 rounded-2xl shadow-lg hover:scale-[1.02] transition-transform text-lg disabled:opacity-50 disabled:hover:scale-100">{busy ? 'جاري الدخول...' : 'تـسـجـيـل الـدخـول'}</button>
                    </form>
                </div>
            );
        }

        function SidebarItem({ icon, label, active, onClick }) {
            return (
                <button type="button" onClick={onClick} className={`w-full flex items-center gap-4 p-4 rounded-2xl transition-all duration-200 ${active ? 'bg-gold-500 text-white shadow-md shadow-gold-500/30' : 'text-gray-500 hover:bg-gray-50 hover:text-gold-600'}`}>
                    <span className={active ? 'text-white' : 'text-gray-400'}>{icon}</span>
                    <span className="font-bold text-sm tracking-tight">{label}</span>
                </button>
            );
        }

        // ===== لوحة التحكم =====
        const sumAmt = a => Math.round(a.reduce((s, x) => s + (Number(x.amount) || 0), 0));
        const fmtN = n => Number(n || 0).toLocaleString('en-US');
        const AR_MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
        const dayShift = (d, n) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return x.toLocaleDateString('en-CA'); };

        // عمود بيانات واحد (لون واحد) + قيمة تظهر باللمس/الماوس
        function MiniBars({ points, unit = '', height = 150 }) {
            const [hover, setHover] = useState(null);
            const max = Math.max(1, ...points.map(p => p.v));
            const W = 100 / points.length;
            return (
                <div className="relative" dir="ltr">
                    <svg viewBox={`0 0 100 ${height}`} preserveAspectRatio="none" className="w-full" style={{ height }}>
                        {[0.25, 0.5, 0.75, 1].map(g => <line key={g} x1="0" x2="100" y1={height - 18 - (height - 30) * g} y2={height - 18 - (height - 30) * g} stroke="#F3F4F6" strokeWidth="0.4" vectorEffect="non-scaling-stroke" />)}
                        {points.map((p, i) => {
                            const h = (height - 30) * p.v / max, x = i * W + W * 0.18, w = W * 0.64;
                            return <g key={i} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} onClick={() => setHover(hover === i ? null : i)} style={{ cursor: 'pointer' }}>
                                <rect x={i * W} y="0" width={W} height={height - 18} fill="transparent" />
                                <rect x={x} y={height - 18 - Math.max(h, p.v ? 1.5 : 0)} width={w} height={Math.max(h, p.v ? 1.5 : 0)} rx="1" fill={hover === i || p.hl ? '#B45309' : '#F59E0B'} opacity={hover === null || hover === i ? 1 : 0.55} />
                            </g>;
                        })}
                    </svg>
                    <div className="absolute inset-x-0 bottom-0 flex text-[9px] text-gray-400 font-bold">{points.map((p, i) => <span key={i} className="text-center truncate" style={{ width: W + '%' }}>{p.l}</span>)}</div>
                    {hover !== null && <div className="absolute -top-1 bg-gray-900 text-white text-[10px] font-black px-2 py-1 rounded-lg pointer-events-none whitespace-nowrap" style={{ left: `calc(${(hover + 0.5) * W}% )`, transform: 'translateX(-50%)' }}>{points[hover].t || points[hover].l}: {fmtN(points[hover].v)}{unit}</div>}
                </div>
            );
        }
        function RankBars({ rows, unit = '', empty }) {
            if (!rows.length) return <p className="text-xs text-gray-400 font-bold py-6 text-center">{empty}</p>;
            const max = Math.max(1, ...rows.map(r => r.v));
            return <div className="space-y-2.5">{rows.map(r => (
                <div key={r.l}>
                    <div className="flex justify-between text-[11px] font-bold mb-1"><span className="text-gray-700 truncate">{r.l}</span><span className="text-gray-900 font-black">{fmtN(r.v)}{unit}</span></div>
                    <div className="h-2 bg-gray-100 rounded-full overflow-hidden"><div className="h-full bg-gold-500 rounded-full" style={{ width: (r.v / max * 100) + '%' }}></div></div>
                </div>))}</div>;
        }
        function Panel({ title, sub, children, action }) {
            return <div className="bg-white rounded-[20px] border border-gray-100 shadow-sm p-4 sm:p-5">
                <div className="flex items-start justify-between gap-2 mb-4"><div><h4 className="text-sm font-black text-gray-800">{title}</h4>{sub && <p className="text-[10px] text-gray-400 font-bold mt-0.5">{sub}</p>}</div>{action}</div>

        }

        function DashboardStats({ data, userRole, onNav, selectedBranch, staff = [] }) {
            const [period, setPeriod] = useState('month');
            const isSuper = userRole === 'superadmin', isAdm = isSuper || userRole === 'admin';
            const today = localDay();
            const PER = {
                today: { l: 'النهاردة', from: today, prevFrom: dayShift(today, -1), prevTo: dayShift(today, -1) },
                week: { l: 'آخر 7 أيام', from: dayShift(today, -6), prevFrom: dayShift(today, -13), prevTo: dayShift(today, -7) },
                month: { l: 'الشهر ده', from: today.slice(0, 7) + '-01', prevFrom: (() => { const d = new Date(today.slice(0, 7) + '-01T00:00:00'); d.setMonth(d.getMonth() - 1); return d.toLocaleDateString('en-CA'); })(), prevTo: dayShift(today.slice(0, 7) + '-01', -1) }
            }[period];
            const inP = d => d && d >= PER.from && d <= today;
            const inPrev = d => d && d >= PER.prevFrom && d <= PER.prevTo;
            const apps = data.appointments;
            const pApps = apps.filter(a => inP(a.date));
            const live = pApps.filter(a => a.status !== 'canceled' && a.status !== 'postponed');
            const attended = pApps.filter(a => a.status === 'arrived' || a.status === 'done').length;
            const dueForAttend = live.filter(a => a.date < today || a.status === 'arrived' || a.status === 'done').length;
            const attendRate = dueForAttend ? Math.round(attended / dueForAttend * 100) : null;
            const canceled = pApps.filter(a => a.status === 'canceled').length;
            const online = pApps.filter(a => a.source === 'online').length;
            const todayApps = apps.filter(a => a.date === today).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
            const tomorrow = dayShift(today, 1);
            const tmrUnconfirmed = apps.filter(a => a.date === tomorrow && (!a.status || a.status === 'unconfirmed' || a.status === 'booked'));
            const followDue = data.patients.filter(p => p.followUpDate && !p.followedAt && p.followUpDate <= today);
            const atLab = data.labCases.filter(c => c.status !== 'returned');
            const labLate = data.labCases.filter(labDue);
            const unpaid = data.dues.filter(d => !d.paid), overdue = unpaid.filter(d => d.dueDate && d.dueDate < today);
            const rev = sumAmt(data.payments.filter(p => inP(p.date))), revPrev = sumAmt(data.payments.filter(p => inPrev(p.date)));
            const revDelta = revPrev ? Math.round((rev - revPrev) / revPrev * 100) : null;
            const appsPrev = apps.filter(a => inPrev(a.date)).length;
            const appsDelta = appsPrev ? Math.round((pApps.length - appsPrev) / appsPrev * 100) : null;

            const days14 = Array.from({ length: 14 }, (_, i) => dayShift(today, i - 13));
            const bookingPts = days14.map(d => ({ l: d.slice(8), t: d, v: apps.filter(a => a.date === d && a.status !== 'canceled').length, hl: d === today }));
            const months6 = Array.from({ length: 6 }, (_, i) => { const d = new Date(today.slice(0, 7) + '-01T00:00:00'); d.setMonth(d.getMonth() - 5 + i); return d.toLocaleDateString('en-CA').slice(0, 7); });
            const revPts = months6.map(m => ({ l: AR_MONTHS[+m.slice(5) - 1].slice(0, 5), t: AR_MONTHS[+m.slice(5) - 1] + ' ' + m.slice(0, 4), v: sumAmt(data.payments.filter(p => (p.date || '').slice(0, 7) === m)) }));
            const count = (arr, key) => Object.entries(arr.reduce((o, x) => { const k = key(x); if (k) o[k] = (o[k] || 0) + 1; return o; }, {})).map(([l, v]) => ({ l, v })).sort((a, b) => b.v - a.v).slice(0, 6);
            const topServices = count(live, a => (a.service || '').trim());
            const docName = id => (staff.find(s => s.id === id) || {}).name;
            const byDoctor = count(live, a => a.doctorName || docName(a.doctorId)).map(r => ({ ...r, l: 'د. ' + r.l }));
            const branchRows = selectedBranch === 'all' && isAdm ? data.branches.map(b => {
                const ba = pApps.filter(a => a.branchId === b.id), bl = ba.filter(a => a.status !== 'canceled' && a.status !== 'postponed');
                const att = ba.filter(a => a.status === 'arrived' || a.status === 'done').length, due = bl.filter(a => a.date < today || a.status === 'arrived' || a.status === 'done').length;
                return { b, apps: ba.length, att: due ? Math.round(att / due * 100) : null, lab: atLab.filter(c => c.branchId === b.id).length, short: data.shortages.filter(x => x.branchId === b.id).length, rev: sumAmt(data.payments.filter(p => p.branchId === b.id && inP(p.date))), dues: sumAmt(unpaid.filter(d => d.branchId === b.id)) };
            }) : [];

            const Delta = ({ v }) => v === null ? null : <span className={`text-[10px] font-black px-1.5 py-0.5 rounded-md ${v >= 0 ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-600'}`} dir="ltr">{v >= 0 ? '▲' : '▼'} {Math.abs(v)}%</span>;
            const Kpi = ({ label, value, sub, tab, delta, tone }) => (

                labLate.length && { t: `${labLate.length} حالة معمل اتأخرت — اطلبيها`, tab: 'labs', c: 'bg-orange-50 text-orange-700' },
                isAdm && overdue.length && { t: `${overdue.length} فاتورة عدّى ميعاد سدادها (${fmtN(sumAmt(overdue))} ج)`, tab: 'dues', c: 'bg-red-50 text-red-600' },
                data.shortages.length && { t: `${data.shortages.length} صنف ناقص`, tab: 'shortages', c: 'bg-gray-100 text-gray-700' }

                        <Kpi label="حجوزات النهاردة" value={fmtN(todayApps.length)} sub={`${todayApps.filter(a => a.status === 'arrived' || a.status === 'done').length} حضروا لحد دلوقتي`} tab="appointments" />
                        {isSuper ? <Kpi label={'الإيراد — ' + PER.l} value={fmtN(rev) + ' ج'} delta={revDelta} sub={revPrev ? 'الفترة اللي قبلها: ' + fmtN(revPrev) + ' ج' : ''} tab="finance" />
                            : <Kpi label="متابعات مستحقة" value={fmtN(followDue.length)} sub="مرضى محتاجين اتصال" tab="patients" tone={followDue.length ? 'text-amber-600' : 'text-gray-900'} />}
                        <Kpi label="حالات عند المعمل" value={fmtN(atLab.length)} sub={labLate.length ? labLate.length + ' متأخرة' : 'مفيش متأخر'} tab="labs" tone={labLate.length ? 'text-orange-600' : 'text-gray-900'} />
                        <Kpi label="النواقص" value={fmtN(data.shortages.length)} sub="أصناف مطلوبة" tab="shortages" />
                        {isAdm && <Kpi label="مستحقات غير مسددة" value={fmtN(sumAmt(unpaid)) + ' ج'} sub={overdue.length ? overdue.length + ' متأخرة' : unpaid.length + ' فاتورة'} tab="dues" tone={overdue.length ? 'text-red-600' : 'text-gray-900'} />}

                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-3">

                                : <p className="text-xs text-emerald-600 font-black text-center py-8">✓ مفيش حاجة متأخرة</p>}
                        </Panel>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-3">
                        <div className="lg:col-span-2"><Panel title="جدول النهاردة" sub={todayApps.length + ' حجز'} action={<button type="button" onClick={() => onNav('appointments')} className="text-[11px] font-black text-gold-600">كل المواعيد ←</button>}>
                            {todayApps.length === 0 ? <p className="text-xs text-gray-400 font-bold py-6 text-center">مفيش حجوزات النهاردة</p> : (
                                <div className="divide-y divide-gray-50 max-h-80 overflow-y-auto custom-scrollbar -mx-1">{todayApps.map(a => { const st = (!a.status || a.status === 'booked') ? 'unconfirmed' : a.status; const S = APP_STATUS[st] || APP_STATUS.unconfirmed; return (
                                    <div key={a.id} className="flex items-center gap-3 py-2.5 px-1">
                                        <span className="text-[11px] font-black text-gold-700 bg-gold-50 rounded-lg px-2 py-1 w-14 text-center shrink-0" dir="ltr">{a.time || '--'}</span>
                                        <div className="min-w-0 flex-1"><p className="text-xs font-black text-gray-800 truncate">{a.patientName}</p><p className="text-[10px] text-gray-400 font-bold truncate">{[a.service, a.doctorName && 'د. ' + a.doctorName, selectedBranch === 'all' && (data.branches.find(b => b.id === a.branchId) || {}).name].filter(Boolean).join(' • ')}</p></div>
                                        {a.source === 'online' && <span className="text-[9px] font-black text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded shrink-0">أونلاين</span>}
                                        <span className={`text-[9px] font-black px-2 py-1 rounded-lg shrink-0 ${S.c}`}>{S.l}</span>
                                    </div>); })}</div>)}
                        </Panel></div>
                        <Panel title="أكتر الخدمات طلباً" sub={PER.l}><RankBars rows={topServices} empty="مفيش خدمات مسجلة في الفترة دي" /></Panel>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-3">
                        {isSuper && <div className="lg:col-span-2"><Panel title="الإيراد — آخر 6 شهور" sub="من التوريدات المسجلة"><MiniBars points={revPts} unit=" ج" /></Panel></div>}
                        <div className={isSuper ? '' : 'lg:col-span-3'}><Panel title="الحجوزات حسب الدكتور" sub={PER.l}><RankBars rows={byDoctor} unit=" حجز" empty="مفيش حجوزات مرتبطة بدكاترة" /></Panel></div>

                    {branchRows.length > 0 && <Panel title="مقارنة الفروع" sub={PER.l}>

                            <tbody className="divide-y divide-gray-50">{branchRows.map(r => <tr key={r.b.id} className="hover:bg-gray-50">
                                <td className="p-2 font-black text-gray-800">{r.b.name}</td><td className="p-2 text-center font-bold">{fmtN(r.apps)}</td>
                                <td className={`p-2 text-center font-bold ${r.att !== null && r.att < 70 ? 'text-red-600' : ''}`}>{r.att === null ? '—' : r.att + '%'}</td>
                                <td className="p-2 text-center font-bold">{r.lab}</td><td className="p-2 text-center font-bold">{r.short}</td>
                                {isSuper && <td className="p-2 text-center font-black text-gray-900">{fmtN(r.rev)} ج</td>}<td className="p-2 text-center font-bold">{fmtN(r.dues)} ج</td></tr>)}</tbody>
                        </table></div>
                    </Panel>}
                </div>
            );
        }

        function ShortagesView({ focusIds, onBuy, shortages, branches, currentUser, selectedBranch, onConfirm, onEdit, showToast }) {

                .then(ref => { const bn = branches.find(b => b.id === branchId)?.name || ''; tgSend(tgText('shortages', { itemName, quantity, branchId }, bn, '', currentUser.name, ref.id), branchId, 'shortage'); setItemName(''); setQuantity(''); showToast("تم إضافة الصنف للمخزن"); })
