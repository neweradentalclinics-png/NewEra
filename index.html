                            <div className="flex gap-2"><input dir="ltr" type={showTk ? 'text' : 'password'} value={v.token} onChange={e => setV({ ...v, token: e.target.value })} className={inp} /><button type="button" onClick={() => setShowTk(!showTk)} className="px-3 bg-gray-100 rounded-xl text-[10px] font-black shrink-0">{showTk ? 'إخفاء' : 'إظهار'}</button></div></div>
                        {bot && (bot.err ? <p className="text-[11px] font-bold text-red-600">⚠️ {bot.err}</p> :
                            <div className="flex items-center justify-between gap-2 bg-blue-50 rounded-xl p-3"><div className="min-w-0"><p className="text-[11px] font-black text-gray-800 truncate">🤖 {bot.first_name}</p><p className="text-[11px] font-bold text-blue-700" dir="ltr">@{bot.username}</p></div>
                                <a href={'https://t.me/' + bot.username} target="_blank" rel="noreferrer" className="shrink-0 bg-blue-600 text-white text-[11px] font-black px-3 py-2 rounded-lg">افتح البوت</a></div>)}
                        <div className="space-y-1"><label className="text-[9px] font-black text-gray-500 block">شات الإدارة (الرئيسي)</label>
                            <div className="flex gap-2"><input dir="ltr" value={v.main} onChange={e => setV({ ...v, main: e.target.value })} className={inp} /><button type="button" onClick={() => test(v.main, 'الإدارة', 'main')} className="px-3 bg-gray-100 rounded-xl text-[10px] font-black shrink-0">تجربة</button></div><Res k="main" /></div>
                    </div>
                    <div className={card}>
                        <h4 className="font-black text-gray-800 text-sm">شات سكرتارية كل فرع</h4>
                        <p className="text-[10px] text-gray-400 font-bold leading-relaxed">إزاي تجيبي رقم الشات: السكرتيرة تفتح البوت على تيليجرام من موبايلها وتدوس <b>Start</b> وتبعتله أي رسالة (أو ضيفي البوت في جروب الفرع وابعتي فيه رسالة)، وبعدها دوسي "هات الشاتات" تحت واختاري الرقم.</p>
                        {branches.map(b => <div key={b.id} className="space-y-1"><label className="text-[9px] font-black text-gray-500 block">فرع {b.name}</label>
                            <div className="flex gap-2"><input dir="ltr" value={v.branches[b.id] || ''} onChange={e => setV({ ...v, branches: { ...v.branches, [b.id]: e.target.value } })} className={inp} placeholder="chat_id" /><button type="button" onClick={() => test(v.branches[b.id], 'سكرتارية ' + b.name, b.id)} className="px-3 bg-gray-100 rounded-xl text-[10px] font-black shrink-0">تجربة</button></div><Res k={b.id} /></div>)}
                        <button type="button" onClick={findChats} className="text-xs font-black text-gold-600">🔎 هات الشاتات اللي كلّمت البوت</button>
                        {found && found.err && <div className="text-[10px] font-bold text-red-600 bg-red-50 rounded-xl p-2" dir="auto">تيليجرام رد بخطأ: <span dir="ltr">{found.err}</span></div>}
                        {found && found.err && /webhook/i.test(found.err) && <div className="text-[11px] font-bold text-gray-700 bg-amber-50 rounded-xl p-3 space-y-2 leading-relaxed">
                            <p>البوت ده متوصّل بخدمة تانية (Webhook) وهي اللي بتستلم رسايله، فالسيستم مش بيقدر يشوفها. <b>إرسال الإشعارات شغال عادي</b> — دي مشكلة في زرار "هات الشاتات" بس.</p>
                            {found.hook && <p>متوصّل بـ: <span dir="ltr" className="font-mono text-[10px] break-all">{found.hook}</span></p>}
                            <p><b>حل 1 (من غير ما تلمسي حاجة):</b> كل سكرتيرة تفتح <a href="https://t.me/myidbot" target="_blank" rel="noreferrer" className="text-blue-600 underline" dir="ltr">@myidbot</a> وتدوس Start وتبعتله <b dir="ltr">/getid</b>، هيرد عليها برقمها — تبعتهولك وتحطيه في خانة الفرع.</p>
                            <p><b>حل 2:</b> لو الخدمة اللي فوق مش بتستخدميها (أو مش عارفاها)، افصليها والزرار هيشتغل:</p>
                            <button type="button" onClick={() => { if (!confirm('فصل الـ Webhook؟ أي خدمة تانية متوصلة بالبوت ده هتبطل تستلم رسايله.')) return; fetch(`https://api.telegram.org/bot${v.token.trim()}/deleteWebhook`).then(r => r.json()).then(j => { setFound(null); showToast(j.ok ? 'اتفصل ✓ — خلي السكرتيرة تبعت للبوت ودوسي "هات الشاتات"' : 'مشكلة: ' + j.description); }).catch(e => showToast(e.message)); }} className="bg-gray-900 text-white px-3 py-2 rounded-lg text-[11px] font-black">فصل الـ Webhook</button>
                        </div>}
                        {found && !found.err && (found.length === 0 ? <div className="text-[10px] font-bold text-gray-500 bg-amber-50 rounded-xl p-3 space-y-1 leading-relaxed">
                                <p className="text-amber-800">مفيش رسايل وصلت للبوت. جربي كده:</p>
                                <p>• <b>لو جروب:</b> البوت في الجروبات مش بيشوف الرسايل العادية، بيشوف الأوامر بس. ابعتي في الجروب <b dir="ltr">/start</b> بالظبط، وبعدها دوسي "هات الشاتات" تاني.</p>
                                <p>• <b>لو شات خاص:</b> اتأكدي إنها بعتت لنفس البوت اللي التوكن بتاعه هنا، ودوست Start.</p>
                                <p>• الرسايل اللي فاتت عليها أكتر من 24 ساعة مش بتظهر، فابعتي رسالة جديدة.</p>
                            </div> :
                            <div className="bg-gray-50 rounded-xl p-2 space-y-1">{found.map(([id, name]) => <div key={id} className="flex items-center justify-between gap-2 text-[11px] font-bold"><span className="truncate">{name}</span><span className="flex items-center gap-1 shrink-0"><span dir="ltr" className="font-mono text-gray-500">{id}</span>
                                <select defaultValue="" onChange={e => { const t = e.target.value; if (!t) return; if (t === 'main') setV(p => ({ ...p, main: id })); else if (t.startsWith('p:')) setPer(t.slice(2), { chat: id }); else setV(p => ({ ...p, branches: { ...p.branches, [t]: id } })); e.target.value = ''; }} className="text-[10px] bg-white border rounded-lg p-1"><option value="">حطه لـ...</option><option value="main">الإدارة</option>{branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}{[...admins, ...doctors].map(x => <option key={x.id} value={'p:' + x.id}>{x.role === 'doctor' ? 'د. ' : ''}{x.name}</option>)}</select></span></div>)}</div>)}
                    </div>
                    <div className={card}>
                        <h4 className="font-black text-gray-800 text-sm">👔 الأدمنز (رسايل شخصية)</h4>
                        <p className="text-[10px] text-gray-400 font-bold leading-relaxed">غير شات الإدارة الرئيسي: كل أدمن يوصله على الخاص اللي تختاريه له من كل الفروع. القايمة بتتسحب من الموظفين المتسجلين، ولو أدمن اتشال من السيستم بيبطل يوصله حاجة لوحده. وتقدري تضيفي شخص يدوي (مش متسجل في السيستم).</p>
                        {admins.map(x => <React.Fragment key={x.id}>{PersonRow({ id: (x.id), name: (x.name), tag: (x.role === 'superadmin' ? 'سوبر أدمن' : 'أدمن'), type: "admin" })}</React.Fragment>)}
                        {Object.entries(v.people || {}).filter(([k, per]) => per.manual).map(([k, per]) => <React.Fragment key={k}>{PersonRow({ id: k, manual: true, type: "admin" })}</React.Fragment>)}
                        <button type="button" onClick={() => { const k = 'm_' + Date.now(); setV(p => ({ ...p, people: { ...p.people, [k]: { manual: true, name: '', chat: '', kinds: [...PERSON_DEFAULT.admin] } } })); setOpenP(k); }} className="text-xs font-black text-gold-600">+ إضافة شخص يدوي</button>
                    </div>
                    <div className={card}>
                        <h4 className="font-black text-gray-800 text-sm">👨‍⚕️ الدكاترة</h4>
                        <p className="text-[10px] text-gray-400 font-bold leading-relaxed">الأسماء بتتسحب من الدكاترة المتسجلين حالياً. الحجوزات والكنسل والتعديل والمتابعات بتوصل للدكتور لو تخصه هو بس، والجدول = جدوله هو. المعامل والنواقص والفواتير والملخص بتوصله لو في فروعه.</p>
                        {doctors.length === 0 && <p className="text-[11px] font-bold text-gray-400">مفيش دكاترة متسجلين لسه.</p>}
                        {doctors.map(x => <React.Fragment key={x.id}>{PersonRow({ id: (x.id), name: ('د. ' + x.name), tag: (doctorBranchIds(x, branches).map(id => (branches.find(b => b.id === id) || {}).name).filter(Boolean).join('، ')), type: "doctor" })}</React.Fragment>)}
                        <p className="text-[10px] text-gray-500 font-bold bg-blue-50 rounded-xl p-2.5 leading-relaxed">إزاي ياخد رقمه: يفتح بوت العيادة ويدوس <b>Start</b> (لازم)، وبعدين يفتح <a href="https://t.me/myidbot" target="_blank" rel="noreferrer" className="text-blue-600 underline" dir="ltr">@myidbot</a> ويبعتله <b dir="ltr">/getid</b> ويبعتلك الرقم.</p>
                    </div>
                    <div className={card}>
                        <h4 className="font-black text-gray-800 text-sm">🔔 تشغيل / إيقاف الرسايل</h4>
                        <p className="text-[10px] text-gray-400 font-bold">اللي تقفليه هنا بيقف للكل (الإدارة والفروع والأدمنز والدكاترة) لحد ما ترجعي تفتحيه. الصلاحيات اللي تحت بتفضل محفوظة زي ما هي.</p>
                        <div className="divide-y divide-gray-50">{TG_KINDS.map(([k, n]) => { const on = !(v.off || []).includes(k); return (
                            <label key={k} className="flex items-center justify-between gap-3 py-2 cursor-pointer">
                                <span className={`text-xs font-bold ${on ? 'text-gray-800' : 'text-gray-400 line-through'}`}>{n}</span>
                                <span onClick={e => { e.preventDefault(); setV(p => ({ ...p, off: on ? [...(p.off || []), k] : (p.off || []).filter(x => x !== k) })); }} className={`relative w-10 h-5 rounded-full transition-colors shrink-0 ${on ? 'bg-emerald-500' : 'bg-gray-300'}`}><span className={`absolute top-0.5 w-4 h-4 bg-white rounded-full shadow transition-all ${on ? 'right-0.5' : 'right-[22px]'}`}></span></span>
                            </label>); })}</div>
                    </div>
                    <div className={card}>
                        <h4 className="font-black text-gray-800 text-sm">مين يوصله إيه</h4>
                        <p className="text-[10px] text-gray-400 font-bold">سكرتارية كل فرع بيوصلها اللي يخص فرعها بس.</p>
                        <table className="w-full text-xs"><thead><tr className="text-[10px] text-gray-400"><th className="text-right p-1.5">الإشعار</th><th className="p-1.5">الإدارة</th><th className="p-1.5">سكرتارية الفرع</th></tr></thead>
                            <tbody className="divide-y divide-gray-50">{TG_KINDS.map(([k, n]) => <tr key={k}><td className="p-1.5 font-bold text-gray-700">{n}</td>
                                {['main', 'branch'].map(side => <td key={side} className="p-1.5 text-center"><input type="checkbox" checked={(v.routes[side] || []).includes(k)} onChange={() => togg(side, k)} /></td>)}</tr>)}</tbody></table>
                        <p className="text-[10px] text-gray-400 font-bold">صلاحيات كل أدمن وكل دكتور بتتحدد من خانته فوق.</p>
                        <p className="text-[10px] text-gray-400 font-bold">نص كل رسالة بيتعدل من الإعدادات ← قوالب الرسائل. ملخص الصبح وجدول المواعيد بيتبعتوا مرة واحدة يومياً بعد 9 الصبح.</p>
                        <button type="button" onClick={() => { if (!TG.token) { showToast('احفظي التوكن الأول'); return; } sendSchedules(LIVE.branches, LIVE.appointments, localDay()); scheduleTargets().forEach(t => sendPersonSchedule(t, LIVE.branches, LIVE.appointments, localDay())); showToast('بيتبعت جدول النهاردة دلوقتي للي مختارين "مواعيد النهاردة"'); }} className="w-full bg-gray-900 text-white py-2.5 rounded-xl font-black text-xs">🗓️ ابعت جدول مواعيد النهاردة دلوقتي</button>
                    </div>
                    <button type="button" onClick={save} className="w-full bg-gold-500 text-white py-3 rounded-xl font-black text-sm">حفظ</button>
                </div>
            );
        }

        function DuesView({ focusIds, items, branches, currentUser, onConfirm, onAdd, onEdit, showToast }) {
            const t = new Date().toISOString().split('T')[0];
            const isAdm = currentUser.role === 'admin' || currentUser.role === 'superadmin';
            const [f, setF] = useState(isAdm ? 'pending' : 'all');
            useEffect(() => { if (focusIds && focusIds.length) setTimeout(() => document.getElementById('due-' + focusIds[0])?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300); }, [focusIds]);
            const list = items.filter(d => f === 'all' || (f === 'paid' ? d.paid : !d.paid)).sort((a, b) => (a.dueDate || '9').localeCompare(b.dueDate || '9'));
            const pend = items.filter(d => !d.paid), over = pend.filter(d => d.dueDate && d.dueDate < t);
            const sum = a => a.reduce((s, d) => s + (Number(d.amount) || 0), 0);
            const upd = (d, v, m) => db.collection('dues').doc(d.id).update(v).then(() => showToast(m)).catch(e => showToast(e.message));
            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="flex justify-between items-center"><h3 className="text-lg font-black text-gray-800">{isAdm ? 'الفواتير والمستحقات' : 'الفواتير (اللي سجّلتيها)'}</h3>
                        <button type="button" onClick={onAdd} className="bg-gold-500 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow-md hover:bg-gold-600">+ مستحق</button></div>
                    {isAdm && <div className="flex gap-2 flex-wrap">
                        <div className="flex-1 min-w-[120px] p-3 rounded-xl bg-amber-50 text-amber-700"><p className="text-[9px] font-bold">إجمالي المستحق</p><p className="text-lg font-black">{sum(pend)} ج</p></div>
                        <div className="flex-1 min-w-[120px] p-3 rounded-xl bg-red-50 text-red-600"><p className="text-[9px] font-bold">متأخر عن موعده</p><p className="text-lg font-black">{sum(over)} ج</p></div>
                    </div>}
                    <select value={f} onChange={e => setF(e.target.value)} className="bg-white border border-gray-200 text-xs font-bold p-2 rounded-xl outline-none">
                        <option value="pending">غير مسددة</option><option value="paid">مسددة</option><option value="all">الكل</option></select>
                    <BranchGroups items={list} branches={branches} empty="لا توجد مستحقات." sub={arr => isAdm ? '• ' + sum(arr.filter(d => !d.paid)) + ' ج مستحق' : 'فاتورة'} render={d => {
                        const late = !d.paid && d.dueDate && d.dueDate < t;
                        return (
                        <div key={d.id} id={'due-' + d.id} className={`bg-white p-4 rounded-[20px] border shadow-sm relative ${focusIds?.includes(d.id) ? 'border-gold-500 ring-2 ring-gold-400' : late ? 'border-red-300' : 'border-gray-100'}`}>
                            <div className="absolute top-3 left-3 flex gap-1">
                                <button type="button" onClick={() => onEdit(d)} className="p-1.5 text-gold-500 bg-gray-50 rounded-lg"><IconEdit/></button>
                                {isAdm && <button type="button" onClick={() => onConfirm({ msg: 'حذف المستحق؟', onConfirm: () => db.collection('dues').doc(d.id).delete().then(() => showToast('تم الحذف')).catch(e => showToast(e.message)) })} className="p-1.5 text-red-500 bg-red-50 rounded-lg"><IconTrash/></button>}
                            </div>
                            <h4 className="font-black text-gray-800 text-sm">{d.party}</h4>
                            {d.desc && <p className="text-[11px] text-gray-500 font-bold">{d.desc}</p>}
                            <p className="text-lg font-black text-gold-600 mt-1">{Number(d.amount) || 0} ج</p>
                            <p className={`text-[10px] font-black mt-1 ${late ? 'text-red-600' : 'text-gray-400'}`}>{d.paid ? '✓ سُدد ' + (d.paidAt || '') : (d.dueDate ? 'موعد السداد: ' + d.dueDate + (late ? ' (متأخر)' : '') : 'بدون موعد سداد')}</p>
                            {isAdm && <button type="button" onClick={() => d.paid ? upd(d, { paid: false, paidAt: '' }, 'اتلغى السداد') : upd(d, { paid: true, paidAt: t }, 'تم تسجيل السداد')} className={`mt-2 px-3 py-1.5 rounded-lg text-[10px] font-bold ${d.paid ? 'bg-gray-100 text-gray-600' : 'bg-emerald-500 text-white'}`}>{d.paid ? 'إلغاء السداد' : 'تم السداد'}</button>}
                        </div>); }} />
                </div>
            );
        }

        // أيقونات صغيرة للتعديل والحذف
        const IcoEdit = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>;
        const IcoTrash = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
        // عنوان قابل للتعديل (أيقونة قلم) + أيقونة حذف
        function EditableTitle({ value, onChange, onDelete, deleteMsg }) {
            const [ed, setEd] = useState(false);
            const [t, setT] = useState(value);
            useEffect(() => setT(value), [value]);
            const done = () => { setEd(false); if (t.trim() && t.trim() !== value) onChange(t.trim()); else setT(value); };
            return (
                <div className="flex items-center gap-1.5 min-w-0">
                    {ed ? <input autoFocus value={t} onChange={e => setT(e.target.value)} onBlur={done} onKeyDown={e => { if (e.key === 'Enter') done(); if (e.key === 'Escape') { setT(value); setEd(false); } }} onClick={e => e.stopPropagation()} className="flex-1 min-w-0 p-1.5 bg-white border border-gold-300 rounded-lg text-xs font-black outline-none" />
                        : <span className="text-xs font-black text-gray-800 truncate">{value}</span>}
                    {!ed && <button type="button" title="تعديل الاسم" onClick={e => { e.stopPropagation(); setEd(true); }} className="shrink-0 w-7 h-7 rounded-lg bg-gray-100 text-gray-500 hover:text-gold-600 hover:bg-gold-50 flex items-center justify-center"><IcoEdit /></button>}
                    {!ed && onDelete && <button type="button" title="حذف" onClick={e => { e.stopPropagation(); if (confirm(deleteMsg || 'حذف؟')) onDelete(); }} className="shrink-0 w-7 h-7 rounded-lg bg-gray-100 text-gray-500 hover:text-red-600 hover:bg-red-50 flex items-center justify-center"><IcoTrash /></button>}
                </div>
            );
        }

        // ===== الخدمات والأسعار + التخصصات (الأدمن والسوبر أدمن) =====
        const fmtPrice = (a, b) => { const x = Number(a) || 0, y = Number(b) || 0; if (!x && !y) return 'حسب الحالة'; if (!y || y === x) return x.toLocaleString('en-US') + ' ج'; return x.toLocaleString('en-US') + ' – ' + y.toLocaleString('en-US') + ' ج'; };
        function ServicesView({ services, specialties, staff, showToast, onConfirm }) {
            const [tab, setTab] = useState('services');
            const [edit, setEdit] = useState(null);
            const [spName, setSpName] = useState('');
            const [spEdit, setSpEdit] = useState(null);
            const inp = "w-full p-2.5 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500";
            const docsOf = spId => staff.filter(x => x.role === 'doctor' && (x.specialties || []).includes(spId)).map(x => 'د. ' + x.name);
            const saveSvc = (e) => {
                e.preventDefault();
                const f = e.target, d = { name: f.name.value.trim(), specialtyId: f.specialtyId.value, priceFrom: Number(f.priceFrom.value) || 0, priceTo: Number(f.priceTo.value) || 0, note: f.note.value.trim(), duration: f.duration.value.trim(), active: f.active.checked, order: Number(f.order.value) || 0 };
                if (!d.name) return;
                const p = edit.id ? db.collection('services').doc(edit.id).set(d, { merge: true }) : db.collection('services').add(d);
                p.then(() => { setEdit(null); showToast('اتحفظت ✓'); }).catch(err => showToast(err.message));
            };
            const addSp = () => { const n = spName.trim(); if (!n) return; db.collection('specialties').add({ name: n, order: specialties.length + 1 }).then(() => setSpName('')).catch(err => showToast(err.message)); };
            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="flex items-center justify-between flex-wrap gap-2">
                        <h3 className="text-lg font-black text-gray-800">الخدمات والأسعار</h3>
                        <div className="flex bg-gray-100 p-1 rounded-xl">{[['services', 'الخدمات'], ['specialties', 'التخصصات']].map(([k, n]) => <button key={k} type="button" onClick={() => setTab(k)} className={`px-4 py-1.5 text-xs font-black rounded-lg ${tab === k ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>{n}</button>)}</div>
                    </div>

                    {tab === 'specialties' && <div className="bg-white rounded-[20px] border border-gray-100 shadow-sm p-5 space-y-3 max-w-2xl">
                        <p className="text-[11px] text-gray-500 font-bold">كل خدمة بتتبع تخصص، وكل دكتور بتختاري تخصصاته من بياناته. لما المريض يختار خدمة، بيظهرله الدكاترة اللي بيعملوا التخصص ده في الفرع اللي اختاره.</p>
                        <div className="flex gap-2"><input value={spName} onChange={e => setSpName(e.target.value)} onKeyDown={e => e.key === 'Enter' && addSp()} placeholder="تخصص جديد (مثال: تقويم)" className={inp} /><button type="button" onClick={addSp} className="bg-gold-500 text-white px-4 rounded-xl text-xs font-black shrink-0">+ إضافة</button></div>
                        {specialties.length === 0 && <p className="text-xs text-gray-400 font-bold text-center py-4">مفيش تخصصات لسه.</p>}
                        <div className="divide-y divide-gray-50">{specialties.map(sp => (
                            <div key={sp.id} className="py-2.5 space-y-1">
                                <EditableTitle value={sp.name} onChange={t => db.collection('specialties').doc(sp.id).update({ name: t }).catch(err => showToast(err.message))}
                                    onDelete={() => db.collection('specialties').doc(sp.id).delete().then(() => showToast('اتحذف')).catch(err => showToast(err.message))}
                                    deleteMsg={'حذف تخصص "' + sp.name + '"؟ الخدمات اللي تبعه هتفضل موجودة بس من غير تخصص.'} />
                                <p className="text-[10px] font-bold text-gray-400">{services.filter(x => x.specialtyId === sp.id).length} خدمة • {docsOf(sp.id).join('، ') || 'مفيش دكاترة متحددين'}</p>
                            </div>))}</div>
                    </div>}

                    {tab === 'services' && <>
                        <div className="flex justify-between items-center"><p className="text-[11px] text-gray-500 font-bold">الأسعار دي بتظهر للمريض في صفحة الحجز كتكلفة تقريبية.</p>
                            <button type="button" onClick={() => setEdit({ active: true })} className="bg-gold-500 text-white px-4 py-2 rounded-xl text-xs font-black shrink-0">+ خدمة جديدة</button></div>
                        {services.length === 0 && <p className="text-xs text-gray-400 font-bold text-center py-6 bg-white rounded-2xl">مفيش خدمات لسه. ابدئي بإضافة التخصصات، وبعدين الخدمات.</p>}
                        {[...specialties, { id: '', name: 'بدون تخصص' }].map(sp => { const list = services.filter(x => (x.specialtyId || '') === sp.id || (sp.id === '' && !specialties.some(y => y.id === x.specialtyId))); if (!list.length) return null; return (
                            <div key={sp.id || 'none'} className="space-y-2">
                                <p className="text-xs font-black text-gray-500 px-1">{sp.name}</p>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-2">{list.map(sv => (
                                    <div key={sv.id} className={`bg-white rounded-2xl border border-gray-100 shadow-sm p-3 flex items-start gap-2 ${sv.active === false ? 'opacity-50' : ''}`}>
                                        <div className="flex-1 min-w-0"><p className="text-sm font-black text-gray-800">{sv.name}{sv.active === false && <span className="text-[9px] text-gray-400 mr-1">(مخفية)</span>}</p>
                                            <p className="text-xs font-black text-gold-700">{fmtPrice(sv.priceFrom, sv.priceTo)}{sv.duration ? <span className="text-gray-400 font-bold"> • {sv.duration}</span> : ''}</p>
                                            {sv.note && <p className="text-[10px] font-bold text-gray-400 mt-0.5">{sv.note}</p>}</div>
                                        <button type="button" title="تعديل" onClick={() => setEdit(sv)} className="w-7 h-7 rounded-lg bg-gray-100 text-gray-500 hover:text-gold-600 flex items-center justify-center shrink-0"><IcoEdit /></button>
                                        <button type="button" title="حذف" onClick={() => onConfirm({ msg: 'حذف خدمة "' + sv.name + '"؟', onConfirm: () => db.collection('services').doc(sv.id).delete().catch(err => showToast(err.message)) })} className="w-7 h-7 rounded-lg bg-gray-100 text-gray-500 hover:text-red-600 flex items-center justify-center shrink-0"><IcoTrash /></button>
                                    </div>))}</div>
                            </div>); })}
                    </>}

                    {edit && <div className="fixed inset-0 bg-gray-900/50 z-[90] flex items-center justify-center p-4" onClick={() => setEdit(null)}>
                        <form onSubmit={saveSvc} onClick={e => e.stopPropagation()} className="bg-white rounded-[24px] w-full max-w-md p-5 space-y-3">
                            <h4 className="font-black text-gray-800">{edit.id ? 'تعديل خدمة' : 'خدمة جديدة'}</h4>
                            <input name="name" defaultValue={edit.name} required placeholder="اسم الخدمة (مثال: زراعة سنة)" className={inp} />
                            <select name="specialtyId" defaultValue={edit.specialtyId || ''} className={inp}><option value="">— بدون تخصص —</option>{specialties.map(sp => <option key={sp.id} value={sp.id}>{sp.name}</option>)}</select>
                            <div className="grid grid-cols-2 gap-2"><label className="text-[10px] font-black text-gray-500">السعر من<input name="priceFrom" type="number" min="0" defaultValue={edit.priceFrom || ''} className={inp + ' mt-1'} /></label>
                                <label className="text-[10px] font-black text-gray-500">لحد (اختياري)<input name="priceTo" type="number" min="0" defaultValue={edit.priceTo || ''} className={inp + ' mt-1'} /></label></div>
                            <div className="grid grid-cols-2 gap-2"><input name="duration" defaultValue={edit.duration} placeholder="المدة (مثال: جلستين)" className={inp} /><input name="order" type="number" defaultValue={edit.order || ''} placeholder="الترتيب" className={inp} /></div>
                            <input name="note" defaultValue={edit.note} placeholder="ملاحظة للمريض (اختياري)" className={inp} />
                            <label className="flex items-center gap-2 text-xs font-black text-gray-700"><input name="active" type="checkbox" defaultChecked={edit.active !== false} /> ظاهرة للمرضى في الحجز</label>
                            <div className="flex gap-2"><button className="flex-1 bg-gold-500 text-white py-2.5 rounded-xl font-black text-sm">حفظ</button><button type="button" onClick={() => setEdit(null)} className="px-4 bg-gray-100 rounded-xl font-black text-sm">إلغاء</button></div>
                        </form>
                    </div>}
                </div>
            );
        }

        // ===== الاستشارات الأونلاين =====
        function ConsultsView(props) {
            const isAdm = props.currentUser.role === 'admin' || props.currentUser.role === 'superadmin';
            const [view, setView] = useState('consults');
            return (<div className="space-y-4 w-full">
                {isAdm && <div className="flex bg-gray-100 p-1 rounded-xl max-w-xs">{[['consults', 'الاستشارات'], ['faq', 'الأسئلة الشائعة']].map(([k, n]) => <button key={k} type="button" onClick={() => setView(k)} className={`flex-1 px-3 py-1.5 text-xs font-black rounded-lg ${view === k ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>{n}</button>)}</div>}
                {view === 'faq' && isAdm ? <FaqView {...props} /> : <ConsultsList {...props} />}
            </div>);
        }

        // ===== الأسئلة الشائعة (بتظهر في الموقع) =====
        function FaqView({ consults, showToast }) {
            const [faqs, setFaqs] = useState(null);
            const [edit, setEdit] = useState(null);
            const [q, setQ] = useState('');
            useEffect(() => db.collection('faqs').onSnapshot(s => setFaqs(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || (b.createdAt || '').localeCompare(a.createdAt || ''))), e => showToast(e.message)), []);
            if (!faqs) return <p className="text-xs font-bold text-gray-400">...</p>;
            const used = new Set(faqs.map(f => f.fromConsult).filter(Boolean));
            const pending = consults.filter(c => (c.replies || []).length && !used.has(c.id));
            const importAll = () => {
                if (!pending.length) { showToast('مفيش استشارات جديدة مترد عليها'); return; }
                const b = db.batch();
                pending.forEach(c => b.set(db.collection('faqs').doc(), { q: c.question, a: (c.replies || []).map(r => r.text).join('\n\n'), topic: c.topic || '', published: false, fromConsult: c.id, createdAt: new Date().toISOString() }));
                b.commit().then(() => showToast('اتضاف ' + pending.length + ' سؤال كمسودة — راجعيهم وانشريهم')).catch(e => showToast(e.message));
            };
            const save = e => {
                e.preventDefault(); const f = e.target;
                const d = { q: f.q.value.trim(), a: f.a.value.trim(), topic: f.topic.value.trim(), published: f.published.checked, order: Number(f.order.value) || 0 };
                if (!d.q || !d.a) return;
                (edit.id ? db.collection('faqs').doc(edit.id).set(d, { merge: true }) : db.collection('faqs').add({ ...d, createdAt: new Date().toISOString() })).then(() => { setEdit(null); showToast('اتحفظ ✓'); }).catch(err => showToast(err.message));
            };
            const shown = faqs.filter(f => !q || (f.q + ' ' + f.a + ' ' + (f.topic || '')).includes(q));
            const inp = "w-full p-2.5 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500";
            return (
                <div className="space-y-3 animate-fade-in">
                    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-[11px] font-bold text-amber-800 leading-relaxed">اللي متعلّم عليه "منشور" بس هو اللي بيظهر في الموقع. قبل النشر راجعي السؤال والإجابة واشيلي أي اسم أو رقم أو تفاصيل تعرّف المريض. اسم المريض ورقمه مش بيتنقلوا أصلاً.</div>
                    <div className="flex flex-wrap gap-2 items-center">
                        <button type="button" onClick={() => setEdit({ published: true })} className="bg-gold-500 text-white px-3 py-2 rounded-xl text-xs font-black">+ سؤال جديد</button>
                        <button type="button" onClick={importAll} className="bg-gray-900 text-white px-3 py-2 rounded-xl text-xs font-black">⬇ هات الاستشارات المردود عليها ({pending.length}) كمسودات</button>
                        <input value={q} onChange={e => setQ(e.target.value)} placeholder="بحث..." className="p-2 bg-white border border-gray-200 rounded-xl text-xs font-bold mr-auto w-40" />
                    </div>
                    <p className="text-[11px] font-bold text-gray-500">{faqs.filter(f => f.published).length} منشور • {faqs.filter(f => !f.published).length} مسودة</p>
                    {shown.map(f => <div key={f.id} className={`bg-white rounded-2xl border shadow-sm p-4 space-y-1.5 ${f.published ? 'border-emerald-200' : 'border-gray-100'}`}>
                        <div className="flex items-start gap-2">
                            <p className="flex-1 text-sm font-black text-gray-800">❓ {f.q}</p>
                            <button type="button" onClick={() => db.collection('faqs').doc(f.id).update({ published: !f.published }).catch(e => showToast(e.message))} className={`text-[10px] font-black px-2 py-1 rounded-lg shrink-0 ${f.published ? 'bg-emerald-50 text-emerald-700' : 'bg-gray-100 text-gray-500'}`}>{f.published ? '✓ منشور' : 'مسودة — انشر'}</button>
                            <button type="button" title="تعديل" onClick={() => setEdit(f)} className="w-7 h-7 rounded-lg bg-gray-100 text-gray-500 hover:text-gold-600 flex items-center justify-center shrink-0"><IcoEdit /></button>
                            <button type="button" title="حذف" onClick={() => confirm('حذف السؤال ده؟') && db.collection('faqs').doc(f.id).delete().catch(e => showToast(e.message))} className="w-7 h-7 rounded-lg bg-gray-100 text-gray-500 hover:text-red-600 flex items-center justify-center shrink-0"><IcoTrash /></button>
                        </div>
                        <p className="text-xs font-bold text-gray-600 whitespace-pre-line">{f.a}</p>
                        {f.topic && <p className="text-[10px] font-black text-gold-700">{f.topic}</p>}
                    </div>)}
                    {edit && <div className="fixed inset-0 bg-gray-900/50 z-[90] flex items-center justify-center p-4" onClick={() => setEdit(null)}>
                        <form onSubmit={save} onClick={e => e.stopPropagation()} className="bg-white rounded-[24px] w-full max-w-lg p-5 space-y-3">
                            <h4 className="font-black text-gray-800">{edit.id ? 'تعديل سؤال' : 'سؤال جديد'}</h4>
                            <textarea name="q" rows="2" defaultValue={edit.q} required placeholder="السؤال" className={inp} />
                            <textarea name="a" rows="5" defaultValue={edit.a} required placeholder="الإجابة" className={inp} />
                            <div className="grid grid-cols-2 gap-2"><input name="topic" defaultValue={edit.topic} placeholder="التصنيف (مثال: تقويم)" className={inp} /><input name="order" type="number" defaultValue={edit.order || ''} placeholder="الترتيب" className={inp} /></div>
                            <label className="flex items-center gap-2 text-xs font-black text-gray-700"><input name="published" type="checkbox" defaultChecked={!!edit.published} /> منشور في الموقع</label>
                            <div className="flex gap-2"><button className="flex-1 bg-gold-500 text-white py-2.5 rounded-xl font-black text-sm">حفظ</button><button type="button" onClick={() => setEdit(null)} className="px-4 bg-gray-100 rounded-xl font-black text-sm">إلغاء</button></div>
                        </form></div>}
                </div>
            );
        }

        function ConsultsList({ consults, branches, staff, specialties, currentUser, focusId, showToast }) {
            const isDoc = currentUser.role === 'doctor';
            const [f, setF] = useState('new');
            const [open, setOpen] = useState(focusId || null);
            const [reply, setReply] = useState({});
            const doctors = staff.filter(x => x.role === 'doctor');
            const st = c => c.sentToPatientAt ? 'sent' : (c.replies || []).length ? 'answered' : 'new';
            const ST = { new: ['مستنية رد', 'bg-red-50 text-red-600'], answered: ['اترد عليها — لسه متبعتتش للمريض', 'bg-amber-50 text-amber-700'], sent: ['اتبعت الرد للمريض', 'bg-emerald-50 text-emerald-700'] };
            const list = consults.filter(c => f === 'all' || st(c) === f);
            const counts = { new: 0, answered: 0, sent: 0 }; consults.forEach(c => counts[st(c)]++);
            const send = (c) => {
                const t = (reply[c.id] || '').trim(); if (!t) return;
                const r = { by: (isDoc ? 'د. ' : '') + currentUser.name, byId: currentUser.id, text: t, at: new Date().toISOString(), via: 'system' };
                db.collection('consults').doc(c.id).update({ replies: firebase.firestore.FieldValue.arrayUnion(r), status: 'answered', answeredAt: r.at })
                    .then(() => { setReply(x => ({ ...x, [c.id]: '' })); showToast('اتسجل الرد ✓');
                        tgSend(fillT('tgConsultReply', { code: c.id, patient: c.name, by: r.by, reply: t }), c.branchId, 'consult', []); })
                    .catch(e => showToast(e.message));
            };
            const reassign = (c, docId) => {
                const d = doctors.find(x => x.id === docId);
                db.collection('consults').doc(c.id).update({ doctorId: docId, doctorName: d ? d.name : '', targets: docId ? [docId] : [], tgSent: false }).then(() => showToast('اتحولت — هيوصله تيليجرام')).catch(e => showToast(e.message));
            };
            const lastReply = c => (c.replies || []).slice(-1)[0];
            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="flex items-center justify-between flex-wrap gap-2">
                        <h3 className="text-lg font-black text-gray-800">الاستشارات الأونلاين</h3>
                        <div className="flex bg-gray-100 p-1 rounded-xl overflow-x-auto">{[['new', 'مستنية رد'], ['answered', 'اترد عليها'], ['sent', 'اتبعتت للمريض'], ['all', 'الكل']].map(([k, n]) => <button key={k} type="button" onClick={() => setF(k)} className={`px-3 py-1.5 text-[11px] font-black rounded-lg whitespace-nowrap ${f === k ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>{n}{k !== 'all' ? ' (' + counts[k] + ')' : ''}</button>)}</div>
                    </div>
                    <p className="text-[10px] text-gray-400 font-bold">الدكتور بيرد من تيليجرام (Reply على رسالة الاستشارة) أو من هنا. الرد بيظهر للمريض في صفحة الحجز بكود الاستشارة، وتقدري تبعتيهوله واتساب من الزرار.</p>
                    {list.length === 0 && <p className="text-xs text-gray-400 font-bold text-center py-8 bg-white rounded-2xl">مفيش استشارات هنا.</p>}
                    {list.map(c => { const s0 = st(c), isOpen = open === c.id, lr = lastReply(c), br = branches.find(b => b.id === c.branchId);
                        return (
                        <div key={c.id} className="bg-white rounded-[20px] border border-gray-100 shadow-sm">
                            <div className="p-4 cursor-pointer space-y-1.5" onClick={() => setOpen(isOpen ? null : c.id)}>
                                <div className="flex items-center gap-2 flex-wrap"><span className="text-sm font-black text-gray-800">{c.name}</span><span className={`text-[10px] font-black px-2 py-0.5 rounded-lg ${ST[s0][1]}`}>{ST[s0][0]}</span><span className="text-[10px] font-mono text-gray-400 mr-auto">#{c.id}</span></div>
                                <p className="text-[11px] font-bold text-gray-500">{[c.topic, c.doctorName ? 'لـ د. ' + c.doctorName : ((c.targets || []).length ? 'لأي دكتور مناسب (' + c.targets.length + ')' : 'للإدارة'), br && 'فرع ' + br.name, new Date(c.createdAt).toLocaleString('ar-EG', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })].filter(Boolean).join(' • ')}</p>
                                <p className={`text-xs font-bold text-gray-700 ${isOpen ? 'whitespace-pre-line' : 'truncate'}`}>❓ {c.question}</p>
                            </div>
                            {isOpen && <div className="px-4 pb-4 space-y-3 border-t border-gray-100 pt-3">
                                {!isDoc && <p className="text-xs font-bold text-gray-600">📞 <span dir="ltr">{c.phone}</span></p>}
                                {(c.replies || []).map((r, i) => <div key={i} className="bg-emerald-50 border border-emerald-100 rounded-xl p-3"><p className="text-[10px] font-black text-emerald-700 mb-1">{r.by} • {r.via === 'telegram' ? 'من تيليجرام' : 'من السيستم'} • {new Date(r.at).toLocaleString('ar-EG', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })}</p><p className="text-xs font-bold text-gray-800 whitespace-pre-line">{r.text}</p></div>)}
                                <div className="space-y-2"><textarea rows="3" value={reply[c.id] || ''} onChange={e => setReply(x => ({ ...x, [c.id]: e.target.value }))} placeholder={isDoc ? 'اكتب ردك على المريض...' : 'اكتبي رد (لو الدكتور رد في التليفون مثلاً)...'} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl text-xs font-bold outline-none focus:border-gold-500" />
                                    <button type="button" onClick={() => send(c)} className="bg-gray-900 text-white px-4 py-2 rounded-xl text-xs font-black">حفظ الرد</button></div>
                                {!isDoc && <div className="flex flex-wrap gap-2 items-center border-t border-gray-100 pt-3">
                                    {lr && <a href={waUrl(c.phone, fillT('consultReply', { name: c.name, doctor: lr.by, reply: lr.text })) || '#'} target={WA_TARGET} rel="noreferrer" onClick={() => db.collection('consults').doc(c.id).update({ sentToPatientAt: new Date().toISOString(), sentBy: currentUser.name }).catch(() => {})} className="bg-green-500 text-white px-3 py-2 rounded-xl text-xs font-black">📲 ابعت الرد للمريض واتساب</a>}
                                    {c.sentToPatientAt && <span className="text-[10px] font-bold text-emerald-600">اتبعت {c.sentBy ? 'بواسطة ' + c.sentBy : ''}</span>}
                                    <label className="text-[11px] font-bold text-gray-500 flex items-center gap-1 mr-auto">تحويل لـ <select value={c.doctorId || ''} onChange={e => reassign(c, e.target.value)} className="p-1.5 bg-gray-50 border border-gray-100 rounded-lg text-[11px] font-bold"><option value="">— الإدارة —</option>{doctors.map(d => <option key={d.id} value={d.id}>د. {d.name}</option>)}</select></label>
                                </div>}
                            </div>}
                        </div>); })}
                </div>
            );
        }

        function TemplatesView({ showToast, data, isSuper }) {

                        {block(WA, 'حذف القالب ده؟ الزرار بتاعه هيختفي من السيستم (تقدري ترجّعيه بعدين).')}

                    {tab === 'tg' && <>
                        <p className="text-[10px] font-bold text-gray-400">رسايل تيليجرام. {'{by}'} هو اسم اللي سجّل. لو حذفتي قالب، الرسالة دي بتبطل تتبعت لحد ما ترجّعيه.</p>

                const APP_STATUS = {

                    className={`text-[9px] font-black rounded-lg px-1.5 py-1.5 outline-none cursor-pointer ${APP_STATUS[cur].c}`}>

        // --- الماليات: خزنة كل فرع ---
        function FinanceView({ payments, branches, selectedBranch, currentUser, onConfirm, onAdd, onEdit, showToast }) {
            const num = v => Number(v || 0);
            const shown = branches.filter(b => selectedBranch === 'all' || b.id === selectedBranch);
            const pending = payments.filter(p => !p.delivered);
            const totalPending = pending.reduce((s, p) => s + num(p.amount), 0);
            const sorted = [...payments].sort((x, y) => (y.date || '').localeCompare(x.date || ''));
            const settle = (b, reset) => onConfirm({
                msg: (reset ? 'تصفير خزنة فرع ' : 'تأكيد توريد خزنة فرع ') + b.name + '؟',
                onConfirm: () => {
                    const batch = db.batch();
                    pending.filter(p => p.branchId === b.id).forEach(p => batch.update(db.collection('payments').doc(p.id), { delivered: true, zeroed: reset, deliveredAt: new Date().toISOString() }));
                    batch.commit().then(() => showToast(reset ? 'تم تصفير الخزنة' : 'تم تسجيل التوريد')).catch(err => showToast("مشكلة: " + err.message));
                }
            });
            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="bg-gradient-to-r from-gold-600 to-gold-400 p-6 rounded-[20px] text-white shadow-xl flex flex-wrap justify-between items-center gap-4">
                        <div><p className="text-gold-100 text-[10px] font-bold mb-1">إجمالي الخزائن (لم يتم توريده)</p><h2 className="text-3xl font-black">{totalPending} EGP</h2></div>
                        <button type="button" onClick={() => onAdd(selectedBranch === 'all' ? '' : selectedBranch)} className="bg-white text-gold-600 px-5 py-2.5 rounded-xl text-xs font-black shadow-lg">+ حساب اليوم</button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        {shown.map(b => {
                            const mine = pending.filter(p => p.branchId === b.id);
                            const bal = mine.reduce((s, p) => s + num(p.amount), 0);
                            const delivered = payments.filter(p => p.branchId === b.id && p.delivered && !p.zeroed).reduce((s, p) => s + num(p.amount), 0);
                            return (
                                <div key={b.id} className="bg-white p-4 rounded-[20px] border border-gray-100 shadow-sm">
                                    <div className="flex justify-between items-start mb-2">
                                        <h4 className="font-black text-sm text-gray-800">{b.name}</h4>
                                        <button type="button" onClick={() => onAdd(b.id)} className="text-[10px] font-black bg-gold-50 text-gold-600 border border-gold-200 px-2 py-1 rounded-lg">+ حساب اليوم</button>
                                    </div>
                                    <p className="text-[9px] text-gray-400 font-bold">في الخزنة ({mine.length} تسجيل)</p>
                                    <p className="text-2xl font-black text-gray-800 mb-1">{bal} ج</p>
                                    <p className="text-[9px] text-gray-400 font-bold mb-3">تم توريده سابقاً: {delivered} ج</p>
                                    <div className="flex gap-2">
                                        <button type="button" disabled={mine.length === 0} onClick={() => settle(b, false)} className="flex-1 py-2 rounded-lg text-[10px] font-black bg-emerald-500 text-white disabled:opacity-30">✅ تم التوريد</button>
                                        <button type="button" disabled={mine.length === 0} onClick={() => settle(b, true)} className="py-2 px-3 rounded-lg text-[10px] font-black bg-gray-100 text-gray-600 disabled:opacity-30">تصفير</button>
                                    </div>
                                </div>
                            );
                        })}

                    <div className="bg-white p-3 rounded-[20px] border border-gray-100 shadow-sm space-y-2">
                        <h4 className="text-xs font-black text-gray-800 px-1">سجل الحسابات اليومية</h4>

                                        db.collection('payments').doc(p.id).delete().then(() => showToast("تم الحذف")).catch(err => showToast("مشكلة في الحذف: " + err.message));
                                    }})} className="p-1 text-red-500 bg-white border border-gray-200 rounded-lg"><IconTrash/></button>
                                </div>
                                <div className="mt-2">
                                    <div className="flex items-center gap-2 mb-1 flex-wrap">

                                </div>
                                <div className="text-emerald-500 font-black text-base mr-12">+{p.amount} ج</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- توريد اليوم (للسكرتارية): يشوفوا ويعدلوا اللي ضافوه النهاردة بس ---
        function DailyView({ payments, branches, currentUser, onConfirm, onAdd, onEdit, showToast }) {
            const [, tick] = useState(0);
            useEffect(() => { const t = setInterval(() => tick(v => v + 1), 30000); return () => clearInterval(t); }, []);
            const today = localDay();
            const mine = payments.filter(p => p.createdDay === today && (p.recordedById ? p.recordedById === currentUser.id : p.recordedBy === currentUser.name)).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
            const total = mine.reduce((s, p) => s + Number(p.amount || 0), 0);
            const guard = (fn) => { if (localDay() !== today) { showToast('انتهى اليوم — مينفعش التعديل'); return; } fn(); };
            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="bg-gradient-to-r from-gold-600 to-gold-400 p-6 rounded-[20px] text-white shadow-xl flex flex-wrap justify-between items-center gap-4">
                        <div><p className="text-gold-100 text-[10px] font-bold mb-1">توريد اليوم ({mine.length} تسجيل)</p><h2 className="text-3xl font-black">{total} EGP</h2></div>
                        <button type="button" onClick={onAdd} className="bg-white text-gold-600 px-5 py-2.5 rounded-xl text-xs font-black shadow-lg">+ إضافة توريد</button>
                    </div>
                    <div className="bg-white p-3 rounded-[20px] border border-gray-100 shadow-sm space-y-2">
                        <p className="text-[10px] text-gray-400 font-bold px-1">بتشوفي هنا اللي ضفتيه النهاردة بس، وبيختفي تلقائياً بعد نهاية اليوم.</p>
                        {mine.length === 0 && <p className="text-gray-400 text-xs font-bold text-center p-4">لا يوجد توريد مسجل اليوم.</p>}
                        {mine.map(p => (
                            <div key={p.id} className="flex justify-between items-center p-4 bg-gray-50 rounded-xl relative">
                                <div className="absolute left-2 top-2 flex gap-1">
                                    <button type="button" onClick={() => guard(() => onEdit(p))} className="p-1 text-gold-500 bg-white border border-gray-200 rounded-lg"><IconEdit/></button>
                                    <button type="button" onClick={() => guard(() => onConfirm({ msg: 'حذف هذا التوريد؟', onConfirm: () => { if (localDay() !== today) { showToast('انتهى اليوم — مينفعش الحذف'); return; } db.collection('payments').doc(p.id).delete().then(() => showToast('تم الحذف')).catch(err => showToast('مشكلة في الحذف: ' + err.message)); } }))} className="p-1 text-red-500 bg-white border border-gray-200 rounded-lg"><IconTrash/></button>
                                </div>
                                <div className="mt-2">
                                    <p className="font-black text-xs text-gray-800">فرع {branches.find(b => b.id === p.branchId)?.name || 'غير معروف'}</p>
                                    {p.paymentMethod && <span className="bg-gray-200 text-gray-600 text-[8px] px-1.5 py-0.5 rounded font-bold">{p.paymentMethod}</span>}
                                </div>
                                <div className="text-emerald-500 font-black text-base mr-12">{p.amount} ج</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

                                        <div className="grid grid-cols-2 gap-2">
                                            <Input name="username" label="اسم المستخدم" defaultValue={modal.data?.username} dir="ltr" autoCapitalize="none" autoComplete="off" required />
                                            <Input name="password" label="كلمة السر (4+ حروف)" defaultValue={modal.data?.password} dir="ltr" autoComplete="new-password" required />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الوظيفة</label>
                                            <select name="jobTitle" value={jobTitle} onChange={(e) => setJobTitle(e.target.value)} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                <option value="سكرتارية">سكرتارية</option>
                                                <option value="مساعد تمريض">مساعد تمريض</option>
                                                <option value="طبيب">طبيب (يشوف حجوزاته فقط)</option>
                                            </select>
                                        </div>
                                        {jobTitle === 'طبيب' ? (
                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">تخصصات الطبيب (بيظهر للمرضى في الحجز حسب الخدمة اللي اختاروها)</label>
                                                {specialties.length === 0 ? <p className="text-[10px] font-bold text-amber-600 bg-amber-50 rounded-lg p-2">مفيش تخصصات لسه — ضيفيها من "الخدمات والأسعار".</p> :
                                                <div className="flex flex-wrap gap-1.5 pb-2">{specialties.map(sp => { const on = docSpecs.includes(sp.id); return <button key={sp.id} type="button" onClick={() => setDocSpecs(v => on ? v.filter(x => x !== sp.id) : [...v, sp.id])} className={`px-2.5 py-1.5 rounded-lg text-[11px] font-black border ${on ? 'bg-gold-500 text-white border-gold-500' : 'bg-white text-gray-600 border-gray-200'}`}>{on ? '✓ ' : ''}{sp.name}</button>; })}</div>}
                                                <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">فروع الطبيب وأيام شغله في كل فرع</label>
                                                <p className="text-[10px] text-gray-400 font-bold">الأيام دي مش بتظهر للمرضى. لو المريض اختار يوم مش من أيامه، بيظهرله إن الدكتور مش متاح. لو مختارتيش أيام = متاح كل الأيام.</p>
                                                <div className="space-y-2">
                                                    {branches.map(b => { const on = docBr.includes(b.id); return (
                                                        <div key={b.id} className={`p-2.5 border rounded-xl ${on ? 'bg-gold-50/40 border-gold-200' : 'bg-gray-50 border-gray-100'}`}>
                                                            <label className="flex items-center gap-2 text-xs font-black cursor-pointer">
                                                                <input type="checkbox" checked={on} onChange={() => setDocBr(v => on ? v.filter(x => x !== b.id) : [...v, b.id])} className="w-4 h-4 accent-yellow-600" />
                                                                {b.name}
                                                            </label>
                                                            {on && <div className="flex flex-wrap gap-1.5 mt-2">{DAY_ORDER.map(dy => { const sel = (docSched[b.id] || []).includes(dy); return (
                                                                <button key={dy} type="button" onClick={() => toggleDay(b.id, dy)} className={`px-2.5 py-1.5 rounded-lg text-[10px] font-black border ${sel ? 'bg-gold-500 text-white border-gold-500' : 'bg-white text-gray-600 border-gray-200'}`}>{DAY_NAMES[dy]}</button>); })}</div>}
                                                        </div>); })}
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الصلاحية</label>
                                                <select name="bId" defaultValue={modal.data?.role === 'doctor' ? 'all' : (modal.data?.branchId || 'all')} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                    <option value="all">مدير عام (جميع الفروع)</option>
                                                    {branches.map(b=><option key={b.id} value={b.id}>موظف فرع: {b.name}</option>)}
                                                </select>
                                            </div>
                                        )}
                                    </>
                                )}
                                {modal.type==='branch' && (
                                    <>
                                        <Input name="name" label="اسم الفرع" defaultValue={modal.data?.name} required />
                                        <Input name="phone" label="تليفون الفرع" defaultValue={modal.data?.phone} required />
                                        <Input name="address" label="العنوان التفصيلي" defaultValue={modal.data?.address} placeholder="مثال: شارع مصطفى النحاس، المنيا" />
                                        <Input name="mapsLink" label="رابط جوجل مابس (Google Maps)" defaultValue={modal.data?.mapsLink} placeholder="https://maps.app.goo.gl/..." dir="ltr" />
                                        <Input name="reviewLink" label="رابط تقييم جوجل (لرسالة التقييم)" defaultValue={modal.data?.reviewLink} placeholder="https://g.page/r/..." dir="ltr" />
                                        <p className="text-[10px] font-black text-gray-500 pt-2 border-t border-gray-100">بيانات بتظهر للمريض في صفحة الحجز</p>
                                        <Input name="hours" label="مواعيد العمل" defaultValue={modal.data?.hours} placeholder="مثال: يومياً من 4 م لـ 10 م — الجمعة إجازة" />
                                        <div className="grid grid-cols-2 gap-2">
                                            <Input name="waitTime" label="مدة الانتظار المتوقعة" defaultValue={modal.data?.waitTime} placeholder="مثال: 10–15 دقيقة" />
                                            <Input name="consultFee" label="سعر الكشف" defaultValue={modal.data?.consultFee} placeholder="مثال: 200 ج" />
                                        </div>
                                        <Input name="mapEmbed" label="الخريطة: كود التضمين من جوجل مابس أو اسم المكان" defaultValue={modal.data?.mapEmbed} placeholder='<iframe src="https://www.google.com/maps/embed?...' dir="ltr" />
                                        <p className="text-[9px] text-gray-400 font-bold leading-relaxed">من جوجل مابس: افتحي مكان الفرع ← مشاركة (Share) ← تضمين خريطة (Embed a map) ← نسخ HTML والصقيه هنا. لو سبتيه فاضي هيستخدم العنوان.</p>
                                    </>
                                )}
                                <button type="submit" className="w-full py-4 mt-6 bg-gold-500 text-white rounded-xl font-black shadow-lg hover:bg-gold-600 transition-colors text-sm">حفظ التغييرات</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        function Input({ label, ...props }) {
            return (
                <div className="space-y-1">
                    <label className="text-[9px] font-black text-gray-500 uppercase tracking-widest block">{label}</label>
                    <input {...props} className="w-full bg-gray-50 border border-gray-100 focus:border-gold-500 p-3 rounded-xl outline-none font-bold text-gray-800 text-xs shadow-inner transition-colors" />
                </div>
            );
        }

        function Toast({ msg, onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);
            return (
                <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[999999] bg-gray-900 text-white px-5 py-3 rounded-2xl shadow-2xl animate-slide-up flex items-center gap-3 border border-gray-700">
                    <IconCheck />
                    <span className="font-bold text-xs">{msg}</span>
                    <button type="button" onClick={onClose} className="text-gray-400 hover:text-white p-1"><IconX /></button>
                </div>
            );
        }

        // لو حصل خطأ في الشاشة: بدل الصفحة البيضا بتظهر رسالة فيها الخطأ وزرار إعادة تحميل
        class AppErrorBoundary extends React.Component {
            constructor(p) { super(p); this.state = { err: null }; }
            static getDerivedStateFromError(err) { return { err }; }
            componentDidCatch(err, info) { console.error('App crash:', err, info && info.componentStack); }
            render() {
                if (!this.state.err) return this.props.children;
                const msg = String((this.state.err && (this.state.err.stack || this.state.err.message)) || this.state.err).split('\n').slice(0, 3).join('\n');
                return (
                    <div className="h-screen bg-[#050505] flex items-center justify-center p-6 text-center">
                        <div className="max-w-md w-full bg-[#111] border border-white/10 rounded-3xl p-6 space-y-4">
                            <p className="text-white font-black">حصلت مشكلة في عرض الصفحة</p>
                            <p className="text-gray-400 text-xs font-bold">صوّري الرسالة دي وابعتيها، وجربي إعادة التحميل.</p>
                            <pre dir="ltr" className="text-left text-[10px] text-red-300 bg-black/60 rounded-xl p-3 whitespace-pre-wrap break-all max-h-40 overflow-auto">{msg}</pre>
                            <div className="flex gap-2"><button type="button" onClick={() => window.location.reload()} className="flex-1 bg-gold-500 text-black py-2.5 rounded-xl font-black text-sm">إعادة تحميل</button>
                                <button type="button" onClick={() => { try { auth.signOut(); } catch (e) {} setTimeout(() => window.location.reload(), 300); }} className="flex-1 bg-white/10 text-white py-2.5 rounded-xl font-black text-sm">خروج</button></div>
                        </div>
                    </div>
                );
            }
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
    </script>
</body>
</html>
