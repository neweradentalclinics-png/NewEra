        function AppointmentsView({ focusIds, apps, branches, currentUser, selectedBranch, onConfirm, onAdd, onEdit, onNav, showToast }) {
            const [viewMode, setViewMode] = useState('daily'); 
            const [selectedDate, setSelectedDate] = useState(localDay());
            useEffect(() => { if (!focusIds || !focusIds.length) return; const a = apps.find(x => focusIds.includes(x.id)); if (a && a.date) { setSelectedDate(a.date); setViewMode('daily'); } setTimeout(() => document.getElementById('app-' + (a ? a.id : ''))?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 350); }, [focusIds]);

            // أي يوم/أسبوع/شهر بيتفتح في التقويم بيتحمّل لو مش محمّل
            useEffect(() => {
                let from = selectedDate, to = selectedDate;
                if (viewMode === 'weekly') to = dayShift(selectedDate, 6);
                if (viewMode === 'monthly') { from = selectedDate.slice(0, 7) + '-01'; const d = new Date(from + 'T00:00:00'); d.setMonth(d.getMonth() + 1); to = dayShift(d.toLocaleDateString('en-CA'), -1); }
                WIN.need('appointments', from, to);
            }, [selectedDate, viewMode]);
            // البحث في كل الحجوزات (القديمة والبعيدة) بالاسم أو الموبايل
            const [aq, setAq] = useState(''), [aRes, setARes] = useState(null);
            const searchApps = () => {
                const t = aq.trim(); if (t.length < 2) return;
                setARes('...');
                const col = db.collection('appointments'), qs = [col.orderBy('patientName').startAt(t).endAt(t + '\uf8ff').limit(40), col.where('phone', '==', t)];
                Promise.all(qs.map(q => q.get().catch(() => ({ docs: [] })))).then(rs => { const m = new Map(); rs.forEach(r => r.docs.forEach(x => m.set(x.id, { id: x.id, ...x.data() }))); setARes([...m.values()].filter(a => selectedBranch === 'all' || a.branchId === selectedBranch).sort((a, b) => (b.date || '').localeCompare(a.date || ''))); });
            };
            const filteredApps = useMemo(() => {
                let list = apps.filter(a => selectedBranch === 'all' || a.branchId === selectedBranch);
                list.sort((a, b) => {
                    const dA = a.date || ""; const dB = b.date || "";
                    if (dA !== dB) return dA.localeCompare(dB);
                    const tA = a.time || ""; const tB = b.time || "";
                    return tA.localeCompare(tB);
                });
                return list;
            }, [apps, selectedBranch]);

            const dailyApps = useMemo(() => filteredApps.filter(a => a.date === selectedDate), [filteredApps, selectedDate]);

            const groupedByBranchDaily = useMemo(() => {
                if (selectedBranch !== 'all') return { [selectedBranch]: dailyApps };
                const groups = {};
                dailyApps.forEach(a => {
                    const bId = a.branchId || 'unknown';
                    if (!groups[bId]) groups[bId] = [];
                    groups[bId].push(a);
                });
                return groups;
            }, [dailyApps, selectedBranch]);

            const weeklyDays = useMemo(() => {
                const days = [];
                for(let i=0; i<7; i++) {
                    const d = new Date(selectedDate);
                    d.setDate(d.getDate() + i);
                    const dStr = d.toISOString().split('T')[0];
                    const dayName = new Intl.DateTimeFormat('ar-EG', { weekday: 'long' }).format(d);
                    const dayApps = filteredApps.filter(a => a.date === dStr);
                    days.push({ date: dStr, dayName, apps: dayApps });
                }
                return days;
            }, [filteredApps, selectedDate]);

            const renderCalendar = () => {
                const date = new Date(selectedDate);
                const year = date.getFullYear(); const month = date.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const calendarDays = [];
                for (let i = 0; i < firstDay; i++) calendarDays.push({ empty: true });
                for (let i = 1; i <= daysInMonth; i++) {
                    const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                    const count = apps.filter(a => a.date === dStr && (selectedBranch === 'all' || a.branchId === selectedBranch)).length;
                    calendarDays.push({ d: i, date: dStr, count });
                }
                return (
                    <div className="bg-white rounded-[20px] border border-gray-100 shadow-sm overflow-hidden animate-slide-up mt-4">
                        <div className="grid grid-cols-7 bg-gray-50 border-b border-gray-100 text-center py-2 text-[9px] font-black text-gray-500">
                            <div>أحد</div><div>إثنين</div><div>ثلاثاء</div><div>أربعاء</div><div>خميس</div><div>جمعة</div><div>سبت</div>
                        </div>
                        <div className="calendar-grid">
                            {calendarDays.map((item, idx) => item.empty ? <div key={idx} className="calendar-cell bg-gray-50 opacity-30"></div> : (
                                <div key={idx} 
                                    onClick={() => { setSelectedDate(item.date); setViewMode('daily'); }}
                                    className={`calendar-cell ${item.date === selectedDate ? 'today' : ''}`}
                                >
                                    <span className="text-xs font-bold">{item.d}</span>
                                    {item.count > 0 && <span className="text-[8px] font-black text-gold-600 mt-1 bg-gold-50 px-1.5 rounded">{item.count} حجز</span>}
                                    {item.count > 0 && <span className="dot"></span>}
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-3">
                        <h3 className="text-lg font-black text-gray-800">إدارة المواعيد</h3>
                        <div className="flex bg-gray-100 p-1 rounded-xl w-full lg:w-auto">
                            <button type="button" onClick={() => setViewMode('daily')} className={`flex-1 px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode==='daily' ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>يومي</button>
                            <button type="button" onClick={() => setViewMode('weekly')} className={`flex-1 px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode==='weekly' ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>أسبوعي</button>
                            <button type="button" onClick={() => setViewMode('monthly')} className={`flex-1 px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode==='monthly' ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>شهري</button>
                        </div>
                        <input type="date" value={selectedDate} onChange={(e)=>setSelectedDate(e.target.value)} className="w-full lg:w-auto bg-white border border-gray-200 text-xs font-bold p-2 rounded-xl outline-none focus:border-gold-500"/>
                        
                        <div className="flex gap-2 w-full lg:w-auto">
                            {currentUser.role !== 'doctor' && <button type="button" onClick={onAdd} className="w-full lg:w-auto bg-gold-500 text-white px-5 py-2 rounded-xl text-xs font-black shadow-md hover:bg-gold-600 transition-colors">+ حجز</button>}
                        </div>
                    </div>

                    {currentUser.role !== 'doctor' && <div className="space-y-2">
                        <div className="flex gap-2"><input value={aq} onChange={e => { setAq(e.target.value); if (!e.target.value) setARes(null); }} onKeyDown={e => { if (e.key === 'Enter') searchApps(); }} placeholder="🔎 دوّر على حجز في كل الأيام (أول الاسم أو الموبايل كامل)" className="flex-1 bg-white border border-gray-200 focus:border-gold-500 p-2.5 rounded-xl text-xs font-bold outline-none" />
                            <button type="button" onClick={searchApps} className="bg-gray-800 text-white px-4 rounded-xl text-xs font-black">بحث</button></div>
                        {aRes === '...' && <p className="text-[11px] font-bold text-gray-400">بيدوّر...</p>}
                        {Array.isArray(aRes) && <div className="bg-white border border-gray-100 rounded-xl p-2 space-y-1 max-h-64 overflow-y-auto">
                            {!aRes.length && <p className="text-[11px] font-bold text-gray-400 p-1">مفيش نتايج.</p>}
                            {aRes.map(a => <button type="button" key={a.id} onClick={() => { setSelectedDate(a.date); setViewMode('daily'); setARes(null); setTimeout(() => document.getElementById('app-' + a.id)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 900); }} className="w-full flex items-center justify-between gap-2 text-start p-2 rounded-lg hover:bg-gold-50 text-[11px] font-bold">
                                <span className="truncate">{a.patientName} <span className="text-gray-400" dir="ltr">{a.phone}</span></span><span className="shrink-0 text-gray-500">{a.date} {a.time || ''} • {bLabel(branches, a.branchId)}{a.status === 'canceled' ? ' • كنسل' : ''}</span></button>)}
                        </div>}
                    </div>}

                    {viewMode === 'daily' && (
                        <div className="animate-slide-up">
                            {Object.keys(groupedByBranchDaily).length === 0 ? (
                                <div className="p-8 text-center text-gray-400 font-bold border border-dashed rounded-3xl bg-white text-sm">لا توجد مواعيد في هذا اليوم.</div>
                            ) : (
                                Object.entries(groupedByBranchDaily).map(([bId, bApps]) => {
                                    if(bApps.length === 0) return null;
                                    const bName = branches.find(b=>b.id===bId)?.name || 'العيادة';
                                    return (
                                        <div key={bId} className="mb-4">
                                            {selectedBranch === 'all' && (
                                                <div className="flex items-center gap-3 mb-4 mt-2">
                                                    <span className="text-xs font-black bg-gradient-to-r from-gold-500 to-gold-600 text-white px-4 py-1.5 rounded-lg shadow-md border border-gold-400">فرع {bName}</span>
                                                    <div className="h-0.5 bg-gradient-to-l from-gold-200 to-transparent flex-1 rounded-full"></div>
                                                </div>
                                            )}
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
                                                {bApps.map(a => (
                                                    <div key={a.id} id={'app-' + a.id} className={`bg-white p-2.5 rounded-xl border ${focusIds?.includes(a.id) ? 'border-gold-500 ring-2 ring-gold-400' : 'border-gray-100'} flex flex-col sm:flex-row sm:items-center justify-between gap-2 hover:bg-gray-50 transition-colors shadow-sm`}>
                                                        <div className="flex items-center gap-2 min-w-0">
                                                            <div className="bg-gold-50 text-gold-700 px-2 py-1 rounded-lg text-[10px] font-black shrink-0 tracking-widest">{a.time || '00:00'}</div>
                                                            <div className="min-w-0">
                                                                <h5 className="font-black text-gray-800 text-xs truncate leading-tight mb-0.5">{a.patientName}</h5>
                                                                <div className="flex flex-wrap items-center gap-1.5">
                                                                    <span className="text-[9px] font-mono font-bold text-gray-500 tracking-wider" dir="ltr">{a.phone || 'بدون رقم'}</span>
                                                                    {a.service && <span className="text-[8px] bg-blue-50 text-blue-600 px-1.5 rounded font-bold">{a.service}</span>}
                                                                    {a.estimate && <span className="text-[8px] bg-amber-50 text-amber-700 px-1.5 rounded font-bold">💳 {a.estimate}</span>}
                                                                    {a.extra && Object.entries(a.extra).map(([k, v]) => <span key={k} className="text-[8px] bg-gray-100 text-gray-600 px-1.5 rounded font-bold">{k}: {String(v)}</span>)}
                                                                    {a.doctorName && <span className="text-[8px] bg-purple-50 text-purple-600 px-1.5 rounded font-bold">د. {a.doctorName}</span>}
                                                                    {a.needsSchedule && <span className="text-[8px] bg-red-100 text-red-700 px-1.5 rounded font-black animate-pulse" title="المريض حجز يوم مفيهوش دكتور فاضي — كلّميه وظبطي الميعاد (أو اختاري دكتور من تعديل الحجز)">⚠️ الميعاد مش متظبط — كلّميه</span>}
                                                                    {a.needsSchedule && currentUser.role !== 'doctor' && <button type="button" onClick={() => db.collection('appointments').doc(a.id).update({ needsSchedule: false, scheduledBy: currentUser.name, scheduledAt: new Date().toISOString() }).then(() => showToast('تمام — اتعلّم إنه اتظبط')).catch(e => showToast('مشكلة: ' + e.message))} className="text-[8px] bg-green-50 text-green-700 border border-green-200 px-1.5 rounded font-black">✓ اتظبط</button>}
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div className="flex gap-1 shrink-0 self-end sm:self-auto items-center"><StatusSelect a={a} showToast={showToast} />{(() => { const br = branches.find(b => b.id === a.branchId) || {}; return (<>{tplOn('reminder') && <WaMsg phone={a.phone} label="تذكير" text={fillT('reminder', { name: a.patientName, branch: br.name || '', date: a.date, time: a.time || '' })} />}{tplOn('review') && (a.status === 'done' || a.status === 'arrived') && <WaMsg phone={a.phone} label={a.reviewSent ? 'تقييم ✓' : 'تقييم'} text={fillT('review', { name: a.patientName, branch: br.name || '', link: br.reviewLink || br.mapsLink || '' })} />}</>); })()}{currentUser.role !== 'doctor' && (<>
                                                            <button type="button" onClick={()=>onEdit(a)} className="p-1.5 bg-white border border-gray-200 text-gold-500 rounded-lg hover:bg-gold-500 hover:text-white transition-colors"><IconEdit/></button>
                                                            <button type="button" onClick={()=>onConfirm({msg:'إلغاء الموعد نهائياً؟', onConfirm:()=>{
                                                                trashDelete('appointments', a.id)
                                                                .then(() => showToast("تم إلغاء الموعد"))
                                                                .catch(err => showToast("مشكلة في حذف الموعد: " + err.message)); 
                                                            }})} className="p-1.5 bg-white border border-gray-200 text-red-500 rounded-lg hover:bg-red-500 hover:text-white transition-colors"><IconTrash/></button>
                                                        </>)}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )
                                })
                            )}
                        </div>
                    )}

                    {viewMode === 'weekly' && (
                        <div className="bg-white rounded-[20px] border border-gray-100 shadow-sm overflow-hidden animate-slide-up">
                            <div className="divide-y divide-gray-50">
                                {weeklyDays.map((day, idx) => (
                                    <div key={idx} onClick={() => { setSelectedDate(day.date); setViewMode('daily'); }} className="flex flex-col sm:flex-row sm:items-center justify-between p-4 hover:bg-gray-50 cursor-pointer transition-colors group">
                                        <div className="flex items-center gap-4 mb-2 sm:mb-0">
                                            <div className={`w-12 h-12 rounded-xl flex flex-col items-center justify-center border-2 ${day.date === localDay() ? 'bg-gold-50 border-gold-400 text-gold-700' : 'bg-white border-gray-100 text-gray-500 group-hover:border-gold-200'}`}>
                                                <span className="text-xs font-black">{day.date.split('-')[2]}</span>
                                            </div>
                                            <div>
                                                <h4 className="font-black text-gray-800 text-sm">{day.dayName}</h4>
                                                <p className="text-[10px] text-gray-400 font-mono">{day.date}</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            {day.apps.length > 0 ? (
                                                <div className="flex items-center gap-2 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100">
                                                    <span className="text-xs font-black text-blue-600">{day.apps.length} مواعيد</span>
                                                    <div className="flex -space-x-1.5 rtl:space-x-reverse">
                                                        {day.apps.slice(0,4).map((a,i) => <div key={i} className="w-5 h-5 rounded-full bg-white border border-blue-200 flex items-center justify-center text-[8px] font-bold text-blue-500 shadow-sm">{a.patientName.charAt(0)}</div>)}
                                                        {day.apps.length > 4 && <div className="w-5 h-5 rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center text-[8px] font-bold text-gray-500">+{day.apps.length-4}</div>}
                                                    </div>
                                                </div>
                                            ) : (
                                                <span className="text-[10px] text-gray-400 font-bold bg-gray-50 px-3 py-1 rounded-lg">لا يوجد حجز</span>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {viewMode === 'monthly' && renderCalendar()}
                </div>
            );
        }

        function BranchesView({ branches, onConfirm, onAdd, onEdit, showToast }) {
            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="flex justify-between items-center"><h3 className="text-lg font-black text-gray-800">إدارة الفروع</h3><button type="button" onClick={onAdd} className="bg-gold-500 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow-md hover:bg-gold-600">+ فرع جديد</button></div>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                        {branches.map(b => (
                            <div key={b.id} className="bg-white p-4 rounded-[20px] border border-gray-100 shadow-sm relative group flex flex-col h-full">
                                <div className="absolute top-2 left-2 flex gap-1">
                                    <button type="button" onClick={() => onEdit(b)} className="p-1.5 text-gold-500 bg-white border border-gray-200 rounded-lg hover:bg-gold-500 hover:text-white transition-colors"><IconEdit/></button>
                                    <button type="button" onClick={() => onConfirm({msg:'حذف الفرع؟', onConfirm:()=>{
                                        trashDelete('branches', b.id)
                                        .then(() => showToast("تم حذف الفرع"))
                                        .catch(err => showToast("مشكلة في الحذف: " + err.message)); 
                                    }})} className="p-1.5 text-red-500 bg-white border border-gray-200 rounded-lg hover:bg-red-500 hover:text-white transition-colors"><IconTrash/></button>
                                </div>
                                <div className="text-gold-500 mb-2 bg-gray-50 w-10 h-10 rounded-xl flex items-center justify-center"><IconBuilding/></div>
                                <h4 className="text-sm font-black text-gray-800 mb-0.5">{b.name}</h4>
                                <p className="text-[10px] font-bold text-gray-500 mb-1">{b.phone}</p>
                                {b.address && <p className="text-[9px] text-gray-400 mb-2 truncate" title={b.address}>{b.address}</p>}
                                
                                {b.mapsLink && (
                                    <a href={b.mapsLink} target="_blank" rel="noreferrer" className="inline-flex w-fit items-center gap-1 text-[9px] font-bold bg-blue-50 text-blue-600 px-2 py-1 rounded-lg hover:bg-blue-100 transition-colors mt-auto border border-blue-100">
                                        <IconMapPin /> عرض على الخريطة
                                    </a>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- سجل المرضى الجديد بتصميم الكروت للموبايل ---
        // "اعرض فترة أقدم": بيحمّل الشهر اللي تختاريه وكل اللي بعده (لحد ما السيستم يتقفل)
        function OlderLoader({ col, what = 'البيانات' }) {
            const [m, setM] = useState('');
            const from = WIN.from(col);
            return (
                <div className="flex flex-wrap items-center gap-2 text-[11px] font-bold text-gray-500 bg-gray-50 border border-dashed border-gray-200 rounded-xl px-3 py-2">
                    <span>📂 معروض {what} من {from} — لو محتاجة أقدم:</span>
                    <input type="month" value={m} onChange={e => setM(e.target.value)} className="bg-white border border-gray-200 rounded-lg px-2 py-1 text-[11px] font-bold outline-none" />
                    <button type="button" disabled={!m} onClick={() => WIN.need(col, m + '-01')} className="bg-gray-800 text-white px-3 py-1 rounded-lg text-[11px] font-black disabled:opacity-30">حمّل من الشهر ده</button>
                </div>
            );
        }

        function PatientsView({ staff = [], focusId, patients, branches, currentUser, onConfirm, onAdd, onEdit, showToast }) {
            const t = localDay();
            const upd = (p, d, m) => db.collection('patients').doc(p.id).update({ ...d, updatedAt: new Date().toISOString() }).then(() => showToast(m)).catch(e => showToast(e.message));
            const isDoc = currentUser.role === 'doctor';
            useEffect(() => { if (focusId) setTimeout(() => document.getElementById('pat-' + focusId)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 200); }, [focusId]);
            const [q, setQ] = useState('');
            useEffect(() => { WIN.search(q); }, [q]);
            useEffect(() => () => WIN.search(''), []);
            const qn = q.trim(), dig = qn.replace(/\D/g, '');
            const match = p => !qn || (p.name || '').includes(qn) || (dig.length >= 3 && String(p.phone || '').replace(/\D/g, '').includes(dig)) || String(p.fileNo || '') === qn;
            const sorted = patients.filter(match).sort((a, b) => ((a.followUpDate && !a.followedAt) ? a.followUpDate : '9') .localeCompare((b.followUpDate && !b.followedAt) ? b.followUpDate : '9'));
            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="flex justify-between items-center">
                        <h3 className="text-lg font-black text-gray-800">سجل المرضى</h3>
                        {!isDoc && <button type="button" onClick={onAdd} className="bg-gold-500 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow-md hover:bg-gold-600">+ مريض جديد</button>}
                    </div>
                    <div className="space-y-1">
                        <input value={q} onChange={e => setQ(e.target.value)} placeholder="🔎 دوّر باسم المريض أو رقمه أو رقم الملف (بيدوّر في كل المرضى)" className="w-full bg-white border border-gray-200 focus:border-gold-500 p-3 rounded-xl text-xs font-bold outline-none" />
                        {!isDoc && <p className="text-[10px] font-bold text-gray-400 px-1">{qn ? 'النتايج من كل السجل (الاسم بيدوّر من أوله).' : 'معروض المرضى اللي ملفهم اتسجل أو اتعدل آخر ' + WIN_BACK + ' يوم + اللي ليهم متابعة قريبة. أي مريض أقدم دوّري عليه بالبحث.'}</p>}
                    </div>
                    <BranchGroups items={sorted} branches={branches} empty={qn ? 'مفيش نتايج — جربي جزء من أول الاسم أو الرقم كامل.' : 'لا يوجد مرضى مسجلين حتى الآن.'} sub={arr => '• يحتاج متابعة: ' + arr.filter(p => p.followUpDate && !p.followedAt && p.followUpDate <= t).length} render={p => {
                        const due = p.followUpDate && !p.followedAt && p.followUpDate <= t;
                        const bn = bLabel(branches, p.branchId);
                        return (
                        <div key={p.id} id={'pat-' + p.id} className={`bg-white p-4 rounded-[20px] border shadow-sm relative ${focusId === p.id ? 'border-gold-500 ring-2 ring-gold-400' : due ? 'border-amber-300' : 'border-gray-100'}`}>
                            {!isDoc && <div className="absolute top-4 left-4 flex gap-1.5">
                                <button type="button" onClick={() => onEdit(p)} className="p-1.5 text-gold-500 bg-gray-50 rounded-lg"><IconEdit/></button>
                                <button type="button" onClick={() => onConfirm({msg:'حذف ملف المريض؟ (هيتنقل لسلة المحذوفات ويفضل ' + TRASH_DAYS + ' يوم)', onConfirm:()=>trashDelete('patients', p.id).then(() => showToast("تم حذف ملف المريض")).catch(err => showToast("مشكلة في الحذف: " + err.message))})} className="p-1.5 text-red-500 bg-red-50 rounded-lg"><IconTrash/></button>
                            </div>}
                            <div className="flex items-start gap-3 mb-3">
                                <div className="w-12 h-12 rounded-xl bg-gold-50 text-gold-600 flex items-center justify-center font-black text-sm border border-gold-100 shrink-0">#{p.fileNo || '-'}</div>
                                <div className="pt-1"><h4 className="font-black text-gray-800 text-sm mb-0.5">{p.name}</h4><p className="text-[10px] text-gray-500 font-mono tracking-wider" dir="ltr">{p.phone}</p></div>
                            </div>
                            <div className="space-y-1 bg-gray-50 p-3 rounded-xl border border-gray-100 text-xs font-bold text-gray-700">
                                <p>📍 {p.address || 'غير مسجل'}</p>
                                <div className="flex flex-wrap gap-1">{(p.services && p.services.length ? p.services : [p.service || 'غير محدد']).map(x => <span key={x} className="text-[10px] font-black text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded">{x}</span>)}</div>
                                {p.lastEvent && <p className="text-[10px] font-black text-red-600 bg-red-50 rounded px-1.5 py-0.5 inline-block">⚠️ {p.lastEvent}</p>}
                                {p.doctorId && <p className="text-[10px] text-gray-500">👨‍⚕️ د. {staff.find(x => x.id === p.doctorId)?.name || ''}</p>}
                            </div>
                            {p.followUpDate && (
                                <div className="mt-3 space-y-2">
                                    <p className={`text-[10px] font-black px-2 py-1 rounded-lg inline-block ${p.followedAt ? 'bg-emerald-100 text-emerald-700' : due ? 'bg-amber-100 text-amber-700' : 'bg-gray-100 text-gray-600'}`}>{p.followedAt ? '✓ تمت المتابعة' : (due ? '📞 حان موعد المتابعة' : 'متابعة: ' + p.followUpDate)}</p>
                                    {!p.followedAt && <div className="flex gap-1.5 flex-wrap">
                                        {tplOn('followup') && <WaMsg phone={p.phone} label="واتساب متابعة" text={fillT('followup', { name: p.name, branch: bn, service: svcText(p) })} />}

        // سلة المحذوفات (للأدمن): ترجيع أو مسح نهائي. اللي عدّى عليه 30 يوم بيتمسح لوحده
        function TrashView({ showToast, branches = [] }) {
            const [items, setItems] = useState(null);
            const [f, setF] = useState('all');
            useEffect(() => db.collection('trash').orderBy('deletedAt', 'desc').limit(500).onSnapshot(s => setItems(s.docs.map(x => ({ id: x.id, ...x.data() }))), e => { showToast(e.message); setItems([]); }), []);
            // تنظيف: اللي عدّى عليه أكتر من 30 يوم
            useEffect(() => { if (!items) return; const cut = new Date(Date.now() - TRASH_DAYS * 864e5).toISOString(); const old = items.filter(t => (t.deletedAt || '') < cut).slice(0, 400); if (!old.length) return; const b = db.batch(); old.forEach(t => b.delete(db.collection('trash').doc(t.id))); b.commit().catch(() => {}); }, [items]);
            if (!items) return <p className="text-xs font-bold text-gray-400">...</p>;

            };

                            <p className="text-[10px] font-bold text-gray-400">اتمسح {new Date(t.deletedAt).toLocaleString('ar-EG', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })}{t.deletedBy ? ' بواسطة ' + t.deletedBy : ''}{t.branchId && t.branchId !== 'all' ? ' • ' + bLabel(branches, t.branchId) : ''} • باقي {left(t)} يوم</p>

        // ===== النسخ الاحتياطي (السوبر أدمن بس) =====
        const BACKUP_COLS = ['faqs', 'services', 'specialties', 'consults', 'branches', 'staff_members', 'staff_codes', 'staff_auth', 'public_doctors', 'patients', 'appointments', 'online_bookings', 'booked_slots', 'lab_cases', 'lab_costs', 'payments', 'shortages', 'consumables', 'dues', 'settings', 'private_config'];
        const packVal = v => v instanceof firebase.firestore.Timestamp ? { __ts: v.toMillis() } : Array.isArray(v) ? v.map(packVal) : (v && typeof v === 'object') ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, packVal(x)])) : v;
        const unpackVal = v => (v && typeof v === 'object' && !Array.isArray(v) && Object.keys(v).length === 1 && typeof v.__ts === 'number') ? firebase.firestore.Timestamp.fromMillis(v.__ts) : Array.isArray(v) ? v.map(unpackVal) : (v && typeof v === 'object') ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, unpackVal(x)])) : v;
        function BackupView({ showToast }) {
            const [busy, setBusy] = useState('');
            const [last, setLast] = useState(() => { try { return localStorage.getItem('neLastBackup') || ''; } catch (e) { return ''; } });
            const download = async () => {
                setBusy('جاري تجميع البيانات...');
                try {
                    const out = { app: 'new-era-clinic', version: 1, at: new Date().toISOString(), collections: {} };
                    for (const c of BACKUP_COLS) {
                        setBusy('جاري تحميل ' + c + '...');
                        const sn = await db.collection(c).get();
                        out.collections[c] = Object.fromEntries(sn.docs.map(d => [d.id, packVal(d.data())]));
                    }
                    const n = Object.values(out.collections).reduce((t, x) => t + Object.keys(x).length, 0);
                    const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'new-era-backup-' + localDay() + '.json'; a.click();
                    const stamp = new Date().toLocaleString('ar-EG'); setLast(stamp); try { localStorage.setItem('neLastBackup', stamp); } catch (e) {}
                    showToast('اتنزلت نسخة فيها ' + n + ' سجل ✓');
                } catch (e) { showToast('مشكلة في النسخة: ' + e.message); }
                setBusy('');
            };
            const restore = async (file) => {
                let j; try { j = JSON.parse(await file.text()); } catch (e) { showToast('الملف ده مش نسخة احتياطية'); return; }
                if (!j || j.app !== 'new-era-clinic' || !j.collections) { showToast('الملف ده مش نسخة احتياطية من السيستم'); return; }
                const n = Object.values(j.collections).reduce((t, x) => t + Object.keys(x || {}).length, 0);
                const ans = prompt('هتسترجعي ' + n + ' سجل من نسخة ' + new Date(j.at).toLocaleString('ar-EG') + '.\n\nالسجلات اللي في النسخة هترجع زي ما كانت (ولو اتعدلت بعدها هيرجع القديم). السجلات الجديدة اللي اتعملت بعد النسخة مش هتتمسح.\n\nللتأكيد اكتبي كلمة: استرجاع');
                if (ans !== 'استرجاع') return;
                setBusy('جاري الاسترجاع...');
                try {
                    const writes = [];
                    Object.entries(j.collections).forEach(([c, docs]) => { if (BACKUP_COLS.includes(c)) Object.entries(docs || {}).forEach(([id, data]) => writes.push([c, id, unpackVal(data)])); });
                    for (let i = 0; i < writes.length; i += 400) {
                        const b = db.batch();
                        writes.slice(i, i + 400).forEach(([c, id, data]) => b.set(db.collection(c).doc(id), data));
                        await b.commit();
                        setBusy('جاري الاسترجاع... ' + Math.min(i + 400, writes.length) + ' / ' + writes.length);
                    }
                    showToast('اتسترجع ' + writes.length + ' سجل ✓');
                } catch (e) { showToast('مشكلة في الاسترجاع: ' + e.message); }
                setBusy('');

            return (
                <div className="space-y-3 max-w-2xl">

            { name: 'ملخص آخر الأسبوع', when: 'weekly', days: [4], time: '22:00', to: { main: true }, text: '📊 ملخص {التاريخ}\nحجوزات النهاردة: {حجوزات_النهاردة}\nكنسل: {كنسل_النهاردة}\nمتابعات مستحقة: {متابعات_مستحقة}' }

                                            {Object.entries(TG.people || {}).filter(([, per]) => per && per.chat).map(([k, per]) => { const st = (data.staff || []).find(x => x.id === k); const nm = per.manual ? (per.name || 'يدوي') : st ? ((st.role === 'doctor' ? 'د. ' : '') + st.name) : null; if (!nm) return null; const on = (m.people || []).includes(k); return <React.Fragment key={k}>{chk(on, (k === (LIVE.me || {}).id ? '👤 أنا (' + nm + ')' : nm), () => upd(m.id, { people: on ? m.people.filter(x => x !== k) : [...(m.people || []), k] }))}</React.Fragment>; })}</div>}
                                        <div className="flex flex-wrap gap-1.5">{CM_TO.map(([k, n]) => <React.Fragment key={k}>{chk(!!(m.to || {})[k], n, () => upd(m.id, { to: { ...(m.to || {}), [k]: !(m.to || {})[k] } }))}</React.Fragment>)}</div>

                                            <select value={m.skipZero || ''} onChange={e => upd(m.id, { skipZero: e.target.value })} className="p-1.5 bg-gray-50 border border-gray-100 rounded-lg text-[11px] font-bold"><option value="">— ابعت دايماً —</option>{CM_VARS.slice(3).map(([k, n]) => <option key={k} value={k}>{n}</option>)}</select>

                                        {allR === 0 ? <p className="text-[11px] font-bold text-red-600">⚠️ مفيش حد هيستلمها: اتأكدي إن اللي اخترتيهم ليهم رقم شات في تبويب "تيليجرام".</p>
                                            : <p className="text-[11px] font-bold text-indigo-700">لو اتبعتت دلوقتي: هتوصل لـ {built.length} من {allR}{built.length < allR ? ' (الباقي متخطّى عشان الرقم = صفر)' : ''}</p>}
                                        {/\{[^{}]+\}/.test(built[0] ? built[0].text : '') && <p className="text-[11px] font-bold text-amber-700">⚠️ فيه كلمة بين أقواس السيستم مش فاهمها — استخدمي الزراير الزرقا.</p>}
                                        {built.slice(0, 3).map((x, i) => <div key={i} className="bg-white rounded-lg p-2.5 border border-indigo-100"><p className="text-[9px] font-black text-gray-400 mb-1">← {x.r.label}</p><p className="text-xs font-bold text-gray-800 whitespace-pre-line">{x.text}</p></div>)}
                                        {built.length > 3 && <p className="text-[10px] font-bold text-indigo-600">+ {built.length - 3} كمان</p>}
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        <button type="button" onClick={() => { if (!TG.token || !TG.main) { showToast('محتاجة توكن وشات إدارة'); return; } const x = built[0]; tgPost(TG.main, '🧪 تجربة: ' + (m.name || '') + '\n\n' + (x ? x.text : cmRender(m.text, {}))).then(() => showToast('اتبعتت تجربة على شات الإدارة')).catch(e => showToast(e.message)); }} className="bg-gray-100 px-3 py-2 rounded-xl text-[11px] font-black">🧪 ابعت تجربة لشات الإدارة</button>

                    <button type="button" onClick={save} disabled={!dirty} className="w-full bg-gold-500 text-white py-3 rounded-xl font-black text-sm disabled:opacity-40">{dirty ? 'حفظ الرسايل' : 'محفوظ ✓'}</button>

        }

        // إعدادات تيليجرام (السوبر أدمن بس) — بتتحفظ في مكان مقفول على الموظفين
        function TelegramView({ showToast, branches = [], staff = [] }) {
            const doctors = staff.filter(x => x.role === 'doctor');
            const admins = staff.filter(x => x.role === 'admin' || x.role === 'superadmin');
            const secsOf = bid => staff.filter(x => x.role !== 'doctor' && x.role !== 'admin' && x.role !== 'superadmin' && (staffScope(x, branches) || []).includes(bid));
            const [openP, setOpenP] = useState(null);
            const [v, setV] = useState(null);
            const [found, setFound] = useState(null);
            const [bot, setBot] = useState(null);
            const [showTk, setShowTk] = useState(false);
            const [testRes, setTestRes] = useState({});
            const why = (d) => /chat not found/i.test(d) ? 'الرقم ده لسه مكلّمش البوت: صاحب الرقم لازم يفتح البوت ويدوس Start (أو الرقم غلط)'
                : /unauthorized/i.test(d) ? 'التوكن غلط أو اتلغى — راجعيه من @BotFather'
                : /blocked/i.test(d) ? 'صاحب الرقم عامل Block للبوت — يفتحه ويدوس Restart'
                : /kicked|not a member/i.test(d) ? 'البوت اتشال من الجروب ده — ضيفيه تاني'
                : /failed to fetch|network/i.test(d) ? 'الجهاز مش قادر يوصل لتيليجرام (النت أو الشبكة حاجباه)' : d;
            // اسم البوت ولينكه (عشان السكرتارية تعرف تبعت لمين)
            useEffect(() => {
                const tk = v && v.token.trim(); if (!tk) { setBot(null); return; }
                const t = setTimeout(() => fetch(`https://api.telegram.org/bot${tk}/getMe`).then(r => r.json()).then(j => setBot(j.ok ? j.result : { err: j.description || 'التوكن غلط' })).catch(() => setBot({ err: 'مش قادرين نوصل لتيليجرام' })), 500);
                return () => clearTimeout(t);
            }, [v && v.token]);
            // "حجوزات السيستم" و"جدول المواعيد" بقوا اختيار واحد
            const normK = k => { const s0 = new Set(k || []); if (s0.has('booking') || s0.has('schedule')) { s0.add('booking'); s0.add('schedule'); } return [...s0]; };
            useEffect(() => { db.collection('private_config').doc('telegram').get().then(d => {
                const x = d.exists ? d.data() : {}, bx = x.branches || {}, off = x.v === 2 ? [] : (x.off || []), routes = mergeRoutes(x);
                const strip = k => normK((k || []).filter(z => !off.includes(z)));
                const cfgOf = (o, defKinds) => ({ ...tgTiming(o || {}), kinds: o ? strip(o.kinds) : strip(defKinds) });
                const people = {}; Object.entries(mergePeople(x)).forEach(([k, per]) => { if (per) people[k] = { ...per, ...tgTiming(per), kinds: strip(per.kinds) }; });
                setV({ token: x.token || '', main: x.main || '', branches: Object.fromEntries(branches.map(b => [b.id, bx[b.id] || bx[b.name] || ''])),
                    mainCfg: cfgOf(x.mainCfg, routes.main), branchCfg: Object.fromEntries(branches.map(b => [b.id, cfgOf((x.branchCfg || {})[b.id], routes.branch)])),
                    people, routes, quiet: x.quiet || {} });
            }).catch(e => showToast(e.message)); }, []);
            if (!v) return <p className="text-xs font-bold text-gray-400">...</p>;
            const inp = "w-full p-2.5 bg-white border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500";
            const card = "bg-white rounded-[20px] border border-gray-100 shadow-sm p-5 space-y-3";
            const T5 = o => ({ kinds: o.kinds || [], schedMode: o.schedMode, schedHour: Number(o.schedHour), shortMode: o.shortMode, shortHour: Number(o.shortHour) });
            const save = () => {
                const br = {}; Object.entries(v.branches).forEach(([k, c]) => { if (String(c).trim()) br[k] = String(c).trim(); });
                const ids = new Set(staff.map(x => x.id)), pp = {};
                // بنحفظ اللي ليه رقم شات بس، واللي اتشالوا من السيستم بيتشالوا
                Object.entries(v.people || {}).forEach(([k, per]) => { const chat = String(per.chat || '').trim(); if (!chat || (!per.manual && !ids.has(k))) return; pp[k] = { chat, ...T5(per), ...(per.manual ? { manual: true, name: (per.name || '').trim() } : {}) }; });
                const bc = {}; branches.forEach(b => { bc[b.id] = T5(v.branchCfg[b.id] || tgTiming({})); });
                db.collection('private_config').doc('telegram').set({ v: 2, token: v.token.trim(), main: v.main.trim(), branches: br, mainCfg: T5(v.mainCfg), branchCfg: bc, people: pp, routes: v.routes, off: [], quiet: v.quiet || {}, routesKnown: TG_KINDS.map(k => k[0]) })
                    .then(() => showToast('تم حفظ إعدادات تيليجرام ✓')).catch(e => showToast(e.message));
            };
            const test = (chat, label, key) => {
                const tk = v.token.trim(), id = String(chat || '').trim();
                if (!tk) { setTestRes(r => ({ ...r, [key]: { ok: false, t: 'خانة التوكن فاضية — حطيه واحفظي' } })); return; }
                if (!id) { setTestRes(r => ({ ...r, [key]: { ok: false, t: 'رقم الشات فاضي — حطيه الأول' } })); return; }
                setTestRes(r => ({ ...r, [key]: { t: 'جاري الإرسال...' } }));
                fetch(`https://api.telegram.org/bot${tk}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: id, text: '✅ رسالة تجربة من سيستم نيو إيرا — ' + label }) })
                    .then(r => r.json()).then(j => setTestRes(r => ({ ...r, [key]: j.ok ? { ok: true, t: 'الرسالة وصلت ✓' } : { ok: false, t: why(j.description || '') } })))
                    .catch(e => setTestRes(r => ({ ...r, [key]: { ok: false, t: why(e.message) } })));
            };
            const Res = ({ k }) => testRes[k] ? <p className={`text-[11px] font-bold ${testRes[k].ok ? 'text-emerald-600' : testRes[k].ok === false ? 'text-red-600' : 'text-gray-400'}`}>{testRes[k].t}</p> : null;
            const findChats = () => {
                if (!v.token.trim()) { showToast('حطي التوكن الأول'); return; }
                fetch(`https://api.telegram.org/bot${v.token.trim()}/getUpdates`).then(r => r.json()).then(j => {
                    if (!j.ok) {
                        const err = j.description || 'خطأ من تيليجرام';
                        if (/webhook/i.test(err)) fetch(`https://api.telegram.org/bot${v.token.trim()}/getWebhookInfo`).then(r => r.json()).then(w => setFound({ err, hook: (w.result && w.result.url) || '' })).catch(() => setFound({ err }));
                        else setFound({ err });
                        return;
                    }
                    const m = {}; (j.result || []).forEach(u => { const c = (u.message || u.edited_message || u.my_chat_member || u.chat_member || u.channel_post || {}).chat; if (c) m[c.id] = (c.type === 'private' ? '👤 ' : '👥 ') + (c.title || [c.first_name, c.last_name].filter(Boolean).join(' ') || c.username || c.id); });
                    setFound(Object.entries(m));
                }).catch(e => setFound({ err: e.message }));
            };
            // ===== كل شات: الإدارة (_main) / جروب الفرع (_b_ID) / شخص =====
            const defKinds = type => type === 'doctor' ? PERSON_DEFAULT.doctor : type === 'secretary' ? SEC_DEFAULT : PERSON_DEFAULT.admin;
            const getRec = (id, type) => {
                if (id === '_main') return { ...v.mainCfg, chat: v.main };
                if (id.startsWith('_b_')) { const bid = id.slice(3); return { ...(v.branchCfg[bid] || { ...tgTiming({}), kinds: [] }), chat: v.branches[bid] || '' }; }
                return (v.people || {})[id] || { chat: '', ...tgTiming({}), kinds: normK(defKinds(type)) };
            };
            const setRec = (id, type, patch) => setV(p => {
                if (id === '_main') { const { chat, ...rest } = patch; return { ...p, ...(chat !== undefined ? { main: chat } : {}), mainCfg: { ...p.mainCfg, ...rest } }; }
                if (id.startsWith('_b_')) { const bid = id.slice(3), { chat, ...rest } = patch; return { ...p, ...(chat !== undefined ? { branches: { ...p.branches, [bid]: chat } } : {}), branchCfg: { ...p.branchCfg, [bid]: { ...(p.branchCfg[bid] || tgTiming({})), ...rest } } }; }
                const cur = (p.people || {})[id] || { chat: '', ...tgTiming({}), kinds: normK(defKinds(type)) };
                return { ...p, people: { ...p.people, [id]: { ...cur, ...patch } } };
            });
            const UI_KINDS = [['sched', '📅 حجوزات السيستم + جدول المواعيد'], ...TG_KINDS.filter(([k]) => k !== 'booking' && k !== 'schedule')];
            const hrTxt = h => (h % 12 || 12) + (h < 12 ? ' الصبح' : h < 17 ? ' الضهر' : ' بالليل');
            const selC = "bg-white border border-gray-200 rounded-lg px-2 py-1.5 text-[11px] font-black outline-none focus:border-gold-500";
            const hourSel = (val, on) => <select value={val} onChange={e => on(Number(e.target.value))} className={selC}>{Array.from({ length: 24 }, (_, h) => <option key={h} value={h}>{hrTxt(h)}</option>)}</select>;
            const recRow = ({ id, label, tag, type, manual }) => {
                const r = getRec(id, type), kinds = r.kinds || [], open = openP === id;
                const has = k => k === 'sched' ? kinds.includes('booking') || kinds.includes('schedule') : kinds.includes(k);
                const tog = k => { const ks = k === 'sched' ? ['booking', 'schedule'] : [k]; setRec(id, type, { kinds: has(k) ? kinds.filter(x => !ks.includes(x)) : [...new Set([...kinds, ...ks])] }); };
                const cnt = UI_KINDS.filter(([k]) => has(k)).length;
                const sum = [has('sched') && (r.schedMode === 'instant' ? '📅 مع كل حجز' : '📅 جدول ' + hrTxt(r.schedHour)), has('shortage') && (r.shortMode === 'instant' ? '🛒 نواقص فوراً' : '🛒 نواقص ' + hrTxt(r.shortHour))].filter(Boolean).join(' • ');
                return (
                    <div key={id} className={`border rounded-xl p-2.5 space-y-2 ${r.chat ? 'border-gold-200 bg-gold-50/30' : 'border-gray-100 bg-gray-50/50'}`}>
                        <div className="flex items-center justify-between gap-2">
                            {manual ? <input value={r.name || ''} onChange={e => setRec(id, type, { name: e.target.value, manual: true })} placeholder="الاسم" className="flex-1 min-w-0 p-2 bg-white border border-gray-100 rounded-lg text-xs font-black outline-none" />
                                : <div className="min-w-0"><p className="text-xs font-black text-gray-800 truncate">{label}</p>{tag && <p className="text-[9px] font-bold text-gray-400 truncate">{tag}</p>}</div>}
                            <div className="flex items-center gap-1 shrink-0">
                                <button type="button" title="ابعت رسالة تجربة" onClick={() => test(r.chat, manual ? (r.name || '') : label, 't_' + id)} className="w-8 h-8 flex items-center justify-center bg-white border border-gray-200 rounded-lg text-sm hover:border-gold-400">🧪</button>
                                <button type="button" onClick={() => setOpenP(open ? null : id)} className="text-[10px] font-black text-gold-700 bg-white border border-gold-200 rounded-lg px-2 h-8">{cnt} إشعار {open ? '▲' : '▼'}</button>
                                {manual && <button type="button" title="حذف" onClick={() => setV(p => { const pp = { ...p.people }; delete pp[id]; return { ...p, people: pp }; })} className="w-8 h-8 text-red-500 font-black">✕</button>}
                            </div>
                        </div>
                        <input dir="ltr" value={r.chat || ''} onChange={e => setRec(id, type, { chat: e.target.value })} className={inp} placeholder="chat_id (من @myidbot)" />
                        <Res k={'t_' + id} />
                        {!open && r.chat && sum && <p className="text-[10px] font-bold text-gray-500">{sum}</p>}
                        {open && <div className="space-y-2 pt-1">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-1">{UI_KINDS.map(([k, n]) => <label key={k} className="flex items-center gap-2 text-[11px] font-bold text-gray-700 cursor-pointer">
                                <input type="checkbox" checked={has(k)} onChange={() => tog(k)} />{n}{type === 'doctor' && (k === 'sched' || DOCTOR_OWN_KINDS.includes(k)) ? <span className="text-[9px] text-gray-400">(بتاعته بس)</span> : ''}</label>)}</div>
                            {(has('sched') || has('digest')) && <div className="bg-white border border-gray-100 rounded-lg p-2 space-y-1.5">
                                {has('sched') && <div className="flex flex-wrap items-center gap-1.5 text-[11px] font-bold text-gray-700"><span>📅 الحجوزات:</span>

                                        <div className="flex-1 min-w-0"><p className="text-sm font-black text-gray-800">{sv.name}{sv.active === false && <span className="text-[9px] text-gray-400 mr-1">(مخفية)</span>}</p>

                                        <button type="button" title="تعديل" onClick={() => setEdit(sv)} className="w-7 h-7 rounded-lg bg-gray-100 text-gray-500 hover:text-gold-600 flex items-center justify-center shrink-0"><IcoEdit /></button>
                                        <button type="button" title="حذف" onClick={() => onConfirm({ msg: 'حذف خدمة "' + sv.name + '"؟', onConfirm: () => trashDelete('services', sv.id).catch(err => showToast(err.message)) })} className="w-7 h-7 rounded-lg bg-gray-100 text-gray-500 hover:text-red-600 flex items-center justify-center shrink-0"><IcoTrash /></button>
                                    </div>))}</div>
                            </div>); })}
                    </>}

                    {edit && <div className="fixed inset-0 bg-gray-900/50 z-[90] flex items-center justify-center p-4" onClick={() => setEdit(null)}>
                        <form onSubmit={saveSvc} onClick={e => e.stopPropagation()} className="bg-white rounded-[24px] w-full max-w-md p-5 space-y-3">
                            <h4 className="font-black text-gray-800">{edit.id ? 'تعديل خدمة' : 'خدمة جديدة'}</h4>
                            <input name="name" defaultValue={edit.name} required placeholder="اسم الخدمة (مثال: زراعة سنة)" className={inp} />
                            <select name="specialtyId" defaultValue={edit.specialtyId || ''} className={inp}><option value="">— بدون تخصص —</option>{specialties.map(sp => <option key={sp.id} value={sp.id}>{sp.name}</option>)}</select>
                            <div className="grid grid-cols-2 gap-2"><label className="text-[10px] font-black text-gray-500">السعر من<input name="priceFrom" type="number" min="0" defaultValue={edit.priceFrom || ''} className={inp + ' mt-1'} /></label>
                                <label className="text-[10px] font-black text-gray-500">لحد (اختياري)<input name="priceTo" type="number" min="0" defaultValue={edit.priceTo || ''} className={inp + ' mt-1'} /></label></div>
                            <div className="grid grid-cols-2 gap-2"><input name="duration" defaultValue={edit.duration} placeholder="المدة (مثال: جلستين)" className={inp} /><input name="order" type="number" defaultValue={edit.order || ''} placeholder="الترتيب" className={inp} /></div>
                            <input name="note" defaultValue={edit.note} placeholder="ملاحظة للمريض (اختياري)" className={inp} />
                            <label className="flex items-center gap-2 text-xs font-black text-gray-700"><input name="active" type="checkbox" defaultChecked={edit.active !== false} /> ظاهرة للمرضى في الحجز</label>
                            <div className="flex gap-2"><button className="flex-1 bg-gold-500 text-white py-2.5 rounded-xl font-black text-sm">حفظ</button><button type="button" onClick={() => setEdit(null)} className="px-4 bg-gray-100 rounded-xl font-black text-sm">إلغاء</button></div>

        // ===== الاستشارات الأونلاين =====
        function ConsultsView(props) {
            const isAdm = props.currentUser.role === 'admin' || props.currentUser.role === 'superadmin';
            const [view, setView] = useState('consults');
            return (<div className="space-y-4 w-full">
                {isAdm && <div className="flex bg-gray-100 p-1 rounded-xl max-w-xs">{[['consults', 'الاستشارات'], ['faq', 'الأسئلة الشائعة']].map(([k, n]) => <button key={k} type="button" onClick={() => setView(k)} className={`flex-1 px-3 py-1.5 text-xs font-black rounded-lg ${view === k ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>{n}</button>)}</div>}

        // ===== الأسئلة الشائعة (بتظهر في الموقع) =====
        function FaqView({ consults, showToast }) {
            const [faqs, setFaqs] = useState(null);
            const [edit, setEdit] = useState(null);
            const [q, setQ] = useState('');
            useEffect(() => db.collection('faqs').onSnapshot(s => setFaqs(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || (b.createdAt || '').localeCompare(a.createdAt || ''))), e => showToast(e.message)), []);
            if (!faqs) return <p className="text-xs font-bold text-gray-400">...</p>;
            const used = new Set(faqs.map(f => f.fromConsult).filter(Boolean));
            const pending = consults.filter(c => (c.replies || []).length && !used.has(c.id));
            const importAll = () => {
                if (!pending.length) { showToast('مفيش استشارات جديدة مترد عليها'); return; }
                const b = db.batch();
                pending.forEach(c => b.set(db.collection('faqs').doc(), { q: c.question, a: (c.replies || []).map(r => r.text).join('\n\n'), topic: c.topic || '', published: false, fromConsult: c.id, createdAt: new Date().toISOString() }));
                b.commit().then(() => showToast('اتضاف ' + pending.length + ' سؤال كمسودة — راجعيهم وانشريهم')).catch(e => showToast(e.message));
            };
            const save = e => {
                e.preventDefault(); const f = e.target;
                const d = { q: f.q.value.trim(), a: f.a.value.trim(), topic: f.topic.value.trim(), published: f.published.checked, order: Number(f.order.value) || 0 };
                if (!d.q || !d.a) return;
                (edit.id ? db.collection('faqs').doc(edit.id).set(d, { merge: true }) : db.collection('faqs').add({ ...d, createdAt: new Date().toISOString() })).then(() => { setEdit(null); showToast('اتحفظ ✓'); }).catch(err => showToast(err.message));
            };
            const shown = faqs.filter(f => !q || (f.q + ' ' + f.a + ' ' + (f.topic || '')).includes(q));
            const inp = "w-full p-2.5 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500";
            return (
                <div className="space-y-3 animate-fade-in">
                    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-[11px] font-bold text-amber-800 leading-relaxed">اللي متعلّم عليه "منشور" بس هو اللي بيظهر في الموقع. قبل النشر راجعي السؤال والإجابة واشيلي أي اسم أو رقم أو تفاصيل تعرّف المريض. اسم المريض ورقمه مش بيتنقلوا أصلاً.</div>
                    <div className="flex flex-wrap gap-2 items-center">
                        <button type="button" onClick={() => setEdit({ published: true })} className="bg-gold-500 text-white px-3 py-2 rounded-xl text-xs font-black">+ سؤال جديد</button>
                        <button type="button" onClick={importAll} className="bg-gray-900 text-white px-3 py-2 rounded-xl text-xs font-black">⬇ هات الاستشارات المردود عليها ({pending.length}) كمسودات</button>
                        <input value={q} onChange={e => setQ(e.target.value)} placeholder="بحث..." className="p-2 bg-white border border-gray-200 rounded-xl text-xs font-bold mr-auto w-40" />
                    </div>
                    <p className="text-[11px] font-bold text-gray-500">{faqs.filter(f => f.published).length} منشور • {faqs.filter(f => !f.published).length} مسودة</p>
                    {shown.map(f => <div key={f.id} className={`bg-white rounded-2xl border shadow-sm p-4 space-y-1.5 ${f.published ? 'border-emerald-200' : 'border-gray-100'}`}>
                        <div className="flex items-start gap-2">
                            <p className="flex-1 text-sm font-black text-gray-800">❓ {f.q}</p>
                            <button type="button" onClick={() => db.collection('faqs').doc(f.id).update({ published: !f.published }).catch(e => showToast(e.message))} className={`text-[10px] font-black px-2 py-1 rounded-lg shrink-0 ${f.published ? 'bg-emerald-50 text-emerald-700' : 'bg-gray-100 text-gray-500'}`}>{f.published ? '✓ منشور' : 'مسودة — انشر'}</button>
                            <button type="button" title="تعديل" onClick={() => setEdit(f)} className="w-7 h-7 rounded-lg bg-gray-100 text-gray-500 hover:text-gold-600 flex items-center justify-center shrink-0"><IcoEdit /></button>
                            <button type="button" title="حذف" onClick={() => confirm('حذف السؤال ده؟') && trashDelete('faqs', f.id).catch(e => showToast(e.message))} className="w-7 h-7 rounded-lg bg-gray-100 text-gray-500 hover:text-red-600 flex items-center justify-center shrink-0"><IcoTrash /></button>
                        </div>
                        <p className="text-xs font-bold text-gray-600 whitespace-pre-line">{f.a}</p>
                        {f.topic && <p className="text-[10px] font-black text-gold-700">{f.topic}</p>}
                    </div>)}
                    {edit && <div className="fixed inset-0 bg-gray-900/50 z-[90] flex items-center justify-center p-4" onClick={() => setEdit(null)}>
                        <form onSubmit={save} onClick={e => e.stopPropagation()} className="bg-white rounded-[24px] w-full max-w-lg p-5 space-y-3">
                            <h4 className="font-black text-gray-800">{edit.id ? 'تعديل سؤال' : 'سؤال جديد'}</h4>
                            <textarea name="q" rows="2" defaultValue={edit.q} required placeholder="السؤال" className={inp} />
                            <textarea name="a" rows="5" defaultValue={edit.a} required placeholder="الإجابة" className={inp} />
                            <div className="grid grid-cols-2 gap-2"><input name="topic" defaultValue={edit.topic} placeholder="التصنيف (مثال: تقويم)" className={inp} /><input name="order" type="number" defaultValue={edit.order || ''} placeholder="الترتيب" className={inp} /></div>
                            <label className="flex items-center gap-2 text-xs font-black text-gray-700"><input name="published" type="checkbox" defaultChecked={!!edit.published} /> منشور في الموقع</label>
                            <div className="flex gap-2"><button className="flex-1 bg-gold-500 text-white py-2.5 rounded-xl font-black text-sm">حفظ</button><button type="button" onClick={() => setEdit(null)} className="px-4 bg-gray-100 rounded-xl font-black text-sm">إلغاء</button></div>
                        </form></div>}
                </div>
            );
        }

        function ConsultsList({ consults, branches, staff, specialties, currentUser, focusId, showToast }) {
            const isDoc = currentUser.role === 'doctor';
            const [f, setF] = useState('new');
            const [open, setOpen] = useState(focusId || null);
            const [reply, setReply] = useState({});
            const doctors = staff.filter(x => x.role === 'doctor');
            const st = c => c.sentToPatientAt ? 'sent' : (c.replies || []).length ? 'answered' : 'new';
            const ST = { new: ['مستنية رد', 'bg-red-50 text-red-600'], answered: ['اترد عليها — لسه متبعتتش للمريض', 'bg-amber-50 text-amber-700'], sent: ['اتبعت الرد للمريض', 'bg-emerald-50 text-emerald-700'] };
            const [q, setQ] = useState('');
            useEffect(() => { if (!isDoc) WIN.find('consults', q); }, [q]);
            useEffect(() => () => WIN.find('consults', ''), []);
            const list = consults.filter(c => textHit(c, ['name', 'phone', 'question', 'topic', 'doctorName', 'id'], q)).filter(c => q.trim() || f === 'all' || st(c) === f);
            const counts = { new: 0, answered: 0, sent: 0 }; consults.forEach(c => counts[st(c)]++);
            const send = (c) => {
                const t = (reply[c.id] || '').trim(); if (!t) return;
                const r = { by: (isDoc ? 'د. ' : '') + currentUser.name, byId: currentUser.id, text: t, at: new Date().toISOString(), via: 'system' };
                db.collection('consults').doc(c.id).update({ replies: firebase.firestore.FieldValue.arrayUnion(r), status: 'answered', answeredAt: r.at })
                    .then(() => { setReply(x => ({ ...x, [c.id]: '' })); showToast('اتسجل الرد ✓');
                        tgSend(fillT('tgConsultReply', { code: c.id, patient: c.name, by: r.by, reply: t }), c.branchId, 'consult', []); })
                    .catch(e => showToast(e.message));
            };
            const reassign = (c, docId) => {
                const d = doctors.find(x => x.id === docId);
                db.collection('consults').doc(c.id).update({ doctorId: docId, doctorName: d ? d.name : '', targets: docId ? [docId] : [], tgSent: false }).then(() => showToast('اتحولت — هيوصله تيليجرام')).catch(e => showToast(e.message));
            };
            const lastReply = c => (c.replies || []).slice(-1)[0];
            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <SearchBar value={q} onChange={setQ} placeholder="دوّر باسم المريض أو رقمه أو كلمة من السؤال" archive={isDoc ? '' : 'باسم المريض من أوله'} />
                    {currentUser.role !== 'doctor' && <OlderLoader col="consults" what="الاستشارات (واللي لسه متردش عليها كلها)" />}
                    <div className="flex items-center justify-between flex-wrap gap-2">
                        <h3 className="text-lg font-black text-gray-800">الاستشارات الأونلاين</h3>
                        <div className="flex bg-gray-100 p-1 rounded-xl overflow-x-auto">{[['new', 'مستنية رد'], ['answered', 'اترد عليها'], ['sent', 'اتبعتت للمريض'], ['all', 'الكل']].map(([k, n]) => <button key={k} type="button" onClick={() => setF(k)} className={`px-3 py-1.5 text-[11px] font-black rounded-lg whitespace-nowrap ${f === k ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>{n}{k !== 'all' ? ' (' + counts[k] + ')' : ''}</button>)}</div>
                    </div>
                    <p className="text-[10px] text-gray-400 font-bold">الدكتور بيرد من تيليجرام (Reply على رسالة الاستشارة) أو من هنا. الرد بيظهر للمريض في صفحة الحجز بكود الاستشارة، وتقدري تبعتيهوله واتساب من الزرار.</p>
                    {list.length === 0 && <p className="text-xs text-gray-400 font-bold text-center py-8 bg-white rounded-2xl">مفيش استشارات هنا.</p>}
                    {list.map(c => { const s0 = st(c), isOpen = open === c.id, lr = lastReply(c), br = branches.find(b => b.id === c.branchId);
                        return (
                        <div key={c.id} className="bg-white rounded-[20px] border border-gray-100 shadow-sm">
                            <div className="p-4 cursor-pointer space-y-1.5" onClick={() => setOpen(isOpen ? null : c.id)}>
                                <div className="flex items-center gap-2 flex-wrap"><span className="text-sm font-black text-gray-800">{c.name}</span><span className={`text-[10px] font-black px-2 py-0.5 rounded-lg ${ST[s0][1]}`}>{ST[s0][0]}</span><span className="text-[10px] font-mono text-gray-400 mr-auto">#{c.id}</span></div>
                                <p className="text-[11px] font-bold text-gray-500">{[c.topic, c.doctorName ? 'لـ د. ' + c.doctorName : ((c.targets || []).length ? 'لأي دكتور مناسب (' + c.targets.length + ')' : 'للإدارة'), br && 'فرع ' + br.name, new Date(c.createdAt).toLocaleString('ar-EG', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })].filter(Boolean).join(' • ')}</p>
                                <p className={`text-xs font-bold text-gray-700 ${isOpen ? 'whitespace-pre-line' : 'truncate'}`}>❓ {c.question}</p>
                            </div>
                            {isOpen && <div className="px-4 pb-4 space-y-3 border-t border-gray-100 pt-3">
                                {!isDoc && <p className="text-xs font-bold text-gray-600">📞 <span dir="ltr">{c.phone}</span></p>}
                                {(c.replies || []).map((r, i) => <div key={i} className="bg-emerald-50 border border-emerald-100 rounded-xl p-3"><p className="text-[10px] font-black text-emerald-700 mb-1">{r.by} • {r.via === 'telegram' ? 'من تيليجرام' : 'من السيستم'} • {new Date(r.at).toLocaleString('ar-EG', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })}</p><p className="text-xs font-bold text-gray-800 whitespace-pre-line">{r.text}</p></div>)}
                                <div className="space-y-2"><textarea rows="3" value={reply[c.id] || ''} onChange={e => setReply(x => ({ ...x, [c.id]: e.target.value }))} placeholder={isDoc ? 'اكتب ردك على المريض...' : 'اكتبي رد (لو الدكتور رد في التليفون مثلاً)...'} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl text-xs font-bold outline-none focus:border-gold-500" />
                                    <button type="button" onClick={() => send(c)} className="bg-gray-900 text-white px-4 py-2 rounded-xl text-xs font-black">حفظ الرد</button></div>
                                {!isDoc && <div className="flex flex-wrap gap-2 items-center border-t border-gray-100 pt-3">
                                    {lr && <a href={waUrl(c.phone, fillT('consultReply', { name: c.name, doctor: lr.by, reply: lr.text })) || '#'} target={WA_TARGET} rel="noreferrer" onClick={() => db.collection('consults').doc(c.id).update({ sentToPatientAt: new Date().toISOString(), sentBy: currentUser.name }).catch(() => {})} className="bg-green-500 text-white px-3 py-2 rounded-xl text-xs font-black">📲 ابعت الرد للمريض واتساب</a>}
                                    {c.sentToPatientAt && <span className="text-[10px] font-bold text-emerald-600">اتبعت {c.sentBy ? 'بواسطة ' + c.sentBy : ''}</span>}
                                    <label className="text-[11px] font-bold text-gray-500 flex items-center gap-1 mr-auto">تحويل لـ <select value={c.doctorId || ''} onChange={e => reassign(c, e.target.value)} className="p-1.5 bg-gray-50 border border-gray-100 rounded-lg text-[11px] font-bold"><option value="">— الإدارة —</option>{doctors.map(d => <option key={d.id} value={d.id}>د. {d.name}</option>)}</select></label>
                                </div>}
                            </div>}
                        </div>); })}
                </div>
            );
        }

        function TemplatesView({ showToast, data, isSuper }) {
            const [v, setV] = useState(() => ({ _titles: {}, _deleted: [], _quiet: { ...(TG.quiet || {}) }, ...JSON.parse(JSON.stringify(TPL)) }));
            const [tab, setTab] = useState('wa');
            const [dirty, setDirty] = useState(false);
            const WA = { consultReply: ['رد الاستشارة للمريض', '{name} {doctor} {reply}'], reminder: ['تذكير الموعد', '{name} {branch} {date} {time}'], review: ['طلب التقييم', '{name} {branch} {link}'], followup: ['متابعة المريض', '{name} {branch} {service}'], lab: ['رسالة المعمل', '{patient} {case} {date}'] };

            // جدول الصبح: مجموعتين (كل مجموعة بتتحذف/تتسمّى مع بعض)
            const GROUPS = {
                grpSched: ['جدول مواعيد الصبح (الإدارة / الفروع / الأدمنز)', [['tgSchedHead', 'أول الرسالة', '{branch} {date} {count} {canceled}'], ['tgSchedDoctor', 'عنوان كل دكتور', '{doctor} {count}'], ['tgSchedLine', 'سطر كل حجز', '{time} {patient} {service} {phone} {status} {online}'], ['tgSchedEmpty', 'لو مفيش حجوزات', '{branch} {date} {canceled}', 'branch', 'متبعتش جدول الفرع لو مفيهوش حجوزات']]],
                grpDocSched: ['جدول مواعيد الدكتور (كل دكتور جدوله)', [['tgDocSchedHead', 'أول الرسالة', '{doctor} {date} {count}'], ['tgDocSchedLine', 'سطر كل حجز', '{time} {patient} {service} {phone} {status} {online}'], ['tgDocSchedEmpty', 'لو مفيش حجوزات', '{doctor} {date}', 'doctor', 'متبعتش للدكتور "مفيش حجوزات ليك النهاردة"']]]
            };
            const set = patch => { setV(p => ({ ...p, ...patch })); setDirty(true); };
            const title = (k, def) => (v._titles || {})[k] || def;
            const setTitle = (k, t) => set({ _titles: { ...(v._titles || {}), [k]: t } });
            const del = k => set({ _deleted: [...new Set([...(v._deleted || []), k])] });
            const undel = k => set({ _deleted: (v._deleted || []).filter(x => x !== k) });
            const isDel = k => (v._deleted || []).includes(k);
            const save = () => db.collection('settings').doc('templates').set({ ...v, ...(TPL._times ? { _times: TPL._times } : {}) }).then(() => { setDirty(false); showToast('تم حفظ الرسائل ✓'); }).catch(e => showToast(e.message));
            const area = (k, rows = 4) => <textarea rows={rows} value={v[k] ?? ''} onChange={e => set({ [k]: e.target.value })} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl text-xs font-bold outline-none focus:border-gold-500" />;
            const reset = k => <button type="button" onClick={() => set({ [k]: TPL_DEFAULT[k] })} className="text-[10px] text-gray-400 font-bold hover:text-gold-600">استرجاع النص الأصلي</button>;
            const card = "bg-white p-4 rounded-[20px] border border-gray-100 shadow-sm space-y-1.5";
            const block = (obj, delMsg) => Object.entries(obj).filter(([k]) => !isDel(k)).map(([k, [t0, vars]]) => (
                <div key={k} className={card}>
                    <EditableTitle value={title(k, t0)} onChange={t => setTitle(k, t)} onDelete={() => del(k)} deleteMsg={delMsg} />
                    <p className="text-[9px] text-gray-400 font-bold" dir="ltr">{vars}</p>
                    {area(k)}{reset(k)}
                </div>));
            const restoreList = (keys, names) => { const d = keys.filter(isDel); return d.length ? (

            const TABS = [['wa', 'واتساب'], ['tg', 'تيليجرام'], ['custom', 'رسائل مخصصة']];
            const tgNames = { ...Object.fromEntries(Object.entries(TG_L).map(([k, x]) => [k, x[0]])), ...Object.fromEntries(Object.entries(GROUPS).map(([k, x]) => [k, x[0]])) };

                    {tab === 'wa' && <>
