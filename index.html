                                        <div className="space-y-1">
                                            <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الدكتور المسؤول عن الحالة (اختياري)</label>
                                            <select key={pBranch} name="docId" defaultValue={pDocs.some(x => x.id === modal.data?.doctorId) ? modal.data.doctorId : ''} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                <option value="">بدون تحديد</option>
                                                {pDocs.map(x => <option key={x.id} value={x.id}>د. {x.name}</option>)}
                                            </select>
                                        </div>
                                    </>
                                )}
                                {modal.type==='payment' && (
                                    <>
                                        <Input name="amt" label="المبلغ" type="number" defaultValue={modal.data?.amount} required />
                                        {user.role !== 'employee' && <Input name="dt" label="التاريخ" type="date" defaultValue={modal.data?.date || new Date().toISOString().split('T')[0]} required />}
                                        <Input name="payMethod" label="مكان الحفظ (اختياري)" defaultValue={modal.data?.paymentMethod} placeholder="كاش، فيزا..." />
                                        <div className="space-y-1">
                                            <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الفرع</label>
                                            <select name="bId" defaultValue={modal.data?.branchId || user.branchId} disabled={user.role==='employee'} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                {branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
                                            </select>
                                        </div>
                                    </>
                                )}
                                {modal.type==='lab' && (
                                    <>
                                        <Input name="labName" label="اسم المعمل" list="labNamesList" defaultValue={modal.data?.labName} required onBlur={e => { const el = e.target.form.labPhone; const n = e.target.value.trim(); if (el && !el.value && labPhones[n]) el.value = labPhones[n]; }} />
                                        <Input name="labPhone" label="رقم واتساب المعمل (اختياري)" type="tel" defaultValue={modal.data?.labPhone} />
                                        <datalist id="labNamesList">{labNames.map(n => <option key={n} value={n} />)}</datalist>
                                        <Input name="patientName" label="اسم المريض" defaultValue={modal.data?.patientName} required />
                                        <Input name="caseType" label="نوع الحالة / الشغل" defaultValue={modal.data?.caseType} required />
                                        <div className="grid grid-cols-2 gap-2">
                                            <Input name="sentDate" label="تاريخ التسليم للمعمل" type="date" defaultValue={modal.data?.sentDate || new Date().toISOString().split('T')[0]} required />
                                            <Input name="dueDate" label="موعد الاستلام المتوقع" type="date" defaultValue={modal.data?.dueDate} />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">تذكير بطلب الحالة من المعمل بعد</label>
                                            <select name="remindDays" defaultValue={modal.data ? labRemindDays(modal.data) : 2} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                <option value="0">بدون تذكير</option><option value="1">يوم</option><option value="2">يومين</option><option value="3">3 أيام</option><option value="5">5 أيام</option><option value="7">أسبوع</option><option value="10">10 أيام</option><option value="14">أسبوعين</option><option value="30">شهر</option>
                                            </select>
                                        </div>
                                        {user.role === 'superadmin' && <Input name="cost" label="التكلفة (تظهر للسوبر أدمن فقط)" type="number" defaultValue={modal.data ? costs[modal.data.id] : ''} />}
                                        <Input name="notes" label="ملاحظات" defaultValue={modal.data?.notes} />
                                        {(user.role === 'admin' || user.role === 'superadmin') && (
                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الفرع</label>
                                                <select name="bId" defaultValue={modal.data?.branchId || (selectedBranch !== 'all' ? selectedBranch : '')} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                    {branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
                                                </select>
                                            </div>
                                        )}
                                    </>
                                )}
                                {modal.type==='due' && (
                                    <>
                                        <Input name="party" label="الجهة / المورد" defaultValue={modal.data?.party} required />
                                        <Input name="desc" label="البيان (رقم الفاتورة / الوصف)" defaultValue={modal.data?.desc} />
                                        <div className="grid grid-cols-2 gap-2">
                                            <Input name="amount" label="المبلغ (ج)" type="number" step="any" defaultValue={modal.data?.amount} required />
                                            <Input name="dueDate" label="موعد السداد (اختياري)" type="date" defaultValue={modal.data?.dueDate} />
                                        </div>
                                        {(user.role === 'admin' || user.role === 'superadmin') && <BranchSelect withStore branches={branches} defaultValue={modal.data?.branchId || (selectedBranch !== 'all' ? selectedBranch : 'store')} />}
                                    </>
                                )}
                                {modal.type==='consumable' && (
                                    <>
                                        <div className="space-y-1">
                                            <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">نوع الحركة</label>
                                            <select name="kind" defaultValue={modal.data?.kind || 'purchase'} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                <option value="purchase">شراء للعيادة</option>
                                                <option value="withdraw">سحب من المخزن</option>
                                            </select>
                                        </div>
                                        <Input name="itemName" label="اسم الصنف" defaultValue={modal.data?.itemName} required onBlur={e => { const el = e.target.form.unit; const c = lastCosts[e.target.value.trim().toLowerCase()]; if (el && !el.value && c) el.value = c; }} />
                                        <div className="grid grid-cols-2 gap-2">
                                            <Input name="qty" label="الكمية" defaultValue={modal.data?.qty} required />
                                            <Input name="unit" label="تكلفة الوحدة الواحدة (ج)" type="number" step="any" defaultValue={modal.data?.unitCost ?? (modal.data?.qty && modal.data?.amount ? Math.round(modal.data.amount / (parseFloat(modal.data.qty) || 1) * 100) / 100 : '')} placeholder="0" />
                                        </div>
                                        <Input name="dt" label="التاريخ" type="date" defaultValue={modal.data?.date || new Date().toISOString().split('T')[0]} required />
                                        <Input name="note" label="ملاحظات (اختياري)" defaultValue={modal.data?.note} />
                                        {(user.role === 'admin' || user.role === 'superadmin') && (
                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الفرع / المخزن</label>
                                                <select name="bId" defaultValue={modal.data?.branchId || (selectedBranch !== 'all' ? selectedBranch : (branches[0]?.id || 'store'))} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                    <option value="store">المخزن (الرئيسي)</option>
                                                    {branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
                                                </select>
                                            </div>
                                        )}
                                    </>
                                )}
                                {modal.type==='shortage' && (
                                    <>
                                        <Input name="itemName" label="اسم الصنف" defaultValue={modal.data?.itemName} required />
                                        <Input name="quantity" label="الكمية" defaultValue={modal.data?.quantity} required />
                                        {(user.role === 'admin' || user.role === 'superadmin') && (
                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الفرع / المخزن</label>
                                                <select name="bId" defaultValue={modal.data?.branchId} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                    <option value="store">المخزن (الرئيسي)</option>
                                                    {branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
                                                </select>
                                            </div>
                                        )}
                                        {user.role === 'employee' && (
                                            <input type="hidden" name="bId" value={modal.data?.branchId || user.branchId} />
                                        )}
                                    </>
                                )}
                                {modal.type==='staff' && (
                                    <>
                                        <Input name="name" label="اسم الموظف" defaultValue={modal.data?.name} required />
                                        <Input name="code" label="كود الدخول (4 أرقام)" defaultValue={modal.data?.code} type="tel" maxLength="4" required />
                                        <div className="space-y-1">
                                            <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الوظيفة</label>
                                            <select name="jobTitle" value={jobTitle} onChange={(e) => setJobTitle(e.target.value)} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                <option value="سكرتارية">سكرتارية</option>
                                                <option value="مساعد تمريض">مساعد تمريض</option>
                                                <option value="طبيب">طبيب (يشوف حجوزاته فقط)</option>
                                            </select>
                                        </div>
                                        {jobTitle === 'طبيب' ? (
                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">فروع الطبيب (اختاري فرع أو أكتر)</label>
                                                <div className="grid grid-cols-2 gap-2">
                                                    {branches.map(b => (
                                                        <label key={b.id} className="flex items-center gap-2 p-2.5 bg-gray-50 border border-gray-100 rounded-xl text-xs font-bold cursor-pointer">
                                                            <input type="checkbox" name="docBranch" value={b.id} defaultChecked={modal.data?.role === 'doctor' && doctorBranchIds(modal.data, branches).includes(b.id)} className="w-4 h-4 accent-yellow-600" />
                                                            {b.name}
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الصلاحية</label>
                                                <select name="bId" defaultValue={modal.data?.role === 'doctor' ? 'all' : (modal.data?.branchId || 'all')} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                    <option value="all">مدير عام (جميع الفروع)</option>
                                                    {branches.map(b=><option key={b.id} value={b.id}>موظف فرع: {b.name}</option>)}
                                                </select>
                                            </div>
                                        )}
                                    </>
                                )}
                                {modal.type==='branch' && (
                                    <>
                                        <Input name="name" label="اسم الفرع" defaultValue={modal.data?.name} required />
                                        <Input name="phone" label="تليفون الفرع" defaultValue={modal.data?.phone} required />
                                        <Input name="address" label="العنوان التفصيلي" defaultValue={modal.data?.address} placeholder="مثال: شارع مصطفى النحاس، المنيا" />
                                        <Input name="mapsLink" label="رابط جوجل مابس (Google Maps)" defaultValue={modal.data?.mapsLink} placeholder="https://maps.app.goo.gl/..." dir="ltr" />
                                        <Input name="reviewLink" label="رابط تقييم جوجل (لرسالة التقييم)" defaultValue={modal.data?.reviewLink} placeholder="https://g.page/r/..." dir="ltr" />
                                    </>
                                )}
                                <button type="submit" className="w-full py-4 mt-6 bg-gold-500 text-white rounded-xl font-black shadow-lg hover:bg-gold-600 transition-colors text-sm">حفظ التغييرات</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        function Input({ label, ...props }) {
            return (
                <div className="space-y-1">
                    <label className="text-[9px] font-black text-gray-500 uppercase tracking-widest block">{label}</label>
                    <input {...props} className="w-full bg-gray-50 border border-gray-100 focus:border-gold-500 p-3 rounded-xl outline-none font-bold text-gray-800 text-xs shadow-inner transition-colors" />
                </div>
            );
        }

        function Toast({ msg, onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);
            return (
                <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[999999] bg-gray-900 text-white px-5 py-3 rounded-2xl shadow-2xl animate-slide-up flex items-center gap-3 border border-gray-700">
                    <IconCheck />
                    <span className="font-bold text-xs">{msg}</span>
                    <button type="button" onClick={onClose} className="text-gray-400 hover:text-white p-1"><IconX /></button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
