    <script type="text/x-jsx-source" id="jsx-source">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // 1. Firebase Config (New Era)
        const firebaseConfig = {
            apiKey: "AIzaSyDQ17UevaMBy2aVYxsrLNpdQCvn92uSKi0",
            authDomain: "new-era-dental-center.firebaseapp.com",
            projectId: "new-era-dental-center",
            storageBucket: "new-era-dental-center.firebasestorage.app",
            messagingSenderId: "11521109321",
            appId: "1:11521109321:web:49e24509d937ff3e20be98"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        // كود السوبر أدمن الأولي (1279): بيتسجل أول مرة بس، وبعدها يتغير من الإعدادات → كود السوبر أدمن
        // أول تشغيل على قاعدة بيانات فاضية بس: يوزر 1279 وباسورد 1279 (يتغيروا من الإعدادات بعدها)
        const BOOTSTRAP_CODE = "1279";

        // ===== الدخول: اسم مستخدم + كلمة سر (أي طول) =====
        // كل يوزر+باسورد ليهم حساب دخول في Firebase Auth، والإيميل/الباسورد الحقيقيين مشتقين منهم ومحدش يشوفهم.
        const sha256Hex = async (str) => {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        };
        const normUser = u => String(u || '').trim().toLowerCase().replace(/\s+/g, '');
        const authCreds = async (username, password) => {
            const h = await sha256Hex('newera-clinic|v2|' + normUser(username) + '|' + String(password || ''));
            return { email: 'u' + h.slice(0, 32) + '@neweraclinic.app', password: h.slice(32, 64) + 'Ne!' };
        };
        // الأكواد القديمة (4 أرقام) — للانتقال بس
        const legacyCreds = async (code) => {
            const h = await sha256Hex('newera-clinic|' + String(code).trim());
            return { email: 'u' + h.slice(0, 32) + '@neweraclinic.app', password: h.slice(32, 64) + 'Ne!' };
        };
        let secApp = null;
        const getSecAuth = () => { if (!secApp) secApp = firebase.initializeApp(firebaseConfig, 'sec'); return secApp.auth(); };
        const ensureAuthUser = async (username, password) => {
            const { email, password: pw } = await authCreds(username, password);
            const sa = getSecAuth();
            let cred;
            try { cred = await sa.createUserWithEmailAndPassword(email, pw); }
            catch (e) { if (e.code === 'auth/email-already-in-use') cred = await sa.signInWithEmailAndPassword(email, pw); else throw e; }
            const uid = cred.user.uid;
            await sa.signOut();
            return uid;
        };
        const validUser = u => /^[^\s]{3,40}$/.test(u);
        const validPass = p => typeof p === 'string' && p.length >= 4 && p.length <= 100;
        // حفظ موظف + اليوزر والباسورد + حساب الدخول في عملية واحدة.
        // اليوزر والباسورد في staff_codes (السوبر أدمن بس يقدر يقراها) ومش في staff_members.
        const saveStaff = async (staffId, d, prev) => {
            const username = normUser(d.username);
            const password = String(d.password || '');
            if (!validUser(username)) throw new Error('اسم المستخدم من 3 لـ 40 حرف ومن غير مسافات');
            // كلمة السر مش محفوظة في أي مكان (بيتحفظ منها بصمة مشفّرة جوه حساب الدخول بس) — في التعديل: فاضية = زي ما هي
            const keepPass = !password && prev && prev.authUid && normUser(prev.username) === username;
            if (!keepPass && !validPass(password)) throw new Error(prev && prev.authUid && !password ? 'لما تغيّري اسم المستخدم لازم تكتبي كلمة سر جديدة' : 'كلمة السر لازم تكون 4 حروف/أرقام على الأقل');
            const dup = await db.collection('staff_codes').where('username', '==', username).get();
            if (dup.docs.some(x => x.id !== staffId)) throw new Error('اسم المستخدم ده مستخدم لموظف تاني');
            const same = keepPass || (prev && prev.authUid && normUser(prev.username) === username && prev.password && prev.password === password);
            const uid = same ? prev.authUid : await ensureAuthUser(username, password);
            const ex = await db.collection('staff_auth').doc(uid).get();
            if (ex.exists && ex.data().staffId && ex.data().staffId !== staffId) throw new Error('اليوزر ده مستخدم لموظف تاني — غيّريه');
            const { username: _u, password: _p, code: _c, ...rest } = d;
            const b = db.batch();
            if (prev && prev.authUid && prev.authUid !== uid) b.delete(db.collection('staff_auth').doc(prev.authUid));
            b.set(db.collection('staff_members').doc(staffId), { ...rest, authUid: uid, code: firebase.firestore.FieldValue.delete() }, { merge: true });
            b.set(db.collection('staff_codes').doc(staffId), { username, pwSetAt: same ? (prev.pwSetAt || '') : new Date().toISOString() });
            b.set(db.collection('staff_auth').doc(uid), { staffId, role: d.role, name: d.name, username });
            await b.commit();
            return uid;
        };
        const removeStaff = (st) => {
            const b = db.batch();
            if (st.authUid) b.delete(db.collection('staff_auth').doc(st.authUid));
            b.delete(db.collection('public_doctors').doc(st.id));
            b.delete(db.collection('staff_codes').doc(st.id));
            b.delete(db.collection('staff_members').doc(st.id));
            return b.commit();
        };

        const OWNER_EMAIL = 'neweradentalclinics@gmail.com';

                const sm = await db.collection('staff_members').where('role', '==', 'superadmin').get();

                setStep('reset');

            const login = async (e) => {
                e.preventDefault(); setMsg(''); setBusy(true);
                try {
                    const em = e.target.em.value.trim().toLowerCase();
                    if (em !== OWNER_EMAIL) throw new Error('ده مش إيميل صاحبة الحساب');

                    await load();
                } catch (x) { setMsg(x.code === 'auth/too-many-requests' ? 'محاولات كتير — استني شوية' : x.code && x.code.startsWith('auth/') ? 'الإيميل أو الباسورد غلط' : x.message); try { await auth.signOut(); } catch (z) {} }
                setBusy(false);
            };
            const resetMail = async (e) => {
                setMsg('');
                try { await auth.sendPasswordResetEmail(OWNER_EMAIL); setMsg('✓ اتبعت لينك تغيير الباسورد على ' + OWNER_EMAIL + ' — افتحي الإيميل (وشوفي الـ Spam).'); }
                catch (x) { setMsg('مقدرناش نبعت اللينك: ' + x.message); }
            };
            const save = async (e) => {
                e.preventDefault(); setMsg('');
                const u = normUser(form.username);
                if (!validUser(u)) { setMsg('اسم المستخدم من 3 لـ 40 حرف ومن غير مسافات'); return; }
                if (!validPass(form.password)) { setMsg('كلمة السر 4 حروف على الأقل'); return; }
                if (form.password !== form.confirm) { setMsg('تأكيد كلمة السر مش مطابق'); return; }
                setBusy(true);
                try {
                    const cur = sups.find(x => x.id === form.id);
                    if (cur) {
                        const { username: _u, ...rest } = cur;
                        await saveStaff(cur.id, { ...rest, role: 'superadmin', username: u, password: form.password }, { ...rest, authUid: cur.authUid, username: '', password: '' });
                    } else {
                        await saveStaff(db.collection('staff_members').doc().id, { name: 'Admin', role: 'superadmin', branchId: 'all', branchIds: [], jobTitle: 'سوبر أدمن', username: u, password: form.password }, null);
                    }
                    await auth.signOut();
                    setStep('done');
                } catch (x) { setMsg('مشكلة: ' + x.message); }
                setBusy(false);
            };
            return (
                <div className="h-screen bg-[#050505] flex items-center justify-center p-6 w-full overflow-y-auto">
                    <div className="w-full max-w-md bg-[#111111] p-8 rounded-[32px] border border-white/5 shadow-2xl space-y-4 text-right">
                        <h2 className="text-white font-black text-lg">استرجاع حساب السوبر أدمن</h2>
                        {step === 'login' && <form onSubmit={login} className="space-y-3">
                            <p className="text-gray-400 text-xs font-bold leading-relaxed">ادخلي بإيميل وباسورد صاحبة الحساب (نفس اللي بتدخلي بيهم لوحة تحكم الموقع)، وبعدها تحطي اسم مستخدم وكلمة سر جداد للسوبر أدمن.</p>
                            <input name="em" type="email" dir="ltr" defaultValue={OWNER_EMAIL} className={field} required />
                            <input name="pw" type="password" dir="ltr" placeholder="باسورد الإيميل" className={field} required />
                            <button disabled={busy} className="w-full bg-gradient-to-r from-gold-600 to-gold-400 text-black font-black py-3 rounded-2xl disabled:opacity-50">{busy ? '...' : 'تأكيد'}</button>
                            <button type="button" onClick={resetMail} className="text-xs font-bold text-gray-400 hover:text-gold-500">نسيتي باسورد الإيميل كمان؟ ابعتيلي لينك تغييره</button>
                        </form>}
                        {step === 'reset' && <form onSubmit={save} className="space-y-3">
                            {sups.length > 1 && <select value={form.id} onChange={e => setForm({ ...form, id: e.target.value, username: (sups.find(x => x.id === e.target.value) || {}).username || '' })} className={field}>{sups.map(x => <option key={x.id} value={x.id}>{x.name} ({x.username || '—'})</option>)}</select>}
                            {sups.length === 0 ? <p className="text-amber-400 text-xs font-bold">مفيش سوبر أدمن متسجل — هيتعمل واحد جديد.</p> : <p className="text-gray-400 text-xs font-bold">اسم المستخدم الحالي: <span dir="ltr" className="text-gold-500">{(sups.find(x => x.id === form.id) || {}).username || '—'}</span></p>}
                            <input dir="ltr" autoCapitalize="none" placeholder="اسم المستخدم الجديد" value={form.username} onChange={e => setForm({ ...form, username: e.target.value })} className={field} />
                            <input dir="ltr" type="password" placeholder="كلمة السر الجديدة" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })} className={field} />
                            <input dir="ltr" type="password" placeholder="تأكيد كلمة السر" value={form.confirm} onChange={e => setForm({ ...form, confirm: e.target.value })} className={field} />
                            <button disabled={busy} className="w-full bg-gradient-to-r from-gold-600 to-gold-400 text-black font-black py-3 rounded-2xl disabled:opacity-50">{busy ? 'جاري الحفظ...' : 'حفظ'}</button>
                        </form>}
                        {step === 'done' && <div className="space-y-3"><p className="text-emerald-400 font-black text-sm">✓ اتغيّر. ادخلي باسم المستخدم وكلمة السر الجداد.</p>
                            <button type="button" onClick={() => window.location.reload()} className="w-full bg-gradient-to-r from-gold-600 to-gold-400 text-black font-black py-3 rounded-2xl">رجوع لتسجيل الدخول</button></div>}
                        {msg && <p className={`text-xs font-bold ${msg.startsWith('✓') ? 'text-emerald-400' : 'text-red-400'}`}>{msg}</p>}
                        {step !== 'done' && <button type="button" onClick={() => { auth.signOut().catch(() => {}); onBack(); }} className="text-xs font-bold text-gray-500 hover:text-white">← رجوع</button>}
                    </div>
                </div>
            );
        }

        function LoginView({ onLogin }) {
            const [recover, setRecover] = useState(false);
            const [user, setUser] = useState('');
            const [pass, setPass] = useState('');
            const [show, setShow] = useState(false);
            const [rememberMe, setRememberMe] = useState(true);
            const [busy, setBusy] = useState(false);
            const [err, setErr] = useState('');
            const passRef = useRef(null);

            const attemptLogin = async (e) => {
                e && e.preventDefault();
                if (busy) return;
                setErr(''); setBusy(true);
                const ok = await onLogin(user, pass, rememberMe);
                setBusy(false);
                if (!ok) { setErr('اسم المستخدم أو كلمة السر غلط'); setPass(''); passRef.current && passRef.current.focus(); }
            };
            const field = "w-full bg-black/80 border border-white/10 rounded-2xl px-4 py-3.5 text-base font-bold text-white placeholder-gray-600 focus:border-gold-500 outline-none transition-all shadow-inner";
            if (recover) return <RecoveryView onBack={() => setRecover(false)} />;

            return (
                <div className="h-screen bg-[#050505] flex items-center justify-center p-6 text-center w-full relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-96 h-96 bg-gold-600/10 rounded-full blur-[120px] -translate-y-1/2 translate-x-1/2"></div>
                    <form onSubmit={attemptLogin} className="w-full max-w-md bg-[#111111] p-8 sm:p-10 rounded-[40px] border border-white/5 shadow-2xl relative z-10 flex flex-col items-center animate-scale-in">
                        <img src="https://i.ibb.co/qLw7Tcqv/logo-Dr-shahenda-original.png" className="w-56 mb-8 drop-shadow-[0_0_15px_rgba(245,158,11,0.2)]" />
                        <div className="w-full space-y-3 mb-4 text-right">
                            <label className="block text-gray-400 text-xs font-bold">اسم المستخدم</label>
                            <input autoFocus autoComplete="username" autoCapitalize="none" spellCheck="false" dir="ltr" value={user} onChange={e => setUser(e.target.value)} className={field} />
                            <label className="block text-gray-400 text-xs font-bold pt-1">كلمة السر</label>
                            <div className="relative">
                                <input ref={passRef} type={show ? 'text' : 'password'} autoComplete="current-password" dir="ltr" value={pass} onChange={e => setPass(e.target.value)} className={field + ' pl-16'} />
                                <button type="button" onClick={() => setShow(!show)} className="absolute left-3 top-1/2 -translate-y-1/2 text-[11px] font-black text-gray-400 hover:text-gold-500">{show ? 'إخفاء' : 'إظهار'}</button>
                            </div>
                        </div>
                        {err && <p className="w-full text-red-400 text-sm font-bold mb-3 bg-red-500/10 rounded-xl py-2">{err}</p>}
                        <label className="flex items-center gap-2 text-gray-400 text-sm font-bold mb-6 cursor-pointer hover:text-gold-500 transition-colors self-start">
                            <input type="checkbox" checked={rememberMe} onChange={(e) => setRememberMe(e.target.checked)} className="rounded" />
                            تذكرني على الجهاز ده
                        </label>
                        <button type="submit" disabled={busy || !user.trim() || !pass} className="w-full bg-gradient-to-r from-gold-600 to-gold-400 text-black font-black py-4 rounded-2xl shadow-lg hover:scale-[1.02] transition-transform text-lg disabled:opacity-50 disabled:hover:scale-100">{busy ? 'جاري الدخول...' : 'تـسـجـيـل الـدخـول'}</button>
                        <button type="button" onClick={() => setRecover(true)} className="mt-4 text-xs font-bold text-gray-500 hover:text-gold-500">نسيتي بيانات دخول السوبر أدمن؟</button>
                    </form>
                </div>
            );
        }

        function SidebarItem({ icon, label, active, onClick }) {
            return (
                <button type="button" onClick={onClick} className={`w-full flex items-center gap-4 p-4 rounded-2xl transition-all duration-200 ${active ? 'bg-gold-500 text-white shadow-md shadow-gold-500/30' : 'text-gray-500 hover:bg-gray-50 hover:text-gold-600'}`}>
                    <span className={active ? 'text-white' : 'text-gray-400'}>{icon}</span>
                    <span className="font-bold text-sm tracking-tight">{label}</span>
                </button>
            );
        }

        // ===== لوحة التحكم =====
        const sumAmt = a => Math.round(a.reduce((s, x) => s + (Number(x.amount) || 0), 0));
        const fmtN = n => Number(n || 0).toLocaleString('en-US');
        const AR_MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
        const dayShift = (d, n) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return x.toLocaleDateString('en-CA'); };

        // عمود بيانات واحد (لون واحد) + قيمة تظهر باللمس/الماوس
        function MiniBars({ points, unit = '', height = 150 }) {
            const [hover, setHover] = useState(null);
            const max = Math.max(1, ...points.map(p => p.v));
            const W = 100 / points.length;
            return (
                <div className="relative" dir="ltr">
                    <svg viewBox={`0 0 100 ${height}`} preserveAspectRatio="none" className="w-full" style={{ height }}>
                        {[0.25, 0.5, 0.75, 1].map(g => <line key={g} x1="0" x2="100" y1={height - 18 - (height - 30) * g} y2={height - 18 - (height - 30) * g} stroke="#F3F4F6" strokeWidth="0.4" vectorEffect="non-scaling-stroke" />)}
                        {points.map((p, i) => {
                            const h = (height - 30) * p.v / max, x = i * W + W * 0.18, w = W * 0.64;
                            return <g key={i} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} onClick={() => setHover(hover === i ? null : i)} style={{ cursor: 'pointer' }}>
                                <rect x={i * W} y="0" width={W} height={height - 18} fill="transparent" />
                                <rect x={x} y={height - 18 - Math.max(h, p.v ? 1.5 : 0)} width={w} height={Math.max(h, p.v ? 1.5 : 0)} rx="1" fill={hover === i || p.hl ? '#B45309' : '#F59E0B'} opacity={hover === null || hover === i ? 1 : 0.55} />
                            </g>;
                        })}
                    </svg>
                    <div className="absolute inset-x-0 bottom-0 flex text-[9px] text-gray-400 font-bold">{points.map((p, i) => <span key={i} className="text-center truncate" style={{ width: W + '%' }}>{p.l}</span>)}</div>
                    {hover !== null && <div className="absolute -top-1 bg-gray-900 text-white text-[10px] font-black px-2 py-1 rounded-lg pointer-events-none whitespace-nowrap" style={{ left: `calc(${(hover + 0.5) * W}% )`, transform: 'translateX(-50%)' }}>{points[hover].t || points[hover].l}: {fmtN(points[hover].v)}{unit}</div>}
                </div>
            );
        }
        function RankBars({ rows, unit = '', empty }) {
            if (!rows.length) return <p className="text-xs text-gray-400 font-bold py-6 text-center">{empty}</p>;
            const max = Math.max(1, ...rows.map(r => r.v));
            return <div className="space-y-2.5">{rows.map(r => (
                <div key={r.l}>
                    <div className="flex justify-between text-[11px] font-bold mb-1"><span className="text-gray-700 truncate">{r.l}</span><span className="text-gray-900 font-black">{fmtN(r.v)}{unit}</span></div>
                    <div className="h-2 bg-gray-100 rounded-full overflow-hidden"><div className="h-full bg-gold-500 rounded-full" style={{ width: (r.v / max * 100) + '%' }}></div></div>
                </div>))}</div>;
        }
        function Panel({ title, sub, children, action }) {
            return <div className="bg-white rounded-[20px] border border-gray-100 shadow-sm p-4 sm:p-5">
                <div className="flex items-start justify-between gap-2 mb-4"><div><h4 className="text-sm font-black text-gray-800">{title}</h4>{sub && <p className="text-[10px] text-gray-400 font-bold mt-0.5">{sub}</p>}</div>{action}</div>
                {children}</div>;
        }

        function DashboardStats({ data, userRole, onNav, selectedBranch, staff = [] }) {
            const [period, setPeriod] = useState('month');
            const isSuper = userRole === 'superadmin', isAdm = isSuper || userRole === 'admin';
            const today = localDay();
            const PER = {
                today: { l: 'النهاردة', from: today, prevFrom: dayShift(today, -1), prevTo: dayShift(today, -1) },
                week: { l: 'آخر 7 أيام', from: dayShift(today, -6), prevFrom: dayShift(today, -13), prevTo: dayShift(today, -7) },
                month: { l: 'الشهر ده', from: today.slice(0, 7) + '-01', prevFrom: (() => { const d = new Date(today.slice(0, 7) + '-01T00:00:00'); d.setMonth(d.getMonth() - 1); return d.toLocaleDateString('en-CA'); })(), prevTo: dayShift(today.slice(0, 7) + '-01', -1) }
            }[period];
            // المقارنة بالفترة اللي قبلها محتاجة بيانات أقدم من نافذة التحميل
            useEffect(() => { WIN.need('appointments', PER.prevFrom); WIN.need('payments', PER.prevFrom); }, [period]);
            const inP = d => d && d >= PER.from && d <= today;
            const inPrev = d => d && d >= PER.prevFrom && d <= PER.prevTo;
            const apps = data.appointments;
            const pApps = apps.filter(a => inP(a.date));
            const live = pApps.filter(a => a.status !== 'canceled' && a.status !== 'postponed');
            const attended = pApps.filter(a => a.status === 'arrived' || a.status === 'done').length;
            const dueForAttend = live.filter(a => a.date < today || a.status === 'arrived' || a.status === 'done').length;
            const attendRate = dueForAttend ? Math.round(attended / dueForAttend * 100) : null;
            const canceled = pApps.filter(a => a.status === 'canceled').length;
            const online = pApps.filter(a => a.source === 'online').length;
            const todayApps = apps.filter(a => a.date === today).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
            const tomorrow = dayShift(today, 1);
            const tmrUnconfirmed = apps.filter(a => a.date === tomorrow && (!a.status || a.status === 'unconfirmed' || a.status === 'booked'));
            const followDue = (data.followups || []).filter(p => p.followUpDate && !p.followedAt && p.followUpDate <= today);
            const atLab = data.labCases.filter(c => c.status !== 'returned');
            const labLate = data.labCases.filter(labDue);
            const unpaid = data.dues.filter(d => !d.paid), overdue = unpaid.filter(d => d.dueDate && d.dueDate < today);
            const rev = sumAmt(data.payments.filter(p => inP(p.date))), revPrev = sumAmt(data.payments.filter(p => inPrev(p.date)));
            const revDelta = revPrev ? Math.round((rev - revPrev) / revPrev * 100) : null;
            const appsPrev = apps.filter(a => inPrev(a.date)).length;
            const appsDelta = appsPrev ? Math.round((pApps.length - appsPrev) / appsPrev * 100) : null;

            const days14 = Array.from({ length: 14 }, (_, i) => dayShift(today, i - 13));
            const bookingPts = days14.map(d => ({ l: d.slice(8), t: d, v: apps.filter(a => a.date === d && a.status !== 'canceled').length, hl: d === today }));
            const months6 = Array.from({ length: 6 }, (_, i) => { const d = new Date(today.slice(0, 7) + '-01T00:00:00'); d.setMonth(d.getMonth() - 5 + i); return d.toLocaleDateString('en-CA').slice(0, 7); });
            const revPts = months6.map(m => ({ l: AR_MONTHS[+m.slice(5) - 1].slice(0, 5), t: AR_MONTHS[+m.slice(5) - 1] + ' ' + m.slice(0, 4), v: sumAmt(data.payments.filter(p => (p.date || '').slice(0, 7) === m)) }));
            const count = (arr, key) => Object.entries(arr.reduce((o, x) => { const k = key(x); if (k) o[k] = (o[k] || 0) + 1; return o; }, {})).map(([l, v]) => ({ l, v })).sort((a, b) => b.v - a.v).slice(0, 6);
            const topServices = count(live, a => (a.service || '').trim());
            const docName = id => (staff.find(s => s.id === id) || {}).name;
            const byDoctor = count(live, a => a.doctorName || docName(a.doctorId)).map(r => ({ ...r, l: 'د. ' + r.l }));
            const branchRows = selectedBranch === 'all' && isAdm ? data.branches.map(b => {
                const ba = pApps.filter(a => a.branchId === b.id), bl = ba.filter(a => a.status !== 'canceled' && a.status !== 'postponed');
                const att = ba.filter(a => a.status === 'arrived' || a.status === 'done').length, due = bl.filter(a => a.date < today || a.status === 'arrived' || a.status === 'done').length;
                return { b, apps: ba.length, att: due ? Math.round(att / due * 100) : null, lab: atLab.filter(c => c.branchId === b.id).length, short: data.shortages.filter(x => x.branchId === b.id).length, rev: sumAmt(data.payments.filter(p => p.branchId === b.id && inP(p.date))), dues: sumAmt(unpaid.filter(d => d.branchId === b.id)) };
            }) : [];

            const Delta = ({ v }) => v === null ? null : <span className={`text-[10px] font-black px-1.5 py-0.5 rounded-md ${v >= 0 ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-600'}`} dir="ltr">{v >= 0 ? '▲' : '▼'} {Math.abs(v)}%</span>;
            const Kpi = ({ label, value, sub, tab, delta, tone }) => (
                <button type="button" onClick={() => tab && onNav(tab)} className="text-right bg-white p-4 rounded-[20px] border border-gray-100 shadow-sm hover:-translate-y-0.5 hover:shadow-md transition-all">
                    <p className="text-[10px] font-black text-gray-400 mb-1.5">{label}</p>
                    <div className="flex items-center gap-2 flex-wrap"><p className={`text-2xl font-black tracking-tight ${tone || 'text-gray-900'}`}>{value}</p><Delta v={delta ?? null} /></div>
                    {sub && <p className="text-[10px] font-bold text-gray-500 mt-1">{sub}</p>}
                </button>);
            const attention = [
                tmrUnconfirmed.length && { t: `${tmrUnconfirmed.length} حجز بكرة لسه مش مؤكد — ابعتي تذكير`, tab: 'appointments', c: 'bg-indigo-50 text-indigo-700' },
                followDue.length && { t: `${followDue.length} مريض محتاج متابعة`, tab: 'followups', c: 'bg-amber-50 text-amber-700' },
                labLate.length && { t: `${labLate.length} حالة معمل اتأخرت — اطلبيها`, tab: 'labs', c: 'bg-orange-50 text-orange-700' },
                isAdm && overdue.length && { t: `${overdue.length} فاتورة عدّى ميعاد سدادها (${fmtN(sumAmt(overdue))} ج)`, tab: 'dues', c: 'bg-red-50 text-red-600' },
                data.shortages.length && { t: `${data.shortages.length} صنف ناقص`, tab: 'shortages', c: 'bg-gray-100 text-gray-700' }
            ].filter(Boolean);
            const dateTxt = new Intl.DateTimeFormat('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
            const scope = selectedBranch === 'all' ? 'كل الفروع' : 'فرع ' + ((data.branches.find(b => b.id === selectedBranch) || {}).name || '');

            return (
                <div className="space-y-4 animate-fade-in">
                    <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-3">
                        <div><h3 className="text-xl font-black text-gray-900">لوحة التحكم</h3><p className="text-xs font-bold text-gray-400 mt-0.5">{dateTxt} • {scope}</p></div>
                        <div className="flex bg-gray-100 p-1 rounded-xl">{['today', 'week', 'month'].map(k => <button key={k} type="button" onClick={() => setPeriod(k)} className={`flex-1 sm:flex-none px-4 py-1.5 text-xs font-bold rounded-lg ${period === k ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>{{ today: 'النهاردة', week: 'الأسبوع', month: 'الشهر' }[k]}</button>)}</div>
                    </div>

                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                        <Kpi label={'الحجوزات — ' + PER.l} value={fmtN(pApps.length)} delta={appsDelta} sub={`${online} أونلاين • ${canceled} كنسل`} tab="appointments" />
                        <Kpi label="نسبة الحضور" value={attendRate === null ? '—' : attendRate + '%'} sub={`${attended} حضروا`} tab="appointments" tone={attendRate !== null && attendRate < 70 ? 'text-red-600' : 'text-gray-900'} />
                        <Kpi label="حجوزات النهاردة" value={fmtN(todayApps.length)} sub={`${todayApps.filter(a => a.status === 'arrived' || a.status === 'done').length} حضروا لحد دلوقتي`} tab="appointments" />
                        {isSuper ? <Kpi label={'الإيراد — ' + PER.l} value={fmtN(rev) + ' ج'} delta={revDelta} sub={revPrev ? 'الفترة اللي قبلها: ' + fmtN(revPrev) + ' ج' : ''} tab="finance" />
                            : <Kpi label="متابعات مستحقة" value={fmtN(followDue.length)} sub="مرضى محتاجين اتصال" tab="patients" tone={followDue.length ? 'text-amber-600' : 'text-gray-900'} />}
                        <Kpi label="حالات عند المعمل" value={fmtN(atLab.length)} sub={labLate.length ? labLate.length + ' متأخرة' : 'مفيش متأخر'} tab="labs" tone={labLate.length ? 'text-orange-600' : 'text-gray-900'} />
                        <Kpi label="النواقص" value={fmtN(data.shortages.length)} sub="أصناف مطلوبة" tab="shortages" />
                        {isAdm && <Kpi label="مستحقات غير مسددة" value={fmtN(sumAmt(unpaid)) + ' ج'} sub={overdue.length ? overdue.length + ' متأخرة' : unpaid.length + ' فاتورة'} tab="dues" tone={overdue.length ? 'text-red-600' : 'text-gray-900'} />}
                        <Kpi label="سجل المرضى" value={fmtN(data.patients.length)} sub={followDue.length + ' محتاج متابعة'} tab="patients" />
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-3">
                        <div className="lg:col-span-2"><Panel title="الحجوزات — آخر 14 يوم" sub="من غير الملغي • العمود الغامق = النهاردة"><MiniBars points={bookingPts} unit=" حجز" /></Panel></div>
                        <Panel title="محتاج انتباهك" sub={attention.length ? '' : 'كله تمام'}>

        function ShortagesView({ focusIds, onBuy, shortages, branches, currentUser, selectedBranch, onConfirm, onEdit, showToast }) {
            const [itemName, setItemName] = useState('');
            const [quantity, setQuantity] = useState('');
            const sc = staffScope(currentUser, branches), myBr = sc ? branches.filter(b => sc.includes(b.id)) : branches, isEmp = currentUser.role === 'employee';
            const [branchId, setBranchId] = useState(selectedBranch !== 'all' ? selectedBranch : (isEmp && myBr[0] ? myBr[0].id : 'store'));

            const [q, setQ] = useState('');
            const sortedShortages = useMemo(() => shortages.filter(x => textHit(x, ['itemName', 'quantity', 'requestedBy'], q)).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)), [shortages, q]);

            const groupedShortages = useMemo(() => {
                if (selectedBranch !== 'all') return { [selectedBranch]: sortedShortages };
                const groups = {};
                sortedShortages.forEach(s => {
                    const bId = s.branchId || 'unknown';
                    if (!groups[bId]) groups[bId] = [];
                    groups[bId].push(s);
                });
                return groups;
            }, [sortedShortages, selectedBranch]);

            useEffect(() => { if (focusIds && focusIds.length) setTimeout(() => document.getElementById('short-' + focusIds[0])?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300); }, [focusIds]);
            const handleAdd = (e) => {
                e.preventDefault();
                if (!itemName || !quantity) return;
                db.collection('shortages').add({ itemName, quantity, branchId, requestedBy: currentUser.name, timestamp: new Date().toISOString() })
                .then(ref => { const bn = branches.find(b => b.id === branchId)?.name || ''; tgSend(tgText('shortages', { itemName, quantity, branchId }, bn, '', currentUser.name, ref.id), branchId, 'shortage'); setItemName(''); setQuantity(''); showToast("تم إضافة الصنف للمخزن"); })
                .catch(err => showToast("مشكلة في إضافة صنف: " + err.message));
            };

            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <h3 className="text-lg font-black text-gray-800">النواقص</h3>
                    <div className="bg-white p-4 rounded-[20px] border border-gray-100 shadow-sm">
                        <form onSubmit={handleAdd} className="flex flex-col md:flex-row gap-3 items-end">
                            <div className="flex-1 w-full">
                                <label className="text-[9px] font-black text-gray-400 uppercase tracking-widest block mb-1">اسم الصنف</label>
                                <input type="text" required value={itemName} onChange={e=>setItemName(e.target.value)} placeholder="مثال: كمامات..." className="w-full bg-gray-50 border border-gray-100 focus:border-gold-500 p-2.5 rounded-lg outline-none font-bold text-gray-800 text-xs" />
                            </div>
                            <div className="w-full md:w-28">
                                <label className="text-[9px] font-black text-gray-400 uppercase tracking-widest block mb-1">الكمية</label>
                                <input type="text" required value={quantity} onChange={e=>setQuantity(e.target.value)} placeholder="مثال: 5" className="w-full bg-gray-50 border border-gray-100 focus:border-gold-500 p-2.5 rounded-lg outline-none font-bold text-gray-800 text-xs text-center" />
                            </div>
                            
                            {(!isEmp || myBr.length > 1) && (
                                <div className="w-full md:w-40">
                                    <label className="text-[9px] font-black text-gray-400 uppercase tracking-widest block mb-1">الفرع / المخزن</label>
                                    <select value={branchId} onChange={e=>setBranchId(e.target.value)} className="w-full bg-gray-50 border border-gray-100 focus:border-gold-500 p-2.5 rounded-lg outline-none font-bold text-gray-800 text-xs cursor-pointer">
                                        {!isEmp && <option value="store">المخزن (الرئيسي)</option>}
                                        {myBr.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
                                    </select>
                                </div>
                            )}
                            <button type="submit" className="w-full md:w-auto bg-gold-500 text-white px-6 py-2.5 rounded-lg font-black text-xs shadow-md hover:bg-gold-600 transition-colors">أضف +</button>
                        </form>
                    </div>
                    {shortages.length > 3 && <SearchBar value={q} onChange={setQ} placeholder="دوّر في النواقص باسم الصنف أو اللي طلبه" />}

                    <div className="bg-white rounded-[20px] border border-gray-100 shadow-sm p-3 sm:p-4 space-y-4">
                        {Object.keys(groupedShortages).length === 0 ? (
                            <div className="p-4 text-center text-gray-400 font-bold text-xs">لا توجد نواقص مسجلة.</div>
                        ) : (
                            Object.entries(groupedShortages).map(([bId, bShortages]) => {
                                if(bShortages.length === 0) return null;
                                const bName = bId === 'store' ? 'المخزن الرئيسي' : (branches.find(b=>b.id===bId)?.name || 'غير معروف');
                                return (
                                    <div key={bId} className="mb-2">
                                        <div className="flex items-center gap-3 mb-2 mt-1">
                                            <span className="text-[10px] font-black bg-gradient-to-r from-gold-500 to-gold-600 text-white px-3 py-1 rounded-lg shadow-sm border border-gold-400">{bName}</span>
                                            <div className="h-px bg-gradient-to-l from-gold-200 to-transparent flex-1 rounded-full"></div>
                                        </div>
                                        <div className="space-y-2">
                                            {bShortages.map(item => {
                                                const d = new Date(item.timestamp).toLocaleDateString('en-GB');
                                                return (
                                                    <div key={item.id} id={'short-' + item.id} className={`flex flex-col sm:flex-row justify-between items-start sm:items-center p-3 rounded-xl border gap-3 ${focusIds?.includes(item.id) ? 'bg-gold-50 border-gold-500 ring-2 ring-gold-400' : 'bg-gray-50 border-gray-100'}`}>
                                                        <div>
                                                            <div className="flex items-center gap-2">
                                                                <span className="font-black text-gray-800 text-xs sm:text-sm">{item.itemName}</span>
                                                                <span className="bg-gold-100 text-gold-700 px-1.5 py-0.5 rounded-md text-[10px] font-bold">{item.quantity}</span>
                                                            </div>
                                                            <div className="text-[9px] text-gray-500 flex flex-wrap gap-2 mt-1 items-center">
                                                                <span className="flex items-center gap-0.5"><IconUserCircle/> {item.requestedBy}</span>
                                                                <span dir="ltr" className="text-gray-400 font-mono">{d}</span>
                                                            </div>
                                                        </div>
                                                        
                                                        <div className="flex items-center gap-1.5 shrink-0">
                                                            <button type="button" onClick={() => onEdit(item)} className="bg-white text-gold-500 hover:bg-gold-500 hover:text-white p-1.5 rounded-lg border border-gray-200 transition-colors">
                                                                <IconEdit />
                                                            </button>
                                                            <button type="button" onClick={() => onBuy(item)} className="bg-emerald-50 text-emerald-600 hover:bg-emerald-500 hover:text-white px-2 py-1 rounded-md font-bold text-[9px] border border-emerald-100 transition-colors whitespace-nowrap">
                                                                ✅ تم الشراء
                                                            </button>
                                                            <button type="button" onClick={() => onConfirm({ msg: 'حذف "' + item.itemName + '" من النواقص؟', onConfirm: () => trashDelete('shortages', item.id).then(() => showToast('تم الحذف')).catch(err => showToast('مشكلة في الحذف: ' + err.message)) })} className="p-1.5 text-red-500 bg-red-50 hover:bg-red-500 hover:text-white rounded-lg border border-red-100 transition-colors" title="حذف">
                                                                <IconTrash />
                                                            </button>
                                                        </div>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>
                                )
                            })
                        )}
                    </div>
                </div>
            );
        }

        // --- المواعيد ---
        function AppointmentsView({ focusIds, apps, branches, currentUser, selectedBranch, onConfirm, onAdd, onFollow, onEdit, onNav, showToast }) {
            const [viewMode, setViewMode] = useState('daily'); 
            const [selectedDate, setSelectedDate] = useState(localDay());
            useEffect(() => { if (!focusIds || !focusIds.length) return; const a = apps.find(x => focusIds.includes(x.id)); if (a && a.date) { setSelectedDate(a.date); setViewMode('daily'); } setTimeout(() => document.getElementById('app-' + (a ? a.id : ''))?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 350); }, [focusIds]);

            // أي يوم/أسبوع/شهر بيتفتح في التقويم بيتحمّل لو مش محمّل
            useEffect(() => {
                let from = selectedDate, to = selectedDate;
                if (viewMode === 'weekly') to = dayShift(selectedDate, 6);
                if (viewMode === 'monthly') { from = selectedDate.slice(0, 7) + '-01'; const d = new Date(from + 'T00:00:00'); d.setMonth(d.getMonth() + 1); to = dayShift(d.toLocaleDateString('en-CA'), -1); }
                WIN.need('appointments', from, to);
            }, [selectedDate, viewMode]);
            // البحث في كل الحجوزات (القديمة والبعيدة) بالاسم أو الموبايل
            const [aq, setAq] = useState(''), [aRes, setARes] = useState(null);
            const searchApps = () => {
                const t = aq.trim(); if (t.length < 2) return;
                setARes('...');
                const col = db.collection('appointments'), qs = [col.orderBy('patientName').startAt(t).endAt(t + '\uf8ff').limit(40), col.where('phone', '==', t)];
                Promise.all(qs.map(q => q.get().catch(() => ({ docs: [] })))).then(rs => { const m = new Map(); rs.forEach(r => r.docs.forEach(x => m.set(x.id, { id: x.id, ...x.data() }))); setARes([...m.values()].filter(a => selectedBranch === 'all' || a.branchId === selectedBranch).sort((a, b) => (b.date || '').localeCompare(a.date || ''))); });
            };
            const filteredApps = useMemo(() => {
                let list = apps.filter(a => selectedBranch === 'all' || a.branchId === selectedBranch);
                list.sort((a, b) => {
                    const dA = a.date || ""; const dB = b.date || "";
                    if (dA !== dB) return dA.localeCompare(dB);
                    const tA = a.time || ""; const tB = b.time || "";
                    return tA.localeCompare(tB);
                });
                return list;
            }, [apps, selectedBranch]);

            const dailyApps = useMemo(() => filteredApps.filter(a => a.date === selectedDate), [filteredApps, selectedDate]);

            const groupedByBranchDaily = useMemo(() => {
                if (selectedBranch !== 'all') return { [selectedBranch]: dailyApps };
                const groups = {};
                dailyApps.forEach(a => {
                    const bId = a.branchId || 'unknown';
                    if (!groups[bId]) groups[bId] = [];
                    groups[bId].push(a);
                });
                return groups;
            }, [dailyApps, selectedBranch]);

            const weeklyDays = useMemo(() => {
                const days = [];
                for(let i=0; i<7; i++) {
                    const d = new Date(selectedDate);
                    d.setDate(d.getDate() + i);
                    const dStr = d.toISOString().split('T')[0];
                    const dayName = new Intl.DateTimeFormat('ar-EG', { weekday: 'long' }).format(d);
                    const dayApps = filteredApps.filter(a => a.date === dStr);
                    days.push({ date: dStr, dayName, apps: dayApps });
                }
                return days;
            }, [filteredApps, selectedDate]);

            const renderCalendar = () => {
                const date = new Date(selectedDate);
                const year = date.getFullYear(); const month = date.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const calendarDays = [];
                for (let i = 0; i < firstDay; i++) calendarDays.push({ empty: true });
                for (let i = 1; i <= daysInMonth; i++) {
                    const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                    const count = apps.filter(a => a.date === dStr && (selectedBranch === 'all' || a.branchId === selectedBranch)).length;
                    calendarDays.push({ d: i, date: dStr, count });
                }
                return (
                    <div className="bg-white rounded-[20px] border border-gray-100 shadow-sm overflow-hidden animate-slide-up mt-4">
                        <div className="grid grid-cols-7 bg-gray-50 border-b border-gray-100 text-center py-2 text-[9px] font-black text-gray-500">
                            <div>أحد</div><div>إثنين</div><div>ثلاثاء</div><div>أربعاء</div><div>خميس</div><div>جمعة</div><div>سبت</div>
                        </div>
                        <div className="calendar-grid">
                            {calendarDays.map((item, idx) => item.empty ? <div key={idx} className="calendar-cell bg-gray-50 opacity-30"></div> : (
                                <div key={idx} 
                                    onClick={() => { setSelectedDate(item.date); setViewMode('daily'); }}
                                    className={`calendar-cell ${item.date === selectedDate ? 'today' : ''}`}
                                >
                                    <span className="text-xs font-bold">{item.d}</span>
                                    {item.count > 0 && <span className="text-[8px] font-black text-gold-600 mt-1 bg-gold-50 px-1.5 rounded">{item.count} حجز</span>}
                                    {item.count > 0 && <span className="dot"></span>}
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-3">
                        <h3 className="text-lg font-black text-gray-800">إدارة المواعيد</h3>
                        <div className="flex bg-gray-100 p-1 rounded-xl w-full lg:w-auto">
                            <button type="button" onClick={() => setViewMode('daily')} className={`flex-1 px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode==='daily' ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>يومي</button>
                            <button type="button" onClick={() => setViewMode('weekly')} className={`flex-1 px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode==='weekly' ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>أسبوعي</button>
                            <button type="button" onClick={() => setViewMode('monthly')} className={`flex-1 px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode==='monthly' ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>شهري</button>
                        </div>
                        <input type="date" value={selectedDate} onChange={(e)=>setSelectedDate(e.target.value)} className="w-full lg:w-auto bg-white border border-gray-200 text-xs font-bold p-2 rounded-xl outline-none focus:border-gold-500"/>
                        
                        <div className="flex gap-2 w-full lg:w-auto">
                            {currentUser.role !== 'doctor' && <button type="button" onClick={onAdd} className="w-full lg:w-auto bg-gold-500 text-white px-5 py-2 rounded-xl text-xs font-black shadow-md hover:bg-gold-600 transition-colors">+ حجز</button>}
                            {currentUser.role !== 'doctor' && onFollow && <button type="button" onClick={() => onFollow()} className="w-full lg:w-auto bg-white border border-gold-300 text-gold-700 px-4 py-2 rounded-xl text-xs font-black hover:bg-gold-50 transition-colors">+ متابعة</button>}
                        </div>
                    </div>

                    {currentUser.role !== 'doctor' && <div className="space-y-2">
                        <div className="flex gap-2"><input value={aq} onChange={e => { setAq(e.target.value); if (!e.target.value) setARes(null); }} onKeyDown={e => { if (e.key === 'Enter') searchApps(); }} placeholder="🔎 دوّر على حجز في كل الأيام (أول الاسم أو الموبايل كامل)" className="flex-1 bg-white border border-gray-200 focus:border-gold-500 p-2.5 rounded-xl text-xs font-bold outline-none" />
                            <button type="button" onClick={searchApps} className="bg-gray-800 text-white px-4 rounded-xl text-xs font-black">بحث</button></div>
                        {aRes === '...' && <p className="text-[11px] font-bold text-gray-400">بيدوّر...</p>}
                        {Array.isArray(aRes) && <div className="bg-white border border-gray-100 rounded-xl p-2 space-y-1 max-h-64 overflow-y-auto">
                            {!aRes.length && <p className="text-[11px] font-bold text-gray-400 p-1">مفيش نتايج.</p>}
                            {aRes.map(a => <button type="button" key={a.id} onClick={() => { setSelectedDate(a.date); setViewMode('daily'); setARes(null); setTimeout(() => document.getElementById('app-' + a.id)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 900); }} className="w-full flex items-center justify-between gap-2 text-start p-2 rounded-lg hover:bg-gold-50 text-[11px] font-bold">
                                <span className="truncate">{a.patientName} <span className="text-gray-400" dir="ltr">{a.phone}</span></span><span className="shrink-0 text-gray-500">{a.date} {a.time || ''} • {bLabel(branches, a.branchId)}{a.status === 'canceled' ? ' • كنسل' : ''}</span></button>)}
                        </div>}
                    </div>}

                    {viewMode === 'daily' && (
                        <div className="animate-slide-up">
                            {Object.keys(groupedByBranchDaily).length === 0 ? (
                                <div className="p-8 text-center text-gray-400 font-bold border border-dashed rounded-3xl bg-white text-sm">لا توجد مواعيد في هذا اليوم.</div>
                            ) : (
                                Object.entries(groupedByBranchDaily).map(([bId, bApps]) => {
                                    if(bApps.length === 0) return null;
                                    const bName = branches.find(b=>b.id===bId)?.name || 'العيادة';
                                    return (
                                        <div key={bId} className="mb-4">
                                            {selectedBranch === 'all' && (
                                                <div className="flex items-center gap-3 mb-4 mt-2">
                                                    <span className="text-xs font-black bg-gradient-to-r from-gold-500 to-gold-600 text-white px-4 py-1.5 rounded-lg shadow-md border border-gold-400">فرع {bName}</span>
                                                    <div className="h-0.5 bg-gradient-to-l from-gold-200 to-transparent flex-1 rounded-full"></div>
                                                </div>
                                            )}
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
                                                {bApps.map(a => (
                                                    <div key={a.id} id={'app-' + a.id} className={`bg-white p-2.5 rounded-xl border ${focusIds?.includes(a.id) ? 'border-gold-500 ring-2 ring-gold-400' : 'border-gray-100'} flex flex-col sm:flex-row sm:items-center justify-between gap-2 hover:bg-gray-50 transition-colors shadow-sm`}>
                                                        <div className="flex items-center gap-2 min-w-0">
                                                            <div className="bg-gold-50 text-gold-700 px-2 py-1 rounded-lg text-[10px] font-black shrink-0 tracking-widest">{a.time || '00:00'}</div>
                                                            <div className="min-w-0">
                                                                <h5 className="font-black text-gray-800 text-xs truncate leading-tight mb-0.5">{a.patientName}</h5>
                                                                <div className="flex flex-wrap items-center gap-1.5">
                                                                    <span className="text-[9px] font-mono font-bold text-gray-500 tracking-wider" dir="ltr">{a.phone || 'بدون رقم'}</span>
                                                                    {a.service && <span className="text-[8px] bg-blue-50 text-blue-600 px-1.5 rounded font-bold">{a.service}</span>}
                                                                    {a.estimate && <span className="text-[8px] bg-amber-50 text-amber-700 px-1.5 rounded font-bold">💳 {a.estimate}</span>}
                                                                    {a.extra && Object.entries(a.extra).map(([k, v]) => <span key={k} className="text-[8px] bg-gray-100 text-gray-600 px-1.5 rounded font-bold">{k}: {String(v)}</span>)}
                                                                    {a.doctorName && <span className="text-[8px] bg-purple-50 text-purple-600 px-1.5 rounded font-bold">د. {a.doctorName}</span>}
                                                                    {a.firstVisit && <span className="text-[8px] bg-blue-100 text-blue-700 px-1.5 rounded font-black">🆕 أول زيارة</span>}
                                                                    {(a.sessions || []).map((x, i) => <span key={i} className="text-[8px] bg-gold-100 text-gold-800 px-1.5 rounded font-black">🔢 {sessLabel(x)}</span>)}
                                                                    {a.needsSchedule && <span className="text-[8px] bg-red-100 text-red-700 px-1.5 rounded font-black animate-pulse" title="المريض حجز يوم مفيهوش دكتور فاضي — كلّميه وظبطي الميعاد (أو اختاري دكتور من تعديل الحجز)">⚠️ الميعاد مش متظبط — كلّميه</span>}
                                                                    {a.needsSchedule && currentUser.role !== 'doctor' && <button type="button" onClick={() => db.collection('appointments').doc(a.id).update({ needsSchedule: false, scheduledBy: currentUser.name, scheduledAt: new Date().toISOString() }).then(() => showToast('تمام — اتعلّم إنه اتظبط')).catch(e => showToast('مشكلة: ' + e.message))} className="text-[8px] bg-green-50 text-green-700 border border-green-200 px-1.5 rounded font-black">✓ اتظبط</button>}
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div className="flex gap-1 shrink-0 self-end sm:self-auto items-center"><StatusSelect a={a} showToast={showToast} />{(() => { const br = branches.find(b => b.id === a.branchId) || {}; return (<>{tplOn('reminder') && <WaMsg phone={a.phone} label="تذكير" text={fillT('reminder', { name: a.patientName, branch: br.name || '', date: a.date, time: a.time || '' })} />}{tplOn('review') && (a.status === 'done' || a.status === 'arrived') && <WaMsg phone={a.phone} label={a.reviewSent ? 'تقييم ✓' : 'تقييم'} text={fillT('review', { name: a.patientName, branch: br.name || '', link: br.reviewLink || br.mapsLink || '' })} />}</>); })()}{currentUser.role !== 'doctor' && (<>
                                                            {onFollow && <button type="button" title="ضيفه لسجل المتابعات" onClick={() => onFollow({ name: a.patientName, phone: a.phone || '', branchId: a.branchId, service: a.service || '', doctorId: a.doctorId && a.doctorId !== 'none' ? a.doctorId : '', appId: a.id })} className="px-1.5 py-1 bg-white border border-gray-200 text-blue-600 rounded-lg text-[9px] font-black hover:bg-blue-50">➕ متابعة</button>}
                                                            <button type="button" onClick={()=>onEdit(a)} className="p-1.5 bg-white border border-gray-200 text-gold-500 rounded-lg hover:bg-gold-500 hover:text-white transition-colors"><IconEdit/></button>
                                                            <button type="button" onClick={()=>onConfirm({msg:'إلغاء الموعد نهائياً؟', onConfirm:()=>{
                                                                trashDelete('appointments', a.id)
                                                                .then(() => showToast("تم إلغاء الموعد"))
                                                                .catch(err => showToast("مشكلة في حذف الموعد: " + err.message)); 
                                                            }})} className="p-1.5 bg-white border border-gray-200 text-red-500 rounded-lg hover:bg-red-500 hover:text-white transition-colors"><IconTrash/></button>
                                                        </>)}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )
                                })
                            )}
                        </div>
                    )}

                    {viewMode === 'weekly' && (
                        <div className="bg-white rounded-[20px] border border-gray-100 shadow-sm overflow-hidden animate-slide-up">
                            <div className="divide-y divide-gray-50">
                                {weeklyDays.map((day, idx) => (
                                    <div key={idx} onClick={() => { setSelectedDate(day.date); setViewMode('daily'); }} className="flex flex-col sm:flex-row sm:items-center justify-between p-4 hover:bg-gray-50 cursor-pointer transition-colors group">
                                        <div className="flex items-center gap-4 mb-2 sm:mb-0">
                                            <div className={`w-12 h-12 rounded-xl flex flex-col items-center justify-center border-2 ${day.date === localDay() ? 'bg-gold-50 border-gold-400 text-gold-700' : 'bg-white border-gray-100 text-gray-500 group-hover:border-gold-200'}`}>
                                                <span className="text-xs font-black">{day.date.split('-')[2]}</span>
                                            </div>
                                            <div>
                                                <h4 className="font-black text-gray-800 text-sm">{day.dayName}</h4>
                                                <p className="text-[10px] text-gray-400 font-mono">{day.date}</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            {day.apps.length > 0 ? (
                                                <div className="flex items-center gap-2 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100">
                                                    <span className="text-xs font-black text-blue-600">{day.apps.length} مواعيد</span>
                                                    <div className="flex -space-x-1.5 rtl:space-x-reverse">
                                                        {day.apps.slice(0,4).map((a,i) => <div key={i} className="w-5 h-5 rounded-full bg-white border border-blue-200 flex items-center justify-center text-[8px] font-bold text-blue-500 shadow-sm">{a.patientName.charAt(0)}</div>)}
                                                        {day.apps.length > 4 && <div className="w-5 h-5 rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center text-[8px] font-bold text-gray-500">+{day.apps.length-4}</div>}
                                                    </div>
                                                </div>
                                            ) : (
                                                <span className="text-[10px] text-gray-400 font-bold bg-gray-50 px-3 py-1 rounded-lg">لا يوجد حجز</span>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {viewMode === 'monthly' && renderCalendar()}
                </div>
            );
        }

        function BranchesView({ branches, onConfirm, onAdd, onEdit, showToast }) {
            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="flex justify-between items-center"><h3 className="text-lg font-black text-gray-800">إدارة الفروع</h3><button type="button" onClick={onAdd} className="bg-gold-500 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow-md hover:bg-gold-600">+ فرع جديد</button></div>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                        {branches.map(b => (
                            <div key={b.id} className="bg-white p-4 rounded-[20px] border border-gray-100 shadow-sm relative group flex flex-col h-full">
                                <div className="absolute top-2 left-2 flex gap-1">
                                    <button type="button" onClick={() => onEdit(b)} className="p-1.5 text-gold-500 bg-white border border-gray-200 rounded-lg hover:bg-gold-500 hover:text-white transition-colors"><IconEdit/></button>
                                    <button type="button" onClick={() => onConfirm({msg:'حذف الفرع؟', onConfirm:()=>{
                                        trashDelete('branches', b.id)
                                        .then(() => showToast("تم حذف الفرع"))
                                        .catch(err => showToast("مشكلة في الحذف: " + err.message)); 
                                    }})} className="p-1.5 text-red-500 bg-white border border-gray-200 rounded-lg hover:bg-red-500 hover:text-white transition-colors"><IconTrash/></button>
                                </div>
                                <div className="text-gold-500 mb-2 bg-gray-50 w-10 h-10 rounded-xl flex items-center justify-center"><IconBuilding/></div>
                                <h4 className="text-sm font-black text-gray-800 mb-0.5">{b.name}</h4>
                                <p className="text-[10px] font-bold text-gray-500 mb-1">{b.phone}</p>
                                {b.address && <p className="text-[9px] text-gray-400 mb-2 truncate" title={b.address}>{b.address}</p>}
                                
                                {b.mapsLink && (
                                    <a href={b.mapsLink} target="_blank" rel="noreferrer" className="inline-flex w-fit items-center gap-1 text-[9px] font-bold bg-blue-50 text-blue-600 px-2 py-1 rounded-lg hover:bg-blue-100 transition-colors mt-auto border border-blue-100">
                                        <IconMapPin /> عرض على الخريطة
                                    </a>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- سجل المرضى الجديد بتصميم الكروت للموبايل ---
        // "اعرض فترة أقدم": بيحمّل الشهر اللي تختاريه وكل اللي بعده (لحد ما السيستم يتقفل)
        function OlderLoader({ col, what = 'البيانات' }) {
            const [m, setM] = useState('');
            const from = WIN.from(col);
            return (
                <div className="flex flex-wrap items-center gap-2 text-[11px] font-bold text-gray-500 bg-gray-50 border border-dashed border-gray-200 rounded-xl px-3 py-2">
                    <span>📂 معروض {what} من {from} — لو محتاجة أقدم:</span>
                    <input type="month" value={m} onChange={e => setM(e.target.value)} className="bg-white border border-gray-200 rounded-lg px-2 py-1 text-[11px] font-bold outline-none" />
                    <button type="button" disabled={!m} onClick={() => WIN.need(col, m + '-01')} className="bg-gray-800 text-white px-3 py-1 rounded-lg text-[11px] font-black disabled:opacity-30">حمّل من الشهر ده</button>
                </div>
            );
        }

        // ===== سجل المتابعات: اللي كنسل أو أجّل من غير ميعاد (تلقائي) + أي مريض نضيفه يدوي عشان نتابع معاه =====
        const FU_REASON = { canceled: ['كنسل', 'bg-red-50 text-red-600'], postponed: ['أجّل من غير ميعاد', 'bg-amber-50 text-amber-700'], manual: ['متابعة', 'bg-blue-50 text-blue-700'] };
        function FollowupsView({ items, branches, staff = [], currentUser, focusId, onAdd, onEdit, onBook, onConfirm, showToast }) {
            const t = localDay();
            const [tab, setTab] = useState('open');
            const [q, setQ] = useState('');
            useEffect(() => { if (focusId) setTimeout(() => document.getElementById('fu-' + focusId)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 200); }, [focusId]);
            const upd = (x, d, m) => db.collection('followups').doc(x.id).update(d).then(() => m && showToast(m)).catch(e => showToast(e.message));
            const later = (x, n) => upd(x, { followUpDate: dayShift(x.followUpDate && x.followUpDate > t ? x.followUpDate : t, n), followRemind: false }, 'اتأجلت المتابعة ' + n + ' أيام');
            const open = items.filter(x => !x.followedAt), done = items.filter(x => x.followedAt);
            const due = open.filter(x => !x.followUpDate || x.followUpDate <= t);
            const list = (tab === 'open' ? open : done).filter(x => textHit(x, ['name', 'phone', 'service', 'note', 'lastEvent'], q))
                .sort((a, b) => tab === 'open' ? (a.followUpDate || '').localeCompare(b.followUpDate || '') : (b.followedAt || '').localeCompare(a.followedAt || ''));
            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="flex justify-between items-center gap-2">
                        <h3 className="text-lg font-black text-gray-800">سجل المتابعات</h3>
                        <button type="button" onClick={() => onAdd()} className="bg-gold-500 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow-md hover:bg-gold-600">+ متابعة جديدة</button>
                    </div>
                    <p className="text-[11px] font-bold text-gray-500 bg-white border border-gray-100 rounded-xl p-3">اللي بيكنسل أو بيأجّل من غير ميعاد جديد بيتسجل هنا لوحده. وتقدري تضيفي أي مريض محتاج متابعة (مثلاً كشف ومحتاج نكلمه) من هنا، أو من زرار "➕ متابعة" على كارت الحجز.</p>
                    <div className="flex gap-2 flex-wrap">
                        {[['open', 'محتاجين متابعة (' + open.length + ')' + (due.length ? ' — ' + due.length + ' النهاردة' : '')], ['done', 'خلصت (' + done.length + ')']].map(([k, n]) => <button key={k} type="button" onClick={() => setTab(k)} className={`px-3 py-1.5 rounded-lg text-xs font-black border ${tab === k ? 'bg-gold-500 text-white border-gold-500' : 'bg-white text-gray-600 border-gray-200'}`}>{n}</button>)}
                    </div>
                    <SearchBar value={q} onChange={setQ} placeholder="دوّر بالاسم أو الرقم أو الخدمة" />
                    <BranchGroups items={list} branches={branches} empty={tab === 'open' ? 'مفيش حد محتاج متابعة 👌' : 'مفيش متابعات خلصت في الفترة دي.'} render={x => {
                        const isDue = !x.followedAt && (!x.followUpDate || x.followUpDate <= t), rs = FU_REASON[x.reason] || FU_REASON.manual, bn = bLabel(branches, x.branchId);
                        return (
                        <div key={x.id} id={'fu-' + x.id} className={`bg-white p-4 rounded-[20px] border shadow-sm space-y-2 ${focusId === x.id ? 'border-gold-500 ring-2 ring-gold-400' : isDue ? 'border-amber-300' : 'border-gray-100'}`}>
                            <div className="flex items-start justify-between gap-2">
                                <div className="min-w-0"><h4 className="font-black text-gray-800 text-sm">{x.name}</h4><p className="text-[10px] text-gray-500 font-mono" dir="ltr">{x.phone || 'بدون رقم'}</p></div>
                                <div className="flex gap-1 shrink-0">
                                    <button type="button" onClick={() => onEdit(x)} className="p-1.5 text-gold-500 bg-gray-50 rounded-lg"><IconEdit/></button>
                                    <button type="button" onClick={() => onConfirm({ msg: 'حذف المتابعة دي؟ (هتتنقل لسلة المحذوفات)', onConfirm: () => trashDelete('followups', x.id).then(() => showToast('اتحذفت')).catch(e => showToast(e.message)) })} className="p-1.5 text-red-400 bg-gray-50 rounded-lg"><IconTrash/></button>
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-1">
                                <span className={`text-[10px] font-black px-1.5 py-0.5 rounded ${rs[1]}`}>{rs[0]}</span>
                                {x.service && <span className="text-[10px] font-black text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded">{x.service}</span>}
                                {x.doctorId && <span className="text-[10px] font-black text-purple-600 bg-purple-50 px-1.5 py-0.5 rounded">د. {(staff.find(s => s.id === x.doctorId) || {}).name || ''}</span>}
                            </div>
                            {x.lastEvent && <p className="text-[10px] font-bold text-gray-500">⚠️ {x.lastEvent}</p>}
                            {x.note && <p className="text-[11px] font-bold text-gray-700 bg-gray-50 rounded-lg p-2 whitespace-pre-line">📝 {x.note}</p>}
                            {x.followedAt ? <p className="text-[10px] font-black text-emerald-700 bg-emerald-50 rounded px-2 py-1 inline-block">✓ اتابعت {x.followedAt.slice(0, 10)}{x.followedBy ? ' — ' + x.followedBy : ''}{x.outcome ? ' • ' + x.outcome : ''}</p>
                            : <>
                                <p className={`text-[10px] font-black px-2 py-1 rounded-lg inline-block ${isDue ? 'bg-amber-100 text-amber-700' : 'bg-gray-100 text-gray-600'}`}>{isDue ? '📞 محتاج يتكلم النهاردة' : '📅 نكلمه يوم ' + x.followUpDate}</p>
                                <div className="flex gap-1.5 flex-wrap">
                                    {tplOn('followup') && x.phone && <WaMsg phone={x.phone} label="واتساب" text={fillT('followup', { name: x.name, branch: bn, service: x.service || '' })} />}
                                    <button type="button" onClick={() => onBook(x)} className="px-2 py-1.5 bg-gold-500 text-white rounded-lg text-[9px] font-bold">📅 احجزله</button>
                                    <button type="button" onClick={() => upd(x, { followedAt: new Date().toISOString(), followedBy: currentUser.name, outcome: 'اتكلمنا' }, 'اتسجلت ✓')} className="px-2 py-1.5 bg-emerald-500 text-white rounded-lg text-[9px] font-bold">✓ اتكلمنا</button>
                                    <button type="button" onClick={() => later(x, 3)} className="px-2 py-1.5 bg-gray-100 text-gray-600 rounded-lg text-[9px] font-bold">بعد 3 أيام</button>
                                    <button type="button" onClick={() => later(x, 7)} className="px-2 py-1.5 bg-gray-100 text-gray-600 rounded-lg text-[9px] font-bold">بعد أسبوع</button>
                                </div>
                            </>}
                            {x.recordedBy && <p className="text-[8px] text-gray-400">سجّلها: {x.recordedBy}</p>}
                        </div>); }} />
                    <OlderLoader col="followups" what="المتابعات اللي خلصت (والمفتوحة كلها)" />
                </div>
            );
        }

        function PatientsView({ staff = [], focusId, patients, branches, currentUser, onConfirm, onAdd, onEdit, showToast }) {
            const t = localDay();
            const upd = (p, d, m) => db.collection('patients').doc(p.id).update({ ...d, updatedAt: new Date().toISOString() }).then(() => showToast(m)).catch(e => showToast(e.message));
            const isDoc = currentUser.role === 'doctor';
            useEffect(() => { if (focusId) setTimeout(() => document.getElementById('pat-' + focusId)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 200); }, [focusId]);
            const [q, setQ] = useState('');
            useEffect(() => { WIN.search(q); }, [q]);
            useEffect(() => () => WIN.search(''), []);
            const qn = q.trim(), dig = qn.replace(/\D/g, '');
            const match = p => !qn || (p.name || '').includes(qn) || (dig.length >= 3 && String(p.phone || '').replace(/\D/g, '').includes(dig)) || String(p.fileNo || '') === qn;
            const sorted = patients.filter(match).sort((a, b) => (b.updatedAt || b.lastBooking || '').localeCompare(a.updatedAt || a.lastBooking || ''));
            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="flex justify-between items-center">
                        <h3 className="text-lg font-black text-gray-800">سجل المرضى</h3>
                        {!isDoc && <button type="button" onClick={onAdd} className="bg-gold-500 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow-md hover:bg-gold-600">+ مريض جديد</button>}
                    </div>
                    <div className="space-y-1">
                        <input value={q} onChange={e => setQ(e.target.value)} placeholder="🔎 دوّر باسم المريض أو رقمه أو رقم الملف (بيدوّر في كل المرضى)" className="w-full bg-white border border-gray-200 focus:border-gold-500 p-3 rounded-xl text-xs font-bold outline-none" />
                        {!isDoc && <p className="text-[10px] font-bold text-gray-400 px-1">{qn ? 'النتايج من كل السجل (الاسم بيدوّر من أوله).' : 'معروض المرضى اللي ملفهم اتسجل أو اتعدل آخر ' + WIN_BACK + ' يوم + اللي ليهم متابعة قريبة. أي مريض أقدم دوّري عليه بالبحث.'}</p>}
                    </div>
                    <BranchGroups items={sorted} branches={branches} empty={qn ? 'مفيش نتايج — جربي جزء من أول الاسم أو الرقم كامل.' : 'لا يوجد مرضى مسجلين حتى الآن.'} render={p => {
                        const due = false;
                        const bn = bLabel(branches, p.branchId);
                        return (
                        <div key={p.id} id={'pat-' + p.id} className={`bg-white p-4 rounded-[20px] border shadow-sm relative ${focusId === p.id ? 'border-gold-500 ring-2 ring-gold-400' : due ? 'border-amber-300' : 'border-gray-100'}`}>
                            {!isDoc && <div className="absolute top-4 left-4 flex gap-1.5">
                                <button type="button" onClick={() => onEdit(p)} className="p-1.5 text-gold-500 bg-gray-50 rounded-lg"><IconEdit/></button>
                                <button type="button" onClick={() => onConfirm({msg:'حذف ملف المريض؟ (هيتنقل لسلة المحذوفات ويفضل ' + TRASH_DAYS + ' يوم)', onConfirm:()=>trashDelete('patients', p.id).then(() => showToast("تم حذف ملف المريض")).catch(err => showToast("مشكلة في الحذف: " + err.message))})} className="p-1.5 text-red-500 bg-red-50 rounded-lg"><IconTrash/></button>
                            </div>}
                            <div className="flex items-start gap-3 mb-3">
                                <div className="w-12 h-12 rounded-xl bg-gold-50 text-gold-600 flex items-center justify-center font-black text-sm border border-gold-100 shrink-0">#{p.fileNo || '-'}</div>
                                <div className="pt-1"><h4 className="font-black text-gray-800 text-sm mb-0.5">{p.name}</h4><p className="text-[10px] text-gray-500 font-mono tracking-wider" dir="ltr">{p.phone}</p></div>
                            </div>
                            <div className="space-y-1 bg-gray-50 p-3 rounded-xl border border-gray-100 text-xs font-bold text-gray-700">
                                <p>📍 {p.address || 'غير مسجل'}</p>
                                <div className="flex flex-wrap gap-1">{(p.services && p.services.length ? p.services : [p.service || 'غير محدد']).map(x => <span key={x} className="text-[10px] font-black text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded">{x}</span>)}</div>
                                {p.doctorId && <p className="text-[10px] text-gray-500">👨‍⚕️ د. {staff.find(x => x.id === p.doctorId)?.name || ''}</p>}
                            </div>
                            {(p.firstVisit || p.lastBooking) && <p className="mt-2 text-[10px] font-bold text-gray-500">{p.firstVisit ? '🆕 أول زيارة: ' + p.firstVisit : ''}{p.firstVisit && p.lastBooking ? ' • ' : ''}{p.lastBooking ? 'آخر حجز: ' + p.lastBooking : ''}</p>}
                            {(currentUser.role === 'admin' || currentUser.role === 'superadmin') && p.recordedBy && <p className="mt-2 text-[8px] text-gray-400">سجّله: {p.recordedBy}</p>}
                        </div>); }} />
                </div>
            );
        }

        // سلة المحذوفات (للأدمن): ترجيع أو مسح نهائي. اللي عدّى عليه 30 يوم بيتمسح لوحده
        function TrashView({ showToast, branches = [] }) {
            const [items, setItems] = useState(null);
            const [f, setF] = useState('all');
            useEffect(() => db.collection('trash').orderBy('deletedAt', 'desc').limit(500).onSnapshot(s => setItems(s.docs.map(x => ({ id: x.id, ...x.data() }))), e => { showToast(e.message); setItems([]); }), []);

                                            : <p className="text-[11px] font-bold text-indigo-700">لو اتبعتت دلوقتي: هتوصل لـ {built.length} من {allR}{built.length < allR ? ' (الباقي متخطّى عشان الرقم = صفر)' : ''}</p>}
                                        {/\{[^{}]+\}/.test(built[0] ? built[0].text : '') && <p className="text-[11px] font-bold text-amber-700">⚠️ فيه كلمة بين أقواس السيستم مش فاهمها — استخدمي الزراير الزرقا.</p>}

                                    </div>

                                        <button type="button" onClick={() => { if (!TG.token || !TG.main) { showToast('محتاجة توكن وشات إدارة'); return; } const x = built[0]; tgPost(TG.main, '🧪 تجربة: ' + (m.name || '') + '\n\n' + (x ? x.text : cmRender(m.text, {}))).then(() => showToast('اتبعتت تجربة على شات الإدارة')).catch(e => showToast(e.message)); }} className="bg-gray-100 px-3 py-2 rounded-xl text-[11px] font-black">🧪 ابعت تجربة لشات الإدارة</button>

                    <button type="button" onClick={save} disabled={!dirty} className="w-full bg-gold-500 text-white py-3 rounded-xl font-black text-sm disabled:opacity-40">{dirty ? 'حفظ الرسايل' : 'محفوظ ✓'}</button>
