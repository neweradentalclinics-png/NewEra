                                                            </button>
                                                            <button type="button" onClick={() => onBuy(item)} className="bg-emerald-50 text-emerald-600 hover:bg-emerald-500 hover:text-white px-2 py-1 rounded-md font-bold text-[9px] border border-emerald-100 transition-colors whitespace-nowrap">
                                                                ✅ تم الشراء
                                                            </button>
                                                            <button type="button" onClick={() => onConfirm({ msg: 'حذف "' + item.itemName + '" من النواقص؟', onConfirm: () => db.collection('shortages').doc(item.id).delete().then(() => showToast('تم الحذف')).catch(err => showToast('مشكلة في الحذف: ' + err.message)) })} className="p-1.5 text-red-500 bg-red-50 hover:bg-red-500 hover:text-white rounded-lg border border-red-100 transition-colors" title="حذف">
                                                                <IconTrash />
                                                            </button>
                                                        </div>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>
                                )
                            })
                        )}
                    </div>
                </div>
            );
        }

        // --- المواعيد ---
        function AppointmentsView({ focusIds, apps, branches, currentUser, selectedBranch, onConfirm, onAdd, onEdit, onNav, showToast }) {
            const [viewMode, setViewMode] = useState('daily'); 
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            useEffect(() => { if (!focusIds || !focusIds.length) return; const a = apps.find(x => focusIds.includes(x.id)); if (a && a.date) { setSelectedDate(a.date); setViewMode('daily'); } setTimeout(() => document.getElementById('app-' + (a ? a.id : ''))?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 350); }, [focusIds]);

            const filteredApps = useMemo(() => {
                let list = apps.filter(a => selectedBranch === 'all' || a.branchId === selectedBranch);
                list.sort((a, b) => {
                    const dA = a.date || ""; const dB = b.date || "";
                    if (dA !== dB) return dA.localeCompare(dB);
                    const tA = a.time || ""; const tB = b.time || "";
                    return tA.localeCompare(tB);
                });
                return list;
            }, [apps, selectedBranch]);

            const dailyApps = useMemo(() => filteredApps.filter(a => a.date === selectedDate), [filteredApps, selectedDate]);

            const groupedByBranchDaily = useMemo(() => {
                if (selectedBranch !== 'all') return { [selectedBranch]: dailyApps };
                const groups = {};
                dailyApps.forEach(a => {
                    const bId = a.branchId || 'unknown';
                    if (!groups[bId]) groups[bId] = [];
                    groups[bId].push(a);
                });
                return groups;
            }, [dailyApps, selectedBranch]);

            const weeklyDays = useMemo(() => {
                const days = [];
                for(let i=0; i<7; i++) {
                    const d = new Date(selectedDate);
                    d.setDate(d.getDate() + i);
                    const dStr = d.toISOString().split('T')[0];
                    const dayName = new Intl.DateTimeFormat('ar-EG', { weekday: 'long' }).format(d);
                    const dayApps = filteredApps.filter(a => a.date === dStr);
                    days.push({ date: dStr, dayName, apps: dayApps });
                }
                return days;
            }, [filteredApps, selectedDate]);

            const handleManualCleanup = () => {
                onConfirm({
                    msg: 'هل أنت متأكد من مسح جميع المواعيد التي مر عليها أكثر من شهر؟ (إجراء آمن)',
                    onConfirm: () => {
                        const oneMonthAgo = new Date();
                        oneMonthAgo.setMonth(oneMonthAgo.getMonth() - 1);
                        const cutoffDate = oneMonthAgo.toISOString().split('T')[0];
                        
                        const old = apps.filter(app => app.date && app.date < cutoffDate);
                        if (old.length === 0) { showToast("مفيش مواعيد أقدم من شهر."); return; }
                        old.forEach(app => {
                            db.collection('appointments').doc(app.id).delete()
                            .catch(err => showToast("خطأ في مسح موعد: " + err.message));
                        });
                        showToast("تم مسح " + old.length + " موعد قديم.");
                    }
                });
            };

            const renderCalendar = () => {
                const date = new Date(selectedDate);
                const year = date.getFullYear(); const month = date.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const calendarDays = [];
                for (let i = 0; i < firstDay; i++) calendarDays.push({ empty: true });
                for (let i = 1; i <= daysInMonth; i++) {
                    const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                    const count = apps.filter(a => a.date === dStr && (selectedBranch === 'all' || a.branchId === selectedBranch)).length;
                    calendarDays.push({ d: i, date: dStr, count });
                }
                return (
                    <div className="bg-white rounded-[20px] border border-gray-100 shadow-sm overflow-hidden animate-slide-up mt-4">
                        <div className="grid grid-cols-7 bg-gray-50 border-b border-gray-100 text-center py-2 text-[9px] font-black text-gray-500">
                            <div>أحد</div><div>إثنين</div><div>ثلاثاء</div><div>أربعاء</div><div>خميس</div><div>جمعة</div><div>سبت</div>
                        </div>
                        <div className="calendar-grid">
                            {calendarDays.map((item, idx) => item.empty ? <div key={idx} className="calendar-cell bg-gray-50 opacity-30"></div> : (
                                <div key={idx} 
                                    onClick={() => { setSelectedDate(item.date); setViewMode('daily'); }}
                                    className={`calendar-cell ${item.date === selectedDate ? 'today' : ''}`}
                                >
                                    <span className="text-xs font-bold">{item.d}</span>
                                    {item.count > 0 && <span className="text-[8px] font-black text-gold-600 mt-1 bg-gold-50 px-1.5 rounded">{item.count} حجز</span>}
                                    {item.count > 0 && <span className="dot"></span>}
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-3">
                        <h3 className="text-lg font-black text-gray-800">إدارة المواعيد</h3>
                        <div className="flex bg-gray-100 p-1 rounded-xl w-full lg:w-auto">
                            <button type="button" onClick={() => setViewMode('daily')} className={`flex-1 px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode==='daily' ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>يومي</button>
                            <button type="button" onClick={() => setViewMode('weekly')} className={`flex-1 px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode==='weekly' ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>أسبوعي</button>
                            <button type="button" onClick={() => setViewMode('monthly')} className={`flex-1 px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode==='monthly' ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>شهري</button>
                        </div>
                        <input type="date" value={selectedDate} onChange={(e)=>setSelectedDate(e.target.value)} className="w-full lg:w-auto bg-white border border-gray-200 text-xs font-bold p-2 rounded-xl outline-none focus:border-gold-500"/>
                        
                        <div className="flex gap-2 w-full lg:w-auto">
                            {currentUser.role === 'superadmin' && (
                                <button type="button" onClick={handleManualCleanup} className="w-full lg:w-auto bg-red-50 text-red-600 border border-red-200 px-3 py-2 rounded-xl text-[10px] font-black hover:bg-red-500 hover:text-white transition-colors">تنظيف المواعيد القديمة</button>
                            )}
                            {currentUser.role !== 'doctor' && <button type="button" onClick={onAdd} className="w-full lg:w-auto bg-gold-500 text-white px-5 py-2 rounded-xl text-xs font-black shadow-md hover:bg-gold-600 transition-colors">+ حجز</button>}
                        </div>
                    </div>

                    {viewMode === 'daily' && (
                        <div className="animate-slide-up">
                            {Object.keys(groupedByBranchDaily).length === 0 ? (
                                <div className="p-8 text-center text-gray-400 font-bold border border-dashed rounded-3xl bg-white text-sm">لا توجد مواعيد في هذا اليوم.</div>
                            ) : (
                                Object.entries(groupedByBranchDaily).map(([bId, bApps]) => {
                                    if(bApps.length === 0) return null;
                                    const bName = branches.find(b=>b.id===bId)?.name || 'العيادة';
                                    return (
                                        <div key={bId} className="mb-4">
                                            {selectedBranch === 'all' && (
                                                <div className="flex items-center gap-3 mb-4 mt-2">
                                                    <span className="text-xs font-black bg-gradient-to-r from-gold-500 to-gold-600 text-white px-4 py-1.5 rounded-lg shadow-md border border-gold-400">فرع {bName}</span>
                                                    <div className="h-0.5 bg-gradient-to-l from-gold-200 to-transparent flex-1 rounded-full"></div>
                                                </div>
                                            )}
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
                                                {bApps.map(a => (
                                                    <div key={a.id} id={'app-' + a.id} className={`bg-white p-2.5 rounded-xl border ${focusIds?.includes(a.id) ? 'border-gold-500 ring-2 ring-gold-400' : 'border-gray-100'} flex flex-col sm:flex-row sm:items-center justify-between gap-2 hover:bg-gray-50 transition-colors shadow-sm`}>
                                                        <div className="flex items-center gap-2 min-w-0">
                                                            <div className="bg-gold-50 text-gold-700 px-2 py-1 rounded-lg text-[10px] font-black shrink-0 tracking-widest">{a.time || '00:00'}</div>
                                                            <div className="min-w-0">
                                                                <h5 className="font-black text-gray-800 text-xs truncate leading-tight mb-0.5">{a.patientName}</h5>
                                                                <div className="flex flex-wrap items-center gap-1.5">
                                                                    <span className="text-[9px] font-mono font-bold text-gray-500 tracking-wider" dir="ltr">{a.phone || 'بدون رقم'}</span>
                                                                    {a.service && <span className="text-[8px] bg-blue-50 text-blue-600 px-1.5 rounded font-bold">{a.service}</span>}
                                                                    {a.doctorName && <span className="text-[8px] bg-purple-50 text-purple-600 px-1.5 rounded font-bold">د. {a.doctorName}</span>}
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div className="flex gap-1 shrink-0 self-end sm:self-auto items-center"><StatusSelect a={a} showToast={showToast} />{(() => { const br = branches.find(b => b.id === a.branchId) || {}; return (<><WaMsg phone={a.phone} label="تذكير" text={fillT('reminder', { name: a.patientName, branch: br.name || '', date: a.date, time: a.time || '' })} />{(a.status === 'done' || a.status === 'arrived') && <WaMsg phone={a.phone} label={a.reviewSent ? 'تقييم ✓' : 'تقييم'} text={fillT('review', { name: a.patientName, branch: br.name || '', link: br.reviewLink || br.mapsLink || '' })} />}</>); })()}{currentUser.role !== 'doctor' && (<>
                                                            <button type="button" onClick={()=>onEdit(a)} className="p-1.5 bg-white border border-gray-200 text-gold-500 rounded-lg hover:bg-gold-500 hover:text-white transition-colors"><IconEdit/></button>
                                                            <button type="button" onClick={()=>onConfirm({msg:'إلغاء الموعد نهائياً؟', onConfirm:()=>{
                                                                db.collection('appointments').doc(a.id).delete()
                                                                .then(() => showToast("تم إلغاء الموعد"))
                                                                .catch(err => showToast("مشكلة في حذف الموعد: " + err.message)); 
                                                            }})} className="p-1.5 bg-white border border-gray-200 text-red-500 rounded-lg hover:bg-red-500 hover:text-white transition-colors"><IconTrash/></button>
                                                        </>)}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )
                                })
                            )}
                        </div>
                    )}

                    {viewMode === 'weekly' && (
                        <div className="bg-white rounded-[20px] border border-gray-100 shadow-sm overflow-hidden animate-slide-up">
                            <div className="divide-y divide-gray-50">
                                {weeklyDays.map((day, idx) => (
                                    <div key={idx} onClick={() => { setSelectedDate(day.date); setViewMode('daily'); }} className="flex flex-col sm:flex-row sm:items-center justify-between p-4 hover:bg-gray-50 cursor-pointer transition-colors group">
                                        <div className="flex items-center gap-4 mb-2 sm:mb-0">
                                            <div className={`w-12 h-12 rounded-xl flex flex-col items-center justify-center border-2 ${day.date === new Date().toISOString().split('T')[0] ? 'bg-gold-50 border-gold-400 text-gold-700' : 'bg-white border-gray-100 text-gray-500 group-hover:border-gold-200'}`}>
                                                <span className="text-xs font-black">{day.date.split('-')[2]}</span>
                                            </div>
                                            <div>
                                                <h4 className="font-black text-gray-800 text-sm">{day.dayName}</h4>
                                                <p className="text-[10px] text-gray-400 font-mono">{day.date}</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            {day.apps.length > 0 ? (
                                                <div className="flex items-center gap-2 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100">
                                                    <span className="text-xs font-black text-blue-600">{day.apps.length} مواعيد</span>
                                                    <div className="flex -space-x-1.5 rtl:space-x-reverse">
                                                        {day.apps.slice(0,4).map((a,i) => <div key={i} className="w-5 h-5 rounded-full bg-white border border-blue-200 flex items-center justify-center text-[8px] font-bold text-blue-500 shadow-sm">{a.patientName.charAt(0)}</div>)}
                                                        {day.apps.length > 4 && <div className="w-5 h-5 rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center text-[8px] font-bold text-gray-500">+{day.apps.length-4}</div>}
                                                    </div>
                                                </div>
                                            ) : (
                                                <span className="text-[10px] text-gray-400 font-bold bg-gray-50 px-3 py-1 rounded-lg">لا يوجد حجز</span>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {viewMode === 'monthly' && renderCalendar()}
                </div>
            );
        }

        function BranchesView({ branches, onConfirm, onAdd, onEdit, showToast }) {
            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="flex justify-between items-center"><h3 className="text-lg font-black text-gray-800">إدارة الفروع</h3><button type="button" onClick={onAdd} className="bg-gold-500 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow-md hover:bg-gold-600">+ فرع جديد</button></div>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                        {branches.map(b => (
                            <div key={b.id} className="bg-white p-4 rounded-[20px] border border-gray-100 shadow-sm relative group flex flex-col h-full">
                                <div className="absolute top-2 left-2 flex gap-1">
                                    <button type="button" onClick={() => onEdit(b)} className="p-1.5 text-gold-500 bg-white border border-gray-200 rounded-lg hover:bg-gold-500 hover:text-white transition-colors"><IconEdit/></button>
                                    <button type="button" onClick={() => onConfirm({msg:'حذف الفرع؟', onConfirm:()=>{
                                        db.collection('branches').doc(b.id).delete()
                                        .then(() => showToast("تم حذف الفرع"))
                                        .catch(err => showToast("مشكلة في الحذف: " + err.message)); 
                                    }})} className="p-1.5 text-red-500 bg-white border border-gray-200 rounded-lg hover:bg-red-500 hover:text-white transition-colors"><IconTrash/></button>
                                </div>
                                <div className="text-gold-500 mb-2 bg-gray-50 w-10 h-10 rounded-xl flex items-center justify-center"><IconBuilding/></div>
                                <h4 className="text-sm font-black text-gray-800 mb-0.5">{b.name}</h4>
                                <p className="text-[10px] font-bold text-gray-500 mb-1">{b.phone}</p>
                                {b.address && <p className="text-[9px] text-gray-400 mb-2 truncate" title={b.address}>{b.address}</p>}
                                
                                {b.mapsLink && (
                                    <a href={b.mapsLink} target="_blank" rel="noreferrer" className="inline-flex w-fit items-center gap-1 text-[9px] font-bold bg-blue-50 text-blue-600 px-2 py-1 rounded-lg hover:bg-blue-100 transition-colors mt-auto border border-blue-100">
                                        <IconMapPin /> عرض على الخريطة
                                    </a>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- سجل المرضى الجديد بتصميم الكروت للموبايل ---
        function PatientsView({ staff = [], focusId, patients, branches, currentUser, onConfirm, onAdd, onEdit, showToast }) {
            const t = new Date().toISOString().split('T')[0];
            const upd = (p, d, m) => db.collection('patients').doc(p.id).update(d).then(() => showToast(m)).catch(e => showToast(e.message));
            const isDoc = currentUser.role === 'doctor';
            useEffect(() => { if (focusId) setTimeout(() => document.getElementById('pat-' + focusId)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 200); }, [focusId]);
            const sorted = [...patients].sort((a, b) => ((a.followUpDate && !a.followedAt) ? a.followUpDate : '9') .localeCompare((b.followUpDate && !b.followedAt) ? b.followUpDate : '9'));
            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="flex justify-between items-center">
                        <h3 className="text-lg font-black text-gray-800">سجل المرضى</h3>
                        {!isDoc && <button type="button" onClick={onAdd} className="bg-gold-500 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow-md hover:bg-gold-600">+ مريض جديد</button>}
                    </div>
                    <BranchGroups items={sorted} branches={branches} empty="لا يوجد مرضى مسجلين حتى الآن." sub={arr => '• يحتاج متابعة: ' + arr.filter(p => p.followUpDate && !p.followedAt && p.followUpDate <= t).length} render={p => {
                        const due = p.followUpDate && !p.followedAt && p.followUpDate <= t;
                        const bn = bLabel(branches, p.branchId);
                        return (
                        <div key={p.id} id={'pat-' + p.id} className={`bg-white p-4 rounded-[20px] border shadow-sm relative ${focusId === p.id ? 'border-gold-500 ring-2 ring-gold-400' : due ? 'border-amber-300' : 'border-gray-100'}`}>
                            {!isDoc && <div className="absolute top-4 left-4 flex gap-1.5">
                                <button type="button" onClick={() => onEdit(p)} className="p-1.5 text-gold-500 bg-gray-50 rounded-lg"><IconEdit/></button>
                                <button type="button" onClick={() => onConfirm({msg:'حذف المريض نهائياً؟', onConfirm:()=>db.collection('patients').doc(p.id).delete().then(() => showToast("تم حذف ملف المريض")).catch(err => showToast("مشكلة في الحذف: " + err.message))})} className="p-1.5 text-red-500 bg-red-50 rounded-lg"><IconTrash/></button>
                            </div>}
                            <div className="flex items-start gap-3 mb-3">
                                <div className="w-12 h-12 rounded-xl bg-gold-50 text-gold-600 flex items-center justify-center font-black text-sm border border-gold-100 shrink-0">#{p.fileNo || '-'}</div>

                            </div>

                                <p>📍 {p.address || 'غير مسجل'}</p>
                                <div className="flex flex-wrap gap-1">{(p.services && p.services.length ? p.services : [p.service || 'غير محدد']).map(x => <span key={x} className="text-[10px] font-black text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded">{x}</span>)}</div>
                                {p.lastEvent && <p className="text-[10px] font-black text-red-600 bg-red-50 rounded px-1.5 py-0.5 inline-block">⚠️ {p.lastEvent}</p>}
                                {p.doctorId && <p className="text-[10px] text-gray-500">👨‍⚕️ د. {staff.find(x => x.id === p.doctorId)?.name || ''}</p>}
                            </div>
                            {p.followUpDate && (
                                <div className="mt-3 space-y-2">
                                    <p className={`text-[10px] font-black px-2 py-1 rounded-lg inline-block ${p.followedAt ? 'bg-emerald-100 text-emerald-700' : due ? 'bg-amber-100 text-amber-700' : 'bg-gray-100 text-gray-600'}`}>{p.followedAt ? '✓ تمت المتابعة' : (due ? '📞 حان موعد المتابعة' : 'متابعة: ' + p.followUpDate)}</p>
                                    {!p.followedAt && <div className="flex gap-1.5 flex-wrap">

                                        <button type="button" onClick={() => upd(p, { followedAt: new Date().toISOString() }, 'تم تسجيل المتابعة')} className="px-2 py-1.5 bg-emerald-500 text-white rounded-lg text-[9px] font-bold">تمت المتابعة</button>
                                        <button type="button" onClick={() => { const base = p.followUpDate && p.followUpDate > t ? p.followUpDate : t; const nd = new Date(base + 'T00:00:00'); nd.setDate(nd.getDate() + 7); const ndS = nd.getFullYear() + '-' + String(nd.getMonth() + 1).padStart(2, '0') + '-' + String(nd.getDate()).padStart(2, '0'); upd(p, { followUpDate: ndS, followUpDays: 7, followedAt: '', followRemind: false }, 'اتأجلت أسبوع: من ' + p.followUpDate + ' إلى ' + ndS); }} className="px-2 py-1.5 bg-gray-100 text-gray-600 rounded-lg text-[9px] font-bold">أجّل أسبوع</button>

                            {(currentUser.role === 'admin' || currentUser.role === 'superadmin') && p.recordedBy && <p className="mt-2 text-[8px] text-gray-400">سجّله: {p.recordedBy}</p>}

                <div className="space-y-4 w-full animate-fade-in">

                    <div key={cur.k}>{cur.node}</div>

        function MasterCodeView({ currentUser, showToast }) {
            const [oldP, setOldP] = useState('');
            const [newU, setNewU] = useState(currentUser.username || '');
            const [newP, setNewP] = useState('');
            const [conf, setConf] = useState('');
            const [busy, setBusy] = useState(false);
            const inp = "w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-sm focus:border-gold-500";
            const save = async (e) => {
                e.preventDefault();

                if (newP && newP !== conf) { showToast('تأكيد كلمة السر مش مطابق'); return; }
                if (u === normUser(currentUser.username) && !newP) { showToast('مفيش تغيير'); return; }
                setBusy(true);
                try {
                    // التأكد من كلمة السر الحالية
                    let okOld = false;
                    try { const c = await authCreds(currentUser.username, oldP); const sa = getSecAuth(); const r = await sa.signInWithEmailAndPassword(c.email, c.password); okOld = r.user.uid === currentUser.authUid; await sa.signOut(); } catch (x) {}
                    if (!okOld) { showToast('كلمة السر الحالية غلط'); setBusy(false); return; }

                    alert('تم الحفظ. من دلوقتي ادخلي باسم المستخدم وكلمة السر الجداد.');

                        <input type="password" dir="ltr" value={newP} onChange={e => setNewP(e.target.value)} className={inp} /></div>

                        <input type="password" dir="ltr" value={conf} onChange={e => setConf(e.target.value)} className={inp} /></div>}
                    <button disabled={busy} type="submit" className="w-full bg-gold-500 text-white py-3 rounded-xl font-black text-sm shadow-md hover:bg-gold-600 disabled:opacity-50">{busy ? 'جاري الحفظ...' : 'حفظ'}</button>

        function FinanceView({ payments, branches, selectedBranch, currentUser, onConfirm, onAdd, onEdit, showToast }) {
            const num = v => Number(v || 0);
            const shown = branches.filter(b => selectedBranch === 'all' || b.id === selectedBranch);
            const pending = payments.filter(p => !p.delivered);
            const totalPending = pending.reduce((s, p) => s + num(p.amount), 0);
            const sorted = [...payments].sort((x, y) => (y.date || '').localeCompare(x.date || ''));
            const settle = (b, reset) => onConfirm({
                msg: (reset ? 'تصفير خزنة فرع ' : 'تأكيد توريد خزنة فرع ') + b.name + '؟',
                onConfirm: () => {
                    const batch = db.batch();
                    pending.filter(p => p.branchId === b.id).forEach(p => batch.update(db.collection('payments').doc(p.id), { delivered: true, zeroed: reset, deliveredAt: new Date().toISOString() }));
                    batch.commit().then(() => showToast(reset ? 'تم تصفير الخزنة' : 'تم تسجيل التوريد')).catch(err => showToast("مشكلة: " + err.message));
                }
            });
            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="bg-gradient-to-r from-gold-600 to-gold-400 p-6 rounded-[20px] text-white shadow-xl flex flex-wrap justify-between items-center gap-4">

                        <button type="button" onClick={() => onAdd(selectedBranch === 'all' ? '' : selectedBranch)} className="bg-white text-gold-600 px-5 py-2.5 rounded-xl text-xs font-black shadow-lg">+ حساب اليوم</button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        {shown.map(b => {
                            const mine = pending.filter(p => p.branchId === b.id);
                            const bal = mine.reduce((s, p) => s + num(p.amount), 0);

            const total = mine.reduce((s, p) => s + Number(p.amount || 0), 0);
            const guard = (fn) => { if (localDay() !== today) { showToast('انتهى اليوم — مينفعش التعديل'); return; } fn(); };
            return (
                <div className="space-y-4 w-full animate-fade-in">

                        <div><p className="text-gold-100 text-[10px] font-bold mb-1">توريد اليوم ({mine.length} تسجيل)</p><h2 className="text-3xl font-black">{total} EGP</h2></div>

                        {mine.length === 0 && <p className="text-gray-400 text-xs font-bold text-center p-4">لا يوجد توريد مسجل اليوم.</p>}
                        {mine.map(p => (
                            <div key={p.id} className="flex justify-between items-center p-4 bg-gray-50 rounded-xl relative">
                                <div className="absolute left-2 top-2 flex gap-1">
                                    <button type="button" onClick={() => guard(() => onEdit(p))} className="p-1 text-gold-500 bg-white border border-gray-200 rounded-lg"><IconEdit/></button>
                                    <button type="button" onClick={() => guard(() => onConfirm({ msg: 'حذف هذا التوريد؟', onConfirm: () => { if (localDay() !== today) { showToast('انتهى اليوم — مينفعش الحذف'); return; } db.collection('payments').doc(p.id).delete().then(() => showToast('تم الحذف')).catch(err => showToast('مشكلة في الحذف: ' + err.message)); } }))} className="p-1 text-red-500 bg-white border border-gray-200 rounded-lg"><IconTrash/></button>
                                </div>

                                    <p className="font-black text-xs text-gray-800">فرع {branches.find(b => b.id === p.branchId)?.name || 'غير معروف'}</p>

                                </div>
                                <div className="text-emerald-500 font-black text-base mr-12">{p.amount} ج</div>
                            </div>

                    </div>
                </div>
            );

                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الفرع</label>
                                                <select name="bId" value={pBranch} onChange={e => setPBranch(e.target.value)} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                    {branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
                                                </select>
                                            </div>
                                        )}
                                        <div className="space-y-1">
                                            <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الدكتور المسؤول عن الحالة (اختياري)</label>
                                            <select key={pBranch} name="docId" defaultValue={pDocs.some(x => x.id === modal.data?.doctorId) ? modal.data.doctorId : ''} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                <option value="">بدون تحديد</option>
                                                {pDocs.map(x => <option key={x.id} value={x.id}>د. {x.name}</option>)}
                                            </select>
                                        </div>
                                    </>
                                )}
                                {modal.type==='payment' && (
                                    <>
                                        <Input name="amt" label="المبلغ" type="number" defaultValue={modal.data?.amount} required />
                                        {user.role !== 'employee' && <Input name="dt" label="التاريخ" type="date" defaultValue={modal.data?.date || new Date().toISOString().split('T')[0]} required />}
                                        <Input name="payMethod" label="مكان الحفظ (اختياري)" defaultValue={modal.data?.paymentMethod} placeholder="كاش، فيزا..." />
                                        <div className="space-y-1">
                                            <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الفرع</label>
                                            <select name="bId" defaultValue={modal.data?.branchId || user.branchId} disabled={user.role==='employee'} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                {branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
                                            </select>
                                        </div>
                                    </>
                                )}
                                {modal.type==='lab' && (
                                    <>
                                        <Input name="labName" label="اسم المعمل" list="labNamesList" defaultValue={modal.data?.labName} required onBlur={e => { const el = e.target.form.labPhone; const n = e.target.value.trim(); if (el && !el.value && labPhones[n]) el.value = labPhones[n]; }} />
                                        <Input name="labPhone" label="رقم واتساب المعمل (اختياري)" type="tel" defaultValue={modal.data?.labPhone} />
                                        <datalist id="labNamesList">{labNames.map(n => <option key={n} value={n} />)}</datalist>
                                        <Input name="patientName" label="اسم المريض" defaultValue={modal.data?.patientName} required />
                                        <Input name="caseType" label="نوع الحالة / الشغل" defaultValue={modal.data?.caseType} required />
                                        <div className="grid grid-cols-2 gap-2">
                                            <Input name="sentDate" label="تاريخ التسليم للمعمل" type="date" defaultValue={modal.data?.sentDate || new Date().toISOString().split('T')[0]} required />
                                            <Input name="dueDate" label="موعد الاستلام المتوقع" type="date" defaultValue={modal.data?.dueDate} />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">تذكير بطلب الحالة من المعمل بعد</label>
                                            <select name="remindDays" defaultValue={modal.data ? labRemindDays(modal.data) : 2} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                <option value="0">بدون تذكير</option><option value="1">يوم</option><option value="2">يومين</option><option value="3">3 أيام</option><option value="5">5 أيام</option><option value="7">أسبوع</option><option value="10">10 أيام</option><option value="14">أسبوعين</option><option value="30">شهر</option>
                                            </select>
                                        </div>
                                        {user.role === 'superadmin' && <Input name="cost" label="التكلفة (تظهر للسوبر أدمن فقط)" type="number" defaultValue={modal.data ? costs[modal.data.id] : ''} />}
                                        <Input name="notes" label="ملاحظات" defaultValue={modal.data?.notes} />
                                        {(user.role === 'admin' || user.role === 'superadmin') && (
                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الفرع</label>
                                                <select name="bId" defaultValue={modal.data?.branchId || (selectedBranch !== 'all' ? selectedBranch : '')} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                    {branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
                                                </select>
                                            </div>
                                        )}
                                    </>
                                )}
                                {modal.type==='due' && (
                                    <>
                                        <Input name="party" label="الجهة / المورد" defaultValue={modal.data?.party} required />
                                        <Input name="desc" label="البيان (رقم الفاتورة / الوصف)" defaultValue={modal.data?.desc} />
                                        <div className="grid grid-cols-2 gap-2">
                                            <Input name="amount" label="المبلغ (ج)" type="number" step="any" defaultValue={modal.data?.amount} required />
                                            <Input name="dueDate" label="موعد السداد (اختياري)" type="date" defaultValue={modal.data?.dueDate} />
                                        </div>
                                        {(user.role === 'admin' || user.role === 'superadmin') && <BranchSelect withStore branches={branches} defaultValue={modal.data?.branchId || (selectedBranch !== 'all' ? selectedBranch : 'store')} />}
                                    </>
                                )}
                                {modal.type==='consumable' && (
                                    <>
                                        <div className="space-y-1">
                                            <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">نوع الحركة</label>
                                            <select name="kind" defaultValue={modal.data?.kind || 'purchase'} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                <option value="purchase">شراء للعيادة</option>
                                                <option value="withdraw">سحب من المخزن</option>
                                            </select>
                                        </div>
                                        <Input name="itemName" label="اسم الصنف" defaultValue={modal.data?.itemName} required onBlur={e => { const el = e.target.form.unit; const c = lastCosts[e.target.value.trim().toLowerCase()]; if (el && !el.value && c) el.value = c; }} />
                                        <div className="grid grid-cols-2 gap-2">
                                            <Input name="qty" label="الكمية" defaultValue={modal.data?.qty} required />
                                            <Input name="unit" label="تكلفة الوحدة الواحدة (ج)" type="number" step="any" defaultValue={modal.data?.unitCost ?? (modal.data?.qty && modal.data?.amount ? Math.round(modal.data.amount / (parseFloat(modal.data.qty) || 1) * 100) / 100 : '')} placeholder="0" />
                                        </div>
                                        <Input name="dt" label="التاريخ" type="date" defaultValue={modal.data?.date || new Date().toISOString().split('T')[0]} required />
                                        <Input name="note" label="ملاحظات (اختياري)" defaultValue={modal.data?.note} />
                                        {(user.role === 'admin' || user.role === 'superadmin') && (
                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الفرع / المخزن</label>
                                                <select name="bId" defaultValue={modal.data?.branchId || (selectedBranch !== 'all' ? selectedBranch : (branches[0]?.id || 'store'))} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                    <option value="store">المخزن (الرئيسي)</option>
                                                    {branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
                                                </select>
                                            </div>
                                        )}
                                    </>
                                )}
                                {modal.type==='shortage' && (
                                    <>
                                        <Input name="itemName" label="اسم الصنف" defaultValue={modal.data?.itemName} required />
                                        <Input name="quantity" label="الكمية" defaultValue={modal.data?.quantity} required />
                                        {(user.role === 'admin' || user.role === 'superadmin') && (
                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الفرع / المخزن</label>
                                                <select name="bId" defaultValue={modal.data?.branchId} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                    <option value="store">المخزن (الرئيسي)</option>
                                                    {branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
                                                </select>
                                            </div>
                                        )}
                                        {user.role === 'employee' && (
                                            <input type="hidden" name="bId" value={modal.data?.branchId || user.branchId} />
                                        )}
                                    </>
                                )}
                                {modal.type==='staff' && (
                                    <>
                                        <Input name="name" label="اسم الموظف" defaultValue={modal.data?.name} required />
                                        <div className="grid grid-cols-2 gap-2">
                                            <Input name="username" label="اسم المستخدم" defaultValue={modal.data?.username} dir="ltr" autoCapitalize="none" autoComplete="off" required />
                                            <Input name="password" label="كلمة السر (4+ حروف)" defaultValue={modal.data?.password} dir="ltr" autoComplete="new-password" required />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الوظيفة</label>
                                            <select name="jobTitle" value={jobTitle} onChange={(e) => setJobTitle(e.target.value)} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                <option value="سكرتارية">سكرتارية</option>
                                                <option value="مساعد تمريض">مساعد تمريض</option>
                                                <option value="طبيب">طبيب (يشوف حجوزاته فقط)</option>
                                            </select>
                                        </div>
                                        {jobTitle === 'طبيب' ? (
                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">فروع الطبيب وأيام شغله في كل فرع</label>
                                                <p className="text-[10px] text-gray-400 font-bold">الأيام دي مش بتظهر للمرضى. لو المريض اختار يوم مش من أيامه، بيظهرله إن الدكتور مش متاح. لو مختارتيش أيام = متاح كل الأيام.</p>
                                                <div className="space-y-2">
                                                    {branches.map(b => { const on = docBr.includes(b.id); return (
                                                        <div key={b.id} className={`p-2.5 border rounded-xl ${on ? 'bg-gold-50/40 border-gold-200' : 'bg-gray-50 border-gray-100'}`}>
                                                            <label className="flex items-center gap-2 text-xs font-black cursor-pointer">
                                                                <input type="checkbox" checked={on} onChange={() => setDocBr(v => on ? v.filter(x => x !== b.id) : [...v, b.id])} className="w-4 h-4 accent-yellow-600" />
                                                                {b.name}
                                                            </label>
                                                            {on && <div className="flex flex-wrap gap-1.5 mt-2">{DAY_ORDER.map(dy => { const sel = (docSched[b.id] || []).includes(dy); return (
                                                                <button key={dy} type="button" onClick={() => toggleDay(b.id, dy)} className={`px-2.5 py-1.5 rounded-lg text-[10px] font-black border ${sel ? 'bg-gold-500 text-white border-gold-500' : 'bg-white text-gray-600 border-gray-200'}`}>{DAY_NAMES[dy]}</button>); })}</div>}
                                                        </div>); })}
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black uppercase text-gray-500 tracking-widest block">الصلاحية</label>
                                                <select name="bId" defaultValue={modal.data?.role === 'doctor' ? 'all' : (modal.data?.branchId || 'all')} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500">
                                                    <option value="all">مدير عام (جميع الفروع)</option>
                                                    {branches.map(b=><option key={b.id} value={b.id}>موظف فرع: {b.name}</option>)}
                                                </select>
                                            </div>
                                        )}
                                    </>
                                )}
                                {modal.type==='branch' && (
                                    <>
                                        <Input name="name" label="اسم الفرع" defaultValue={modal.data?.name} required />
                                        <Input name="phone" label="تليفون الفرع" defaultValue={modal.data?.phone} required />
                                        <Input name="address" label="العنوان التفصيلي" defaultValue={modal.data?.address} placeholder="مثال: شارع مصطفى النحاس، المنيا" />
                                        <Input name="mapsLink" label="رابط جوجل مابس (Google Maps)" defaultValue={modal.data?.mapsLink} placeholder="https://maps.app.goo.gl/..." dir="ltr" />
                                        <Input name="reviewLink" label="رابط تقييم جوجل (لرسالة التقييم)" defaultValue={modal.data?.reviewLink} placeholder="https://g.page/r/..." dir="ltr" />
                                    </>
                                )}
                                <button type="submit" className="w-full py-4 mt-6 bg-gold-500 text-white rounded-xl font-black shadow-lg hover:bg-gold-600 transition-colors text-sm">حفظ التغييرات</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        function Input({ label, ...props }) {
            return (
                <div className="space-y-1">
                    <label className="text-[9px] font-black text-gray-500 uppercase tracking-widest block">{label}</label>
                    <input {...props} className="w-full bg-gray-50 border border-gray-100 focus:border-gold-500 p-3 rounded-xl outline-none font-bold text-gray-800 text-xs shadow-inner transition-colors" />
                </div>
            );
        }

        function Toast({ msg, onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);
            return (
                <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[999999] bg-gray-900 text-white px-5 py-3 rounded-2xl shadow-2xl animate-slide-up flex items-center gap-3 border border-gray-700">
                    <IconCheck />
                    <span className="font-bold text-xs">{msg}</span>
                    <button type="button" onClick={onClose} className="text-gray-400 hover:text-white p-1"><IconX /></button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
