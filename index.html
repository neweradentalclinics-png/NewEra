        // إعدادات تيليجرام (السوبر أدمن بس) — بتتحفظ في مكان مقفول على الموظفين
        function TelegramView({ showToast, branches = [], staff = [] }) {
            const doctors = staff.filter(x => x.role === 'doctor');
            const admins = staff.filter(x => x.role === 'admin' || x.role === 'superadmin');
            const secsOf = bid => staff.filter(x => x.role !== 'doctor' && x.role !== 'admin' && x.role !== 'superadmin' && (staffScope(x, branches) || []).includes(bid));
            const [openP, setOpenP] = useState(null);
            const [v, setV] = useState(null);
            const [found, setFound] = useState(null);
            const [bot, setBot] = useState(null);
            const [showTk, setShowTk] = useState(false);
            const [testRes, setTestRes] = useState({});
            const why = (d) => /chat not found/i.test(d) ? 'الرقم ده لسه مكلّمش البوت: صاحب الرقم لازم يفتح البوت ويدوس Start (أو الرقم غلط)'
                : /unauthorized/i.test(d) ? 'التوكن غلط أو اتلغى — راجعيه من @BotFather'
                : /blocked/i.test(d) ? 'صاحب الرقم عامل Block للبوت — يفتحه ويدوس Restart'
                : /kicked|not a member/i.test(d) ? 'البوت اتشال من الجروب ده — ضيفيه تاني'
                : /failed to fetch|network/i.test(d) ? 'الجهاز مش قادر يوصل لتيليجرام (النت أو الشبكة حاجباه)' : d;
            // اسم البوت ولينكه (عشان السكرتارية تعرف تبعت لمين)
            useEffect(() => {
                const tk = v && v.token.trim(); if (!tk) { setBot(null); return; }
                const t = setTimeout(() => fetch(`https://api.telegram.org/bot${tk}/getMe`).then(r => r.json()).then(j => setBot(j.ok ? j.result : { err: j.description || 'التوكن غلط' })).catch(() => setBot({ err: 'مش قادرين نوصل لتيليجرام' })), 500);
                return () => clearTimeout(t);
            }, [v && v.token]);
            // "حجوزات السيستم" و"جدول المواعيد" بقوا اختيار واحد
            const normK = k => { const s0 = new Set(k || []); if (s0.has('booking') || s0.has('schedule')) { s0.add('booking'); s0.add('schedule'); } return [...s0]; };
            useEffect(() => { db.collection('private_config').doc('telegram').get().then(d => {
                const x = d.exists ? d.data() : {}, bx = x.branches || {}, off = x.v === 2 ? [] : (x.off || []), routes = mergeRoutes(x);
                const strip = k => normK((k || []).filter(z => !off.includes(z)));
                const cfgOf = (o, defKinds) => ({ ...tgTiming(o || {}), kinds: o ? strip(o.kinds) : strip(defKinds) });
                const people = {}; Object.entries(mergePeople(x)).forEach(([k, per]) => { if (per) people[k] = { ...per, ...tgTiming(per), kinds: strip(per.kinds) }; });
                setV({ token: x.token || '', main: x.main || '', branches: Object.fromEntries(branches.map(b => [b.id, bx[b.id] || bx[b.name] || ''])),
                    mainCfg: cfgOf(x.mainCfg, routes.main), branchCfg: Object.fromEntries(branches.map(b => [b.id, cfgOf((x.branchCfg || {})[b.id], routes.branch)])),
                    people, routes, quiet: x.quiet || {} });
            }).catch(e => showToast(e.message)); }, []);
            if (!v) return <p className="text-xs font-bold text-gray-400">...</p>;
            const inp = "w-full p-2.5 bg-white border border-gray-100 rounded-xl font-bold outline-none text-xs focus:border-gold-500";
            const card = "bg-white rounded-[20px] border border-gray-100 shadow-sm p-5 space-y-3";
            const T5 = o => ({ kinds: o.kinds || [], schedMode: o.schedMode, schedHour: Number(o.schedHour), shortMode: o.shortMode, shortHour: Number(o.shortHour) });
            const save = () => {
                const br = {}; Object.entries(v.branches).forEach(([k, c]) => { if (String(c).trim()) br[k] = String(c).trim(); });
                const ids = new Set(staff.map(x => x.id)), pp = {};
                // بنحفظ اللي ليه رقم شات بس، واللي اتشالوا من السيستم بيتشالوا
                Object.entries(v.people || {}).forEach(([k, per]) => { const chat = String(per.chat || '').trim(); if (!chat || (!per.manual && !ids.has(k))) return; pp[k] = { chat, ...T5(per), ...(per.manual ? { manual: true, name: (per.name || '').trim() } : {}) }; });
                const bc = {}; branches.forEach(b => { bc[b.id] = T5(v.branchCfg[b.id] || tgTiming({})); });
                db.collection('private_config').doc('telegram').set({ v: 2, token: v.token.trim(), main: v.main.trim(), branches: br, mainCfg: T5(v.mainCfg), branchCfg: bc, people: pp, routes: v.routes, off: [], quiet: v.quiet || {}, routesKnown: TG_KINDS.map(k => k[0]) })
                    .then(() => showToast('تم حفظ إعدادات تيليجرام ✓')).catch(e => showToast(e.message));
            };
            const test = (chat, label, key) => {
                const tk = v.token.trim(), id = String(chat || '').trim();
                if (!tk) { setTestRes(r => ({ ...r, [key]: { ok: false, t: 'خانة التوكن فاضية — حطيه واحفظي' } })); return; }
                if (!id) { setTestRes(r => ({ ...r, [key]: { ok: false, t: 'رقم الشات فاضي — حطيه الأول' } })); return; }
                setTestRes(r => ({ ...r, [key]: { t: 'جاري الإرسال...' } }));
                fetch(`https://api.telegram.org/bot${tk}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: id, text: '✅ رسالة تجربة من سيستم نيو إيرا — ' + label }) })
                    .then(r => r.json()).then(j => setTestRes(r => ({ ...r, [key]: j.ok ? { ok: true, t: 'الرسالة وصلت ✓' } : { ok: false, t: why(j.description || '') } })))
                    .catch(e => setTestRes(r => ({ ...r, [key]: { ok: false, t: why(e.message) } })));
            };
            const Res = ({ k }) => testRes[k] ? <p className={`text-[11px] font-bold ${testRes[k].ok ? 'text-emerald-600' : testRes[k].ok === false ? 'text-red-600' : 'text-gray-400'}`}>{testRes[k].t}</p> : null;
            const findChats = () => {
                if (!v.token.trim()) { showToast('حطي التوكن الأول'); return; }
                fetch(`https://api.telegram.org/bot${v.token.trim()}/getUpdates`).then(r => r.json()).then(j => {
                    if (!j.ok) {
                        const err = j.description || 'خطأ من تيليجرام';
                        if (/webhook/i.test(err)) fetch(`https://api.telegram.org/bot${v.token.trim()}/getWebhookInfo`).then(r => r.json()).then(w => setFound({ err, hook: (w.result && w.result.url) || '' })).catch(() => setFound({ err }));
                        else setFound({ err });
                        return;
                    }
                    const m = {}; (j.result || []).forEach(u => { const c = (u.message || u.edited_message || u.my_chat_member || u.chat_member || u.channel_post || {}).chat; if (c) m[c.id] = (c.type === 'private' ? '👤 ' : '👥 ') + (c.title || [c.first_name, c.last_name].filter(Boolean).join(' ') || c.username || c.id); });
                    setFound(Object.entries(m));
                }).catch(e => setFound({ err: e.message }));
            };
            // ===== كل شات: الإدارة (_main) / جروب الفرع (_b_ID) / شخص =====
            const defKinds = type => type === 'doctor' ? PERSON_DEFAULT.doctor : type === 'secretary' ? SEC_DEFAULT : PERSON_DEFAULT.admin;
            const getRec = (id, type) => {
                if (id === '_main') return { ...v.mainCfg, chat: v.main };
                if (id.startsWith('_b_')) { const bid = id.slice(3); return { ...(v.branchCfg[bid] || { ...tgTiming({}), kinds: [] }), chat: v.branches[bid] || '' }; }
                return (v.people || {})[id] || { chat: '', ...tgTiming({}), kinds: normK(defKinds(type)) };
            };
            const setRec = (id, type, patch) => setV(p => {
                if (id === '_main') { const { chat, ...rest } = patch; return { ...p, ...(chat !== undefined ? { main: chat } : {}), mainCfg: { ...p.mainCfg, ...rest } }; }
                if (id.startsWith('_b_')) { const bid = id.slice(3), { chat, ...rest } = patch; return { ...p, ...(chat !== undefined ? { branches: { ...p.branches, [bid]: chat } } : {}), branchCfg: { ...p.branchCfg, [bid]: { ...(p.branchCfg[bid] || tgTiming({})), ...rest } } }; }
                const cur = (p.people || {})[id] || { chat: '', ...tgTiming({}), kinds: normK(defKinds(type)) };
                return { ...p, people: { ...p.people, [id]: { ...cur, ...patch } } };
            });
            const UI_KINDS = [['sched', '📅 حجوزات السيستم + جدول المواعيد'], ...TG_KINDS.filter(([k]) => k !== 'booking' && k !== 'schedule')];
            const hrTxt = h => (h % 12 || 12) + (h < 12 ? ' الصبح' : h < 17 ? ' الضهر' : ' بالليل');
            const selC = "bg-white border border-gray-200 rounded-lg px-2 py-1.5 text-[11px] font-black outline-none focus:border-gold-500";
            const hourSel = (val, on) => <select value={val} onChange={e => on(Number(e.target.value))} className={selC}>{Array.from({ length: 24 }, (_, h) => <option key={h} value={h}>{hrTxt(h)}</option>)}</select>;
            const recRow = ({ id, label, tag, type, manual }) => {
                const r = getRec(id, type), kinds = r.kinds || [], open = openP === id;
                const has = k => k === 'sched' ? kinds.includes('booking') || kinds.includes('schedule') : kinds.includes(k);
                const tog = k => { const ks = k === 'sched' ? ['booking', 'schedule'] : [k]; setRec(id, type, { kinds: has(k) ? kinds.filter(x => !ks.includes(x)) : [...new Set([...kinds, ...ks])] }); };
                const cnt = UI_KINDS.filter(([k]) => has(k)).length;
                const sum = [has('sched') && (r.schedMode === 'instant' ? '📅 مع كل حجز' : '📅 جدول ' + hrTxt(r.schedHour)), has('shortage') && (r.shortMode === 'instant' ? '🛒 نواقص فوراً' : '🛒 نواقص ' + hrTxt(r.shortHour))].filter(Boolean).join(' • ');

                    <div key={id} className={`border rounded-xl p-2.5 space-y-2 ${r.chat ? 'border-gold-200 bg-gold-50/30' : 'border-gray-100 bg-gray-50/50'}`}>

                                : <div className="min-w-0"><p className="text-xs font-black text-gray-800 truncate">{label}</p>{tag && <p className="text-[9px] font-bold text-gray-400 truncate">{tag}</p>}</div>}
                            <div className="flex items-center gap-1 shrink-0">
                                <button type="button" title="ابعت رسالة تجربة" onClick={() => test(r.chat, manual ? (r.name || '') : label, 't_' + id)} className="w-8 h-8 flex items-center justify-center bg-white border border-gray-200 rounded-lg text-sm hover:border-gold-400">🧪</button>
                                <button type="button" onClick={() => setOpenP(open ? null : id)} className="text-[10px] font-black text-gold-700 bg-white border border-gold-200 rounded-lg px-2 h-8">{cnt} إشعار {open ? '▲' : '▼'}</button>
                                {manual && <button type="button" title="حذف" onClick={() => setV(p => { const pp = { ...p.people }; delete pp[id]; return { ...p, people: pp }; })} className="w-8 h-8 text-red-500 font-black">✕</button>}
                            </div>
                        </div>
                        <input dir="ltr" value={r.chat || ''} onChange={e => setRec(id, type, { chat: e.target.value })} className={inp} placeholder="chat_id (من @myidbot)" />
                        <Res k={'t_' + id} />
                        {!open && r.chat && sum && <p className="text-[10px] font-bold text-gray-500">{sum}</p>}
                        {open && <div className="space-y-2 pt-1">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-1">{UI_KINDS.map(([k, n]) => <label key={k} className="flex items-center gap-2 text-[11px] font-bold text-gray-700 cursor-pointer">
                                <input type="checkbox" checked={has(k)} onChange={() => tog(k)} />{n}{type === 'doctor' && (k === 'sched' || DOCTOR_OWN_KINDS.includes(k)) ? <span className="text-[9px] text-gray-400">(بتاعته بس)</span> : ''}</label>)}</div>
                            {(has('sched') || has('digest')) && <div className="bg-white border border-gray-100 rounded-lg p-2 space-y-1.5">
                                {has('sched') && <div className="flex flex-wrap items-center gap-1.5 text-[11px] font-bold text-gray-700"><span>📅 الحجوزات:</span>
                                    <select value={r.schedMode} onChange={e => setRec(id, type, { schedMode: e.target.value })} className={selC}><option value="daily">مجمّعة في جدول المواعيد</option><option value="instant">رسالة مع كل حجز</option></select>
                                    {r.schedMode !== 'instant' && <><span>الساعة</span>{hourSel(r.schedHour, h => setRec(id, type, { schedHour: h }))}</>}</div>}
                                {has('sched') && <p className="text-[9px] font-bold text-gray-400">{r.schedMode === 'instant' ? 'كل حجز من السيستم بيوصل لحظتها (لأي يوم)، ومفيش جدول صبح.' : 'جدول النهاردة بيوصل الساعة دي. الحجز الجديد لنفس اليوم بعدها بيوصل لوحده، وحجوزات بكرة وبعده بتيجي في جدول يومها.'}</p>}
                                {has('digest') && (!has('sched') || r.schedMode === 'instant') && <div className="flex flex-wrap items-center gap-1.5 text-[11px] font-bold text-gray-700"><span>☀️ ملخص الصبح الساعة</span>{hourSel(r.schedHour, h => setRec(id, type, { schedHour: h }))}</div>}
                            </div>}
                            {has('shortage') && <div className="bg-white border border-gray-100 rounded-lg p-2 flex flex-wrap items-center gap-1.5 text-[11px] font-bold text-gray-700"><span>🛒 النواقص:</span>
                                <select value={r.shortMode} onChange={e => setRec(id, type, { shortMode: e.target.value })} className={selC}><option value="daily">مجمّعة مرة في اليوم</option><option value="instant">فوراً مع كل نقص</option></select>
                                {r.shortMode !== 'instant' && <><span>الساعة</span>{hourSel(r.shortHour, h => setRec(id, type, { shortHour: h }))}</>}</div>}
                        </div>}
                    </div>

            const area = (k, rows = 4) => <textarea rows={rows} value={v[k] ?? ''} onChange={e => set({ [k]: e.target.value })} className="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl text-xs font-bold outline-none focus:border-gold-500" />;
            const reset = k => <button type="button" onClick={() => set({ [k]: TPL_DEFAULT[k] })} className="text-[10px] text-gray-400 font-bold hover:text-gold-600">استرجاع النص الأصلي</button>;
            const card = "bg-white p-4 rounded-[20px] border border-gray-100 shadow-sm space-y-1.5";
            const block = (obj, delMsg) => Object.entries(obj).filter(([k]) => !isDel(k)).map(([k, [t0, vars]]) => (
                <div key={k} className={card}>
                    <EditableTitle value={title(k, t0)} onChange={t => setTitle(k, t)} onDelete={() => del(k)} deleteMsg={delMsg} />
                    <p className="text-[9px] text-gray-400 font-bold" dir="ltr">{vars}</p>
                    {area(k)}{reset(k)}
                </div>));
            const restoreList = (keys, names) => { const d = keys.filter(isDel); return d.length ? (
                <div className="bg-gray-50 border border-dashed border-gray-200 rounded-[20px] p-3 space-y-1.5"><p className="text-[10px] font-black text-gray-500">قوالب محذوفة (مش بتتبعت):</p>
                    {d.map(k => <div key={k} className="flex items-center justify-between text-xs font-bold text-gray-500"><span className="line-through">{title(k, names[k])}</span><button type="button" onClick={() => undel(k)} className="text-gold-600 font-black text-[11px]">↩ استرجاع</button></div>)}</div>) : null; };
            const TABS = [['wa', 'واتساب'], ['tg', 'تيليجرام'], ['custom', 'رسائل مخصصة']];
            const tgNames = { ...Object.fromEntries(Object.entries(TG_L).map(([k, x]) => [k, x[0]])), ...Object.fromEntries(Object.entries(GROUPS).map(([k, x]) => [k, x[0]])) };
            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="flex bg-gray-100 p-1 rounded-xl max-w-md">{TABS.map(([k, n]) => <button key={k} type="button" onClick={() => setTab(k)} className={`flex-1 px-3 py-2 text-xs font-black rounded-lg ${tab === k ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>{n}</button>)}</div>

                    {tab === 'wa' && <>
                        <p className="text-[10px] font-bold text-gray-400">رسايل واتساب اللي بتتبعت للمرضى والمعامل من الزراير. الكلمات بين أقواس {'{ }'} بتتبدل تلقائي. لو حذفتي قالب، الزرار بتاعه بيختفي.</p>
                        {block(WA, 'حذف القالب ده؟ الزرار بتاعه هيختفي من السيستم (تقدري ترجّعيه بعدين).')}
                        {restoreList(Object.keys(WA), Object.fromEntries(Object.entries(WA).map(([k, x]) => [k, x[0]])))}
                    </>}

                    {tab === 'tg' && <>
                        <p className="text-[10px] font-bold text-gray-400">رسايل تيليجرام. {'{by}'} هو اسم اللي سجّل. لو حذفتي قالب، الرسالة دي بتبطل تتبعت لحد ما ترجّعيه.</p>
                        {block(TG_L, 'حذف القالب ده؟ الرسالة دي هتبطل تتبعت لأي حد (تقدري ترجّعيها بعدين).')}
                        {Object.entries(GROUPS).filter(([g]) => !isDel(g)).map(([g, [t0, parts]]) => (
                            <div key={g} className={card + ' space-y-3'}>
                                <EditableTitle value={title(g, t0)} onChange={t => setTitle(g, t)} onDelete={() => del(g)} deleteMsg="حذف الجدول ده؟ هيبطل يتبعت (تقدري ترجّعيه بعدين)." />
                                {parts.map(([k, n, vars, qk, qn]) => <div key={k} className="space-y-1 border-t border-gray-50 pt-2">
                                    <p className="text-[11px] font-black text-gray-600">{n}</p>
                                    <p className="text-[9px] text-gray-400 font-bold" dir="ltr">{vars}</p>
                                    {area(k, 2)}
                                    {qk && <label className="flex items-center gap-2 text-[11px] font-black text-gray-700 bg-amber-50 rounded-lg px-2.5 py-2 cursor-pointer"><input type="checkbox" checked={!!(v._quiet || {})[qk]} onChange={e => set({ _quiet: { ...(v._quiet || {}), [qk]: e.target.checked } })} />{qn}</label>}
                                    {reset(k)}
                                </div>)}
                                <p className="text-[10px] text-gray-400 font-bold">لو خانة فاضية (زي الخدمة) الفاصل اللي قبلها بيختفي لوحده.</p>
                            </div>))}
                        {restoreList([...Object.keys(TG_L), ...Object.keys(GROUPS)], tgNames)}
                    </>}

                    {tab === 'custom' && (isSuper ? <CustomMsgsView showToast={showToast} data={data} /> : <p className="text-xs font-bold text-gray-400 bg-white rounded-xl p-4">الرسايل المخصصة للسوبر أدمن بس.</p>)}

                    {tab !== 'custom' && <button type="button" onClick={save} disabled={!dirty} className="w-full bg-gold-500 text-white py-3 rounded-xl font-black text-sm shadow-md disabled:opacity-40">{dirty ? 'حفظ الرسائل' : 'محفوظ ✓'}</button>}
                </div>
            );
        }

                const APP_STATUS = {
            unconfirmed: { l: 'غير مؤكد', c: 'bg-gray-100 text-gray-600' },
            confirmed: { l: 'حجز مؤكد', c: 'bg-indigo-100 text-indigo-700' },
            on_way: { l: 'في الطريق', c: 'bg-blue-100 text-blue-700' },
            arrived: { l: 'حضر (الريسبشن)', c: 'bg-emerald-100 text-emerald-700' },
            done: { l: 'أنهى الجلسة', c: 'bg-teal-100 text-teal-700' },
            postponed: { l: 'مؤجل', c: 'bg-amber-100 text-amber-700' },
            canceled: { l: 'كنسل', c: 'bg-red-100 text-red-600' }
        };
        function StatusSelect({ a, showToast }) {
            const cur = (!a.status || a.status === 'booked') ? 'unconfirmed' : a.status;
            const [pp, setPp] = useState(null); // نافذة التأجيل: { date, time }
            const me = LIVE.me || {};
            const setSt = st => db.collection('appointments').doc(a.id).update({ status: st, statusChangedAt: new Date().toISOString() }).catch(err => showToast("مشكلة في تغيير الحالة: " + err.message));
            // التأجيل: السكرتيرة تختار الميعاد الجديد والحجز يتنقل له. لو مفيش ميعاد لسه → "مؤجل" ويتسجل في سجل المرضى للمتابعة
            const onChange = v => { if (v === 'postponed' && me.role !== 'doctor') setPp({ date: '', time: a.time || '' }); else setSt(v); };
            const move = async () => {
                if (!pp.date || !pp.time) { showToast('اختاري اليوم والساعة'); return; }
                const clash = a.doctorId && a.doctorId !== 'none' && (LIVE.appointments || []).some(x => x.id !== a.id && x.doctorId === a.doctorId && x.date === pp.date && x.time === pp.time && x.status !== 'canceled');
                if (clash && !confirm('د. ' + (a.doctorName || '') + ' عنده حجز تاني في الميعاد ده. تنقليه برضه؟')) return;
                const br = (LIVE.branches || []).find(b => b.id === a.branchId) || {};
                if (((br.daysOff || []).includes(dowOf(pp.date)) || (br.holidays || []).includes(pp.date)) && !confirm('الفرع متسجل إجازة اليوم ده. تنقليه برضه؟')) return;
                const at = new Date().toISOString();
                db.collection('appointments').doc(a.id).update({ date: pp.date, time: pp.time, status: 'unconfirmed', statusChangedAt: at, rescheduledAt: at, rescheduledBy: me.name || '', prevDate: a.date || '', prevTime: a.time || '', prevDoctorId: a.doctorId || '', prevDoctorName: a.doctorName || '' })
                    .then(() => { setPp(null); showToast('الحجز اتنقل لـ ' + pp.date + ' ' + pp.time + ' ✓'); }).catch(err => showToast('مشكلة: ' + err.message));
            };
            return (
                <>
                    <select value={cur} onChange={e => onChange(e.target.value)}
                        className={`text-[9px] font-black rounded-lg px-1.5 py-1.5 outline-none cursor-pointer ${APP_STATUS[cur].c}`}>
                        {Object.entries(APP_STATUS).map(([k, v]) => <option key={k} value={k}>{v.l}</option>)}
                    </select>
                    {pp && ReactDOM.createPortal(<div dir="rtl" className="fixed inset-0 bg-black/60 z-[99999] flex items-center justify-center p-4" onClick={() => setPp(null)}>
                        <div className="bg-white rounded-[24px] p-5 w-full max-w-sm space-y-3 text-right" onClick={e => e.stopPropagation()}>
                            <p className="font-black text-gray-800">⏸ تأجيل حجز {a.patientName}</p>
                            <p className="text-[11px] font-bold text-gray-500">كان: {a.date} {a.time || ''}{a.doctorName ? ' — د. ' + a.doctorName : ''}</p>
                            <p className="text-xs font-black text-gray-700">الميعاد الجديد:</p>
                            <div className="grid grid-cols-2 gap-2">
                                <input type="date" min={localDay()} value={pp.date} onChange={e => setPp({ ...pp, date: e.target.value })} className="p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-bold outline-none focus:border-gold-500" />
                                <input type="time" value={pp.time} onChange={e => setPp({ ...pp, time: e.target.value })} className="p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-bold outline-none focus:border-gold-500" />
                            </div>
                            <button type="button" onClick={move} className="w-full bg-gold-500 text-white py-3 rounded-xl font-black text-sm">📅 انقل الحجز للميعاد ده</button>
                            <button type="button" onClick={() => { setPp(null); setSt('postponed'); }} className="w-full bg-amber-50 text-amber-800 border border-amber-200 py-2.5 rounded-xl font-black text-xs">مفيش ميعاد لسه — سجّليه "مؤجل" في سجل المرضى للمتابعة</button>
                            <button type="button" onClick={() => setPp(null)} className="w-full text-gray-400 py-1 font-bold text-xs">رجوع</button>
                        </div>
                    </div>, document.body)}
                </>
            );
        }

        // --- الماليات: خزنة كل فرع ---
        function FinanceView({ payments, branches, selectedBranch, currentUser, onConfirm, onAdd, onEdit, showToast }) {
            const num = v => Number(v || 0);
            const shown = branches.filter(b => selectedBranch === 'all' || b.id === selectedBranch);
            const pending = payments.filter(p => !p.delivered);
            const totalPending = pending.reduce((s, p) => s + num(p.amount), 0);
            const [q, setQ] = useState('');
            const sorted = payments.filter(p => textHit(p, ['receivedBy', 'recordedBy', 'amount', 'paymentMethod', 'date', 'note'], q)).sort((x, y) => (y.date || '').localeCompare(x.date || ''));
            const settle = (b, reset) => onConfirm({
                msg: (reset ? 'تصفير خزنة فرع ' : 'تأكيد توريد خزنة فرع ') + b.name + '؟',
                onConfirm: () => {
                    const batch = db.batch();
                    pending.filter(p => p.branchId === b.id).forEach(p => batch.update(db.collection('payments').doc(p.id), { delivered: true, zeroed: reset, deliveredAt: new Date().toISOString() }));
                    batch.commit().then(() => showToast(reset ? 'تم تصفير الخزنة' : 'تم تسجيل التوريد')).catch(err => showToast("مشكلة: " + err.message));
                }
            });
            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <SearchBar value={q} onChange={setQ} placeholder="دوّر في التوريدات بالاسم أو المبلغ أو التاريخ" />
                    <OlderLoader col="payments" what="التوريدات (والمبالغ اللي لسه متورّدتش كلها)" />
                    <div className="bg-gradient-to-r from-gold-600 to-gold-400 p-6 rounded-[20px] text-white shadow-xl flex flex-wrap justify-between items-center gap-4">
                        <div><p className="text-gold-100 text-[10px] font-bold mb-1">إجمالي الخزائن (لم يتم توريده)</p><h2 className="text-3xl font-black">{totalPending} EGP</h2></div>
                        <button type="button" onClick={() => onAdd(selectedBranch === 'all' ? '' : selectedBranch)} className="bg-white text-gold-600 px-5 py-2.5 rounded-xl text-xs font-black shadow-lg">+ حساب اليوم</button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        {shown.map(b => {
                            const mine = pending.filter(p => p.branchId === b.id);
                            const bal = mine.reduce((s, p) => s + num(p.amount), 0);
                            const delivered = payments.filter(p => p.branchId === b.id && p.delivered && !p.zeroed).reduce((s, p) => s + num(p.amount), 0);
                            return (
                                <div key={b.id} className="bg-white p-4 rounded-[20px] border border-gray-100 shadow-sm">
                                    <div className="flex justify-between items-start mb-2">
                                        <h4 className="font-black text-sm text-gray-800">{b.name}</h4>
                                        <button type="button" onClick={() => onAdd(b.id)} className="text-[10px] font-black bg-gold-50 text-gold-600 border border-gold-200 px-2 py-1 rounded-lg">+ حساب اليوم</button>
                                    </div>
                                    <p className="text-[9px] text-gray-400 font-bold">في الخزنة ({mine.length} تسجيل)</p>
                                    <p className="text-2xl font-black text-gray-800 mb-1">{bal} ج</p>
                                    <p className="text-[9px] text-gray-400 font-bold mb-3">تم توريده سابقاً: {delivered} ج</p>
                                    <div className="flex gap-2">
                                        <button type="button" disabled={mine.length === 0} onClick={() => settle(b, false)} className="flex-1 py-2 rounded-lg text-[10px] font-black bg-emerald-500 text-white disabled:opacity-30">✅ تم التوريد</button>
                                        <button type="button" disabled={mine.length === 0} onClick={() => settle(b, true)} className="py-2 px-3 rounded-lg text-[10px] font-black bg-gray-100 text-gray-600 disabled:opacity-30">تصفير</button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    <div className="bg-white p-3 rounded-[20px] border border-gray-100 shadow-sm space-y-2">
                        <h4 className="text-xs font-black text-gray-800 px-1">سجل الحسابات اليومية</h4>
                        {sorted.length === 0 && <p className="text-gray-400 text-xs font-bold text-center p-4">لا توجد حسابات مسجلة.</p>}
                        {sorted.map(p => (
                            <div key={p.id} className="flex justify-between items-center p-4 bg-gray-50 rounded-xl relative">
                                <div className="absolute left-2 top-2 flex gap-1">
                                    <button type="button" onClick={() => onEdit(p)} className="p-1 text-gold-500 bg-white border border-gray-200 rounded-lg"><IconEdit/></button>
                                    <button type="button" onClick={() => onConfirm({msg:'هل تريد حذف هذا الحساب نهائياً؟', onConfirm:()=>{
                                        trashDelete('payments', p.id).then(() => showToast("تم الحذف")).catch(err => showToast("مشكلة في الحذف: " + err.message));
                                    }})} className="p-1 text-red-500 bg-white border border-gray-200 rounded-lg"><IconTrash/></button>
                                </div>
                                <div className="mt-2">
                                    <div className="flex items-center gap-2 mb-1 flex-wrap">
                                        <p className="font-black text-xs text-gray-800">فرع {branches.find(b => b.id === p.branchId)?.name || 'غير معروف'}</p>
                                        {p.paymentMethod && <span className="bg-gray-200 text-gray-600 text-[8px] px-1.5 py-0.5 rounded font-bold">{p.paymentMethod}</span>}
                                        <span className={`text-[8px] px-1.5 py-0.5 rounded font-bold ${!p.delivered ? 'bg-amber-100 text-amber-700' : p.zeroed ? 'bg-gray-200 text-gray-500' : 'bg-emerald-100 text-emerald-700'}`}>{!p.delivered ? 'في الخزنة' : p.zeroed ? 'تم التصفير' : 'تم التوريد'}</span>
                                    </div>
                                    <p className="text-[9px] text-gray-500 font-bold">{p.date}{p.recordedBy ? ' • ' + p.recordedBy : ''}</p>
                                </div>
                                <div className="text-emerald-500 font-black text-base mr-12">+{p.amount} ج</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- توريد اليوم (للسكرتارية): يشوفوا ويعدلوا اللي ضافوه النهاردة بس ---
        function DailyView({ payments, branches, currentUser, onConfirm, onAdd, onEdit, showToast }) {
            const [, tick] = useState(0);
            useEffect(() => { const t = setInterval(() => tick(v => v + 1), 30000); return () => clearInterval(t); }, []);
            const today = localDay();
            const mine = payments.filter(p => p.createdDay === today && (p.recordedById ? p.recordedById === currentUser.id : p.recordedBy === currentUser.name)).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
            const total = mine.reduce((s, p) => s + Number(p.amount || 0), 0);
            const guard = (fn) => { if (localDay() !== today) { showToast('انتهى اليوم — مينفعش التعديل'); return; } fn(); };
            return (
                <div className="space-y-4 w-full animate-fade-in">
                    <div className="bg-gradient-to-r from-gold-600 to-gold-400 p-6 rounded-[20px] text-white shadow-xl flex flex-wrap justify-between items-center gap-4">
                        <div><p className="text-gold-100 text-[10px] font-bold mb-1">توريد اليوم ({mine.length} تسجيل)</p><h2 className="text-3xl font-black">{total} EGP</h2></div>
                        <button type="button" onClick={onAdd} className="bg-white text-gold-600 px-5 py-2.5 rounded-xl text-xs font-black shadow-lg">+ إضافة توريد</button>
                    </div>
                    <div className="bg-white p-3 rounded-[20px] border border-gray-100 shadow-sm space-y-2">
                        <p className="text-[10px] text-gray-400 font-bold px-1">بتشوفي هنا اللي ضفتيه النهاردة بس، وبيختفي تلقائياً بعد نهاية اليوم.</p>
                        {mine.length === 0 && <p className="text-gray-400 text-xs font-bold text-center p-4">لا يوجد توريد مسجل اليوم.</p>}
                        {mine.map(p => (
                            <div key={p.id} className="flex justify-between items-center p-4 bg-gray-50 rounded-xl relative">
                                <div className="absolute left-2 top-2 flex gap-1">
                                    <button type="button" onClick={() => guard(() => onEdit(p))} className="p-1 text-gold-500 bg-white border border-gray-200 rounded-lg"><IconEdit/></button>
                                    <button type="button" onClick={() => guard(() => onConfirm({ msg: 'حذف هذا التوريد؟', onConfirm: () => { if (localDay() !== today) { showToast('انتهى اليوم — مينفعش الحذف'); return; } trashDelete('payments', p.id).then(() => showToast('تم الحذف')).catch(err => showToast('مشكلة في الحذف: ' + err.message)); } }))} className="p-1 text-red-500 bg-white border border-gray-200 rounded-lg"><IconTrash/></button>
                                </div>
                                <div className="mt-2">
                                    <p className="font-black text-xs text-gray-800">فرع {branches.find(b => b.id === p.branchId)?.name || 'غير معروف'}</p>
                                    {p.paymentMethod && <span className="bg-gray-200 text-gray-600 text-[8px] px-1.5 py-0.5 rounded font-bold">{p.paymentMethod}</span>}
                                </div>
                                <div className="text-emerald-500 font-black text-base mr-12">{p.amount} ج</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- الموظفين + الأطباء ---
        function SecretCell({ value }) {
            const [show, setShow] = useState(false);
            if (!value) return <span className="text-gray-300">—</span>;
            return <button type="button" onClick={() => setShow(!show)} className="font-mono font-bold text-gray-700 hover:text-gold-600">{show ? value : '••••••'}</button>;
        }

                <div className="space-y-4 w-full animate-fade-in">
                    <div className="flex justify-between items-center">

                    </div>
                    <div className="flex bg-gray-100 p-1 rounded-xl w-full sm:w-72">
                        <button type="button" onClick={() => setTab('staff')} className={`flex-1 px-4 py-1.5 text-xs font-bold rounded-lg ${tab === 'staff' ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>سكرتارية / تمريض</button>
                        <button type="button" onClick={() => setTab('doctors')} className={`flex-1 px-4 py-1.5 text-xs font-bold rounded-lg ${tab === 'doctors' ? 'bg-white shadow text-gold-600' : 'text-gray-500'}`}>الأطباء</button>
                    </div>
                    {tab === 'doctors' && <p className="text-[10px] text-gray-400 font-bold">الطبيب يدخل باسم المستخدم وكلمة السر ويشوف حجوزاته وحالاته بس، ويقدر يغيّر حالة الحجز. ممكن تختاري له أكتر من فرع بنفس الحساب.</p>}
                    <div className="bg-white rounded-[20px] border border-gray-100 overflow-hidden shadow-sm w-full overflow-x-auto">
                        <table className="w-full text-right text-[10px] min-w-[480px]">
                            <thead className="bg-gray-50 text-gray-500 border-b"><tr><th className="p-2">الاسم</th><th className="p-2">الوظيفة</th><th className="p-2 text-center">اسم المستخدم</th><th className="p-2 text-center">كلمة السر</th><th className="p-2">الفرع</th><th className="p-2 text-center">أوامر</th></tr></thead>
                            <tbody className="divide-y divide-gray-100">{list.map(s => (

                                                <label className="text-[10px] font-black text-gray-500">كل كام دقيقة<select name="slotMin" defaultValue={modal.data?.slotMin || 30} className="w-full mt-1 p-2 bg-white border border-gray-200 rounded-lg text-xs font-bold">{[15, 20, 30, 45, 60].map(m => <option key={m} value={m}>{m} دقيقة</option>)}</select></label>
                                            </div>
                                            <p className="text-[10px] font-black text-gray-500">أيام الإجازة الأسبوعية (مفيش حجز فيها):</p>
                                            <div className="flex flex-wrap gap-1.5">{[6, 0, 1, 2, 3, 4, 5].map(dw => <button type="button" key={dw} onClick={() => setBrOff(o => o.includes(dw) ? o.filter(x => x !== dw) : [...o, dw])} className={`px-2.5 py-1 rounded-lg text-[11px] font-black border ${brOff.includes(dw) ? 'bg-red-500 text-white border-red-500' : 'bg-white text-gray-600 border-gray-200'}`}>{DAY_NAMES[dw]}</button>)}</div>
                                            <p className="text-[10px] font-black text-gray-500">إجازات في أيام معينة (عيد، سفر...):</p>
                                            <div className="flex gap-2"><input type="date" value={holNew} min={localDay()} onChange={e => setHolNew(e.target.value)} className="flex-1 p-2 bg-white border border-gray-200 rounded-lg text-xs font-bold" /><button type="button" disabled={!holNew} onClick={() => { setBrHol(h => [...new Set([...h, holNew])].sort()); setHolNew(''); }} className="px-3 bg-gray-800 text-white rounded-lg text-[11px] font-black disabled:opacity-30">إضافة</button></div>
                                            {brHol.length > 0 && <div className="flex flex-wrap gap-1.5">{brHol.map(h => <span key={h} className="bg-red-50 text-red-700 text-[11px] font-black px-2 py-1 rounded-lg">{h} <button type="button" onClick={() => setBrHol(x => x.filter(y => y !== h))} className="mr-1">✕</button></span>)}</div>}
                                        </div>
                                        <Input name="mapEmbed" label="الخريطة: كود التضمين من جوجل مابس أو اسم المكان" defaultValue={modal.data?.mapEmbed} placeholder='<iframe src="https://www.google.com/maps/embed?...' dir="ltr" />
                                        <p className="text-[9px] text-gray-400 font-bold leading-relaxed">من جوجل مابس: افتحي مكان الفرع ← مشاركة (Share) ← تضمين خريطة (Embed a map) ← نسخ HTML والصقيه هنا. لو سبتيه فاضي هيستخدم العنوان.</p>
                                    </>
                                )}
                                <button type="submit" className="w-full py-4 mt-6 bg-gold-500 text-white rounded-xl font-black shadow-lg hover:bg-gold-600 transition-colors text-sm">حفظ التغييرات</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        function Input({ label, ...props }) {
            return (
                <div className="space-y-1">
                    <label className="text-[9px] font-black text-gray-500 uppercase tracking-widest block">{label}</label>
                    <input {...props} className="w-full bg-gray-50 border border-gray-100 focus:border-gold-500 p-3 rounded-xl outline-none font-bold text-gray-800 text-xs shadow-inner transition-colors" />
                </div>
            );
        }

        function Toast({ msg, onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);
            return (
                <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[999999] bg-gray-900 text-white px-5 py-3 rounded-2xl shadow-2xl animate-slide-up flex items-center gap-3 border border-gray-700">
                    <IconCheck />
                    <span className="font-bold text-xs">{msg}</span>
                    <button type="button" onClick={onClose} className="text-gray-400 hover:text-white p-1"><IconX /></button>
                </div>
            );
        }

        // لو حصل خطأ في الشاشة: بدل الصفحة البيضا بتظهر رسالة فيها الخطأ وزرار إعادة تحميل
        class AppErrorBoundary extends React.Component {
            constructor(p) { super(p); this.state = { err: null }; }
            static getDerivedStateFromError(err) { return { err }; }
            componentDidCatch(err, info) { console.error('App crash:', err, info && info.componentStack); }
            render() {
                if (!this.state.err) return this.props.children;
                const msg = String((this.state.err && (this.state.err.stack || this.state.err.message)) || this.state.err).split('\n').slice(0, 3).join('\n');
                return (
                    <div className="h-screen bg-[#050505] flex items-center justify-center p-6 text-center">
                        <div className="max-w-md w-full bg-[#111] border border-white/10 rounded-3xl p-6 space-y-4">
                            <p className="text-white font-black">حصلت مشكلة في عرض الصفحة</p>
                            <p className="text-gray-400 text-xs font-bold">صوّري الرسالة دي وابعتيها، وجربي إعادة التحميل.</p>
                            <pre dir="ltr" className="text-left text-[10px] text-red-300 bg-black/60 rounded-xl p-3 whitespace-pre-wrap break-all max-h-40 overflow-auto">{msg}</pre>
                            <div className="flex gap-2"><button type="button" onClick={() => window.location.reload()} className="flex-1 bg-gold-500 text-black py-2.5 rounded-xl font-black text-sm">إعادة تحميل</button>
                                <button type="button" onClick={() => { try { auth.signOut(); } catch (e) {} setTimeout(() => window.location.reload(), 300); }} className="flex-1 bg-white/10 text-white py-2.5 rounded-xl font-black text-sm">خروج</button></div>
                        </div>
                    </div>
                );
            }
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
    </script>
</body>
</html>
