    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #FDFCFB; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #F59E0B; border-radius: 10px; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        .animate-scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background-color: #e5e7eb; border: 1px solid #e5e7eb; border-radius: 16px; overflow: hidden; }
        .calendar-cell { background-color: white; aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .calendar-cell:hover { background-color: #fffbeb; }
        .calendar-cell.other-month { background-color: #f9fafb; color: #9ca3af; }
        .calendar-cell.today { background-color: #fef3c7; color: #b45309; font-weight: 900; border: 2px solid #f59e0b; }
        .dot { height: 6px; width: 6px; background-color: #F59E0B; border-radius: 50%; margin-top: 4px; }
        .modal-layer { z-index: 99999 !important; }
        
        /* تأثيرات Checkbox */
        input[type="checkbox"] { accent-color: #F59E0B; width: 16px; height: 16px; cursor: pointer; }

ه قبل ما آجي الكشف؟","هات معاك أي أشعة أو تقارير قديمة، وقول للدكتور لو عندك أي أمراض مزمنة (زي السكر أو الضغط) أو بتاخد أدوية بانتظام، أو لو عندك حساسية من أي دوا، أو لو حامل."],["xray","أشعة","إيه الفرق بين الأشعة العادية والأشعة الـ 3D؟","الأشعة العادية بتورّي صورة مسطحة للأسنان، أما الأشعة الـ 3D (CBCT) فبتورّي العظم والأعصاب والأسنان بأبعادها التلاتة، وده مهم جداً في تخطيط الزراعة والضروس المدفونة وبعض حالات العصب الصعبة."],["xray","أشعة","هل أشعة الأسنان فيها خطر؟","جرعة الإشعاع في أشعة الأسنان صغيرة جداً، والدكتور مش بيطلبها غير لما تكون مفيدة فعلاً للتشخيص. ولو في احتمال حمل لازم تبلّغي الدكتور قبلها."],["xray","أشعة","إمتى أحتاج أشعة 3D؟","غالباً قبل زراعة الأسنان، وفي الضروس المدفونة (زي ضرس العقل)، وتقييم عظم الفك، وبعض حالات العصب والتقويم. الدكتور هو اللي بيحدد إذا كانت حالتك محتاجاها."],["fillings","حشو","إيه هو الحشو التجميلي؟","هو حشو بلون السنة (كومبوزيت) بيتختار لونه بحيث يبقى قريب من لون سنانك، فمش بيبان. بيتعمل في نفس الجلسة غالباً وبيرجّع شكل السنة ووظيفتها."],["fillings","حشو","ينفع آكل بعد الحشو على طول؟","الحشو التجميلي بيتصلّب بالضوء في العيادة، فينفع تاكل بعده. بس لو خدت بنج استنى لحد ما مفعوله يروح عشان متعضّش على خدك أو لسانك من غير ما تحس."],["fillings","حشو","طبيعي يبقى فيه حساسية بعد الحشو؟","ممكن يبقى فيه حساسية خفيفة من البارد أو الساقع كام يوم وبتروح لوحدها. لو الألم شديد، أو بيصحّيك من النوم، أو حاسس إن الحشو عالي وانت بتعض، ارجع للدكتور."],["fillings","حشو","ينفع أغيّر الحشو الفضي القديم لحشو بلون السنة؟","غالباً ينفع، خصوصاً لو الحشو القديم مكسور أو فيه تسوس تحته أو شكله مضايقك. الدكتور بيكشف ويقولك إذا كان التغيير مناسب لحالتك."],["","حشو العصب","حشو العصب بيوجع؟","بيتعمل تحت بنج موضعي، فأغلب المرضى بيحسوا براحة بعده مش بألم، لأنه بيشيل سبب الوجع. ممكن يبقى فيه إحساس بسيط كام يوم بعدها وبيتعالج بمسكن عادي حسب كلام الدكتور."],["","حشو العصب","حشو العصب بياخد كام جلسة؟","بيختلف حسب الحالة: ناس بتخلص في جلسة واحدة، وحالات تانية بتحتاج جلستين أو تلاتة لو فيه التهاب أو خراج. الدكتور بيحدد ده بعد الكشف والأشعة."],["","حشو العصب","لازم أركّب طربوش بعد حشو العصب؟","في الضروس الخلفية غالباً بيُنصح بالطربوش (التاج)، لأن السنة بعد حشو العصب بتبقى أضعف ومعرّضة للكسر. في بعض الأسنان الأمامية ممكن حشو كويس يكفي، والدكتور بيقرر حسب حالة السنة."],["","حشو العصب","هل لازم آخد مضاد حيوي مع حشو العصب؟","مش دايماً. المضاد الحيوي بيتوصف بس في حالات معينة زي وجود تورم أو التهاب منتشر، والعلاج الأساسي هو تنظيف العصب نفسه. متاخدش مضاد حيوي من غير وصفة الدكتور."],["fixed-prosthetics","تركيبات","إيه الفرق بين الطربوش والكوبري؟","الطربوش (التاج) بيغطي سنة واحدة ضعيفة أو مكسورة عشان يحميها. الكوبري بيعوّض سنة أو أكتر ناقصة، وبيتثبت على الأسنان اللي جنب المكان الفاضي."],["fixed-prosthetics","تركيبات","أنهي أحسن: زيركون ولا بورسلين؟","الاتنين اختيارات كويسة. الزيركون معروف بقوته وشكله الطبيعي ومناسب لأماكن كتير، والبورسلين بأنواعه ليه استخداماته برضه. الدكتور بيختار المادة حسب مكان السنة وقوة العضة والشكل اللي يناسبك."],["fixed-prosthetics","تركيبات","التركيبة الثابتة بتاخد كام زيارة؟","غالباً زيارتين لتلاتة: تجهيز السنة وأخذ المقاس وتركيب طربوش مؤقت، وبعدها بكام يوم تجربة وتركيب التركيبة النهائية. ممكن يختلف حسب الحالة."],["fixed-prosthetics","تركيبات","أحافظ على التركيبة إزاي؟","بالتفريش مرتين في اليوم والخيط أو فرشاة ما بين الأسنان خصوصاً تحت الكوبري، وبلاش تكسير حاجات صلبة بسنانك، وكشف دوري كل 6 شهور."],["removable-prosthetics","تركيبات متحركة","هاخد وقت قد إيه عشان أتعود على الطقم؟","طبيعي أول كام أسبوع تحس إنه غريب أو يعمل نقط ضغط أو يأثّر على الكلام. التعود بيحصل تدريجياً، والدكتور بيعمل تعديلات بسيطة لو فيه مكان بيضغط."],["removable-prosthetics","تركيبات متحركة","أشيل الطقم بالليل؟","الأفضل تشيله وانت نايم عشان اللثة ترتاح، وتنضّفه كويس وتحطه في ميه أو المحلول اللي الدكتور ينصح بيه."],["removable-prosthetics","تركيبات متحركة","أنضّف الطقم إزاي؟","بفرشاة خاصة أو ناعمة وصابون خفيف أو منظف مخصوص للأطقم، بعد الأكل لو قدرت. بلاش الميه السخنة جداً لأنها ممكن تغيّر شكله، وبلاش معجون أسنان خشن."],["removable-prosthetics","تركيبات متحركة","هل الطقم ينفع يتظبط لو بقى واسع؟","أيوه، مع الوقت شكل اللثة والعظم بيتغير فالطقم ممكن يوسع، والحل غالباً تبطين جديد أو تعديل، ولو قديم جداً ممكن يحتاج طقم جديد. متستخدمش لزقات كتير بدل ما تظبطه."],["ortho","تقويم","التقويم بياخد قد إيه؟","بيختلف حسب الحالة، لكن أغلب الحالات بتاخد من سنة لسنتين تقريباً. الدكتور بيديك مدة متوقعة بعد الكشف والأشعة وأخذ المقاسات."],["ortho","تقويم","هل في سن معين للتقويم؟","مفيش سن أقصى طول ما الأسنان واللثة سليمين. للأطفال، أول تقييم بيكون مفيد حوالي سن 7 سنين عشان لو فيه مشكلة في نمو الفك تتلحق بدري."],["ortho","تقويم","التقويم بيوجع؟","بيبقى فيه ضغط أو ألم خفيف أول كام يوم بعد التركيب وبعد كل ضبط، وبيروح لوحده. الأكل الطري والمسكن العادي بيساعدوا."],["ortho","تقويم","فيه تقويم شفاف مش باين؟","أيوه، فيه تقويم شفاف (Aligners) وتقويم بأقواس بلون السنة. مش كل الحالات مناسب لها كل نوع، والدكتور بيقولك الأنسب لحالتك."],["ortho","تقويم","ليه لازم ألبس مثبت بعد التقويم؟","الأسنان بيكون عندها ميل ترجع لمكانها القديم، فالمثبت (Retainer) بيحافظ على النتيجة. الدكتور بيحددلك تلبسه قد إيه وإزاي."],["ortho","تقويم","آكل إيه وأنا لابس تقويم؟","ابعد عن الأكل اللزج (زي الكراميل) والصلب جداً (زي المكسرات والتلج) عشان ميكسرش الأقواس، وقطّع الأكل الصلب حتت صغيرة، وفرّش بعد الأكل."],["implants","زراعة","زراعة الأسنان بتوجع؟","العملية بتتعمل ببنج موضعي فمش بتحس بألم وقتها. بعدها ممكن يبقى فيه تورم أو ألم بسيط كام يوم وبيتظبط بالأدوية اللي الدكتور يكتبها."],["implants","زراعة","الزراعة بتاخد وقت قد إيه لحد ما أركّب السنة؟","غالباً العظم بيحتاج من 3 لـ 6 شهور عشان يلتحم مع الزرعة قبل التركيبة النهائية. في بعض الحالات المناسبة ممكن يتركب سنة مؤقتة بدري، والدكتور بيحدد ده حسب العظم."],["implants","زراعة","مين ينفع يعمل زراعة؟","أغلب الناس اللي صحتهم كويسة ينفع لهم. مرضى السكر أو المدخنين محتاجين تقييم أدق وضبط للحالة الأول. الأشعة الـ 3D بتحدد كمية العظم، ولو قليل ممكن يتعمل تعويض عظم."],["implants","زراعة","الزرعة بتعيش قد إيه؟","مع العناية الكويسة بالتفريش والخيط والكشف الدوري، الزرعة ممكن تعيش سنين طويلة جداً. التدخين وإهمال نظافة اللثة من أكتر أسباب مشاكلها."],["implants","زراعة","إيه أحسن من الكوبري ولا الزراعة؟","الزراعة بتعوّض السنة من غير ما نبرد الأسنان اللي جنبها، والكوبري اختيار كويس برضه في حالات كتير. الدكتور بيشرحلك مميزات كل اختيار حسب حالتك وميزانيتك."],["kids","أطفال","إمتى أول زيارة لدكتور الأسنان للطفل؟","يُنصح بأول زيارة مع ظهور أول سنة أو قبل ما يكمّل سنة. الزيارة دي بتطمّن على الأسنان وبتعوّد الطفل على العيادة من غير خوف."],["kids","أطفال","ليه أعالج الأسنان اللبني وهي كده كده هتقع؟","الأسنان اللبني بتحافظ على مكان الأسنان الدايمة، وبتساعد الطفل ياكل ويتكلم كويس. التسوس فيها ممكن يسبب ألم والتهاب ويأثّر على السنة الدايمة اللي تحتها."],["kids","أطفال","إزاي أحمي سنان ابني من التسوس؟","تفريش مرتين في اليوم بكمية مناسبة من معجون فيه فلورايد حسب سنه، وتقليل الحلويات والعصاير بين الوجبات، وبلاش ينام بالببرونة. والدكتور ممكن يعمل فلورايد أو سد شقوق (Sealant) للحماية."],["kids","أطفال","ابني بيخاف من الدكتور، أعمل إيه؟",'متخوّفوش بكلام زي "هيوجعك" أو "هيعملك حقنة"، واتكلم عن الزيارة بشكل عادي. دكاترة الأطفال بيتعاملوا خطوة بخطوة عشان الطفل يطمّن ويتعاون.'],["whitening","تبييض","التبييض بيضر الأسنان؟","لما يتعمل تحت إشراف دكتور وبالتركيزات المناسبة بيكون آمن. ممكن يحصل حساسية مؤقتة يوم أو اتنين وبتروح."],["whitening","تبييض","نتيجة التبييض بتستمر قد إيه؟","بتختلف حسب العادات: التدخين والشاي والقهوة والمشروبات الملونة بتقلّل مدة النتيجة. مع العناية ممكن تفضل فترة طويلة، وممكن جلسة تنشيط بعد مدة."],["whitening","تبييض","التبييض بيفتّح لون التركيبات والحشو؟","لأ، التبييض بيأثّر على الأسنان الطبيعية بس. لو عندك حشو أو تركيبات في الأسنان الأمامية الدكتور هيقولك إذا كانت محتاجة تتغير بعد التبييض عشان اللون يبقى واحد."],["whitening","تبييض","مين مينفعش يعمل تبييض؟","يُفضّل تأجيله أثناء الحمل والرضاعة، ولو فيه تسوس أو مشاكل لثة لازم تتعالج الأول. والأطفال الصغيرين مش بيعملوه. الكشف بيحدد إذا كنت مناسب."],["jaw-surgery","جراحة","إمتى ضرس العقل لازم يتخلع؟","لما يكون مدفون أو طالع بزاوية غلط، أو بيعمل ألم أو التهاب متكرر في اللثة، أو بيضغط على الضرس اللي جنبه أو بيسبب تسوس فيه. مش كل ضرس عقل لازم يتخلع، والأشعة بتحدد."],["jaw-surgery","جراحة","أعمل إيه بعد خلع الضرس؟","اضغط على الشاش حوالي نص ساع <!-- مصدر أداة المخزن (للتعديل بس — المتصفح مش بيشغّله). الباقي نفس كود السيستم index.html -->
<script type="text/x-jsx-source" id="inv-jsx-source">
// ===== أداة المخزن المنفصلة (inventory.html) — نفس فايربيس السيستم =====
// بتستخدم نفس مكونات المخزن اللي في السيستم (InventoryView / ShortagesView) بالظبط.
// الدخول: أمين مخزن (حساب بيتعمل من هنا) أو أدمن/سوبر أدمن السيستم بنفس اسم المستخدم وكلمة السر.
const INV_APP_VERSION = '1.0.0';

// يحمّل بيانات الحساب اللي داخل: أدمن السيستم أو أمين مخزن
const loadInvUser = async (u) => {
    if (!u || u.isAnonymous) return null;
    if (u.email && u.email.toLowerCase() === OWNER_EMAIL) return { id: 'owner', name: 'صاحبة الحساب', role: 'superadmin', branchId: 'all', branchIds: [] };
    const a = await db.collection('staff_auth').doc(u.uid).get();
    if (!a.exists) return null;
    const d = a.data();
    if (d.role === 'storekeeper') {
        const k = await db.collection('inv_keepers').doc(d.staffId).get();
        if (!k.exists || k.data().active === false) return { blocked: true };
        return { id: k.id, ...k.data(), role: 'storekeeper', branchId: 'all', branchIds: [], authUid: u.uid };
    }
    if (d.role === 'admin' || d.role === 'superadmin') return await loadStaffForUid(u.uid);
    return { blocked: true };
};

function InvLogin({ onDone, err }) {
    const [busy, setBusy] = useState(false);
    const [msg, setMsg] = useState(err || '');
    useEffect(() => setMsg(err || ''), [err]);
    const submit = async e => {
        e.preventDefault(); const f = e.target;
        const user = f.user.value, pass = f.pass.value;
        if (!user.trim() || !pass) return;
        setBusy(true); setMsg('');
        try {
            await auth.setPersistence(f.keep.checked ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
            const c = await authCreds(user, pass);
            await auth.signInWithEmailAndPassword(c.email, c.password);
            onDone();
        } catch (er) {
            setMsg(er.code === 'auth/too-many-requests' ? 'محاولات كتير — استني شوية وجربي تاني' : er.code === 'auth/network-request-failed' ? 'مفيش نت' : 'اسم المستخدم أو كلمة السر غلط');
        }
        setBusy(false);
    };
    const fld = 'w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white text-sm font-bold outline-none';
    return (
        <div className="min-h-screen bg-[#050505] flex items-center justify-center p-6">
            <form onSubmit={submit} className="w-full max-w-sm bg-[#111111] p-8 rounded-[32px] border border-white/5 shadow-2xl space-y-4 text-right">
                <div className="text-center space-y-1">
                    <p className="text-4xl">📦</p>
                    <h1 className="text-white font-black text-lg">مخزن نيو إيرا</h1>
                    <p className="text-gray-400 text-xs font-bold">دخول أمين المخزن أو الإدارة</p>
                </div>
                <input name="user" autoComplete="username" placeholder="اسم المستخدم" className={fld} required />
                <input name="pass" type="password" autoComplete="current-password" placeholder="كلمة السر" className={fld} required />
                <label className="flex items-center gap-2 text-xs font-bold text-gray-400"><input type="checkbox" name="keep" defaultChecked /> افتكرني على الجهاز ده</label>
                {msg && <p className="text-red-400 text-xs font-black text-center">{msg}</p>}
                <button type="submit" disabled={busy} className="w-full bg-gold-500 text-black py-3 rounded-xl font-black text-sm">{busy ? '...' : 'دخول'}</button>
                <p className="text-center text-[10px] font-bold text-gray-500">v{INV_APP_VERSION}</p>
            </form>
        </div>
    );
}

// ===== إدارة حسابات أمناء المخزن (للأدمن والسوبر أدمن بس) =====
const saveKeeper = async (id, d, old) => {
    const username = normUser(d.username), password = String(d.password || '');
    if (!d.name.trim()) throw new Error('اكتبي الاسم');
    if (!validUser(username)) throw new Error('اسم المستخدم من 3 لـ 40 حرف ومن غير مسافات');
    const keepCreds = old && old.authUid && normUser(old.username) === username && !password;
    if (!keepCreds && !validPass(password)) throw new Error(old ? 'لما تغيّري اسم المستخدم لازم تكتبي كلمة سر جديدة' : 'كلمة السر لازم تكون 4 حروف/أرقام على الأقل');
    const same = await db.collection('inv_keepers').where('username', '==', username).get();
    if (same.docs.some(x => x.id !== id)) throw new Error('اسم المستخدم ده مستخدم لأمين مخزن تاني');
    try { const s = await db.collection('staff_codes').where('username', '==', username).get(); if (!s.empty) throw new Error('اسم المستخدم ده مستخدم لموظف في السيستم — اختاري اسم تاني'); } catch (er) { if (/مستخدم/.test(er.message)) throw er; }
    const uid = keepCreds ? old.authUid : await ensureAuthUser(username, password);
    const ex = await db.collection('staff_auth').doc(uid).get();
    if (ex.exists && ex.data().staffId !== id) throw new Error('اليوزر وكلمة السر دول مستخدمين لحساب تاني — غيّريهم');
    const b = db.batch(), now = new Date().toISOString();
    if (old && old.authUid && old.authUid !== uid) b.delete(db.collection('staff_auth').doc(old.authUid));
    b.set(db.collection('staff_auth').doc(uid), { staffId: id, role: 'storekeeper', name: d.name.trim(), username });
    b.set(db.collection('inv_keepers').doc(id), { name: d.name.trim(), phone: (d.phone || '').trim(), username, authUid: uid, active: d.active !== false, updatedAt: now, ...(old ? {} : { createdAt: now }) }, { merge: true });
    await b.commit();
};

function KeepersView({ showToast, onConfirm }) {
    const [list, setList] = useState(null);
    const [form, setForm] = useState(null);
    const [busy, setBusy] = useState(false);
    useEffect(() => db.collection('inv_keepers').onSnapshot(s => setList(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'))), er => { setList([]); showToast('مشكلة: ' + er.message); }), []);
    const save = async e => {
        e.preventDefault(); const f = e.target;
        setBusy(true);
        try {
            const id = form.id || db.collection('inv_keepers').doc().id;
            await saveKeeper(id, { name: f.kname.value, phone: f.phone.value, username: f.username.value, password: f.password.value, active: f.active.checked }, form.id ? form : null);
            setForm(null); showToast(form.id ? 'تم التعديل' : 'اتعمل حساب أمين المخزن');
        } catch (er) { showToast(er.message); }
        setBusy(false);
    };
    const toggle = k => db.collection('inv_keepers').doc(k.id).update({ active: k.active === false, updatedAt: new Date().toISOString() }).then(() => showToast(k.active === false ? 'الحساب اتفعّل' : 'الحساب اتوقف')).catch(er => showToast(er.message));
    const remove = k => { const b = db.batch(); if (k.authUid) b.delete(db.collection('staff_auth').doc(k.authUid)); b.delete(db.collection('inv_keepers').doc(k.id)); return b.commit().then(() => showToast('اتمسح الحساب')).catch(er => showToast(er.message)); };
    return (
        <div className="space-y-4 w-full animate-fade-in">
            <div className="flex justify-between items-center gap-2 flex-wrap">
                <h3 className="text-lg font-black text-gray-800">حسابات أمناء المخزن</h3>
                <button type="button" onClick={() => setForm({})} className="bg-gold-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md hover:bg-gold-600">+ أمين مخزن جديد</button>
            </div>
            <p className="text-[11px] font-bold text-gray-500 bg-amber-50 border border-amber-100 rounded-xl p-3">أمين المخزن بيدخل على أداة المخزن دي بس (الأصناف، الوارد والصرف، الفواتير، الجرد، الأجهزة، والنواقص). مش بيقدر يدخل السيستم ولا يشوف المرضى أو الحجوزات أو الفلوس.</p>
            {list === null ? <p className="text-center text-gray-400 font-bold text-sm p-6">بيحمّل...</p>
                : list.length === 0 ? <div className="p-8 text-center text-gray-400 font-bold border border-dashed rounded-3xl bg-white text-sm">لسه مفيش أمناء مخزن.</div>
                : <div className="grid gap-2 sm:grid-cols-2">{list.map(k => (
                    <div key={k.id} className={`p-3 rounded-[18px] border shadow-sm ${k.active === false ? 'bg-gray-50 border-gray-200' : 'bg-white border-gray-100'}`}>
                        <div className="flex justify-between gap-2">
                            <div className="min-w-0">
                                <h4 className="font-black text-gray-800 text-sm truncate">{k.name}</h4>
                                <p className="text-[10px] font-bold text-gray-400" dir="ltr">{k.username}{k.phone ? ' • ' + k.phone : ''}</p>
                            </div>
                            <span className={`text-[9px] font-black px-2 py-0.5 rounded-lg h-fit ${k.active === false ? 'bg-red-50 text-red-600' : 'bg-emerald-100 text-emerald-700'}`}>{k.active === false ? 'متوقف' : 'شغال'}</span>
                        </div>
                        <div className="flex gap-1 mt-2">
                            <button type="button" onClick={() => toggle(k)} className="px-2 py-1 rounded-lg text-[10px] font-black bg-gray-100 text-gray-600">{k.active === false ? 'تفعيل' : 'إيقاف'}</button>
                            <span className="flex-1" />
                            <button type="button" onClick={() => setForm(k)} className="p-1 text-gold-500 bg-gray-50 rounded-lg"><IconEdit /></button>
                            <button type="button" onClick={() => onConfirm({ msg: 'مسح حساب "' + k.name + '"؟ مش هيقدر يدخل تاني.', onConfirm: () => remove(k) })} className="p-1 text-red-500 bg-red-50 rounded-lg"><IconTrash /></button>
                        </div>
                    </div>))}</div>}
            {form && <InvModal title={form.id ? 'تعديل أمين مخزن' : 'أمين مخزن جديد'} onClose={() => setForm(null)}>
                <form onSubmit={save} className="space-y-3">
                    <Input name="kname" label="الاسم" defaultValue={form.name} required autoFocus />
                    <Input name="phone" label="الموبايل (اختياري)" defaultValue={form.phone} inputMode="tel" />
                    <div className="grid grid-cols-2 gap-2">
                        <Input name="username" label="اسم المستخدم" defaultValue={form.username} required dir="ltr" autoComplete="off" />
                        <Input name="password" label={form.id ? 'كلمة سر جديدة (سيبيها فاضية لو مش هتتغير)' : 'كلمة السر'} type="text" autoComplete="off" dir="ltr" />
                    </div>
                    <label className="flex items-center gap-2 text-[11px] font-bold text-gray-600"><input type="checkbox" name="active" defaultChecked={form.active !== false} /> الحساب شغال</label>
                    <button type="submit" disabled={busy} className="w-full bg-gold-500 text-white py-3 rounded-xl font-black text-sm">{busy ? '...' : 'حفظ'}</button>
                </form>
            </InvModal>}
        </div>
    );
}

// تعديل نقص (بديل نافذة السيستم)
function ShortEditModal({ item, branches, onClose, showToast }) {
    const save = e => {
        e.preventDefault(); const f = e.target;
        db.collection('shortages').doc(item.id).update({ itemName: f.iname.value.trim(), quantity: f.qty.value.trim(), branchId: f.br.value, editedAt: new Date().toISOString(), editedBy: (LIVE.me && LIVE.me.name) || '' })
            .then(() => { onClose(); showToast('تم التعديل'); }).catch(er => showToast(er.message));
    };
    return (
        <InvModal title={'تعديل نقص: ' + item.itemName} onClose={onClose}>
            <form onSubmit={save} className="space-y-3">
                <Input name="iname" label="الصنف" defaultValue={item.itemName} required />
                <div className="grid grid-cols-2 gap-2">
                    <Input name="qty" label="الكمية" defaultValue={item.quantity} required />
                    <div className="space-y-1"><label className="text-[9px] font-black text-gray-500 block">الفرع</label>
                        <select name="br" defaultValue={item.branchId} className="w-full bg-gray-50 border border-gray-100 p-3 rounded-xl text-xs font-bold">
                            <option value="store">المخزن الرئيسي</option>{branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                        </select></div>
                </div>
                <button type="submit" className="w-full bg-gold-500 text-white py-3 rounded-xl font-black text-sm">حفظ</button>
            </form>
        </InvModal>
    );
}

function InvApp() {
    const [me, setMe] = useState(undefined); // undefined = بيتأكد، null = مش داخل
    const [loginErr, setLoginErr] = useState('');
    const [tab, setTab] = useState(() => lsGet('invAppTab', 'inventory'));
    useEffect(() => { lsSet('invAppTab', tab); }, [tab]);
    const [toast, setToast] = useState('');
    const closeToast = useCallback(() => setToast(''), []);
    const [confirmAction, setConfirmAction] = useState(null);
    const [items, setItems] = useState([]);
    const [cons, setCons] = useState([]);
    const [branches, setBranches] = useState([]);
    const [shorts, setShorts] = useState([]);
    const [selBranch, setSelBranch] = useState('all');
    const [editShort, setEditShort] = useState(null);

    const check = async (u) => {
        try {
            const x = await loadInvUser(u);
            if (x && x.blocked) { await auth.signOut(); setLoginErr('الحساب ده مالوش صلاحية على المخزن (أو متوقف)'); setMe(null); return; }
            if (!x) { if (u) await auth.signOut(); setMe(null); return; }
            LIVE.me = x; setMe(x); setLoginErr('');
        } catch (er) { console.error(er); setLoginErr('مشكلة في الدخول: ' + er.message); setMe(null); }
    };
    useEffect(() => auth.onAuthStateChanged(u => { if (!u) { LIVE.me = null; setMe(null); return; } check(u); }), []);

    useEffect(() => {
        if (!me) return;
        const err = er => { console.error(er); setToast('مشكلة في تحميل البيانات: ' + er.message); };
        const snap = (q, set) => q.onSnapshot(s => set(s.docs.map(d => ({ id: d.id, ...d.data() }))), err);
        const un = [
            snap(db.collection('inv_items'), setItems),
            snap(db.collection('consumables'), setCons),
            snap(db.collection('shortages'), setShorts),
            snap(db.collection('branches'), x => { const b = x.sort((a, c) => (a.order ?? 99) - (c.order ?? 99)); LIVE.branches = b; setBranches(b); })
        ];
        return () => un.forEach(f => f());
    }, [me && me.id]);

    if (me === undefined) return <div className="min-h-screen bg-[#050505] flex items-center justify-center text-gray-400 font-bold text-sm">بيحمّل...</div>;
    if (!me) return <InvLogin err={loginErr} onDone={() => {}} />;

    const isAdm = me.role === 'admin' || me.role === 'superadmin';
    const curTab = tab === 'keepers' && !isAdm ? 'inventory' : tab;
    const openShorts = shorts.filter(s => selBranch === 'all' || s.branchId === selBranch);
    const low = items.filter(invLow).length;
    const T = [['inventory', '📦 المخزن والجرد', low], ['shortages', '🛒 النواقص', shorts.length], ...(isAdm ? [['keepers', '👤 أمناء المخزن', 0]] : [])];
    // النواقص: أمين المخزن بيشوف كل الفروع (من غير ما يبقى أدمن في السيستم)
    const shortUser = { ...me, role: 'admin', branchId: 'all', branchIds: [] };

    return (
        <div className="min-h-screen bg-[#FDFCFB]">
            <header className="bg-[#111111] text-white sticky top-0 z-50 shadow-lg">
                <div className="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
                    <span className="text-2xl">📦</span>
                    <div className="flex-1 min-w-0">
                        <h1 className="font-black text-sm truncate">مخزن نيو إيرا</h1>
                        <p className="text-[10px] font-bold text-gray-400 truncate">{me.name} • {me.role === 'storekeeper' ? 'أمين مخزن' : me.role === 'superadmin' ? 'سوبر أدمن' : 'أدمن'} • v{INV_APP_VERSION}</p>
                    </div>
                    <button type="button" onClick={() => setConfirmAction({ msg: 'تسجيل خروج؟', onConfirm: () => auth.signOut() })} className="bg-white/10 px-3 py-2 rounded-xl text-[11px] font-black">خروج</button>
                </div>
                <div className="max-w-6xl mx-auto px-4 pb-2 flex gap-1.5 overflow-x-auto custom-scrollbar">
                    {T.map(([k, l, n]) => <button key={k} type="button" onClick={() => setTab(k)} className={`shrink-0 px-3 py-2 rounded-xl text-[11px] font-black border ${curTab === k ? 'bg-gold-500 text-white border-gold-500 shadow' : 'bg-white/5 text-gray-300 border-white/10'}`}>{l}{n > 0 && <span className="mr-1 bg-red-500 text-white rounded-full px-1.5 text-[9px]">{n}</span>}</button>)}
                </div>
            </header>
            <main className="max-w-6xl mx-auto p-4 pb-24">
                {curTab === 'inventory' && <InventoryView items={items} consumables={cons} branches={branches} currentUser={me} showToast={setToast} onConfirm={setConfirmAction} />}
                {curTab === 'shortages' && <div className="space-y-3">
                    <div className="flex gap-1.5 overflow-x-auto custom-scrollbar pb-1">
                        {[{ id: 'all', name: 'الكل' }, { id: 'store', name: 'المخزن' }, ...branches].map(b => <button key={b.id} type="button" onClick={() => setSelBranch(b.id)} className={`shrink-0 px-3 py-1.5 rounded-lg text-[11px] font-black border ${selBranch === b.id ? 'bg-gold-500 text-white border-gold-500' : 'bg-white text-gray-600 border-gray-200'}`}>{b.name}</button>)}
                    </div>
                    <ShortagesView key={selBranch} invItems={items} shortages={openShorts} branches={branches} currentUser={shortUser} selectedBranch={selBranch}
                        onBuy={it => setConfirmAction({ msg: 'تسجيل شراء "' + it.itemName + '" (' + it.quantity + ') وإزالته من النواقص؟', onConfirm: () => {
                            const cat = invFind(items, it.itemName), unit = cat && cat.price ? Number(cat.price) : 0, q = parseFloat(it.quantity) || 0, day = localDay(), b = db.batch();
                            const rec = { kind: 'purchase', itemId: cat ? cat.id : '', branchId: it.branchId || 'store', qty: it.quantity };
                            applyStock(b, rec.itemId, stockEffect(rec));
                            b.set(db.collection('consumables').doc(), { itemId: rec.itemId, kind: 'purchase', itemName: cat ? cat.name : (it.itemName || '').trim(), qty: it.quantity, unitCost: unit, amount: Math.round(unit * q * 100) / 100, date: day, month: day.slice(0, 7), note: '', branchId: it.branchId || 'store', source: 'auto', recordedBy: me.name, createdAt: new Date().toISOString() });
                            b.delete(db.collection('shortages').doc(it.id));
                            b.commit().then(() => setToast('تم تسجيل الشراء')).catch(er => setToast('مشكلة: ' + er.message));
                        } })}
                        onConfirm={setConfirmAction} onEdit={setEditShort} showToast={setToast} />
                </div>}
                {curTab === 'keepers' && isAdm && <KeepersView showToast={setToast} onConfirm={setConfirmAction} />}
            </main>
            {editShort && <ShortEditModal item={editShort} branches={branches} onClose={() => setEditShort(null)} showToast={setToast} />}
            {confirmAction && <ConfirmModal action={confirmAction} onClose={() => setConfirmAction(null)} />}
            {toast && <Toast msg={toast} onClose={closeToast} />}
        </div>
    );
}

</script>
</body>
</html>
